name: Activate Nemotron — Governed

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/nemotron-worker/**'
      - 'deploy/systemd/dominion-nemotron.service'
      - 'governance/system_integrity_agent.json'
      - 'governance/nemotron_reactivation_scope_20260910.json'
      - 'docs/NEMOTRON_REACTIVATION_WORK_ORDER_20260910.md'
      - '.github/workflows/watchdog.yml'
      - '.github/workflows/activate-nemotron-governed.yml'
      - 'tests/test_nemotron_reactivation_contract.py'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact merged main SHA to activate'
        required: true
        type: string
      confirm:
        description: 'Type ACTIVATE NEMOTRON'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Resolve exact release
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          CONFIRM: ${{ inputs.confirm }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            [ "$CONFIRM" = 'ACTIVATE NEMOTRON' ] || { echo 'Founder confirmation mismatch'; exit 1; }
            [ "$ACTOR" = 'dunkdee' ] || { echo 'Activation requires Founder actor'; exit 1; }
            [ "$TRIGGERING_ACTOR" = 'dunkdee' ] || { echo 'Activation requires Founder triggering actor'; exit 1; }
            [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Full 40-character SHA required'; exit 1; }
            git fetch origin main
            current_main="$(git rev-parse origin/main)"
            [ "$REQUESTED_SHA" = "$current_main" ] || { echo "REFUSED stale_release requested=$REQUESTED_SHA current_main=$current_main"; exit 1; }
            deploy_sha="$REQUESTED_SHA"
          else
            deploy_sha="$(git rev-parse HEAD)"
          fi
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "NEMOTRON_RELEASE_SHA=$deploy_sha"

      - name: Validate Nemotron reactivation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool governance/system_integrity_agent.json >/dev/null
          python3 -m json.tool governance/nemotron_reactivation_scope_20260910.json >/dev/null
          python3 -m pytest -q tests/test_nemotron_reactivation_contract.py
          python3 scripts/validate_control_plane.py
          python3 scripts/validate_control_plane_runtime.py
          python3 scripts/validate_constitutional_kernel_v1.py

      - name: Prove bounded activation design
        shell: bash
        run: |
          set -euo pipefail
          unit=deploy/systemd/dominion-nemotron.service
          grep -q '^Environment=NEMOTRON_LISTEN_HOST=127.0.0.1$' "$unit"
          ! grep -q '^Environment=NEMOTRON_LISTEN_HOST=0.0.0.0$' "$unit"
          grep -q '/.dominion/nemotron/runtime/release/apps/nemotron-worker' "$unit"
          grep -q '^Requires=ollama.service$' "$unit"
          grep -q 'ACTIVATE NEMOTRON' .github/workflows/activate-nemotron-governed.yml
          echo 'NEMOTRON_STATIC_GATES=PASS'

  activate:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: foundation-vm-production
    steps:
      - name: Checkout exact governed main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Require protected VM access
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" || { echo 'VM_HOST secret missing'; exit 1; }
          test -n "$VM_USER" || { echo 'VM_USER secret missing'; exit 1; }
          test -n "$VM_SSH_KEY" || { echo 'VM_SSH_KEY secret missing'; exit 1; }

      - name: Prepare SSH
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/nemotron_key"
          chmod 600 "$HOME/.ssh/nemotron_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build exact-SHA bundle
        id: bundle
        shell: bash
        env:
          DEPLOY_SHA: ${{ needs.validate.outputs.deploy_sha }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$DEPLOY_SHA" ] || { echo 'Runner checkout is not exact release SHA'; exit 1; }
          git update-ref refs/heads/nemotron-release "$DEPLOY_SHA"
          bundle="$RUNNER_TEMP/nemotron-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle"
          remote_bundle="/tmp/nemotron-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle"
          git bundle create "$bundle" refs/heads/nemotron-release
          git bundle verify "$bundle"
          scp -q -i "$HOME/.ssh/nemotron_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$bundle" "$VM_USER@$VM_HOST:$remote_bundle"
          ssh -q -i "$HOME/.ssh/nemotron_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$VM_USER@$VM_HOST" "chmod 600 '$remote_bundle'"
          echo "remote_bundle=$remote_bundle" >> "$GITHUB_OUTPUT"

      - name: Activate with automatic rollback
        id: remote
        shell: bash
        env:
          DEPLOY_SHA: ${{ needs.validate.outputs.deploy_sha }}
          REMOTE_BUNDLE: ${{ steps.bundle.outputs.remote_bundle }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -u -o pipefail
          log="$RUNNER_TEMP/nemotron-activation.log"
          set +e
          ssh -i "$HOME/.ssh/nemotron_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 "$VM_USER@$VM_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' REMOTE_BUNDLE='$REMOTE_BUNDLE' bash -s" <<'REMOTE' 2>&1 | tee "$log"
          set -Eeuo pipefail
          SERVICE=dominion-nemotron.service
          MODEL=nemotron-3-nano:4b
          REPO="$HOME/dominion-ops"
          RUNTIME="$HOME/.dominion/nemotron"
          LIVE_CONTRACT="$HOME/.config/dominion/system-integrity-agent.json"
          UNIT=/etc/systemd/system/dominion-nemotron.service
          mutated=0
          backup=''
          prior_release=''

          say(){ printf '%s\n' "$*"; }
          fail(){ say "NEMOTRON_ACTIVATION=BLOCKED reason=$*"; exit 1; }

          rollback(){
            set +e
            say 'NEMOTRON_ROLLBACK=BEGIN'
            sudo systemctl disable --now "$SERVICE" >/dev/null 2>&1 || true
            if [ -n "$backup" ] && [ -f "$backup/unit" ]; then
              sudo install -m 0644 "$backup/unit" "$UNIT" || true
            fi
            if [ -n "$backup" ] && [ -f "$backup/integrity-contract.json" ]; then
              install -m 600 "$backup/integrity-contract.json" "$LIVE_CONTRACT" || true
            fi
            if [ -n "$prior_release" ]; then
              ln -sfn "$prior_release" "$RUNTIME/runtime/release" || true
            else
              rm -f "$RUNTIME/runtime/release" || true
            fi
            sudo systemctl daemon-reload || true
            for _ in $(seq 1 30); do
              if ! ss -ltnH 2>/dev/null | awk '{print $4}' | grep -Eq '(^|:)11435$'; then break; fi
              sleep 1
            done
            code11434="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 http://127.0.0.1:11434/api/tags 2>/dev/null || true)"
            codecc="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 http://127.0.0.1:8091/health 2>/dev/null || true)"
            say "NEMOTRON_ROLLBACK=COMPLETE ollama_11434=${code11434:-000} command_center=${codecc:-000}"
          }

          on_exit(){
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$mutated" -eq 1 ]; then rollback; fi
            exit "$rc"
          }
          trap on_exit EXIT

          [ -d "$REPO/.git" ] || fail 'repo_missing'
          [ -z "$(git -C "$REPO" status --porcelain)" ] || fail 'vm_repo_dirty'
          branch="$(git -C "$REPO" branch --show-current)"
          [ "$branch" = main ] || fail "vm_repo_not_main:$branch"

          service_state="$(systemctl is-active "$SERVICE" 2>/dev/null || true)"
          [ "$service_state" != active ] || fail 'service_already_active_requires_separate_reconciliation'
          if ss -ltnH 2>/dev/null | awk '{print $4}' | grep -Eq '(^|:)11435$'; then fail 'port_11435_not_free'; fi

          code11434="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 http://127.0.0.1:11434/api/tags 2>/dev/null || true)"
          [ "$code11434" = 200 ] || fail "ollama_11434_unhealthy:$code11434"
          curl -fsS --max-time 10 http://127.0.0.1:11434/api/tags | python3 - "$MODEL" <<'PY'
          import json,sys
          model=sys.argv[1]
          doc=json.load(sys.stdin)
          names={str(x.get('name')) for x in doc.get('models',[]) if isinstance(x,dict)}
          if model not in names:
              raise SystemExit(f'model_missing:{model}')
          print('NEMOTRON_MODEL_PRESENT=PASS')
          PY

          codecc="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 http://127.0.0.1:8091/health 2>/dev/null || true)"
          [ "$codecc" = 200 ] || fail "command_center_preflight:$codecc"
          [ -f "$HOME/.dominion/system-integrity/latest.json" ] || fail 'integrity_state_missing'
          before_cycle="$(python3 - "$HOME/.dominion/system-integrity/latest.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('ok') is True and d.get('status')=='PASS' and int(d.get('defect_count',-1))==0
          print(int(d.get('cycle',0)))
          PY
          )" || fail 'integrity_preflight_not_pass'
          say "NEMOTRON_PREFLIGHT=PASS integrity_cycle=$before_cycle"

          remote_ref=refs/remotes/nemotron/release
          git -C "$REPO" fetch "$REMOTE_BUNDLE" "refs/heads/nemotron-release:$remote_ref"
          fetched="$(git -C "$REPO" rev-parse "$remote_ref")"
          [ "$fetched" = "$DEPLOY_SHA" ] || fail 'bundle_sha_mismatch'
          current="$(git -C "$REPO" rev-parse HEAD)"
          git -C "$REPO" merge-base --is-ancestor "$current" "$DEPLOY_SHA" || fail 'vm_repo_cannot_fast_forward'

          backup="$RUNTIME/backups/$(date -u +%Y%m%dT%H%M%SZ)-${DEPLOY_SHA:0:12}"
          install -d -m 700 "$backup" "$RUNTIME/releases" "$RUNTIME/runtime" "$HOME/.config/dominion"
          if [ -f "$UNIT" ]; then sudo cp -a "$UNIT" "$backup/unit"; fi
          if [ -f "$LIVE_CONTRACT" ]; then cp -a "$LIVE_CONTRACT" "$backup/integrity-contract.json"; fi
          prior_release="$(readlink -f "$RUNTIME/runtime/release" 2>/dev/null || true)"
          printf '%s\n' "$prior_release" > "$backup/prior-release.txt"

          git -C "$REPO" merge --ff-only "$DEPLOY_SHA"
          [ "$(git -C "$REPO" rev-parse HEAD)" = "$DEPLOY_SHA" ] || fail 'vm_repo_sync_failed'

          release="$RUNTIME/releases/$DEPLOY_SHA"
          rm -rf "$release"
          install -d -m 755 "$release/apps/nemotron-worker"
          install -m 0644 "$REPO/apps/nemotron-worker/nemotron_worker.py" "$release/apps/nemotron-worker/nemotron_worker.py"
          printf '%s\n' "$DEPLOY_SHA" > "$release/RELEASE_SHA"
          ln -sfn "$release" "$RUNTIME/runtime/release"

          install -m 600 "$REPO/governance/system_integrity_agent.json" "$LIVE_CONTRACT"
          sudo install -m 0644 "$REPO/deploy/systemd/dominion-nemotron.service" "$UNIT"
          mutated=1
          sudo systemctl daemon-reload
          sudo systemctl enable --now "$SERVICE"

          for _ in $(seq 1 30); do
            health="$(curl -fsS --max-time 8 http://127.0.0.1:11435/health 2>/dev/null || true)"
            if python3 - "$health" "$MODEL" <<'PY' >/dev/null 2>&1
          import json,sys
          d=json.loads(sys.argv[1])
          assert d.get('status')=='ok' and d.get('model_available') is True and d.get('model')==sys.argv[2]
          PY
            then break; fi
            sleep 2
          done
          health="$(curl -fsS --max-time 8 http://127.0.0.1:11435/health)"
          python3 - "$health" "$MODEL" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          assert d.get('status')=='ok'
          assert d.get('model_available') is True
          assert d.get('model')==sys.argv[2]
          print('NEMOTRON_HEALTH=PASS')
          PY

          mainpid="$(systemctl show "$SERVICE" -p MainPID --value)"
          [ -n "$mainpid" ] && [ "$mainpid" != 0 ] || fail 'missing_mainpid'
          listener="$(sudo ss -lntp 2>/dev/null | grep ':11435' || true)"
          printf '%s\n' "$listener" | grep -q '127.0.0.1:11435' || fail 'listener_not_loopback'
          if printf '%s\n' "$listener" | grep -Eq '0\.0\.0\.0:11435|\[::\]:11435|\*:11435'; then fail 'listener_exposed'; fi
          printf '%s\n' "$listener" | grep -q "pid=$mainpid," || fail 'listener_not_owned_by_service_mainpid'
          [ "$(systemctl is-active "$SERVICE")" = active ] || fail 'service_not_active'
          [ "$(systemctl is-enabled "$SERVICE")" = enabled ] || fail 'service_not_enabled'
          say "NEMOTRON_LISTENER=PASS pid=$mainpid bind=127.0.0.1:11435"

          probe="$(curl -fsS --max-time 90 -H 'Content-Type: application/json' -d '{"message":"SYSTEM_INTEGRITY_HEALTH_PROBE. Return a short readiness acknowledgement. Do not perform any external action."}' http://127.0.0.1:8091/api/chat)"
          python3 - "$probe" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          assert d.get('source')=='nemotron', d.get('source')
          assert str(d.get('answer') or '').strip()
          print('NEMOTRON_COMMAND_CENTER_ROUTE=PASS')
          PY

          cmp -s "$REPO/governance/system_integrity_agent.json" "$LIVE_CONTRACT" || fail 'integrity_contract_drift'
          worker_repo_sha="$(sha256sum "$REPO/apps/nemotron-worker/nemotron_worker.py" | awk '{print $1}')"
          worker_live_sha="$(sha256sum "$release/apps/nemotron-worker/nemotron_worker.py" | awk '{print $1}')"
          [ "$worker_repo_sha" = "$worker_live_sha" ] || fail 'worker_hash_mismatch'
          unit_repo_sha="$(sha256sum "$REPO/deploy/systemd/dominion-nemotron.service" | awk '{print $1}')"
          unit_live_sha="$(sudo sha256sum "$UNIT" | awk '{print $1}')"
          [ "$unit_repo_sha" = "$unit_live_sha" ] || fail 'unit_hash_mismatch'

          integrity_ok=0
          for _ in $(seq 1 110); do
            if python3 - "$HOME/.dominion/system-integrity/latest.json" "$before_cycle" <<'PY' >/dev/null 2>&1
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert int(d.get('cycle',0)) > int(sys.argv[2])
          assert d.get('ok') is True and d.get('status')=='PASS' and int(d.get('defect_count',-1))==0
          PY
            then integrity_ok=1; break; fi
            sleep 2
          done
          [ "$integrity_ok" = 1 ] || fail 'integrity_post_activation_not_pass'
          after_cycle="$(python3 -c 'import json,os; print(json.load(open(os.path.expanduser("~/.dominion/system-integrity/latest.json"))).get("cycle"))')"
          say "NEMOTRON_INTEGRITY=PASS cycle=$after_cycle"

          receipt="$RUNTIME/receipts/$(date -u +%Y%m%dT%H%M%SZ)-activation.json"
          install -d -m 700 "$RUNTIME/receipts"
          python3 - "$receipt" "$DEPLOY_SHA" "$worker_live_sha" "$unit_live_sha" "$mainpid" "$before_cycle" "$after_cycle" <<'PY'
          import json,sys,datetime
          path,sha,worker,unit,pid,before,after=sys.argv[1:]
          data={
            'schema':'dominion-nemotron-activation-receipt-v1',
            'governance':'RADAH MEMSHALAH',
            'status':'DONE',
            'release_sha':sha,
            'service':'dominion-nemotron.service',
            'model':'nemotron-3-nano:4b',
            'bind':'127.0.0.1:11435',
            'main_pid':int(pid),
            'worker_sha256':worker,
            'unit_sha256':unit,
            'command_center_source':'nemotron',
            'integrity_cycle_before':int(before),
            'integrity_cycle_after':int(after),
            'integrity_status':'PASS',
            'defect_count':0,
            'external_ingress_opened':False,
            'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          }
          open(path,'w').write(json.dumps(data,indent=2,sort_keys=True)+'\n')
          print(path)
          PY
          chmod 600 "$receipt"
          printf '%s\n' "$receipt" > /tmp/dominion-nemotron-activation-receipt.path
          say "NEMOTRON_ACTIVATION=DONE release_sha=$DEPLOY_SHA receipt=$receipt"
          mutated=0
          trap - EXIT
          rm -f "$REMOTE_BUNDLE"
          REMOTE
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Collect activation receipt
        if: success()
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          receipt_path="$(ssh -q -i "$HOME/.ssh/nemotron_key" -o BatchMode=yes -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" 'cat /tmp/dominion-nemotron-activation-receipt.path')"
          case "$receipt_path" in "$HOME"/.dominion/nemotron/receipts/*.json) ;; *) echo 'Invalid receipt path'; exit 1 ;; esac
          scp -q -i "$HOME/.ssh/nemotron_key" -o BatchMode=yes -o IdentitiesOnly=yes "$VM_USER@$VM_HOST:$receipt_path" "$RUNNER_TEMP/nemotron-activation-receipt.json"
          python3 -m json.tool "$RUNNER_TEMP/nemotron-activation-receipt.json" >/dev/null

      - name: Upload immutable activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-activation-${{ needs.validate.outputs.deploy_sha }}
          path: |
            ${{ runner.temp }}/nemotron-activation.log
            ${{ runner.temp }}/nemotron-activation-receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/nemotron_key" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP"/nemotron-*.bundle
