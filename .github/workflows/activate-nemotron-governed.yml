name: Activate Nemotron — Governed

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/nemotron-worker/**'
      - 'deploy/systemd/dominion-nemotron.service'
      - 'governance/system_integrity_agent.json'
      - 'governance/nemotron_reactivation_scope_20260910.json'
      - 'governance/nemotron_reactivation_gate_20260910.json'
      - 'governance/nemotron_reactivation_release_notes_20260910.md'
      - '.github/workflows/watchdog.yml'
      - '.github/workflows/activate-nemotron-governed.yml'
      - 'scripts/nemotron/activate_nemotron.sh'
      - 'tests/test_nemotron_reactivation_contract.py'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact merged main SHA to activate'
        required: true
        type: string
      confirm:
        description: 'Type ACTIVATE NEMOTRON'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Resolve exact release and authority boundary
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          CONFIRM: ${{ inputs.confirm }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            [ "$CONFIRM" = 'ACTIVATE NEMOTRON' ] || { echo 'Founder confirmation mismatch'; exit 1; }
            [ "$ACTOR" = 'dunkdee' ] || { echo 'Activation requires Founder actor'; exit 1; }
            [ "$TRIGGERING_ACTOR" = 'dunkdee' ] || { echo 'Activation requires Founder triggering actor'; exit 1; }
            [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Full 40-character SHA required'; exit 1; }
            git fetch origin main
            current_main="$(git rev-parse origin/main)"
            [ "$REQUESTED_SHA" = "$current_main" ] || { echo "REFUSED stale_release requested=$REQUESTED_SHA current_main=$current_main"; exit 1; }
            [ "$checkout_sha" = "$REQUESTED_SHA" ] || { echo "REFUSED checkout_mismatch checkout=$checkout_sha requested=$REQUESTED_SHA"; exit 1; }
            deploy_sha="$REQUESTED_SHA"
          else
            deploy_sha="$checkout_sha"
            expected_head='${{ github.event.pull_request.head.sha }}'
            [ "$deploy_sha" = "$expected_head" ] || { echo "REFUSED pr_head_mismatch checkout=$deploy_sha expected=$expected_head"; exit 1; }
          fi
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "NEMOTRON_RELEASE_SHA=$deploy_sha"

      - name: Validate Nemotron reactivation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool governance/system_integrity_agent.json >/dev/null
          python3 -m json.tool governance/nemotron_reactivation_scope_20260910.json >/dev/null
          python3 -m json.tool governance/nemotron_reactivation_gate_20260910.json >/dev/null
          bash -n scripts/nemotron/activate_nemotron.sh
          python3 - <<'PY'
          import runpy
          namespace = runpy.run_path('tests/test_nemotron_reactivation_contract.py')
          tests = sorted((name, value) for name, value in namespace.items() if name.startswith('test_') and callable(value))
          assert tests, 'no Nemotron contract tests discovered'
          for name, test in tests:
              test()
              print(f'PASS {name}')
          print(f'NEMOTRON_CONTRACT_TESTS=PASS count={len(tests)}')
          PY
          python3 scripts/validate_control_plane.py
          python3 scripts/validate_control_plane_runtime.py
          python3 scripts/validate_constitutional_kernel_v1.py

      - name: Prove bounded activation design
        shell: bash
        run: |
          set -euo pipefail
          unit=deploy/systemd/dominion-nemotron.service
          script=scripts/nemotron/activate_nemotron.sh
          grep -q '^Environment=NEMOTRON_LISTEN_HOST=127.0.0.1$' "$unit"
          ! grep -q '^Environment=NEMOTRON_LISTEN_HOST=0.0.0.0$' "$unit"
          grep -q '/.dominion/nemotron/runtime/release/apps/nemotron-worker' "$unit"
          grep -q '^Requires=ollama.service$' "$unit"
          grep -q "NEMOTRON_COMMAND_CENTER_ROUTE=PASS" "$script"
          grep -q "NEMOTRON_INTEGRITY=PASS" "$script"
          grep -q "NEMOTRON_ROLLBACK=BEGIN" "$script"
          ! grep -qiE 'gcloud compute firewall-rules (create|update)|ollama[[:space:]]+pull|kill[[:space:]]+-9|pkill|killall' "$script"
          echo 'NEMOTRON_STATIC_GATES=PASS'

  activate:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: foundation-vm-production
    steps:
      - name: Checkout exact governed main
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Require protected VM access
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" || { echo 'VM_HOST secret missing'; exit 1; }
          test -n "$VM_USER" || { echo 'VM_USER secret missing'; exit 1; }
          test -n "$VM_SSH_KEY" || { echo 'VM_SSH_KEY secret missing'; exit 1; }

      - name: Prepare SSH
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/nemotron_key"
          chmod 600 "$HOME/.ssh/nemotron_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build and transfer exact-SHA bundle
        id: bundle
        shell: bash
        env:
          DEPLOY_SHA: ${{ needs.validate.outputs.deploy_sha }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$DEPLOY_SHA" ] || { echo 'Runner checkout is not exact release SHA'; exit 1; }
          git update-ref refs/heads/nemotron-release "$DEPLOY_SHA"
          bundle="$RUNNER_TEMP/nemotron-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle"
          remote_bundle="/tmp/nemotron-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle"
          git bundle create "$bundle" refs/heads/nemotron-release
          git bundle verify "$bundle"
          scp -q -i "$HOME/.ssh/nemotron_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$bundle" "$VM_USER@$VM_HOST:$remote_bundle"
          ssh -q -i "$HOME/.ssh/nemotron_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$VM_USER@$VM_HOST" "chmod 600 '$remote_bundle'"
          echo "remote_bundle=$remote_bundle" >> "$GITHUB_OUTPUT"

      - name: Activate with automatic rollback
        id: remote
        shell: bash
        env:
          DEPLOY_SHA: ${{ needs.validate.outputs.deploy_sha }}
          REMOTE_BUNDLE: ${{ steps.bundle.outputs.remote_bundle }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -u -o pipefail
          log="$RUNNER_TEMP/nemotron-activation.log"
          set +e
          ssh -i "$HOME/.ssh/nemotron_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 "$VM_USER@$VM_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' REMOTE_BUNDLE='$REMOTE_BUNDLE' bash -s" \
            < scripts/nemotron/activate_nemotron.sh 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Collect and validate activation receipt
        if: success()
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          DEPLOY_SHA: ${{ needs.validate.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          receipt_path="$(ssh -q -i "$HOME/.ssh/nemotron_key" -o BatchMode=yes -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" 'cat /tmp/dominion-nemotron-activation-receipt.path')"
          case "$receipt_path" in /home/*/.dominion/nemotron/receipts/*.json) ;; *) echo "Invalid receipt path"; exit 1 ;; esac
          scp -q -i "$HOME/.ssh/nemotron_key" -o BatchMode=yes -o IdentitiesOnly=yes "$VM_USER@$VM_HOST:$receipt_path" "$RUNNER_TEMP/nemotron-activation-receipt.json"
          python3 - "$RUNNER_TEMP/nemotron-activation-receipt.json" "$DEPLOY_SHA" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              d = json.load(handle)
          assert d['status'] == 'DONE'
          assert d['release_sha'] == sys.argv[2]
          assert d['bind'] == '127.0.0.1:11435'
          assert d['command_center_source'] == 'nemotron'
          assert d['integrity_status'] == 'PASS' and d['defect_count'] == 0
          assert d['external_ingress_opened'] is False
          print('NEMOTRON_RECEIPT=PASS')
          PY

      - name: Upload immutable activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-activation-${{ needs.validate.outputs.deploy_sha }}
          path: |
            ${{ runner.temp }}/nemotron-activation.log
            ${{ runner.temp }}/nemotron-activation-receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove remote bundle and SSH material
        if: always()
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          REMOTE_BUNDLE: ${{ steps.bundle.outputs.remote_bundle }}
        run: |
          set +e
          if [ -f "$HOME/.ssh/nemotron_key" ] && [ -n "$VM_HOST" ] && [ -n "$VM_USER" ] && [ -n "$REMOTE_BUNDLE" ]; then
            ssh -q -i "$HOME/.ssh/nemotron_key" -o BatchMode=yes -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" "rm -f '$REMOTE_BUNDLE'" || true
          fi
          rm -f "$HOME/.ssh/nemotron_key" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP"/nemotron-*.bundle
