name: Activate RADAH MEMSHALAH Autopilot

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ACTIVATE RADAH MEMSHALAH AUTOPILOT"
        required: true
        type: string
      commit_sha:
        description: "Exact 40-character main commit SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  activate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'ACTIVATE RADAH MEMSHALAH AUTOPILOT' &&
      inputs.commit_sha == github.sha &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: foundation-vm-production
    steps:
      - name: Checkout exact release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate autopilot release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n scripts/autopilot/install_autopilot.sh
          python -m py_compile scripts/autopilot/lane_supervisor.py tests/test_radah_autopilot.py
          python -m unittest tests.test_radah_autopilot -v
          python tests/test_dominion_command_center_ui.py
          python scripts/validate_buddy_authority_policy.py governance/buddy/buddy_authority_policy.json --root .
          echo 'RADAH_AUTOPILOT_RELEASE=PASS'

      - name: Require protected VM access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stage exact autopilot bundle
        id: stage
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/radah-autopilot-${GITHUB_RUN_ID}.tgz"
          remote_bundle="/tmp/radah-autopilot-${GITHUB_RUN_ID}.tgz"
          remote_root="/tmp/radah-autopilot-${GITHUB_RUN_ID}"
          tar -czf "$bundle" \
            scripts/autopilot/lane_supervisor.py \
            scripts/autopilot/install_autopilot.sh \
            scripts/autopilot/revenue_workplane_supervisor.py \
            scripts/autopilot/multilane_supervisor.py \
            scripts/autopilot/control_plane_guard.py \
            governance/radah_memshalah_autopilot_policy.json \
            governance/verticals.json \
            governance/SYSTEM_CONSTITUTION.md \
            governance/authority_matrix.json \
            governance/five_council_policy.json \
            governance/incident_learning_policy.json \
            governance/legal_evidence_policy.json \
            governance/constitutional_amendment_policy.json \
            governance/revenue_workplane.json \
            governance/lane_access_policy.json \
            governance/lane_runtime_contracts.json \
            governance/profitability_lane_contracts.json \
            agents/registry.json
          scp -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$bundle" "$VM_USER@$VM_HOST:$remote_bundle"
          echo "remote_bundle=$remote_bundle" >> "$GITHUB_OUTPUT"
          echo "remote_root=$remote_root" >> "$GITHUB_OUTPUT"

      - name: Install and prove first production cycle
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          REMOTE_BUNDLE: ${{ steps.stage.outputs.remote_bundle }}
          REMOTE_ROOT: ${{ steps.stage.outputs.remote_root }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "$VM_USER@$VM_HOST" \
            "REMOTE_BUNDLE='$REMOTE_BUNDLE' REMOTE_ROOT='$REMOTE_ROOT' RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cleanup() {
            rm -rf "$REMOTE_ROOT"
            rm -f "$REMOTE_BUNDLE"
          }
          trap cleanup EXIT
          test -f "$REMOTE_BUNDLE"
          mkdir -m 700 "$REMOTE_ROOT"
          tar -xzf "$REMOTE_BUNDLE" -C "$REMOTE_ROOT"
          ASSET_ROOT="$REMOTE_ROOT" RUN_ID="$RUN_ID" bash "$REMOTE_ROOT/scripts/autopilot/install_autopilot.sh"
          REMOTE

      - name: Record activation summary
        run: |
          {
            echo '## RADAH MEMSHALAH Autopilot'
            echo '- exact main SHA: `${{ github.sha }}`'
            echo '- activation: founder-gated'
            echo '- cadence: 30 minutes'
            echo '- automatic external actions: disabled'
            echo '- primary revenue wave: 2 lanes maximum'
            echo '- first bounded mission: acceptance required by installer'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup runner access material
        if: always()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          REMOTE_BUNDLE: ${{ steps.stage.outputs.remote_bundle }}
          REMOTE_ROOT: ${{ steps.stage.outputs.remote_root }}
        shell: bash
        run: |
          set +e
          if [ -f "$HOME/.ssh/foundation_vm_key" ]; then
            ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" \
              "rm -rf '$REMOTE_ROOT'; rm -f '$REMOTE_BUNDLE'" >/dev/null 2>&1
          fi
          rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP"/radah-autopilot-*.tgz
