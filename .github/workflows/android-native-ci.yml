name: Android Native CI

on:
  pull_request:
    paths:
      - 'android-client/**'
      - '.github/workflows/android-native-ci.yml'
  push:
    branches:
      - 'feat/dominion-android-native-v1'
    paths:
      - 'android-client/**'
      - '.github/workflows/android-native-ci.yml'

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-client
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prove public-app isolation
        run: |
          test "$(grep -RIlE 'PUBLISHER_CLIENT_SECRET|META_APP_SECRET|OANDA_API_KEY|BINANCE_API_KEY|GOOGLE_SERVICE_ACCOUNT_JSON' app/src || true)" = ""
          ! grep -Rqi 'WebView' app/src/main
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          echo 'ANDROID_PUBLIC_BOUNDARY_PASS'

      - name: Compile lint and unit test
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest

      - name: Verify debug APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk && echo 'ANDROID_DEBUG_APK_PASS'
