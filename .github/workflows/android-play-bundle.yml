name: Android Play Bundle

on:
  pull_request:
    paths:
      - 'android-client/**'
      - '.github/workflows/android-play-bundle.yml'
  push:
    branches:
      - 'feat/dominion-android-native-v1'
    paths:
      - 'android-client/**'
      - '.github/workflows/android-play-bundle.yml'

permissions:
  contents: read

jobs:
  play-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-client
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install API 36 SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prove Play baseline
        run: |
          grep -q 'applicationId = "org.dominionhealing.creator"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          echo 'ANDROID_PLAY_BASELINE_PASS'

      - name: Build release app bundle
        run: gradle --no-daemon :app:bundleRelease

      - name: Verify release AAB exists
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/bundle/release/app-release.aab
          echo 'ANDROID_PLAY_AAB_PASS'

      - name: Upload release AAB receipt
        uses: actions/upload-artifact@v4
        with:
          name: dominion-creator-play-aab-${{ github.sha }}
          path: android-client/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
