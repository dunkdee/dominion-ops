name: Apply External Message Test Alignment

on:
  push:
    branches:
      - capability/governed-external-message-backend

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: capability/governed-external-message-backend
          fetch-depth: 0

      - name: Align regression and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_buddy_operator_v2.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_message_is_drafted_then_held(op):
              result = op.handle("Send an outreach email to these prospects")
              assert result["status"] == "HELD"
              assert result["receipts"][0]["capability"] == "artifact.stage"
              assert result["receipts"][0]["status"] == "VERIFIED"
              assert result["held"]["capability"] == "external.message"
          '''
          new = '''def test_message_without_explicit_destination_drafts_then_blocks_before_authority(op):
              result = op.handle("Send an outreach email to these prospects")
              assert result["status"] == "BLOCKED"
              assert result["receipts"][0]["capability"] == "artifact.stage"
              assert result["receipts"][0]["status"] == "VERIFIED"
              boundary = result["receipts"][1]
              assert boundary["capability"] == "external.message"
              assert boundary["status"] == "BLOCKED"
              assert boundary["errors"][0]["error"] == "ExternalPayloadPreparationError"
              assert result["held"] is None


          def test_message_with_explicit_destination_is_drafted_then_held(op):
              result = op.handle("Send an outreach email to founder@example.com")
              assert result["status"] == "HELD"
              assert result["receipts"][0]["capability"] == "artifact.stage"
              assert result["receipts"][0]["status"] == "VERIFIED"
              assert result["held"]["capability"] == "external.message"
              assert result["held"]["payload_hash"]
          '''
          if text.count(old) != 1:
              raise SystemExit('message regression block did not match exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/apply-external-message-test-alignment.yml').unlink()
          PY

      - name: Run aligned focused suite
        shell: bash
        env:
          PYTHONPATH: .:buddy_core
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m pytest -q \
            tests/test_buddy_operator_v2.py \
            tests/test_governed_external_message_backend.py \
            tests/test_buddy_authority_policy.py \
            tests/test_buddy_authority_execution.py \
            tests/test_pr235_final_security_closure.py

      - name: Commit final test alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: require explicit message destination before authority"
          git push origin HEAD:capability/governed-external-message-backend
