name: Apply Governed External Message Backend

on:
  push:
    branches:
      - capability/governed-external-message-backend

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: capability/governed-external-message-backend
          fetch-depth: 0

      - name: Apply bounded wiring and remove temporary patcher
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_apply_external_message_backend.py

      - name: Run focused regression suite on final candidate tree
        shell: bash
        env:
          PYTHONPATH: .:buddy_core
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m py_compile buddy_core/core/operator.py buddy_core/core/message_delivery.py
          python -m pytest -q \
            tests/test_governed_external_message_backend.py \
            tests/test_buddy_authority_policy.py \
            tests/test_buddy_authority_execution.py \
            tests/test_pr235_final_security_closure.py

      - name: Commit final candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: wire governed external message delivery"
          git push origin HEAD:capability/governed-external-message-backend
