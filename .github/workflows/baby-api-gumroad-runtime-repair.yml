name: Baby API — Governed Gumroad Runtime Repair

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/repair_baby_api_gumroad.sh'
      - '.github/workflows/baby-api-gumroad-runtime-repair.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/repair_baby_api_gumroad.sh'
      - '.github/workflows/baby-api-gumroad-runtime-repair.yml'

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate governed Baby API repair
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n scripts/repair_baby_api_gumroad.sh
          grep -Fq 'BABY_API_PREMUTATION_CONTRACT=PASS' scripts/repair_baby_api_gumroad.sh
          grep -Fq 'os.replace(tmp,dst)' scripts/repair_baby_api_gumroad.sh
          grep -Fq 'os.fsync(dfd)' scripts/repair_baby_api_gumroad.sh
          grep -Fq -- '--no-deps --no-build --force-recreate baby-api' scripts/repair_baby_api_gumroad.sh
          grep -Fq 'BABY_API_GUMROAD_REPAIR=ROLLBACK' scripts/repair_baby_api_gumroad.sh
          grep -Fq 'BABY_API_GUMROAD_REPAIR=PASS' scripts/repair_baby_api_gumroad.sh
          if grep -Fq '/gumroad/sales' scripts/repair_baby_api_gumroad.sh; then
            echo 'BABY_API_GUMROAD_VALIDATE=HOLD reason=sales_endpoint_forbidden'
            exit 1
          fi
          if grep -Eq 'docker compose .*up -d([^\n]* )(?!baby-api)' scripts/repair_baby_api_gumroad.sh 2>/dev/null; then
            :
          fi
          echo 'BABY_API_GUMROAD_VALIDATE=PASS'

  repair:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: foundation-vm-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify current protected Gumroad token
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GUMROAD_TOKEN" || { echo 'BABY_API_GUMROAD_REPAIR=HOLD reason=secret_missing'; exit 1; }
          code="$(curl -sS -o "$RUNNER_TEMP/gumroad-products.json" -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $GUMROAD_TOKEN" https://api.gumroad.com/v2/products)"
          python3 - "$RUNNER_TEMP/gumroad-products.json" "$code" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if sys.argv[2] != '200' or d.get('success') is not True:
              raise SystemExit('BABY_API_GUMROAD_REPAIR=HOLD reason=protected_token_rejected')
          products=d.get('products',[])
          published=sum(1 for p in products if p.get('published') is True)
          if not products or published < 1:
              raise SystemExit('BABY_API_GUMROAD_REPAIR=HOLD reason=no_published_products')
          print(f'BABY_API_GUMROAD_TOKEN=PASS products={len(products)} published={published}')
          PY
          rm -f "$RUNNER_TEMP/gumroad-products.json"

      - name: Require protected VM connection
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" && test -n "$VM_USER" && test -n "$VM_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Wait for canonical VM release parity
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          repo="$HOME/dominion-ops"
          matched=0
          for _ in $(seq 1 120); do
            if [ -d "$repo/.git" ] && [ "$(git -C "$repo" rev-parse HEAD 2>/dev/null || true)" = "$RELEASE_SHA" ]; then
              matched=1
              break
            fi
            sleep 2
          done
          [ "$matched" -eq 1 ] || { echo 'BABY_API_GUMROAD_REPAIR=HOLD reason=vm_release_not_current'; exit 1; }
          echo "BABY_API_VM_SHA=PASS sha=$RELEASE_SHA"
          REMOTE

      - name: Stage protected token and exact repair script
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          printf 'GUMROAD_TOKEN=%s\n' "$GUMROAD_TOKEN" > "$RUNNER_TEMP/baby-api-gumroad.env"
          scp_opts=(-i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${scp_opts[@]}" "$RUNNER_TEMP/baby-api-gumroad.env" \
            "$VM_USER@$VM_HOST:/tmp/baby-api-gumroad-${GITHUB_RUN_ID}.env"
          scp "${scp_opts[@]}" scripts/repair_baby_api_gumroad.sh \
            "$VM_USER@$VM_HOST:/tmp/repair-baby-api-gumroad-${GITHUB_RUN_ID}.sh"
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "chmod 600 '/tmp/baby-api-gumroad-${GITHUB_RUN_ID}.env'; chmod 700 '/tmp/repair-baby-api-gumroad-${GITHUB_RUN_ID}.sh'"
          rm -f "$RUNNER_TEMP/baby-api-gumroad.env"

      - name: Restore Gumroad to Baby API with rollback
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "$VM_USER@$VM_HOST" \
            "RUN_ID='$GITHUB_RUN_ID' RELEASE_SHA='$RELEASE_SHA' bash '/tmp/repair-baby-api-gumroad-${GITHUB_RUN_ID}.sh'"

      - name: Remove temporary protected material
        if: always()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          if [ -n "${VM_HOST:-}" ] && [ -n "${VM_USER:-}" ] && [ -f "$HOME/.ssh/foundation_vm_key" ] && [ -f "$HOME/.ssh/known_hosts" ]; then
            ssh -i "$HOME/.ssh/foundation_vm_key" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$VM_USER@$VM_HOST" \
              "rm -f '/tmp/repair-baby-api-gumroad-${GITHUB_RUN_ID}.sh' '/tmp/baby-api-gumroad-${GITHUB_RUN_ID}.env'" || true
          fi
          rm -f "$HOME/.ssh/foundation_vm_key" "$RUNNER_TEMP/baby-api-gumroad.env" "$RUNNER_TEMP/gumroad-products.json"
