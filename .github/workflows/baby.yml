name: Legacy full-stack deploy (disabled)

# This workflow previously rewrote the VM environment file, pulled into a
# divergent production checkout, and rebuilt every container on every push to
# main. It is intentionally held until the immutable release pipeline is ready.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ACKNOWLEDGE to confirm this workflow is disabled"
        required: true

permissions:
  contents: read

jobs:
  deployment-hold:
    if: ${{ github.event.inputs.confirm == 'ACKNOWLEDGE' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment hold
        run: |
          echo "The legacy all-service deployment is disabled."
          echo "Use a tested, service-specific release with health checks and rollback."
