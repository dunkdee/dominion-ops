name: Brain Renderer Target Hardening

on:
  push:
    branches:
      - governance/agent-brain-pack-20260809
    paths:
      - .github/workflows/brain-renderer-hardening.yml
      - scripts/runtime/brain_renderer_target_guard_patch.py

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: governance/agent-brain-pack-20260809
          fetch-depth: 0
      - name: Apply target guard
        run: python scripts/runtime/brain_renderer_target_guard_patch.py
      - name: Validate brain suite
        run: |
          python -m pip install --disable-pip-version-check 'pytest>=8,<9'
          python -m py_compile scripts/render_dominion_brain.py tests/test_render_dominion_brain.py
          pytest -q tests/test_render_dominion_brain.py
          target="$(mktemp -d)/Dominion-Brain"
          python scripts/render_dominion_brain.py "$target"
          test -f "$target/MANIFEST.json"
          git diff --check
      - name: Commit durable files only
        run: |
          git config user.name dominion-github-engineer
          git config user.email actions@users.noreply.github.com
          git add scripts/render_dominion_brain.py tests/test_render_dominion_brain.py
          git diff --cached --check
          git commit -m 'fix(brain): reject prepopulated or symlinked render targets'
          git push origin HEAD:governance/agent-brain-pack-20260809
