name: Buddy Web Context Wire (Branch Only)

on:
  push:
    branches:
      - buddy/operator-complete-20260820
    paths:
      - '.github/workflows/buddy-operator-web-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.ref == 'refs/heads/buddy/operator-complete-20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact nonproduction branch without third-party actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git checkout buddy/operator-complete-20260820
      - name: Wire bounded conversation context into BuddyOperator
        run: |
          cd repo
          python3 - <<'PY'
          from pathlib import Path
          p = Path('buddy_core/buddy_web.py')
          text = p.read_text(encoding='utf-8')
          old = '        operator_result = get_operator().handle(message, session_id=session_id)\n'
          new = '        operator_result = get_operator().handle(message, session_id=session_id, conversation_context=full_prompt)\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one operator chat marker, found {text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          print('BUDDY_WEB_CONTEXT_WIRE=STAGED')
          PY
          python3 -m py_compile buddy_core/buddy_web.py buddy_core/core/operator.py
          test "$(git diff --name-only | tr '\n' ' ')" = "buddy_core/buddy_web.py "
          git diff --check
      - name: Commit only Buddy web context wire
        run: |
          cd repo
          git config user.name 'dominion-buddy-build'
          git config user.email 'buddy-build@users.noreply.github.com'
          git add buddy_core/buddy_web.py
          git commit -m 'feat(buddy): preserve conversation context in operator chat'
          git push origin HEAD:buddy/operator-complete-20260820
