name: Buddy Phone Access Verification

# Read-only. Proves the phone-first contract end to end:
#   * the three public hosts still answer
#   * Buddy's sign-in screen is reachable from a phone browser
#   * BUDDY_WEB_TOKEN resolves to exactly one value across every source
#   * the Obsidian Command Center is still connected
# No VM mutation of any kind.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/buddy-phone-access-clean
    paths:
      - 'buddy_core/**'
      - 'scripts/deploy_command_center.sh'
      - '.github/workflows/buddy-phone-access-verify.yml'

permissions:
  contents: read

jobs:
  contract:
    name: Phone login contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi httpx uvicorn python-dotenv requests
      - name: Prove the phone sign-in flow against the real app
        env:
          PYTHONPATH: .:buddy_core
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_buddy_phone_login.py tests/test_buddy_token_resolver.py
          echo 'BUDDY_PHONE_LOGIN_CONTRACT=PASS'

  public:
    name: Public host reachability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe the public hosts a phone actually hits
        run: |
          set -euo pipefail
          fail=0

          probe() {
            local url="$1" expected="$2" label="$3"
            local code
            code="$(curl -sS -o /tmp/body.out -w '%{http_code}' --max-time 25 -L "$url" 2>/dev/null || true)"
            echo "$label=$code url=$url expected=$expected"
            case " $expected " in
              *" $code "*) ;;
              *) fail=1; echo "::error::$label returned $code, expected one of: $expected" ;;
            esac
          }

          probe https://dominionhealing.org/ '200' MAIN_SITE
          probe https://shop.dominionhealing.org/ '200' SHOP_SITE
          probe https://buddy.dominionhealing.org/buddy '401' BUDDY_GATED

          # The unauthenticated 401 response must still carry the phone login UI.
          curl -sS --max-time 25 https://buddy.dominionhealing.org/buddy -o /tmp/buddy_gate.html || true
          if grep -q '/buddy/api/login' /tmp/buddy_gate.html; then
            echo 'BUDDY_PHONE_LOGIN_SCREEN=SERVED'
          else
            fail=1
            echo '::error::BUDDY_PHONE_LOGIN_SCREEN=NOT_SERVED'
          fi

          probe https://buddy.dominionhealing.org/buddy/login '200 401 404' BUDDY_LOGIN_ROUTE
          test "$fail" -eq 0
          echo 'BUDDY_PUBLIC_PATH_ACCEPTANCE=PASS'

  runtime:
    name: VM read-only truth
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Validate VM connection secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read-only phone-access truth
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$VM_USER@$VM_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          BUDDY_DIR="$HOME/buddy_core"

          echo '=== BUDDY WEB SERVICE ==='
          systemctl is-active --quiet dominion-buddy-web.service
          echo 'BUDDY_WEB_SERVICE=ACTIVE'

          echo '=== TOKEN RESOLUTION (NAMES AND BOOLEANS ONLY) ==='
          test -f "$BUDDY_DIR/core/token_resolver.py" || {
            echo 'TOKEN_RESOLVER_DEPLOYED=NO'
            exit 30
          }
          "$HOME/dominion_env/bin/python3" - "$BUDDY_DIR" <<'PY'
          import json, sys
          from pathlib import Path
          runtime = Path(sys.argv[1])
          sys.path.insert(0, str(runtime))
          from core.token_resolver import resolve_buddy_web_token
          report = resolve_buddy_web_token(home=runtime.parent).report()
          safe = {k: v for k, v in report.items() if k != 'token'}
          print('TOKEN_REPORT=' + json.dumps(safe, sort_keys=True))
          if not report.get('configured'):
              raise SystemExit('BUDDY_WEB_TOKEN is not configured')
          if report.get('conflict'):
              raise SystemExit('BUDDY_WEB_TOKEN source conflict detected')
          if report.get('duplicate_sources'):
              raise SystemExit('duplicate BUDDY_WEB_TOKEN sources detected')
          print('TOKEN_CONFLICT_RESOLVED=YES')
          PY

          echo '=== SUDO / SYSTEMD ENVIRONMENT DIAGNOSTIC (READ ONLY, NO SECRET VALUES) ==='
          sudo -n true 2>/dev/null && echo 'SUDO_NOPASSWD=YES' || echo 'SUDO_NOPASSWD=NO'
          systemctl show dominion-buddy-web.service -p EnvironmentFiles --no-pager 2>/dev/null || true
          env_directive="$(systemctl show dominion-buddy-web.service -p Environment --value 2>/dev/null || true)"
          if printf '%s' "$env_directive" | grep -q 'BUDDY_WEB_TOKEN='; then
            echo 'BUDDY_WEB_TOKEN_IN_SYSTEMD_ENVIRONMENT_DIRECTIVE=YES'
          else
            echo 'BUDDY_WEB_TOKEN_IN_SYSTEMD_ENVIRONMENT_DIRECTIVE=NO'
          fi
          buddy_pid="$(systemctl show -p MainPID --value dominion-buddy-web.service 2>/dev/null || true)"
          echo "BUDDY_WEB_MAIN_PID=${buddy_pid:-0}"
          test -n "${buddy_pid:-}" && test "$buddy_pid" != '0'
          if sudo -n test -r "/proc/$buddy_pid/environ" 2>/dev/null; then
            echo 'PROC_ENVIRON_READABLE=YES'
            if sudo -n tr '\0' '\n' < "/proc/$buddy_pid/environ" 2>/dev/null | grep -q '^BUDDY_WEB_TOKEN='; then
              echo 'BUDDY_WEB_TOKEN_IN_PROC_ENVIRON=YES'
            else
              echo 'BUDDY_WEB_TOKEN_IN_PROC_ENVIRON=NO (loaded at runtime via dotenv, not exec-time env)'
            fi
          else
            echo 'PROC_ENVIRON_READABLE=NO (diagnostic only; resolver remains authoritative)'
          fi

          echo '=== PHONE LOGIN LIVE PROBE (LOOPBACK, READ ONLY) ==='
          grep -q 'DOMINION_BUDDY_PHONE_AUTH_V1' "$BUDDY_DIR/buddy_web.py" || {
            echo 'PHONE_LOGIN_DEPLOYED=NO'
            exit 31
          }
          token="$("$HOME/dominion_env/bin/python3" - "$BUDDY_DIR" <<'PY'
          import sys
          from pathlib import Path
          runtime = Path(sys.argv[1])
          sys.path.insert(0, str(runtime))
          from core.token_resolver import resolve_buddy_web_token
          sys.stdout.write(resolve_buddy_web_token(home=runtime.parent).token)
          PY
          )"
          test -n "$token"

          gate="$(curl -sS -o /tmp/gate.html -w '%{http_code}' --max-time 10 http://127.0.0.1:5070/buddy || true)"
          echo "UNAUTH_GATE=$gate"
          test "$gate" = '401'
          grep -q '/buddy/api/login' /tmp/gate.html
          echo 'LOGIN_SCREEN_SERVED=YES'

          login="$(curl -sS -c /tmp/jar.txt -o /tmp/login.json -w '%{http_code}' --max-time 10 \
            -H 'Content-Type: application/json' \
            -d "{\"passcode\":\"$token\"}" http://127.0.0.1:5070/buddy/api/login || true)"
          echo "LOGIN_EXCHANGE=$login"
          test "$login" = '200'
          grep -q 'buddy_session' /tmp/jar.txt
          echo 'SESSION_COOKIE_ISSUED=YES'

          dash="$(curl -sS -b /tmp/jar.txt -o /tmp/dash.html -w '%{http_code}' --max-time 10 http://127.0.0.1:5070/buddy || true)"
          echo "DASHBOARD_WITH_SESSION=$dash"
          test "$dash" = '200'
          grep -q 'id="messages"' /tmp/dash.html
          echo 'EXISTING_DASHBOARD_OPENED=YES'

          bad="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 -H 'Content-Type: application/json' \
            -d '{"passcode":"definitely-not-the-passcode"}' http://127.0.0.1:5070/buddy/api/login || true)"
          echo "WRONG_PASSCODE_REJECTED=$bad"
          test "$bad" = '401'
          rm -f /tmp/jar.txt /tmp/login.json /tmp/gate.html /tmp/dash.html
          unset token

          echo '=== OBSIDIAN COMMAND CENTER ==='
          obsidian_state="$(docker inspect obsidian-remote --format '{{.State.Status}}' 2>/dev/null || true)"
          obsidian_health="$(docker inspect obsidian-remote --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' 2>/dev/null || true)"
          command_center_state="$(docker inspect dominion-command-center --format '{{.State.Status}}' 2>/dev/null || true)"
          echo "obsidian-remote=$obsidian_state health=$obsidian_health"
          echo "dominion-command-center=$command_center_state"
          test "$obsidian_state" = 'running'
          test "$obsidian_health" = 'healthy'
          test "$command_center_state" = 'running'

          cc_code="$(curl -sS -o /tmp/cc.json -w '%{http_code}' --max-time 10 http://127.0.0.1:8091/health || true)"
          echo "COMMAND_CENTER_HEALTH=$cc_code"
          test "$cc_code" = '200'
          python3 - <<'PY'
          import json
          s = json.load(open('/tmp/cc.json'))
          if s.get('status') != 'ok':
              raise SystemExit('Command Center status is not ok')
          print('COMMAND_CENTER_STATUS=' + json.dumps({k: s.get(k) for k in ('status', 'truth', 'systems') if k in s}, sort_keys=True)[:600])
          PY

          echo 'BUDDY_RUNTIME_ACCEPTANCE=PASS'
          echo '=== READ-ONLY VERIFICATION COMPLETE: NO VM MUTATIONS PERFORMED ==='
          REMOTE

      - name: Cleanup SSH material
        if: always()
        run: rm -f ~/.ssh/id_vm ~/.ssh/known_hosts
