name: Buddy Phone Access Verification

# Read-only. Proves the phone-first contract end to end:
#   * the three public hosts still answer
#   * Buddy's sign-in screen is reachable from a phone browser
#   * BUDDY_WEB_TOKEN resolves to exactly one value across every source
#   * Proposal Queue state-changing routes reject unauthorized callers
#   * governed internal multi-capability execution works without external effects
#   * controlled model-router fallback reports truthful provider provenance
#   * the Obsidian Command Center is still connected
# No durable production-state mutation of any kind.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/buddy-phone-access-clean
    paths:
      - 'buddy_core/**'
      - 'scripts/deploy_command_center.sh'
      - '.github/workflows/buddy-phone-access-verify.yml'

permissions:
  contents: read

jobs:
  contract:
    name: Phone login contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi httpx uvicorn python-dotenv requests
      - name: Prove the phone sign-in flow against the real app
        env:
          PYTHONPATH: .:buddy_core
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_buddy_phone_login.py tests/test_buddy_token_resolver.py
          echo 'BUDDY_PHONE_LOGIN_CONTRACT=PASS'

  public:
    name: Public host reachability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe the public hosts a phone actually hits
        run: |
          set -euo pipefail
          fail=0

          probe() {
            local url="$1" expected="$2" label="$3"
            local code
            code="$(curl -sS -o /tmp/body.out -w '%{http_code}' --max-time 25 -L "$url" 2>/dev/null || true)"
            echo "$label=$code url=$url expected=$expected"
            case " $expected " in
              *" $code "*) ;;
              *) fail=1; echo "::error::$label returned $code, expected one of: $expected" ;;
            esac
          }

          probe https://dominionhealing.org/ '200' MAIN_SITE
          probe https://shop.dominionhealing.org/ '200' SHOP_SITE
          probe https://buddy.dominionhealing.org/buddy '401' BUDDY_GATED

          # The unauthenticated 401 response must still carry the phone login UI.
          curl -sS --max-time 25 https://buddy.dominionhealing.org/buddy -o /tmp/buddy_gate.html || true
          if grep -q '/buddy/api/login' /tmp/buddy_gate.html; then
            echo 'BUDDY_PHONE_LOGIN_SCREEN=SERVED'
          else
            fail=1
            echo '::error::BUDDY_PHONE_LOGIN_SCREEN=NOT_SERVED'
          fi

          probe https://buddy.dominionhealing.org/buddy/login '200 401 404' BUDDY_LOGIN_ROUTE
          test "$fail" -eq 0
          echo 'BUDDY_PUBLIC_PATH_ACCEPTANCE=PASS'

  runtime:
    name: VM read-only truth
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Validate VM connection secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read-only phone-access truth
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$VM_USER@$VM_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          BUDDY_DIR="$HOME/buddy_core"

          echo '=== BUDDY WEB SERVICE ==='
          systemctl is-active --quiet dominion-buddy-web.service
          echo 'BUDDY_WEB_SERVICE=ACTIVE'

          echo '=== TOKEN RESOLUTION (NAMES AND BOOLEANS ONLY) ==='
          test -f "$BUDDY_DIR/core/token_resolver.py" || {
            echo 'TOKEN_RESOLVER_DEPLOYED=NO'
            exit 30
          }
          "$HOME/dominion_env/bin/python3" - "$BUDDY_DIR" <<'PY'
          import json, sys
          from pathlib import Path
          runtime = Path(sys.argv[1])
          sys.path.insert(0, str(runtime))
          from core.token_resolver import resolve_buddy_web_token
          report = resolve_buddy_web_token(home=runtime.parent).report()
          safe = {k: v for k, v in report.items() if k != 'token'}
          print('TOKEN_REPORT=' + json.dumps(safe, sort_keys=True))
          if not report.get('configured'):
              raise SystemExit('BUDDY_WEB_TOKEN is not configured')
          if report.get('conflict'):
              raise SystemExit('BUDDY_WEB_TOKEN source conflict detected')
          if report.get('duplicate_sources'):
              raise SystemExit('duplicate BUDDY_WEB_TOKEN sources detected')
          print('TOKEN_CONFLICT_RESOLVED=YES')
          PY

          echo '=== SUDO / SYSTEMD ENVIRONMENT DIAGNOSTIC (READ ONLY, NO SECRET VALUES) ==='
          sudo -n true 2>/dev/null && echo 'SUDO_NOPASSWD=YES' || echo 'SUDO_NOPASSWD=NO'
          systemctl show dominion-buddy-web.service -p EnvironmentFiles --no-pager 2>/dev/null || true
          env_directive="$(systemctl show dominion-buddy-web.service -p Environment --value 2>/dev/null || true)"
          if printf '%s' "$env_directive" | grep -q 'BUDDY_WEB_TOKEN='; then
            echo 'BUDDY_WEB_TOKEN_IN_SYSTEMD_ENVIRONMENT_DIRECTIVE=YES'
          else
            echo 'BUDDY_WEB_TOKEN_IN_SYSTEMD_ENVIRONMENT_DIRECTIVE=NO'
          fi
          buddy_pid="$(systemctl show -p MainPID --value dominion-buddy-web.service 2>/dev/null || true)"
          echo "BUDDY_WEB_MAIN_PID=${buddy_pid:-0}"
          test -n "${buddy_pid:-}" && test "$buddy_pid" != '0'
          if sudo -n test -r "/proc/$buddy_pid/environ" 2>/dev/null; then
            echo 'PROC_ENVIRON_READABLE=YES'
            if sudo -n tr '\0' '\n' < "/proc/$buddy_pid/environ" 2>/dev/null | grep -q '^BUDDY_WEB_TOKEN='; then
              echo 'BUDDY_WEB_TOKEN_IN_PROC_ENVIRON=YES'
            else
              echo 'BUDDY_WEB_TOKEN_IN_PROC_ENVIRON=NO (loaded at runtime via dotenv, not exec-time env)'
            fi
          else
            echo 'PROC_ENVIRON_READABLE=NO (diagnostic only; resolver remains authoritative)'
          fi

          echo '=== PHONE LOGIN LIVE PROBE (LOOPBACK, READ ONLY) ==='
          grep -q 'DOMINION_BUDDY_PHONE_AUTH_V1' "$BUDDY_DIR/buddy_web.py" || {
            echo 'PHONE_LOGIN_DEPLOYED=NO'
            exit 31
          }
          token="$("$HOME/dominion_env/bin/python3" - "$BUDDY_DIR" <<'PY'
          import sys
          from pathlib import Path
          runtime = Path(sys.argv[1])
          sys.path.insert(0, str(runtime))
          from core.token_resolver import resolve_buddy_web_token
          sys.stdout.write(resolve_buddy_web_token(home=runtime.parent).token)
          PY
          )"
          test -n "$token"

          gate="$(curl -sS -o /tmp/gate.html -w '%{http_code}' --max-time 10 http://127.0.0.1:5070/buddy || true)"
          echo "UNAUTH_GATE=$gate"
          test "$gate" = '401'
          grep -q '/buddy/api/login' /tmp/gate.html
          echo 'LOGIN_SCREEN_SERVED=YES'

          login="$(curl -sS -c /tmp/jar.txt -o /tmp/login.json -w '%{http_code}' --max-time 10 \
            -H 'Content-Type: application/json' \
            -d "{\"passcode\":\"$token\"}" http://127.0.0.1:5070/buddy/api/login || true)"
          echo "LOGIN_EXCHANGE=$login"
          test "$login" = '200'
          grep -q 'buddy_session' /tmp/jar.txt
          echo 'SESSION_COOKIE_ISSUED=YES'

          dash="$(curl -sS -b /tmp/jar.txt -o /tmp/dash.html -w '%{http_code}' --max-time 10 http://127.0.0.1:5070/buddy || true)"
          echo "DASHBOARD_WITH_SESSION=$dash"
          test "$dash" = '200'
          grep -q 'id="messages"' /tmp/dash.html
          echo 'EXISTING_DASHBOARD_OPENED=YES'

          bad="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 -H 'Content-Type: application/json' \
            -d '{"passcode":"definitely-not-the-passcode"}' http://127.0.0.1:5070/buddy/api/login || true)"
          echo "WRONG_PASSCODE_REJECTED=$bad"
          test "$bad" = '401'
          rm -f /tmp/jar.txt /tmp/login.json /tmp/gate.html /tmp/dash.html
          unset token

          echo '=== PROPOSAL QUEUE MUTATION AUTH (NONEXISTENT-ID PROBE ONLY) ==='
          systemctl is-active --quiet dominion-proposal-queue.service
          PROPOSAL="$BUDDY_DIR/proposal_queue.py"
          test -f "$PROPOSAL"
          grep -q 'PROPOSAL_OPERATOR_KEY' "$PROPOSAL"
          grep -q '_require_operator_auth' "$PROPOSAL"

          proposal_pid="$(systemctl show -p MainPID --value dominion-proposal-queue.service 2>/dev/null || true)"
          echo "PROPOSAL_QUEUE_MAIN_PID=${proposal_pid:-0}"
          test -n "${proposal_pid:-}" && test "$proposal_pid" != '0'
          sudo -n test -r "/proc/$proposal_pid/environ"
          proposal_key="$(sudo -n tr '\0' '\n' < "/proc/$proposal_pid/environ" | sed -n 's/^PROPOSAL_OPERATOR_KEY=//p' | head -1)"
          test -n "$proposal_key"
          echo 'PROPOSAL_OPERATOR_KEY_RUNTIME=CONFIGURED'

          probe_name='__dominion_auth_probe_never_exists_20260915_7f6ea318__.json'
          test ! -e "$BUDDY_DIR/ready_to_submit/$probe_name"
          proposal_url="http://127.0.0.1:5101/api/proposals/$probe_name/mark-submitted"

          proposal_unauth="$(curl -sS -o /tmp/proposal_unauth.json -w '%{http_code}' --max-time 10 -X POST "$proposal_url" || true)"
          echo "PROPOSAL_UNAUTH_MUTATION=$proposal_unauth"
          test "$proposal_unauth" = '401'

          proposal_bad="$(curl -sS -o /tmp/proposal_bad.json -w '%{http_code}' --max-time 10 -X POST \
            -H 'Authorization: Bearer definitely-not-the-operator-key' "$proposal_url" || true)"
          echo "PROPOSAL_BAD_KEY_MUTATION=$proposal_bad"
          test "$proposal_bad" = '401'

          proposal_auth="$(curl -sS -o /tmp/proposal_auth.json -w '%{http_code}' --max-time 10 -X POST \
            -H "Authorization: Bearer $proposal_key" "$proposal_url" || true)"
          echo "PROPOSAL_VALID_KEY_NONEXISTENT_ID=$proposal_auth"
          test "$proposal_auth" = '404'
          test ! -e "$BUDDY_DIR/ready_to_submit/$probe_name"
          rm -f /tmp/proposal_unauth.json /tmp/proposal_bad.json /tmp/proposal_auth.json
          unset proposal_key
          echo 'PROPOSAL_MUTATION_AUTH_ACCEPTANCE=PASS'

          echo '=== MULTI-CAPABILITY RUNTIME + CONTROLLED FALLBACK (NO PROVIDER CALLS) ==='
          "$HOME/dominion_env/bin/python3" - "$BUDDY_DIR" <<'PY'
          import hashlib
          import json
          import sys
          import tempfile
          from pathlib import Path

          runtime = Path(sys.argv[1]).resolve()
          sys.path.insert(0, str(runtime))

          import core.operator as operator_module
          import core.brain_router as router
          from core.operator import BuddyOperator

          # Keep durable Buddy state untouched. These overrides exist only in this
          # one probe process; the capability executors remain deployed runtime code.
          operator_module.record_mission = lambda record: record
          operator_module.audit = lambda event, data: {"event": event}

          with tempfile.TemporaryDirectory(prefix="buddy-runtime-accept-") as state:
              op = BuddyOperator(state_dir=Path(state))
              required = ("system.status", "revenue.feedback")
              for capability in required:
                  cap = op.capabilities.get(capability)
                  if not cap:
                      raise SystemExit(f"missing registered capability: {capability}")
                  if cap.get("classification") != "read" or cap.get("auth_required"):
                      raise SystemExit(f"capability is not read-only: {capability}")

              plan = {
                  "mission_id": "mission_runtime_acceptance",
                  "objective": "Read current governed internal health and revenue feedback only",
                  "kind": "runtime_acceptance",
                  "evidence_policy": None,
                  "created_at": "2026-09-15T00:00:00+00:00",
                  "conversation_context": "",
                  "steps": [
                      {
                          "capability": "system.status",
                          "instruction": "Read current loopback-only governed system health.",
                      },
                      {
                          "capability": "revenue.feedback",
                          "instruction": "Read current governed revenue feedback without external action.",
                      },
                  ],
                  "completion_rule": "Read-only acceptance probe.",
              }
              result = op.execute(plan, session_id="runtime-acceptance")
              if result.get("status") != "COMPLETE":
                  raise SystemExit(f"multi-capability mission status={result.get('status')}")
              receipts = result.get("receipts") or []
              observed = [row.get("capability") for row in receipts]
              if observed != list(required):
                  raise SystemExit(f"unexpected capability sequence: {observed}")
              for row in receipts:
                  if row.get("status") != "VERIFIED":
                      raise SystemExit(
                          f"capability {row.get('capability')} status={row.get('status')}"
                      )
                  if not row.get("evidence"):
                      raise SystemExit(
                          f"capability {row.get('capability')} missing evidence"
                      )
              receipt_blob = json.dumps(
                  result,
                  sort_keys=True,
                  ensure_ascii=True,
                  default=str,
                  separators=(",", ":"),
              ).encode("utf-8")
              receipt_hash = hashlib.sha256(receipt_blob).hexdigest()
              print(
                  "BUDDY_MULTI_CAPABILITY_ACCEPTANCE=PASS "
                  "capabilities=system.status,revenue.feedback "
                  f"receipt_sha256={receipt_hash}"
              )

          calls = []

          def controlled_available(mode):
              return mode in {"claude", "openai"}

          def controlled_call(mode, prompt, system=None):
              calls.append(mode)
              if mode == "claude":
                  raise RuntimeError("synthetic_primary_failure")
              if mode == "openai":
                  return "CONTROLLED_FALLBACK_OK"
              raise RuntimeError("unexpected_provider_call")

          # Controlled in-memory failure only. No provider/model API is contacted.
          router._available = controlled_available
          router._call = controlled_call
          fallback = router.ask_best(
              "Controlled no-network fallback acceptance probe",
              task_type="coding",
              max_fallback_hops=2,
          )
          if calls != ["claude", "openai"]:
              raise SystemExit(f"unexpected fallback call sequence: {calls}")
          if fallback.provider != "openai":
              raise SystemExit(f"unexpected fallback provider: {fallback.provider}")
          if fallback.fallback_hops != 1:
              raise SystemExit(f"unexpected fallback hops: {fallback.fallback_hops}")
          if fallback.text != "CONTROLLED_FALLBACK_OK":
              raise SystemExit("fallback result text mismatch")
          print(
              "BUDDY_CONTROLLED_FALLBACK_ACCEPTANCE=PASS "
              "primary=anthropic failure=synthetic_primary_failure "
              f"fallback_provider={fallback.provider} fallback_hops={fallback.fallback_hops}"
          )
          print(
              "BUDDY_CAPABILITY_RUNTIME_ACCEPTANCE=PASS "
              "no_provider_api_calls=true durable_state_mutations=0"
          )
          PY

          echo '=== OBSIDIAN COMMAND CENTER ==='
          obsidian_state="$(docker inspect obsidian-remote --format '{{.State.Status}}' 2>/dev/null || true)"
          obsidian_health="$(docker inspect obsidian-remote --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' 2>/dev/null || true)"
          command_center_state="$(docker inspect dominion-command-center --format '{{.State.Status}}' 2>/dev/null || true)"
          echo "obsidian-remote=$obsidian_state health=$obsidian_health"
          echo "dominion-command-center=$command_center_state"
          test "$obsidian_state" = 'running'
          test "$obsidian_health" = 'healthy'
          test "$command_center_state" = 'running'

          cc_code="$(curl -sS -o /tmp/cc.json -w '%{http_code}' --max-time 10 http://127.0.0.1:8091/health || true)"
          echo "COMMAND_CENTER_HEALTH=$cc_code"
          test "$cc_code" = '200'
          python3 - <<'PY'
          import json
          s = json.load(open('/tmp/cc.json'))
          if s.get('status') != 'ok':
              raise SystemExit('Command Center status is not ok')
          print('COMMAND_CENTER_STATUS=' + json.dumps({k: s.get(k) for k in ('status', 'truth', 'systems') if k in s}, sort_keys=True)[:600])
          PY

          echo 'BUDDY_RUNTIME_ACCEPTANCE=PASS'
          echo '=== READ-ONLY VERIFICATION COMPLETE: NO DURABLE VM MUTATIONS PERFORMED ==='
          REMOTE

      - name: Cleanup SSH material
        if: always()
        run: rm -f ~/.ssh/id_vm ~/.ssh/known_hosts
