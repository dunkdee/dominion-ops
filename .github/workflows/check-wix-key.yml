name: Check WIX_API_KEY

on:
  workflow_dispatch:

jobs:
  check-key:
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub Secret
        run: |
          if [ -n "$WIX_KEY" ]; then
            echo "GitHub Secret WIX_API_KEY: SET (${#WIX_KEY} chars)"
          else
            echo "GitHub Secret WIX_API_KEY: NOT SET"
          fi
        env:
          WIX_KEY: ${{ secrets.WIX_API_KEY }}

      - name: Check VM .env via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            for f in ~/.env ~/dominion/.env ~/dominion-ops/.env; do
              if [ -f "$f" ]; then
                if grep -q 'WIX_API_KEY' "$f"; then
                  VAL=$(grep 'WIX_API_KEY' "$f" | cut -d= -f2)
                  echo "$f: WIX_API_KEY SET (${#VAL} chars)"
                else
                  echo "$f: WIX_API_KEY not found"
                fi
              else
                echo "$f: file not found"
              fi
            done
