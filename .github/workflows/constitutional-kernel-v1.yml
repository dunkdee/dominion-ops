name: Constitutional Kernel v1

on:
  pull_request:
    paths:
      - "governance/SYSTEM_CONSTITUTION.md"
      - "governance/constitutional_amendment_policy.json"
      - "governance/break_glass_recovery_policy.json"
      - "scripts/validate_constitutional_kernel_v1.py"
      - ".github/workflows/constitutional-kernel-v1.yml"
  push:
    branches: [main]
    paths:
      - "governance/SYSTEM_CONSTITUTION.md"
      - "governance/constitutional_amendment_policy.json"
      - "governance/break_glass_recovery_policy.json"
      - "scripts/validate_constitutional_kernel_v1.py"
      - ".github/workflows/constitutional-kernel-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: constitutional-kernel-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile validator
        run: python3 -m py_compile scripts/validate_constitutional_kernel_v1.py

      - name: Validate constitutional kernel
        run: python3 scripts/validate_constitutional_kernel_v1.py

      - name: Validate existing governance contracts
        run: python3 scripts/validate_control_plane.py

      - name: Validate guarded runtime contracts
        run: python3 scripts/validate_control_plane_runtime.py
