name: Dominion Constitutional Multi-Lane Production Handoff

on:
  push:
    branches: ['ops/constitutional-multilane-production-83793236']
    paths: ['.github/workflows/constitutional-multilane-production-handoff.yml']

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

env:
  RELEASE_SHA: 83793236c61bebe260c0f9dd92c3bf1601c5ce70

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: foundation-vm-production
    steps:
      - name: Checkout exact merged release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Re-prove constitutional release before production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          bash -n scripts/autopilot/install_autopilot.sh scripts/autopilot/install_revenue_workplane.sh
          python -m py_compile \
            scripts/autopilot/lane_supervisor.py \
            scripts/autopilot/revenue_workplane_supervisor.py \
            scripts/autopilot/control_plane_guard.py \
            scripts/autopilot/multilane_supervisor.py \
            scripts/validate_control_plane.py \
            scripts/validate_lane_runtime_contracts.py
          python scripts/validate_control_plane.py
          python scripts/validate_lane_runtime_contracts.py
          python -m unittest tests.test_lane_runtime_contracts -v
          python -m unittest tests.test_radah_autopilot -v
          python -m unittest tests.test_revenue_workplane -v
          state="$RUNNER_TEMP/multilane-preflight"
          output="$(RADAH_AUTOPILOT_ENABLED=0 python scripts/autopilot/multilane_supervisor.py --plan-only --sweep-size 3 --state-dir "$state")"
          printf '%s\n' "$output"
          printf '%s' "$output" | grep -q 'RADAH_MULTILANE_SWEEP=PLANNED selected=3'
          printf '%s' "$output" | grep -q '"registered_lanes": 11'
          printf '%s' "$output" | grep -q '"runtime_contracts": 11'
          printf '%s' "$output" | grep -q '"economic_profitability_contracts": 8'
          test ! -e "$state/state.json"
          echo "CONSTITUTIONAL_MULTILANE_HANDOFF_PREFLIGHT=PASS release=$RELEASE_SHA"

      - name: Require protected production access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_HOST" && test -n "$VM_USER" && test -n "$VM_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy exact constitutional multi-lane runtime
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "$VM_USER@$VM_HOST" \
            "RUN_ID='$GITHUB_RUN_ID' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          repo="$HOME/dominion-ops"
          service="dominion-radah-autopilot.service"
          test -d "$repo/.git"
          cd "$repo"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

          base_rc=0
          ASSET_ROOT="$repo" RUN_ID="${RUN_ID}-base" bash scripts/autopilot/install_autopilot.sh || base_rc=$?
          if [ "$base_rc" -ne 0 ]; then
            echo "RADAH_BASE_INSTALL=FAILED rc=$base_rc"
            echo '--- systemd status ---'
            sudo systemctl status "$service" --no-pager -l || true
            echo '--- systemd result/environment/command ---'
            sudo systemctl show "$service" \
              -p Result -p ExecMainStatus -p ExecMainCode -p ExecStart -p User \
              -p WorkingDirectory -p Environment -p EnvironmentFiles --no-pager || true
            echo '--- recent journal ---'
            sudo journalctl -u "$service" --since '10 minutes ago' --no-pager -o short-precise || true
            echo '--- latest persisted lane receipt ---'
            latest_receipt="$(find "$HOME/.dominion/autopilot/receipts" -maxdepth 1 -type f -name '*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2- || true)"
            if [ -n "$latest_receipt" ] && [ -s "$latest_receipt" ]; then
              echo "receipt=$latest_receipt"
              python3 -m json.tool "$latest_receipt" || cat "$latest_receipt"
            else
              echo 'receipt=missing'
            fi
            echo '--- scheduler state ---'
            if [ -s "$HOME/.dominion/autopilot/state.json" ]; then
              python3 -m json.tool "$HOME/.dominion/autopilot/state.json" || true
            else
              echo 'state=missing'
            fi
            exit "$base_rc"
          fi

          ASSET_ROOT="$repo" RUN_ID="${RUN_ID}-multilane" bash scripts/autopilot/install_revenue_workplane.sh

          sudo systemctl reset-failed "$service" >/dev/null 2>&1 || true
          sudo systemctl start "$service"
          test "$(sudo systemctl show "$service" -p Result --value)" = success
          test "$(sudo systemctl is-active dominion-radah-autopilot.timer)" = active
          test "$(sudo systemctl is-enabled dominion-radah-autopilot.timer)" = enabled
          test "$(sudo systemctl is-active dominion-revenue-runtime.service)" = active
          test "$(sudo systemctl is-active dominion-revenue-evaluator.timer)" = active

          latest="$HOME/.dominion/autopilot/latest_sweep.json"
          test -s "$latest"
          python3 - "$latest" "$RELEASE_SHA" <<'PY'
          import json,sys
          path,sha=sys.argv[1],sys.argv[2]
          d=json.load(open(path,encoding='utf-8'))
          assert d['schema']=='radah-multilane-sweep-v1', d
          assert d['status']=='HEALTHY', d
          assert d['execution_requested'] is True, d
          assert d['external_actions_authorized'] is False, d
          assert d['registered_lanes']==11 and d['open_lanes']==11, d
          assert d['selected_count']==3, d
          assert len(d['selected_lanes'])==3 and len(set(d['selected_lanes']))==3, d
          c=d['constitutional_guard']
          assert c['status']=='PASS', c
          assert c['registered_lanes']==11 and c['runtime_contracts']==11, c
          assert c['economic_profitability_contracts']==8, c
          assert c['default_deny'] is True, c
          assert c['human_final_authority']=='human_overseer', c
          assert c['five_council'] is True, c
          assert c['incident_learning'] is True, c
          assert c['legal_fail_closed'] is True, c
          assert c['constitutional_amendment_guard'] is True, c
          assert c['live_trading_authorized'] is False, c
          results=d['lane_results']
          assert len(results)==3, results
          for row in results:
              assert row['lane'] in d['selected_lanes'], row
              assert row['external_actions_authorized'] is False, row
              assert row['status'] in {'COMPLETE','HELD','BLOCKED'}, row
              assert not row.get('supervisor_error'), row
              assert row.get('mission_id'), row
              if row['status']=='BLOCKED':
                  assert isinstance(row.get('receipts'),list) and row['receipts'], row
          print('RADAH_CONSTITUTIONAL_MULTILANE_PRODUCTION=PASS')
          print('RELEASE_SHA='+sha)
          print('LANES=11/11')
          print('SWEEP_SIZE=3')
          print('ECONOMIC_PROFITABILITY_CONTRACTS=8')
          print('FOUNDER_AUTHORITY=preserved')
          print('EXTERNAL_ACTIONS_AUTHORIZED=false')
          PY

          resolved="$(systemctl show "$service" -p ExecStart --value)"
          printf '%s\n' "$resolved" | grep -q 'multilane_supervisor.py'
          echo 'RADAH_AUTOPILOT_SERVICE_BINDING=PASS entrypoint=multilane_supervisor.py cadence=30m'
          REMOTE

      - name: Record production receipt
        run: |
          {
            echo '## Dominion Constitutional Multi-Lane Runtime'
            echo '- exact main SHA: `${{ env.RELEASE_SHA }}`'
            echo '- Constitution/default-deny/Five Council: enforced at runtime'
            echo '- registered runtime contracts: 11'
            echo '- economic profitability contracts: 8'
            echo '- bounded missions per activation: 3'
            echo '- external actions: still Founder-held'
            echo '- live trading: disabled'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup runner access material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
