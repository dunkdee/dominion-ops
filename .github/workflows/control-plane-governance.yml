name: Control Plane Governance

on:
  pull_request:
    paths:
      - "governance/**"
      - "agents/**"
      - "control_plane/**"
      - "runtime/**"
      - "tests/test_control_plane_runtime.py"
      - "architecture/CONTROL_PLANE.md"
      - "architecture/CONTROL_PLANE_RUNTIME.md"
      - "operations/INCIDENT_RESPONSE.md"
      - "scripts/control_plane.py"
      - "scripts/validate_control_plane.py"
      - "scripts/validate_control_plane_runtime.py"
      - ".github/workflows/control-plane-governance.yml"
  push:
    branches: [main]
    paths:
      - "governance/**"
      - "agents/**"
      - "control_plane/**"
      - "runtime/**"
      - "tests/test_control_plane_runtime.py"
      - "architecture/CONTROL_PLANE.md"
      - "architecture/CONTROL_PLANE_RUNTIME.md"
      - "operations/INCIDENT_RESPONSE.md"
      - "scripts/control_plane.py"
      - "scripts/validate_control_plane.py"
      - "scripts/validate_control_plane_runtime.py"
      - ".github/workflows/control-plane-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compile control-plane code
        run: |
          python3 -m py_compile \
            control_plane/*.py \
            scripts/control_plane.py \
            scripts/validate_control_plane.py \
            scripts/validate_control_plane_runtime.py \
            tests/test_control_plane_runtime.py

      - name: Validate governance contracts
        run: python3 scripts/validate_control_plane.py

      - name: Validate Stage 2 runtime contracts
        run: python3 scripts/validate_control_plane_runtime.py

      - name: Run deterministic runtime tests
        run: python3 -m unittest discover -s tests -p 'test_control_plane_runtime.py' -v

      - name: Run simulation-only revenue smoke test
        run: |
          python3 scripts/control_plane.py simulate-revenue \
            --input runtime/examples/revenue_scenario.json \
            --output /tmp/revenue-simulation.json
          python3 -c 'import json; d=json.load(open("/tmp/revenue-simulation.json")); assert d["mode"] == "SIMULATION_ONLY"; assert d["external_actions"] == []; assert d["money_moved"] is False'
