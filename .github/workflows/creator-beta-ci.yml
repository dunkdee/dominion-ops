name: Creator Beta CI

on:
  pull_request:
    paths:
      - 'api/**'
      - 'web/public/creator-beta.html'
      - 'docs/DOMINION_ANDROID_PLAY_PRODUCT.md'
      - '.github/workflows/creator-beta-ci.yml'
  push:
    branches:
      - 'feat/dominion-play-launch-clean'
    paths:
      - 'api/**'
      - 'web/public/creator-beta.html'
      - 'docs/DOMINION_ANDROID_PLAY_PRODUCT.md'
      - '.github/workflows/creator-beta-ci.yml'

permissions:
  contents: read

jobs:
  beta-api-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: Install API dependencies
        run: python -m pip install --upgrade pip && pip install -r api/requirements.txt

      - name: Compile API modules
        run: python -m py_compile api/app.py api/beta.py api/vault_io.py api/test_beta.py

      - name: Run creator beta contract tests
        run: python -m unittest api/test_beta.py -v

      - name: Prove existing API routes remain registered
        working-directory: api
        run: |
          python - <<'PY'
          from app import app
          rules = {rule.rule for rule in app.url_map.iter_rules()}
          required = {'/', '/gumroad', '/gumroad/sales', '/vault/inbox', '/vault/health', '/gumroad/ping', '/beta/apply'}
          missing = sorted(required - rules)
          if missing:
              raise SystemExit(f'missing routes: {missing}')
          print('ROUTE_REGRESSION_PASS', sorted(required))
          PY

      - name: Prove beta tests are isolated from production Vault
        run: |
          if grep -q 'TemporaryDirectory' api/test_beta.py && grep -q 'vault_io.VAULT_ROOT = self.tmp.name' api/test_beta.py; then
            echo 'BETA_TEST_ISOLATION_PASS'
          else
            echo 'beta tests are not isolated' >&2
            exit 1
          fi
