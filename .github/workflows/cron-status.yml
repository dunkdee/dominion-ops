name: Empire Status Snapshot

on:
  schedule: [{ cron: "*/30 * * * *" }]
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revenue snapshot integrity gate
        env:
          GATEWAY: ${{ secrets.N8N_AGENT_GATEWAY_URL }}
          N8N_TOOL_SECRET: ${{ secrets.N8N_TOOL_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${GATEWAY:-}" ]; then
            echo "ERROR: N8N_AGENT_GATEWAY_URL is not configured"
            exit 1
          fi
          if [[ ! "$GATEWAY" =~ ^https?://[^[:space:]]+$ ]]; then
            echo "ERROR: N8N_AGENT_GATEWAY_URL is malformed"
            exit 1
          fi
          if [ -z "${N8N_TOOL_SECRET:-}" ]; then
            echo "ERROR: N8N_TOOL_SECRET is not configured"
            exit 1
          fi

          curl --fail --show-error --location --max-time 10 -X POST "$GATEWAY" \
            -H "X-AGENT-KEY: ${N8N_TOOL_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"tool":"roi_snapshot","args":{"since":"7d","metrics":["revenue","orders"]}}' \
            > snapshot.json

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("snapshot.json").read_text(encoding="utf-8"))
          if not isinstance(payload, dict):
              raise SystemExit("ERROR: roi_snapshot response is not a JSON object")

          result = payload.get("result", payload)
          if not isinstance(result, dict):
              raise SystemExit("ERROR: roi_snapshot result is not a JSON object")

          purchase_source = result.get("PURCHASE_SOURCE") or result.get("purchase_source")
          revenue_source = result.get("REVENUE_SOURCE") or result.get("revenue_source")
          db_available = result.get("db_available")

          if not purchase_source or not revenue_source:
              raise SystemExit("ERROR: roi_snapshot has no authoritative purchase/revenue provenance")
          if db_available is not True:
              raise SystemExit("ERROR: authoritative purchase evidence is unavailable")
          if "params" in result and not ("purchase_count" in result or "revenue_cents" in result):
              raise SystemExit("ERROR: legacy roi_snapshot stub signature rejected")

          purchase_count = result.get("purchase_count")
          revenue_cents = result.get("revenue_cents")
          if not isinstance(purchase_count, int) or purchase_count < 0:
              raise SystemExit("ERROR: purchase_count must be a non-negative integer")
          if not isinstance(revenue_cents, int) or revenue_cents < 0:
              raise SystemExit("ERROR: revenue_cents must be a non-negative integer")

          print("REVENUE_SNAPSHOT_PROVENANCE=PASS")
          print("REVENUE_SNAPSHOT_RECEIPT=PASS")
          PY

          echo "Snapshot result:"
          cat snapshot.json
