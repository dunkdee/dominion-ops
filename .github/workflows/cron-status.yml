name: Empire Status Snapshot

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN EMPIRE STATUS SNAPSHOT"
        required: true
        type: string
      commit_sha:
        description: "Exact 40-character main commit SHA"
        required: true
        type: string
permissions:
  contents: read

jobs:
  snapshot:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'RUN EMPIRE STATUS SNAPSHOT' &&
      inputs.commit_sha == github.sha &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Smoke test gateway
        env:
          GATEWAY: ${{ secrets.N8N_AGENT_GATEWAY_URL }}
          N8N_TOOL_SECRET: ${{ secrets.N8N_TOOL_SECRET }}
        run: |
          if [ -z "${GATEWAY:-}" ]; then
            echo "N8N_AGENT_GATEWAY_URL not set — skipping snapshot"
            exit 0
          fi
          if [[ ! "$GATEWAY" =~ ^https?:// ]]; then
            echo "GATEWAY is not a valid URL — skipping snapshot"
            exit 0
          fi
          curl --fail --show-error --location --max-time 10 -X POST "${GATEWAY}" \
            -H "X-AGENT-KEY: ${N8N_TOOL_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"tool":"roi_snapshot","args":{"since":"7d","metrics":["revenue","orders"]}}' \
            > snapshot.json || { echo "Gateway unreachable — skipping"; exit 0; }
          echo "Snapshot result:" && cat snapshot.json
