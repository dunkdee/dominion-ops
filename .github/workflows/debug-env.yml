name: Debug ENV Reset

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Find what controls the .env file
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo '=== CRON JOBS ==='
            crontab -l 2>/dev/null || echo 'no user crontab'
            ls /etc/cron* 2>/dev/null || true

            echo '=== SYSTEMD SERVICES that mention .env ==='
            grep -rl '\.env' /etc/systemd/system/ 2>/dev/null || echo 'none'
            grep -rl '\.env' ~/.config/systemd/ 2>/dev/null || echo 'none'

            echo '=== docker-compose.yml env_file / environment section ==='
            cat ~/desktop-tutorial/docker-compose.yml

            echo '=== .env file last modified ==='
            stat ~/desktop-tutorial/.env 2>/dev/null || echo 'file not found'

            echo '=== does docker compose have its own .env or override? ==='
            ls -la ~/desktop-tutorial/.env* 2>/dev/null
            ls -la ~/desktop-tutorial/docker-compose*.yml 2>/dev/null
            ls -la ~/desktop-tutorial/docker-compose*.yaml 2>/dev/null

            echo '=== wix-agent container env vars (names only) ==='
            docker inspect wix-agent --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | cut -d= -f1 || echo 'container not running'
