name: Deploy Buddy Runtime

on:
  push:
    branches: [main]
    paths:
      - 'buddy_core/**'
      - 'apps/youtube/**'
      - 'scripts/runtime/remediate_authorization_key_boundary.sh'
      - 'tests/test_buddy_brain_router_v2.py'
      - 'tests/test_buddy_canonical_governance.py'
      - 'tests/test_buddy_standalone_runtime.py'
      - 'tests/test_buddy_capability_health.py'
      - 'tests/test_buddy_token_resolver.py'
      - 'tests/test_buddy_phone_login.py'
      - 'tests/test_buddy_self_heal_extensions.py'
      - 'tests/test_revenue_runtime.py'
      - 'tests/test_authorization_runtime_layout.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install bounded Buddy test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests python-dotenv fastapi httpx uvicorn
      - name: Compile canonical Buddy paths
        env:
          PYTHONPATH: .:buddy_core
        run: |
          set -euo pipefail
          python -m py_compile \
            buddy_core/core/__init__.py \
            buddy_core/core/authorization.py \
            buddy_core/core/brain.py \
            buddy_core/core/brain_router.py \
            buddy_core/core/operator.py \
            buddy_core/core/message_delivery.py \
            buddy_core/core/operator_extensions.py \
            buddy_core/core/learning_engine.py \
            buddy_core/core/autonomous_learning.py \
            buddy_core/core/revenue_runtime.py \
            buddy_core/core/capability_health.py \
            buddy_core/core/mcp_client.py \
            buddy_core/core/self_heal.py \
            buddy_core/core/token_resolver.py \
            buddy_core/watchmen/saraqael.py \
            buddy_core/buddy_bridge_api.py \
            buddy_core/buddy_web.py \
            apps/youtube/script_generator.py \
            apps/youtube/main.py
      - name: Verify canonical reasoning and capability contracts
        env:
          PYTHONPATH: .:buddy_core
          BUDDY_STATE_DIR: /tmp/buddy-runtime-deploy-test-state
        run: |
          set -euo pipefail
          tests=(
            tests/test_buddy_brain_router_v2.py
            tests/test_buddy_canonical_governance.py
            tests/test_buddy_standalone_runtime.py
            tests/test_buddy_capability_health.py
            tests/test_buddy_self_heal_extensions.py
            tests/test_buddy_operator_v2.py
            tests/test_buddy_autonomous_learning.py
            tests/test_buddy_token_resolver.py
            tests/test_buddy_phone_login.py
            tests/test_revenue_runtime.py
          )
          if [ -f tests/test_authorization_runtime_layout.py ]; then
            tests+=(tests/test_authorization_runtime_layout.py)
          fi
          python -m pytest -q "${tests[@]}"
      - name: Assert canonical prompt content
        env:
          PYTHONPATH: .:buddy_core
        run: |
          python - <<'PY'
          from buddy_core.core import brain_router
          s = brain_router.canonical_system_prompt()
          assert 'ELITE REASONING PROTOCOL' in s
          assert 'Founder Operating Context' in s
          assert 'Capability Maximization Doctrine' in s
          assert 'Narrow Guardrails / Broad Autonomy' in s
          assert 'RADAH MEMSHALAH' in s
          assert 'Fable' not in s
          print('BUDDY_CANONICAL_PROMPT=PASS')
          PY

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: foundation-vm-production
    steps:
      - name: Require protected VM access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Configure protected SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy exact Buddy release with tracked-file rollback
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 "$VM_USER@$VM_HOST" \
            "RUN_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          repo="$HOME/dominion-ops"
          runtime="$HOME/buddy_core"
          state="$HOME/.dominion/buddy"
          backups="$state/deploy-backups"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup_dir="$backups/$stamp-$RUN_SHA"
          backup_ready=0
          deployed=0
          services="dominion-buddy-web.service buddy-bridge.service dominion-buddy.service"

          rollback() {
            rc=$?
            if [ "$deployed" -ne 1 ] && [ "$backup_ready" -eq 1 ] && [ -d "$backup_dir" ]; then
              echo 'BUDDY_DEPLOY_ROLLBACK=START'
              python3 - "$runtime" "$backup_dir" <<'PY'
          import json, shutil, sys
          from pathlib import Path
          runtime=Path(sys.argv[1]); backup=Path(sys.argv[2])
          files=backup/'files'
          if files.exists():
              for src in files.rglob('*'):
                  if not src.is_file():
                      continue
                  rel=src.relative_to(files)
                  dst=runtime/rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
          absent_file=backup/'absent.json'
          if absent_file.exists():
              for rel in json.loads(absent_file.read_text(encoding='utf-8')):
                  target=runtime/rel
                  if target.is_file() or target.is_symlink():
                      target.unlink()
          PY
              for s in $services; do
                if systemctl cat "$s" >/dev/null 2>&1; then sudo systemctl restart "$s" || true; fi
              done
              echo 'BUDDY_DEPLOY_ROLLBACK=COMPLETE'
            fi
            exit "$rc"
          }
          trap rollback ERR

          test -d "$repo/.git"
          install -d -m 755 "$runtime"
          install -d -m 700 "$backups"

          find "$backups" -maxdepth 1 -type f -name '*.tgz' -delete 2>/dev/null || true
          find "$backups" -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} + 2>/dev/null || true

          cd "$repo"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          test "$(git rev-parse HEAD)" = "$RUN_SHA"

          # Preserve the existing authorization HMAC while relocating its
          # canonical file outside HOME/repository/Buddy writable state. This
          # must complete before any Buddy process is restarted.
          bash "$repo/scripts/runtime/remediate_authorization_key_boundary.sh"

          avail_kb="$(df -Pk "$HOME" | awk 'NR==2 {print $4}')"
          test "${avail_kb:-0}" -ge 524288

          install -d -m 700 "$backup_dir/files"
          python3 - "$repo/buddy_core" "$runtime" "$backup_dir" <<'PY'
          import json, shutil, sys
          from pathlib import Path
          source=Path(sys.argv[1]); runtime=Path(sys.argv[2]); backup=Path(sys.argv[3])
          absent=[]
          for src in source.rglob('*'):
              if not src.is_file():
                  continue
              rel=src.relative_to(source)
              live=runtime/rel
              if live.is_file():
                  dst=backup/'files'/rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(live, dst)
              else:
                  absent.append(str(rel))
          (backup/'absent.json').write_text(json.dumps(absent, sort_keys=True), encoding='utf-8')
          PY
          backup_ready=1

          cp -a "$repo/buddy_core/." "$runtime/"

          python3 -m py_compile \
            "$runtime/core/__init__.py" \
            "$runtime/core/authorization.py" \
            "$runtime/core/brain.py" \
            "$runtime/core/brain_router.py" \
            "$runtime/core/operator.py" \
            "$runtime/core/message_delivery.py" \
            "$runtime/core/operator_extensions.py" \
            "$runtime/core/learning_engine.py" \
            "$runtime/core/autonomous_learning.py" \
            "$runtime/core/revenue_runtime.py" \
            "$runtime/core/capability_health.py" \
            "$runtime/core/mcp_client.py" \
            "$runtime/core/self_heal.py" \
            "$runtime/core/token_resolver.py" \
            "$runtime/watchmen/saraqael.py" \
            "$runtime/buddy_bridge_api.py" \
            "$runtime/buddy_web.py"

          grep -Fq 'ELITE REASONING PROTOCOL' "$runtime/core/brain.py"
          grep -Fq 'RADAH MEMSHALAH' "$runtime/core/brain.py"
          grep -Fq 'Founder Operating Context' "$runtime/config/FOUNDER_OPERATING_CONTEXT.md"
          grep -Fq 'Capability Maximization Doctrine' "$runtime/config/FOUNDER_OPERATING_CONTEXT.md"
          grep -Fq 'Narrow Guardrails / Broad Autonomy' "$runtime/config/BUDDY_CONSTITUTION.md"
          grep -Fq 'founder-safe-internal-self-heal-v1' "$runtime/config/standing_authorizations.json"
          grep -Fq 'system.self_repair' "$runtime/config/capability_extensions.json"
          grep -Fq 'install_operator_extensions' "$runtime/core/__init__.py"
          grep -Fq '_compose_system(system)' "$runtime/core/brain_router.py"
          grep -Fq 'canonical_system_prompt()' "$runtime/core/brain_router.py"
          grep -Fq 'DOMINION_BUDDY_PHONE_AUTH_V1' "$runtime/buddy_web.py"
          grep -Fq '/buddy/api/login' "$runtime/buddy_web.py"
          grep -Fq 'resolve_buddy_web_token' "$runtime/buddy_web.py"
          if grep -Rni --include='*.py' --include='*.md' --include='*.json' 'fable' "$runtime" >/tmp/buddy-fable-offenders.txt; then
            cat /tmp/buddy-fable-offenders.txt
            echo 'BUDDY_RUNTIME_SOURCE_INTEGRITY=FAIL stale_fable_reference'
            exit 1
          fi
          echo 'BUDDY_RUNTIME_SOURCE_INTEGRITY=PASS'

          restarted=0
          for s in $services; do
            if systemctl cat "$s" >/dev/null 2>&1; then
              if ! sudo systemctl restart "$s"; then
                sudo systemctl status "$s" --no-pager -l || true
                journalctl -u "$s" -n 80 --no-pager || true
                exit 1
              fi
              if ! sudo systemctl is-active --quiet "$s"; then
                sudo systemctl status "$s" --no-pager -l || true
                journalctl -u "$s" -n 80 --no-pager || true
                exit 1
              fi
              restarted=$((restarted+1))
              echo "BUDDY_SERVICE_RESTARTED=$s"
            fi
          done
          test "$restarted" -ge 1

          bridge_code="000"
          for _ in $(seq 1 30); do
            bridge_code="$(curl -sS -o /tmp/buddy-bridge-health.json -w '%{http_code}' --max-time 4 http://127.0.0.1:5052/health 2>/dev/null || true)"
            [ "$bridge_code" = '200' ] && break
            sleep 1
          done
          if [ "$bridge_code" != '200' ]; then
            journalctl -u buddy-bridge.service -n 100 --no-pager || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/buddy-bridge-health.json'))
          assert data.get('ok') is True
          assert data.get('service') == 'buddy_bridge'
          assert data.get('canonical_repo') is True
          assert data.get('self_heal_connected') is True
          assert data.get('mcp_operator_connected') is True
          assert int(data.get('capability_count', 0)) >= 20
          print(f"BUDDY_BRIDGE_HEALTH=PASS capabilities={data['capability_count']} self_heal={data['self_heal_connected']} mcp_operator={data['mcp_operator_connected']}")
          PY

          mcp_code="$(curl -sS -o /tmp/buddy-mcp-health.json -w '%{http_code}' --max-time 5 http://127.0.0.1:8390/health 2>/dev/null || true)"
          test "$mcp_code" = '200'
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/buddy-mcp-health.json'))
          assert data.get('status') == 'ok'
          assert data.get('service') == 'dominion-mcp-cli'
          assert data.get('external_mutation_enabled') is False
          assert data.get('binding') == 'loopback-only'
          assert int(data.get('connector_count', 0)) >= 1
          print(f"BUDDY_MCP_HEALTH=PASS connectors={data['connector_count']}")
          PY

          web_code="000"
          for _ in $(seq 1 30); do
            web_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 4 http://127.0.0.1:5070/buddy 2>/dev/null || true)"
            case "$web_code" in 200|401|403) break;; esac
            sleep 1
          done
          case "$web_code" in 200|401|403) ;; *) journalctl -u dominion-buddy-web.service -n 100 --no-pager || true; exit 1;; esac

          avail_after_kb="$(df -Pk "$HOME" | awk 'NR==2 {print $4}')"
          python3 - "$state/deployed_release.json" "$RUN_SHA" "$avail_after_kb" <<'PY'
          import hashlib,json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          out=Path(sys.argv[1]); sha=sys.argv[2]; available_kb=int(sys.argv[3])
          runtime=Path.home()/'buddy_core'
          files={}
          for rel in [
              'core/__init__.py','core/authorization.py','core/brain.py','core/brain_router.py',
              'core/capability_health.py','core/message_delivery.py','core/operator.py',
              'core/operator_extensions.py','core/mcp_client.py','core/self_heal.py',
              'watchmen/saraqael.py',
              'config/FOUNDER_OPERATING_CONTEXT.md','config/BUDDY_CONSTITUTION.md',
              'config/standing_authorizations.json','config/capability_extensions.json'
          ]:
              p=runtime/rel
              files[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          payload={
              'schema':'dominion-buddy-deployed-release-v1',
              'release_sha':sha,
              'deployed_at':datetime.now(timezone.utc).isoformat(),
              'canonical_prompt':'ELITE_REASONING_PROTOCOL',
              'founder_context':True,
              'capability_maximization_doctrine':True,
              'narrow_guardrails_broad_autonomy':True,
              'standing_self_heal_authorization':True,
              'operator_extensions':True,
              'self_heal_runtime_connected':True,
              'mcp_operator_connected':True,
              'mcp_health':True,
              'disk_available_kb':available_kb,
              'files_sha256':files,
          }
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          out.chmod(0o600)
          print('BUDDY_RELEASE_RECEIPT=PASS')
          PY

          deployed=1
          trap - ERR
          echo "BUDDY_RUNTIME_DEPLOY=PASS release=$RUN_SHA services=$restarted web_http=$web_code disk_available_kb=$avail_after_kb"
          REMOTE

      - name: Cleanup SSH material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
