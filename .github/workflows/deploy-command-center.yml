name: Deploy Dominion Command Center

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY COMMAND CENTER"
        required: true
        type: string
      commit_sha:
        description: "Exact 40-character main commit SHA"
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'DEPLOY COMMAND CENTER' &&
      inputs.commit_sha == github.sha &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Deploy current main through governed workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          gh workflow run deploy-foundation-vm-governed.yml --ref main \
            -f commit_sha="$target_sha" \
            -f confirm='DEPLOY FOUNDATION VM'
