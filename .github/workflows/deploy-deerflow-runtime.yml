name: Deploy DeerFlow Runtime

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full main commit SHA to deploy
        required: true
        type: string
      confirm:
        description: Type DEPLOY DEERFLOW RUNTIME
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deerflow-runtime-production
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ inputs.confirm == 'DEPLOY DEERFLOW RUNTIME' }}
    runs-on: ubuntu-24.04
    outputs:
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
    steps:
      - name: Checkout governed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve authorized commit
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.commit_sha }}'
          [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'full 40-character SHA required'; exit 1; }
          git cat-file -e "${requested}^{commit}"
          git merge-base --is-ancestor "$requested" origin/main
          echo "deploy_sha=$requested" >> "$GITHUB_OUTPUT"

      - name: Validate governed production capability contract
        shell: bash
        run: |
          set -euo pipefail
          cfg='integrations/deerflow/config.dominion.yaml'
          soul='integrations/deerflow/SOUL.dominion.md'
          deploy='scripts/deploy_deerflow_runtime_remote.sh'

          bash -n "$deploy"
          grep -Fq 'https://github.com/bytedance/deer-flow.git' "$deploy"
          grep -Fq 'UPSTREAM_TAG="v2.0.0"' "$deploy"
          grep -Fq 'deerflow-harness[ollama]' "$deploy"
          grep -Fq 'DEERFLOW_INFERENCE_PROOF=PASS' "$deploy"
          grep -Fq 'DEERFLOW_CAPABILITY_PROOF=PASS' "$deploy"
          grep -Fq 'from langchain_ollama import ChatOllama' "$deploy"
          ! grep -Eq 'ollama[[:space:]]+pull|/api/pull' "$deploy"
          grep -Fq 'model: nemotron-3-nano:4b' "$cfg"
          ! grep -Fq 'model: llama3.1:8b' "$cfg"
          grep -Fq 'backend: sqlite' "$cfg"
          grep -Fq 'run_events:' "$cfg"
          grep -Fq 'backend: db' "$cfg"
          grep -Fq 'memory:' "$cfg"
          grep -Fq 'token_counting: char' "$cfg"
          grep -Fq 'skill_evolution:' "$cfg"
          grep -Fq 'agents_api:' "$cfg"
          grep -Fq 'channel_connections:' "$cfg"
          grep -Fq 'guardrails:' "$cfg"
          grep -Fq 'fail_closed: true' "$cfg"
          grep -Fq 'deerflow.guardrails.builtin:AllowlistProvider' "$cfg"
          grep -Fq 'web_search' "$cfg"
          grep -Fq 'web_fetch' "$cfg"
          grep -Fq 'image_search' "$cfg"
          grep -Fq 'glob_tool' "$cfg"
          grep -Fq 'grep_tool' "$cfg"
          grep -Fq 'str_replace_tool' "$cfg"
          ! grep -Fq 'browser_automation' "$cfg"
          ! grep -Fq 'browser_navigate' "$cfg"
          grep -Fq 'allow_host_bash: false' "$cfg"
          test -s "$soul"
          grep -Fq 'RADAH MEMSHALAH' "$soul"
          echo 'DEERFLOW_STATIC_GATE=PASS upstream=v2.0.0 model=nemotron-3-nano:4b inference=required persistence=sqlite run_events=db memory=on guardrails=fail-closed self_modify=off channels=off tools=9 ollama=harness-extra browser=disabled-v2.0.0 host_bash=disabled'

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: foundation-vm-production
    steps:
      - name: Checkout authorized commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.deploy_sha }}
          fetch-depth: 1

      - name: Require VM connection material
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Prepare SSH
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transfer DeerFlow deployment payload
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          remote_dir="/tmp/dominion-deerflow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" "mkdir -p '$remote_dir' && chmod 700 '$remote_dir'"
          scp -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            scripts/deploy_deerflow_runtime_remote.sh \
            integrations/deerflow/config.dominion.yaml \
            integrations/deerflow/SOUL.dominion.md \
            "$VM_USER@$VM_HOST:$remote_dir/"
          echo "REMOTE_DIR=$remote_dir" >> "$GITHUB_ENV"

      - name: Deploy and prove health and capabilities
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$VM_USER@$VM_HOST" \
            "chmod 700 '$REMOTE_DIR/deploy_deerflow_runtime_remote.sh' && DOMINION_CONFIG_SOURCE='$REMOTE_DIR/config.dominion.yaml' DOMINION_SOUL_SOURCE='$REMOTE_DIR/SOUL.dominion.md' '$REMOTE_DIR/deploy_deerflow_runtime_remote.sh'" \
            | tee "$RUNNER_TEMP/deerflow-deploy.log"
          grep -Fq 'DEERFLOW_INFERENCE_PROOF=PASS model=nemotron-3-nano:4b' "$RUNNER_TEMP/deerflow-deploy.log"
          grep -Fq 'DEERFLOW_CAPABILITY_PROOF=PASS' "$RUNNER_TEMP/deerflow-deploy.log"
          grep -Fq 'DEERFLOW_RUNTIME_HEALTH=PASS' "$RUNNER_TEMP/deerflow-deploy.log"

      - name: Cleanup temporary material
        if: always()
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          if [ -n "${REMOTE_DIR:-}" ] && [ -f "$HOME/.ssh/foundation_vm_key" ]; then
            ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" "rm -rf '$REMOTE_DIR'" || true
          fi
          rm -f "$HOME/.ssh/foundation_vm_key"
