name: Deploy Dominion Command Center

on:
  push:
    branches: [main]
    paths:
      - 'obsidian/**'
      - 'scripts/deploy_dominion_command_center.sh'
      - '.github/workflows/deploy-dominion-command-center.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: foundation-vm-production
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate command center assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n scripts/deploy_dominion_command_center.sh
          test -s obsidian/00-DOMINION-COMMAND-CENTER.md
          test -s obsidian/dominion.css
          test -s obsidian/command-center/00-HOME.md
          test -s obsidian/command-center/14-Daily-State.md
          test -s obsidian/command-center/09-Revenue.md
          echo 'DOMINION_UI_ASSETS=PASS'

      - name: Require protected VM access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          test -n "$OBSIDIAN_PASSWORD"

      - name: Stage exact UI bundle
        id: stage
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          bundle="$RUNNER_TEMP/dominion-ui-${GITHUB_RUN_ID}.tgz"
          remote_bundle="/tmp/dominion-ui-${GITHUB_RUN_ID}.tgz"
          remote_root="/tmp/dominion-ui-${GITHUB_RUN_ID}"
          tar -czf "$bundle" obsidian scripts/deploy_dominion_command_center.sh
          scp -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$bundle" "$VM_USER@$VM_HOST:$remote_bundle"

          password_file="$RUNNER_TEMP/obsidian-password-${GITHUB_RUN_ID}"
          remote_password="/tmp/obsidian-password-${GITHUB_RUN_ID}"
          umask 077
          printf '%s' "$OBSIDIAN_PASSWORD" > "$password_file"
          scp -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$password_file" "$VM_USER@$VM_HOST:$remote_password"
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$VM_USER@$VM_HOST" "chmod 600 '$remote_bundle' '$remote_password'"

          echo "remote_bundle=$remote_bundle" >> "$GITHUB_OUTPUT"
          echo "remote_root=$remote_root" >> "$GITHUB_OUTPUT"
          echo "remote_password=$remote_password" >> "$GITHUB_OUTPUT"

      - name: Install Dominion UI and verify invariants
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          REMOTE_BUNDLE: ${{ steps.stage.outputs.remote_bundle }}
          REMOTE_ROOT: ${{ steps.stage.outputs.remote_root }}
          REMOTE_PASSWORD: ${{ steps.stage.outputs.remote_password }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 "$VM_USER@$VM_HOST" \
            "REMOTE_BUNDLE='$REMOTE_BUNDLE' REMOTE_ROOT='$REMOTE_ROOT' PASSWORD_FILE='$REMOTE_PASSWORD' RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cleanup() {
            rm -rf "$REMOTE_ROOT"
            rm -f "$REMOTE_BUNDLE" "$PASSWORD_FILE"
          }
          trap cleanup EXIT
          test -f "$REMOTE_BUNDLE"
          test -f "$PASSWORD_FILE"
          mkdir -m 700 "$REMOTE_ROOT"
          tar -xzf "$REMOTE_BUNDLE" -C "$REMOTE_ROOT"
          password="$(cat "$PASSWORD_FILE")"
          test -n "$password"
          export OBSIDIAN_PASSWORD="$password"
          ASSET_ROOT="$REMOTE_ROOT" RUN_ID="$RUN_ID" bash "$REMOTE_ROOT/scripts/deploy_dominion_command_center.sh"
          REMOTE

      - name: Cleanup runner access material
        if: always()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          REMOTE_BUNDLE: ${{ steps.stage.outputs.remote_bundle }}
          REMOTE_ROOT: ${{ steps.stage.outputs.remote_root }}
          REMOTE_PASSWORD: ${{ steps.stage.outputs.remote_password }}
        shell: bash
        run: |
          set +e
          if [ -f "$HOME/.ssh/foundation_vm_key" ]; then
            ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" "rm -rf '$REMOTE_ROOT'; rm -f '$REMOTE_BUNDLE' '$REMOTE_PASSWORD'" >/dev/null 2>&1
          fi
          rm -f "$HOME/.ssh/foundation_vm_key" "$RUNNER_TEMP"/dominion-ui-*.tgz "$RUNNER_TEMP"/obsidian-password-*
