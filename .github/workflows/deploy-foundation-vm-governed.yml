name: Deploy Foundation VM — Governed

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full commit SHA from main to deploy"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY FOUNDATION VM"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ inputs.confirm == 'DEPLOY FOUNDATION VM' }}
    runs-on: ubuntu-24.04
    outputs:
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and authorize commit
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.commit_sha }}'
          [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "A full 40-character commit SHA is required"; exit 1; }
          git cat-file -e "${requested}^{commit}"
          git merge-base --is-ancestor "$requested" origin/main || { echo "Requested commit is not reachable from main"; exit 1; }
          echo "deploy_sha=$requested" >> "$GITHUB_OUTPUT"

      - name: Validate constitutional kernel
        run: |
          set -euo pipefail
          python3 scripts/validate_constitutional_kernel_v1.py
          python3 scripts/validate_control_plane.py
          python3 scripts/validate_control_plane_runtime.py

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: foundation-vm-production
    outputs:
      exit_code: ${{ steps.remote.outputs.exit_code }}
      failure_summary: ${{ steps.remote.outputs.failure_summary }}
      rollback_summary: ${{ steps.remote.outputs.rollback_summary }}
      success_summary: ${{ steps.remote.outputs.success_summary }}
    steps:
      - name: Checkout governed main history
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Require deployment secrets
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" || { echo "VM_HOST secret is missing"; exit 1; }
          test -n "$VM_USER" || { echo "VM_USER secret is missing"; exit 1; }
          test -n "$VM_SSH_KEY" || { echo "VM_SSH_KEY secret is missing"; exit 1; }

      - name: Prepare SSH
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build and transfer authorized deployment bundle
        id: bundle
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          DEPLOY_SHA: ${{ needs.validate.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          bundle_path="$RUNNER_TEMP/foundation-vm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle"
          remote_bundle="/tmp/dominion-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle"

          git cat-file -e "${DEPLOY_SHA}^{commit}"
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
          git bundle create "$bundle_path" main
          git bundle verify "$bundle_path"

          scp -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            "$bundle_path" "$VM_USER@$VM_HOST:$remote_bundle"

          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" "chmod 600 '$remote_bundle'"

          echo "remote_bundle=$remote_bundle" >> "$GITHUB_OUTPUT"

      - name: Deploy with automatic rollback
        id: remote
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          DEPLOY_SHA: ${{ needs.validate.outputs.deploy_sha }}
          DEPLOY_BUNDLE_PATH: ${{ steps.bundle.outputs.remote_bundle }}
        run: |
          set -u -o pipefail
          log_file="$RUNNER_TEMP/foundation-vm-deploy.log"

          set +e
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$VM_USER@$VM_HOST" "DEPLOY_SHA='$DEPLOY_SHA' DEPLOY_BUNDLE_PATH='$DEPLOY_BUNDLE_PATH' bash -s" \
            < scripts/deploy_foundation_vm_remote.sh 2>&1 | tee "$log_file"
          rc=${PIPESTATUS[0]}
          set -e

          failure_summary="$(grep '^DEPLOY_FAILURE ' "$log_file" | tail -n 1 || true)"
          rollback_summary="$(grep '^DEPLOY_ROLLBACK ' "$log_file" | tail -n 1 || true)"
          success_summary="$(grep '^DEPLOY_SUCCESS ' "$log_file" | tail -n 1 || true)"
          failure_context="$(python3 scripts/extract_deploy_failure_context.py "$log_file" || true)"

          if [ -n "$failure_summary" ] && [ -n "$failure_context" ]; then
            failure_summary="${failure_summary} context=${failure_context}"
          fi

          {
            echo "exit_code=$rc"
            echo "failure_summary=${failure_summary:-none}"
            echo "rollback_summary=${rollback_summary:-none}"
            echo "success_summary=${success_summary:-none}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Foundation VM deployment"
            echo
            echo "- Exit code: \`$rc\`"
            echo "- Failure: \`${failure_summary:-none}\`"
            echo "- Rollback: \`${rollback_summary:-none}\`"
            echo "- Success: \`${success_summary:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce remote deployment result
        if: ${{ steps.remote.outputs.exit_code != '0' }}
        shell: bash
        env:
          FAILURE_SUMMARY: ${{ steps.remote.outputs.failure_summary }}
          ROLLBACK_SUMMARY: ${{ steps.remote.outputs.rollback_summary }}
        run: |
          echo "${FAILURE_SUMMARY:-Remote deployment failed without a structured failure summary}"
          echo "${ROLLBACK_SUMMARY:-DEPLOY_ROLLBACK status=not-recorded}"
          exit 1

      - name: Remove temporary deployment material
        if: always()
        run: |
          rm -f "$HOME/.ssh/foundation_vm_key"
          rm -f "$RUNNER_TEMP"/foundation-vm-*.bundle

  report:
    name: Publish deployment status
    if: ${{ always() }}
    needs:
      - validate
      - deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Update deployment status issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: "55"
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          REMOTE_EXIT_CODE: ${{ needs.deploy.outputs.exit_code }}
          FAILURE_SUMMARY: ${{ needs.deploy.outputs.failure_summary }}
          ROLLBACK_SUMMARY: ${{ needs.deploy.outputs.rollback_summary }}
          SUCCESS_SUMMARY: ${{ needs.deploy.outputs.success_summary }}
        run: |
          set -euo pipefail

          if [ "$DEPLOY_RESULT" = "success" ]; then
            overall="success"
          elif [ "$VALIDATE_RESULT" = "failure" ] || [ "$DEPLOY_RESULT" = "failure" ]; then
            overall="failure"
          elif [ "$VALIDATE_RESULT" = "cancelled" ] || [ "$DEPLOY_RESULT" = "cancelled" ]; then
            overall="cancelled"
          else
            overall="skipped"
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          updated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          remote_exit_code="${REMOTE_EXIT_CODE:-not-recorded}"
          failure_summary="${FAILURE_SUMMARY:-none}"
          rollback_summary="${ROLLBACK_SUMMARY:-none}"
          success_summary="${SUCCESS_SUMMARY:-none}"

          cat > /tmp/foundation-vm-deployment-status.md <<EOF
          # Foundation VM Deployment Status

          - Overall: **${overall}**
          - Validation: **${VALIDATE_RESULT}**
          - Deployment: **${DEPLOY_RESULT}**
          - Requested SHA: \`${REQUESTED_SHA}\`
          - Remote exit code: \`${remote_exit_code}\`
          - Failure summary: \`${failure_summary}\`
          - Rollback summary: \`${rollback_summary}\`
          - Success summary: \`${success_summary}\`
          - Run: [${GITHUB_RUN_ID}](${run_url})
          - Attempt: ${GITHUB_RUN_ATTEMPT}
          - Actor: \`${GITHUB_ACTOR}\`
          - Workflow ref: \`${GITHUB_REF}\`
          - Updated: \`${updated_at}\`

          This issue is updated automatically after every governed Foundation VM deployment run.
          EOF

          payload="$(python3 - <<'PY'
          import json
          from pathlib import Path

          print(json.dumps({"body": Path("/tmp/foundation-vm-deployment-status.md").read_text()}))
          PY
          )"

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --data "$payload"
