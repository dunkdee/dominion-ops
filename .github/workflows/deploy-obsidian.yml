name: Verify Obsidian Remote Access

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full deployed commit SHA from main"
        required: true
        type: string
      confirm:
        description: "Type VERIFY OBSIDIAN REMOTE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ inputs.confirm == 'VERIFY OBSIDIAN REMOTE' }}
    runs-on: ubuntu-24.04
    outputs:
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve authorized deployed commit
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.commit_sha }}'
          [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "A full 40-character commit SHA is required"; exit 1; }
          git cat-file -e "${requested}^{commit}"
          git merge-base --is-ancestor "$requested" origin/main || { echo "Requested commit is not reachable from main"; exit 1; }
          echo "deploy_sha=$requested" >> "$GITHUB_OUTPUT"

  verify:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: foundation-vm-production
    steps:
      - name: Require protected verification secrets
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          test -n "$OBSIDIAN_PASSWORD"

      - name: Prepare SSH
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify exact VM release and loopback backend
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          DEPLOY_SHA: ${{ needs.validate.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$VM_USER@$VM_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          repo="$HOME/dominion-ops"
          test -d "$repo/.git"
          cd "$repo"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA" || { echo "OBSIDIAN_VERIFY=FAIL reason=vm_sha_mismatch"; exit 1; }
          state="$(docker inspect --format '{{.State.Status}}' obsidian-remote 2>/dev/null || true)"
          test "$state" = "running" || { echo "OBSIDIAN_VERIFY=FAIL reason=backend_not_running"; exit 1; }
          backend_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8083/ || true)"
          test "$backend_status" = "401" || { echo "OBSIDIAN_VERIFY=FAIL reason=backend_auth_contract expected=401 actual=${backend_status:-000}"; exit 1; }
          ss -tln | grep -Eq '127\.0\.0\.1:8083[[:space:]]' || { echo "OBSIDIAN_VERIFY=FAIL reason=backend_not_loopback_bound"; exit 1; }
          sudo caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null || { echo "OBSIDIAN_VERIFY=FAIL reason=caddy_invalid"; exit 1; }
          echo "OBSIDIAN_BACKEND_VERIFY=PASS sha=$DEPLOY_SHA boundary=loopback auth=required"
          REMOTE

      - name: Verify public Caddy authentication boundary
        shell: bash
        env:
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}
        run: |
          set -euo pipefail
          curl -fsS \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 15 \
            --max-time 30 \
            -u "dominion:$OBSIDIAN_PASSWORD" \
            https://vault.dominionhealing.org/ >/dev/null
          unauth_status="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 30 https://vault.dominionhealing.org/ || true)"
          test "$unauth_status" = "401" || {
            echo "OBSIDIAN_VERIFY=FAIL reason=public_auth_not_enforced status=$unauth_status"
            exit 1
          }
          echo "OBSIDIAN_ACCESS_VERIFY=PASS sha=${{ needs.validate.outputs.deploy_sha }} backend=loopback public_auth=caddy"

      - name: Remove temporary access material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/foundation_vm_key"
