name: Deploy Site Compliance Fixes

on:
  workflow_dispatch:

jobs:
  deploy-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy compliance pages to VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            MAIN_WR="$HOME/aura-ecosystem/agency-website"
            SURPLUS_PUB="/var/www/surplus-public"
            TS=$(date +%Y%m%d_%H%M%S)
            
            echo "=== STEP 1: Write Caddy updater ==="
            echo '' | base64 -d > /tmp/fix_caddy_surplus.py
            echo "Caddy updater staged"
            
            echo "=== STEP 2: Backup existing files ==="
            cp "$MAIN_WR/index.html" "$MAIN_WR/index.html.bak.$TS" 2>/dev/null && echo "backed up index.html" || true
            cp "$MAIN_WR/store.html" "$MAIN_WR/store.html.bak.$TS" 2>/dev/null && echo "backed up store.html" || true
            
            echo "=== STEP 3: Deploy index.html ==="
            echo '' | base64 -d > "$MAIN_WR/index.html"
            echo "index.html: $(wc -c < "$MAIN_WR/index.html") bytes written"
            grep -q "Fla. Stat" "$MAIN_WR/index.html" && echo "PASS: surplus disclosure present" || echo "FAIL: surplus disclosure missing"
            grep -q "educational purposes" "$MAIN_WR/index.html" && echo "PASS: education disclaimer present" || echo "FAIL: disclaimer missing"
            
            echo "=== STEP 4: Deploy store.html ==="
            echo '' | base64 -d > "$MAIN_WR/store.html"
            echo "store.html: $(wc -c < "$MAIN_WR/store.html") bytes written"
            grep -q "Credit Dispute Toolkit" "$MAIN_WR/store.html" && echo "PASS: Credit Dispute Toolkit present" || echo "FAIL: CDT missing"
            
            echo "=== STEP 5: Deploy surplus public compliance page ==="
            sudo mkdir -p "$SURPLUS_PUB"
            cp "$SURPLUS_PUB/index.html" "$SURPLUS_PUB/index.html.bak.$TS" 2>/dev/null || true
            echo '' | sudo tee "$SURPLUS_PUB/index.html" > /dev/null
            sudo grep -q "45.033" "$SURPLUS_PUB/index.html" && echo "PASS: 45.033 cap present" || echo "FAIL: 45.033 missing"
            sudo grep -q "directly with the clerk" "$SURPLUS_PUB/index.html" && echo "PASS: self-file right present" || echo "FAIL: self-file right missing"
            
            echo "=== STEP 6: Update Caddy surplus block ==="
            sudo cp /etc/caddy/Caddyfile "/etc/caddy/Caddyfile.bak.$TS"
            sudo python3 /tmp/fix_caddy_surplus.py
            
            echo "=== STEP 7: Validate and reload Caddy ==="
            sudo caddy validate --config /etc/caddy/Caddyfile 2>&1 && echo "Caddy config valid" || { echo "FAIL: config invalid — restoring backup"; sudo cp "/etc/caddy/Caddyfile.bak.$TS" /etc/caddy/Caddyfile; exit 1; }
            sudo systemctl reload caddy && echo "PASS: Caddy reloaded" || echo "WARN: reload failed — run: sudo caddy reload --config /etc/caddy/Caddyfile"
            
            echo "=== ALL DONE ==="
            echo "dominionhealing.org: index.html + store.html updated in $MAIN_WR"
            echo "surplus.dominionhealing.org: compliance page deployed to $SURPLUS_PUB"
            echo "Caddy updated: surplus root now serves static compliance page"
