name: Diagnose — dominion-proposal-queue.service

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect proposal-queue systemd unit + process
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "=============================="
            echo "  systemctl status (full)"
            echo "=============================="
            systemctl status dominion-proposal-queue.service --no-pager -l 2>&1 || echo "status command failed"

            echo ""
            echo "=============================="
            echo "  systemctl show (Fragment/Source paths)"
            echo "=============================="
            systemctl show dominion-proposal-queue.service -p FragmentPath -p SourcePath -p UnitFileState -p MainPID -p ExecStart 2>&1

            echo ""
            echo "=============================="
            echo "  unit file search (systemd dirs)"
            echo "=============================="
            find /etc/systemd/system /lib/systemd/system /usr/lib/systemd/system \
              -iname "*proposal*" 2>/dev/null

            echo ""
            echo "=============================="
            echo "  unit file content (if found)"
            echo "=============================="
            for f in /etc/systemd/system/dominion-proposal-queue.service \
                     /etc/systemd/system/multi-user.target.wants/dominion-proposal-queue.service; do
              echo "--- $f ---"
              cat "$f" 2>/dev/null || echo "not present"
            done

            echo ""
            echo "=============================="
            echo "  running proposal_queue processes"
            echo "=============================="
            ps aux | grep -i proposal_queue | grep -v grep || echo "no matching process"

            echo ""
            echo "=============================="
            echo "  ~/buddy_core/proposal_queue.py"
            echo "=============================="
            ls -la ~/buddy_core/proposal_queue.py 2>/dev/null || echo "file not found"

            echo ""
            echo "=============================="
            echo "  systemd-analyze verify"
            echo "=============================="
            systemd-analyze verify dominion-proposal-queue.service 2>&1 || true
