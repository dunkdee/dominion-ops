name: Diagnose — dominion-proposal-queue.service

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect proposal-queue systemd unit + process
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "=============================="
            echo "  sudo access check"
            echo "=============================="
            sudo -n true 2>/dev/null && echo "SUDO_OK (passwordless)" || echo "SUDO_NO"

            echo ""
            echo "=============================="
            echo "  sibling buddy_core unit files (templates)"
            echo "=============================="
            for svc in dominion-review-queue.service dominion-report.service dominion-guardian.service dominion-buddy-web.service; do
              echo "--- $svc ---"
              systemctl cat "$svc" 2>&1
              echo ""
            done
