name: Dominion Brain CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'brain/**'
      - 'scripts/render_dominion_brain.py'
      - 'scripts/check_brain_inputs.py'
      - 'scripts/deploy_dominion_brain_remote.sh'
      - 'scripts/setup_vault.sh'
      - '.github/workflows/seed-vault.yml'
      - 'scripts/quarantine_vm_repo_state.sh'
      - 'tests/test_render_dominion_brain.py'
      - 'agents/registry.json'
      - 'governance/**'
      - 'architecture/CONTROL_PLANE.md'
      - 'STATE.md'
      - 'README.md'
      - '.github/workflows/dominion-brain-ci.yml'
      - '.github/workflows/publish-dominion-brain-production.yml'
  push:
    branches:
      - main
      - governance/agent-brain-pack-20260809
      - fix/brain-vm-drift-quarantine-20260809
    paths:
      - 'brain/**'
      - 'scripts/render_dominion_brain.py'
      - 'scripts/check_brain_inputs.py'
      - 'scripts/deploy_dominion_brain_remote.sh'
      - 'scripts/quarantine_vm_repo_state.sh'
      - 'tests/test_render_dominion_brain.py'
      - 'agents/registry.json'
      - 'governance/**'
      - 'architecture/CONTROL_PLANE.md'
      - 'STATE.md'
      - 'README.md'
      - '.github/workflows/dominion-brain-ci.yml'
      - '.github/workflows/publish-dominion-brain-production.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile and shell syntax
        run: |
          python -m py_compile scripts/render_dominion_brain.py scripts/check_brain_inputs.py tests/test_render_dominion_brain.py
          bash -n scripts/deploy_dominion_brain_remote.sh scripts/quarantine_vm_repo_state.sh scripts/setup_vault.sh
      - name: Reject secret-bearing governed inputs
        run: |
          set -euo pipefail
          python scripts/check_brain_inputs.py
          output="$(bash scripts/setup_vault.sh 2>&1 || true)"
          grep -Fq 'LEGACY_VAULT_SETUP=RETIRED mutation=none' <<<"$output"
          ! git ls-files brain | grep -E '(^|/)(\.env|.*\.(pem|key|p12|pfx))$'
      - name: Test
        run: |
          python -m pip install --disable-pip-version-check 'pytest>=8,<9'
          pytest -q tests/test_render_dominion_brain.py
      - name: Render smoke test
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          target="$root/Dominion-Brain"
          python scripts/render_dominion_brain.py "$target"
          test -f "$target/MANIFEST.json"
          test -f "$target/00-Constitution/SYSTEM_CONSTITUTION.md"
          test -f "$target/04-Agents/REGISTRY.md"
          test -f "$target/01-Founder-Authority/AUTHORITY_MATRIX.md"
          test -f "$target/03-Control-Plane/DOMINION_OPERATING_MAP.md"
          test -f "$target/04-Agents/research/02-Authority.md"
