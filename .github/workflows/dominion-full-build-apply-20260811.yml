name: DEPRECATED — Runtime Recovery Hold

# This workflow deliberately performs no deployment, restart, or remote access.
# It replaces a stale workflow that could re-enable services without a current
# authorization record. Do not add an activation path here.

on:
  workflow_dispatch:

permissions: {}

jobs:
  recovery-hold:
    name: Recovery hold — no action permitted
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse deployment
        shell: bash
        run: |
          echo "RUNTIME_RECOVERY_HOLD=ACTIVE"
          echo "No VM, laptop, firewall, secret, or service changes are permitted by this workflow."
          echo "Use a reviewed, purpose-specific recovery workflow with explicit acceptance evidence."
          exit 1
