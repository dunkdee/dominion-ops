name: Dominion Online Audit Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dominion-online-audit-once.yml'

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: foundation-vm-production
    steps:
      - name: Require protected VM access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_HOST" && test -n "$VM_USER" && test -n "$VM_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Audit live Dominion runtime read-only
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -u
          failures=0
          echo '=== DOMINION LIVE AUDIT ==='
          if [ -d "$HOME/dominion-ops/.git" ]; then
            echo "VM_REPO_SHA=$(git -C "$HOME/dominion-ops" rev-parse HEAD 2>/dev/null || true)"
          else
            echo 'VM_REPO_SHA=MISSING'; failures=$((failures+1))
          fi

          if sudo caddy validate --config /etc/caddy/Caddyfile >/dev/null 2>&1; then
            echo 'CADDY=PASS'
          else
            echo 'CADDY=FAIL'; failures=$((failures+1))
          fi

          required_ports='80 443 5000 5050 5055 5056 5060 5070 5080 5090 5101 5678 8080 8082 8083 8090 8099 8787 11434'
          missing=''
          for port in $required_ports; do
            if timeout 2 bash -c "</dev/tcp/127.0.0.1/$port" >/dev/null 2>&1; then :; else missing="$missing $port"; fi
          done
          if [ -n "$missing" ]; then echo "LISTENERS=FAIL missing=$missing"; failures=$((failures+1)); else echo 'LISTENERS=PASS count=19'; fi

          check_200() {
            name="$1"; url="$2"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" 2>/dev/null || true)"
            if [ "$code" = '200' ]; then echo "HTTP=PASS name=$name status=200"; else echo "HTTP=FAIL name=$name status=${code:-000}"; failures=$((failures+1)); fi
          }
          check_200 baby_api http://127.0.0.1:8080/
          check_200 wix_agent http://127.0.0.1:8082/ready
          check_200 dominion_web http://127.0.0.1:8090/
          check_200 n8n http://127.0.0.1:5678/healthz
          check_200 alpha_engine http://127.0.0.1:8787/health
          check_200 conductor http://127.0.0.1:5060/health
          check_200 email_drip http://127.0.0.1:8099/health
          check_200 ollama http://127.0.0.1:11434/api/tags

          obsidian_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8083/ 2>/dev/null || true)"
          if [ "$obsidian_code" = '401' ]; then echo 'HTTP=PASS name=obsidian_backend status=401 auth=required'; else echo "HTTP=FAIL name=obsidian_backend expected=401 actual=${obsidian_code:-000}"; failures=$((failures+1)); fi

          buddy_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:5070/buddy 2>/dev/null || true)"
          if [ "$buddy_code" = '401' ]; then echo 'HTTP=PASS name=buddy status=401 auth=required'; else echo "HTTP=FAIL name=buddy expected=401 actual=${buddy_code:-000}"; failures=$((failures+1)); fi

          echo '=== CONTAINERS ==='
          sudo docker ps --format 'CONTAINER={{.Names}} STATUS={{.Status}}' | sort || true
          echo '=== DOMINION SYSTEMD ==='
          systemctl --no-pager --plain --type=service --state=running 2>/dev/null | grep -E 'dominion|buddy|sentinel|proposal|conductor|email' || true

          echo '=== PUBLIC SURFACES ==='
          public_2xx() {
            name="$1"; url="$2"
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "$url" 2>/dev/null || true)"
            case "$code" in 2??) echo "PUBLIC=PASS name=$name status=$code" ;; *) echo "PUBLIC=FAIL name=$name status=${code:-000}"; failures=$((failures+1)) ;; esac
          }
          public_2xx dominion_healing https://dominionhealing.org/
          public_2xx voltedge_store https://www.voltedgegoods.com/
          public_2xx surplus https://surplus.dominionhealing.org/
          vault_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://vault.dominionhealing.org/ 2>/dev/null || true)"
          if [ "$vault_code" = '401' ]; then echo 'PUBLIC=PASS name=vault status=401 auth=required'; else echo "PUBLIC=FAIL name=vault expected=401 actual=${vault_code:-000}"; failures=$((failures+1)); fi

          echo "DOMINION_LIVE_AUDIT_FAILURES=$failures"
          [ "$failures" -eq 0 ]
          REMOTE

      - name: Cleanup SSH material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key"
