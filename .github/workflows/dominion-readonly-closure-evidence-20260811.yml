name: Dominion Read-Only Closure Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Verify and stage approved closure evidence
        id: evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $vault = 'C:\Users\Dell\Documents\Dominion Command Vault'
          if (-not (Test-Path -LiteralPath $vault -PathType Container)) {
            throw 'Dominion Command Vault is missing'
          }

          $bundle = Join-Path $env:RUNNER_TEMP ("dominion-closure-evidence-{0}" -f $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null

          $relativePaths = @(
            '_system\unknown_133_decision_queue.json',
            '_system\unknown_133_evidence.json',
            '_system\unknown_133_summary.txt',
            '_system\canonical_manifest_v3_overlay_phase5b.json',
            '_system\canonical_manifest_v3_reconciliation.json',
            '_system\canonical_manifest_v3_review_queue.json',
            '_system\component_registry.json',
            '_system\division_registry.json',
            '_system\vault_manifest.json',
            'Dominion-Brain\MANIFEST.json',
            'Dominion-Release-State\laptop-latest.json'
          )

          $expectedHashes = @{
            '_system\unknown_133_decision_queue.json' = 'c02f7dc2c81955f855ba44baf29a1d274acfc9204dca3f6367522f0ddde6a850'
            '_system\unknown_133_evidence.json' = '397f66c194762f7e6c9756e1586460cfb7f02e9a2f9fd19804baec3adbc13b3d'
            '_system\unknown_133_summary.txt' = '7c1ec2522f94b3f896ef44761ea258139d8a1196536484eb574692ace459572c'
          }

          $all = @(Get-ChildItem -LiteralPath $vault -Recurse -File -Force)
          $canonical = @($all | Where-Object {
            $_.FullName -notmatch '\\\.dominion-brain-(backup|stage)-'
          })
          $sensitive = @($canonical | Where-Object {
            $_.Name -match '\.(env|pem|key|p12|pfx)$|credential|secret|token'
          })
          if ($sensitive.Count -ne 0) {
            throw ("Sensitive-looking filenames detected; refusing evidence export. count={0}" -f $sensitive.Count)
          }

          $items = foreach ($relative in $relativePaths) {
            $source = Join-Path $vault $relative
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw ("Required closure artifact missing: {0}" -f $relative)
            }
            $hash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expectedHashes.ContainsKey($relative) -and $hash -ne $expectedHashes[$relative]) {
              throw ("Approved artifact hash mismatch: {0}" -f $relative)
            }
            $destination = Join-Path $bundle ([IO.Path]::GetFileName($relative))
            Copy-Item -LiteralPath $source -Destination $destination -Force
            [pscustomobject]@{
              relative_path = $relative
              bytes = (Get-Item -LiteralPath $source).Length
              sha256 = $hash
            }
          }

          $runnerService = Get-Service -Name 'actions.runner.dunkdee-dominion-ops.dominion-laptop' -ErrorAction SilentlyContinue
          $manifest = [ordered]@{
            schema = 'dominion-readonly-closure-evidence-v1'
            result = 'PASS'
            run_id = $env:GITHUB_RUN_ID
            runner = $env:COMPUTERNAME
            vault_exists = $true
            canonical_file_count = $canonical.Count
            sensitive_filename_count = $sensitive.Count
            runner_service_state = if ($runnerService) { [string]$runnerService.Status } else { 'NOT_FOUND' }
            files = @($items)
            vault_mutated = $false
          }
          $manifestPath = Join-Path $bundle 'closure_manifest.json'
          [IO.File]::WriteAllText(
            $manifestPath,
            ($manifest | ConvertTo-Json -Depth 8),
            [Text.UTF8Encoding]::new($false)
          )

          "bundle=$bundle" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host ("CLOSURE_EVIDENCE=PASS files={0} canonical={1} sensitive_names={2}" -f $items.Count, $canonical.Count, $sensitive.Count)

      - name: Upload private one-day evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: dominion-closure-evidence-${{ github.run_id }}
          path: ${{ steps.evidence.outputs.bundle }}
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary staged evidence
        if: always()
        shell: powershell
        run: |
          $bundle = '${{ steps.evidence.outputs.bundle }}'
          if ($bundle -and (Test-Path -LiteralPath $bundle)) {
            Remove-Item -LiteralPath $bundle -Recurse -Force
          }
