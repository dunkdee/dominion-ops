name: Dominion Vault Read-Only Inventory

on:
  schedule:
    - cron: '*/5 * * * *'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  inventory:
    if: github.event_name == 'schedule' || github.event.issue.title == 'RUN Dominion Vault Read-Only Inventory'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Inventory Command Vault without mutation
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $vault = 'C:\Users\Dell\Documents\Dominion Command Vault'
          if (-not (Test-Path -LiteralPath $vault -PathType Container)) {
            throw 'Dominion Command Vault is missing'
          }

          $all = @(Get-ChildItem -LiteralPath $vault -Recurse -File -Force)
          $canonical = @($all | Where-Object {
            $_.FullName -notmatch '\\\.dominion-brain-(backup|stage)-'
          })

          $topRows = foreach ($dir in Get-ChildItem -LiteralPath $vault -Directory -Force) {
            [pscustomobject]@{
              Name = $dir.Name
              Files = @(Get-ChildItem -LiteralPath $dir.FullName -Recurse -File -Force).Count
            }
          }

          $systemRoot = Join-Path $vault '_system'
          $unknown = @()
          $recovery = @()
          if (Test-Path -LiteralPath $systemRoot -PathType Container) {
            $unknown = @(Get-ChildItem -LiteralPath $systemRoot -File -Filter 'unknown*133*')
            $recovery = @(Get-ChildItem -LiteralPath $systemRoot -File | Where-Object {
              $_.Name -match 'manifest|registry|reconciliation|decision|overlay|validator|checkpoint'
            })
          }

          $sensitive = @($all | Where-Object {
            $_.Name -match '\.(env|pem|key|p12|pfx)$|credential|secret|token'
          })

          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('# Dominion Vault Read-Only Inventory')
          $lines.Add('')
          $lines.Add('- Result: PASS')
          $lines.Add("- Runner: $env:COMPUTERNAME")
          $lines.Add("- Vault exists: true")
          $lines.Add("- Raw files: $($all.Count)")
          $lines.Add("- Canonical files excluding backup/stage trees: $($canonical.Count)")
          $lines.Add("- Canonical Markdown: $(@($canonical | Where-Object Extension -eq '.md').Count)")
          $lines.Add("- Canonical JSON: $(@($canonical | Where-Object Extension -eq '.json').Count)")
          $lines.Add("- Canonical CSV: $(@($canonical | Where-Object Extension -eq '.csv').Count)")
          $lines.Add("- Sensitive-looking filenames: $($sensitive.Count)")
          $lines.Add('')
          $lines.Add('## Top-level file counts')
          foreach ($row in $topRows | Sort-Object Files -Descending) {
            $lines.Add("- `$($row.Name)`: $($row.Files)")
          }
          $lines.Add('')
          $lines.Add('## Approved unknown_133 artifacts')
          foreach ($file in $unknown | Sort-Object Name) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = $file.FullName.Substring($vault.Length).TrimStart('\')
            $lines.Add("- `$relative` — bytes=$($file.Length) sha256=`$hash`")
          }
          $lines.Add('')
          $lines.Add('## System recovery artifacts')
          foreach ($file in $recovery | Sort-Object Name) {
            $relative = $file.FullName.Substring($vault.Length).TrimStart('\')
            $lines.Add("- `$relative` — bytes=$($file.Length) modified=$($file.LastWriteTimeUtc.ToString('o'))")
          }
          $lines.Add('')
          $lines.Add('No Vault files were created, edited, moved, or deleted by this inventory.')

          $bodyPath = Join-Path $env:RUNNER_TEMP "dominion-vault-inventory-$env:GITHUB_RUN_ID.md"
          [IO.File]::WriteAllLines($bodyPath, $lines, [Text.UTF8Encoding]::new($false))
          & gh issue create --repo $env:GITHUB_REPOSITORY --title "Dominion Vault Read-Only Inventory $env:GITHUB_RUN_ID" --body-file $bodyPath
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish sanitized inventory issue' }
