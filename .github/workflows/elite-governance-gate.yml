name: Elite Governance Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elite-governance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance-enforcement:
    name: governance-enforcement
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code

      - name: Run fail-closed Dominion governance gate
        run: python scripts/validate_elite_governance.py

  full-python-suite:
    name: full-python-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install declared repository test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run repository-wide Python suite without hiding dependency gaps
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
