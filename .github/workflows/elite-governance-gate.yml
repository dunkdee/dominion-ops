name: Elite Governance Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elite-governance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance-enforcement:
    name: governance-enforcement
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate elite governance contracts
        run: python scripts/validate_elite_governance.py
