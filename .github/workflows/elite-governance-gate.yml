name: Elite Governance Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: elite-governance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance-enforcement:
    name: governance-enforcement
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code

      - name: Run fail-closed Dominion governance gate
        run: python scripts/validate_elite_governance.py

  full-python-suite:
    name: full-python-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install test runner only
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9'

      - name: Run repository-wide Python suite without hiding dependency gaps
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
