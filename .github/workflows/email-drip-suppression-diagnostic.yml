name: Email Drip — Suppression Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/email-drip-suppression-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: foundation-vm-production
    steps:
      - uses: actions/checkout@v7

      - name: Require protected VM secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Inspect suppression boundary without reading addresses
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          service="dominion-email-drip.service"
          target="$HOME/email_drip/email_drip.py"

          sudo systemctl is-active --quiet "$service"
          health="$(curl -fsS --max-time 10 http://127.0.0.1:8099/health)"
          python3 - "$health" <<'PY'
          import json,sys
          j=json.loads(sys.argv[1])
          assert j['status']=='ok'
          assert j['send_mode']=='hold'
          print('EMAIL_DRIP_SUPPRESSION_RUNTIME=PASS mode=hold')
          PY

          pid="$(sudo systemctl show -p MainPID --value "$service")"
          test "$pid" -gt 0
          owner="$(stat -c '%U' "$target")"
          python_bin="$(sudo python3 - "$pid" <<'PY'
          import pathlib,sys
          raw=pathlib.Path(f'/proc/{sys.argv[1]}/cmdline').read_bytes().split(b'\0')
          if not raw or not raw[0]: raise SystemExit(1)
          print(raw[0].decode())
          PY
          )"
          test -x "$python_bin"

          suppression="$(sudo python3 - "$pid" <<'PY'
          import pathlib,sys
          entries=pathlib.Path(f'/proc/{sys.argv[1]}/environ').read_bytes().split(b'\0')
          env={}
          for raw in entries:
              if b'=' in raw:
                  k,v=raw.split(b'=',1)
                  env[k.decode(errors='replace')]=v.decode(errors='replace')
          print(env.get('DRIP_SUPPRESSION_FILE','/home/malachisingleton8/buddy_core/email_suppression.json'))
          PY
          )"

          sudo -u "$owner" "$python_bin" - "$suppression" <<'PY'
          import json,os,stat,sys
          from pathlib import Path

          path=Path(sys.argv[1])
          parent=path.parent
          lock=Path(str(path)+'.lock')

          def meta(p):
              try:
                  st=p.stat()
              except OSError as exc:
                  return {'exists':False,'error_type':type(exc).__name__}
              return {
                  'exists':True,
                  'is_file':p.is_file(),
                  'is_symlink':p.is_symlink(),
                  'mode':oct(stat.S_IMODE(st.st_mode)),
                  'uid':st.st_uid,
                  'gid':st.st_gid,
              }

          out={
              'suppression':meta(path),
              'parent':meta(parent),
              'lock':meta(lock),
              'file_readable':os.access(path,os.R_OK),
              'parent_writable':os.access(parent,os.W_OK),
              'lock_writable':os.access(lock,os.W_OK) if lock.exists() else None,
          }

          try:
              with path.open('r',encoding='utf-8') as handle:
                  data=json.load(handle)
              out['json_parse']='ok'
              out['root_type']=type(data).__name__
              emails=data.get('emails') if isinstance(data,dict) else None
              out['emails_type']=type(emails).__name__ if emails is not None else 'missing'
              out['email_count']=len(emails) if isinstance(emails,list) else None
          except Exception as exc:
              out['json_parse']='error'
              out['json_error_type']=type(exc).__name__

          print('EMAIL_DRIP_SUPPRESSION_DIAG='+json.dumps(out,separators=(',',':'),sort_keys=True))
          print('EMAIL_DRIP_SUPPRESSION_DIAGNOSTIC=PASS')
          PY
          REMOTE

      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key"
