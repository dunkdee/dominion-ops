name: Find WIX_API_KEY on VM

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Deep search for WIX_API_KEY across VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 120s
          script: |
            echo "=== DEEP SEARCH: WIX_API_KEY ==="

            echo ""
            echo "--- 1. Login shell env ---"
            bash -l -c 'echo "WIX_API_KEY length: ${#WIX_API_KEY}"'

            echo ""
            echo "--- 2. Grep all text files under /home /opt /root /etc ---"
            grep -rl 'WIX_API_KEY' /home /opt /root /etc 2>/dev/null \
              | grep -v '/.git/' | grep -v '__pycache__' \
              | while read f; do
                  echo "FOUND: $f"
                  grep 'WIX_API_KEY' "$f" 2>/dev/null | sed 's/=.*/=***REDACTED***/' | head -2
                done

            echo ""
            echo "--- 3. Systemd service/env files ---"
            find /etc/systemd /lib/systemd /home -name "*.service" -o -name "*.env" 2>/dev/null \
              | xargs grep -l 'WIX' 2>/dev/null \
              | while read f; do
                  echo "FOUND in systemd: $f"
                  grep 'WIX' "$f" | sed 's/=.*/=***REDACTED***/'
                done

            echo ""
            echo "--- 4. Docker container environments ---"
            docker inspect $(docker ps -aq 2>/dev/null) 2>/dev/null \
              | python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    for c in data:
        name = c.get('Name', '?')
        env = c.get('Config', {}).get('Env', []) or []
        for e in env:
            if 'WIX' in e:
                key = e.split('=')[0]
                print(f'FOUND in container {name}: {key}=***REDACTED***')
except Exception as ex:
    print(f'parse error: {ex}')
" 2>/dev/null || echo "  (no containers)"

            echo ""
            echo "--- 5. Running process environments (/proc) ---"
            for pid in /proc/[0-9]*/environ; do
              out=$(tr '\0' '\n' < "$pid" 2>/dev/null | grep 'WIX_API_KEY' | sed 's/=.*/=***REDACTED***/')
              [ -n "$out" ] && echo "FOUND in PID $pid: $out"
            done | head -10

            echo ""
            echo "--- 6. docker-compose files with WIX ---"
            find /home /opt /root 2>/dev/null \( -name "docker-compose*.yml" -o -name "docker-compose*.yaml" \) \
              | xargs grep -l 'WIX' 2>/dev/null \
              | while read f; do
                  echo "FOUND in compose: $f"
                  grep 'WIX' "$f" | sed 's/=.*/=***REDACTED***/'
                done

            echo ""
            echo "=== Search complete ==="
            echo "If nothing found above, the key was only in an old terminal session and is gone."
            echo "You'll need to get it from: https://manage.wix.com/premium-purchase-plan/dynamo"
            echo "Go to: Settings > Advanced > API Keys"
