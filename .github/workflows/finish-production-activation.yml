name: Finish Dominion Production Activation
# Governed production activation orchestrator
# Retriggered after Obsidian runtime verification was hardened to use the real authenticated service response.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type FINISH PRODUCTION ACTIVATION"
        required: true
        type: string
      commit_sha:
        description: "Exact 40-character main commit SHA"
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: dominion-production-activation
  cancel-in-progress: false

jobs:
  activate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'FINISH PRODUCTION ACTIVATION' &&
      inputs.commit_sha == github.sha &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve and freeze exact activation SHA
        id: sha
        env:
          INPUT_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$target_sha" = "$INPUT_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$target_sha"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "DOMINION_RELEASE_FREEZE=PASS sha=$target_sha"

      - name: Run strict Foundation VM dry-run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous="$(gh run list --workflow run-foundation-vm-dry-run.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          gh workflow run run-foundation-vm-dry-run.yml --ref main
          run_id=""
          for _ in {1..24}; do
            current="$(gh run list --workflow run-foundation-vm-dry-run.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "$current" && "$current" != "$previous" ]]; then
              run_id="$current"
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status

      - name: Verify strict dry-run evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(gh issue view 78 --json body --jq .body)"
          grep -q 'Overall: \*\*success\*\*' <<<"$body"
          grep -q 'DRY RUN complete\. failures=0' <<<"$body"
          grep -q 'exit_code=0' <<<"$body"

      - name: Dispatch governed Foundation VM deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.sha.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          previous="$(gh run list --workflow deploy-foundation-vm-governed.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          gh workflow run deploy-foundation-vm-governed.yml --ref main \
            -f commit_sha="$TARGET_SHA" \
            -f confirm='DEPLOY FOUNDATION VM'
          run_id=""
          for _ in {1..24}; do
            current="$(gh run list --workflow deploy-foundation-vm-governed.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "$current" && "$current" != "$previous" ]]; then
              run_id="$current"
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status

      - name: Verify governed deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.sha.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(gh issue view 55 --json body --jq .body)"
          grep -q 'Overall: \*\*success\*\*' <<<"$body"
          grep -q 'Validation: \*\*success\*\*' <<<"$body"
          grep -q 'Deployment: \*\*success\*\*' <<<"$body"
          grep -q "Requested SHA: \`$TARGET_SHA\`" <<<"$body"
          grep -q 'Remote exit code: `0`' <<<"$body"
          grep -q 'Failure summary: `none`' <<<"$body"
          grep -q 'Rollback summary: `none`' <<<"$body"

      - name: Dispatch governed Obsidian access verification
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.sha.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          previous="$(gh run list --workflow deploy-obsidian.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          gh workflow run deploy-obsidian.yml --ref main \
            -f commit_sha="$TARGET_SHA" \
            -f confirm='VERIFY OBSIDIAN REMOTE'
          run_id=""
          for _ in {1..24}; do
            current="$(gh run list --workflow deploy-obsidian.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "$current" && "$current" != "$previous" ]]; then
              run_id="$current"
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          gh issue comment 79 --body "Governed Obsidian verification dispatched for exact SHA \`$TARGET_SHA\`: $run_url"
          if ! gh run watch "$run_id" --exit-status; then
            gh issue comment 79 --body "Governed Obsidian verification failed for exact SHA \`$TARGET_SHA\`. Sanitized run evidence: $run_url"
            exit 1
          fi

      - name: Publish Brain, deploy complete Command Center, and prove live runtime
        id: closure
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.sha.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          dispatch_and_wait() {
            local workflow="$1"
            shift
            local previous current run_id
            previous="$(gh run list --workflow "$workflow" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            gh workflow run "$workflow" --ref main "$@"
            run_id=""
            for _ in {1..36}; do
              current="$(gh run list --workflow "$workflow" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              if [[ -n "$current" && "$current" != "$previous" ]]; then
                run_id="$current"
                break
              fi
              sleep 5
            done
            test -n "$run_id"
            gh run watch "$run_id" --exit-status
            printf '%s=%s\n' "${workflow//[^A-Za-z0-9]/_}_run_id" "$run_id" >> "$GITHUB_OUTPUT"
          }

          dispatch_and_wait publish-dominion-brain-production.yml \
            -f commit_sha="$TARGET_SHA" \
            -f confirm='PUBLISH DOMINION BRAIN'

          dispatch_and_wait deploy-dominion-command-center.yml \
            -f commit_sha="$TARGET_SHA" \
            -f confirm='DEPLOY DOMINION COMMAND CENTER'

          dispatch_and_wait final-production-acceptance.yml \
            -f commit_sha="$TARGET_SHA" \
            -f confirm='RUN PRODUCTION ACCEPTANCE'

          dispatch_and_wait watchdog.yml
          echo "DOMINION_TOP_TO_BOTTOM_CLOSURE=PASS sha=$TARGET_SHA"

      - name: Install content engine dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r apps/gemini/requirements.txt

      - name: Validate content engine entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile apps/gemini/engine.py
          python3 apps/gemini/engine.py --help >/tmp/content-engine-help.txt
          grep -qi 'campaign' /tmp/content-engine-help.txt

      - name: Publish final activation evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.sha.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          deploy_run="$(gh run list --workflow deploy-foundation-vm-governed.yml --event workflow_dispatch --limit 1 --json url --jq '.[0].url')"
          dry_run="$(gh run list --workflow run-foundation-vm-dry-run.yml --event workflow_dispatch --limit 1 --json url --jq '.[0].url')"
          obsidian_run="$(gh run list --workflow deploy-obsidian.yml --event workflow_dispatch --limit 1 --json url --jq '.[0].url')"
          brain_run="$(gh run list --workflow publish-dominion-brain-production.yml --event workflow_dispatch --limit 1 --json url --jq '.[0].url')"
          command_center_run="$(gh run list --workflow deploy-dominion-command-center.yml --event workflow_dispatch --limit 1 --json url --jq '.[0].url')"
          acceptance_run="$(gh run list --workflow final-production-acceptance.yml --event workflow_dispatch --limit 1 --json url --jq '.[0].url')"
          observer_run="$(gh run list --workflow watchdog.yml --event workflow_dispatch --limit 1 --json url --jq '.[0].url')"
          cat > /tmp/issue79.md <<EOF
          # Dominion Production Activation — Verified

          - [x] Baby API exact ownership hardening merged and issue #76 closed.
          - [x] Strict Foundation VM dry-run passed with failures=0 and exit_code=0.
          - [x] Governed Foundation VM deployment passed for exact SHA \`$TARGET_SHA\`.
          - [x] Validation passed, deployment passed, remote exit code was 0, with no failure and no rollback.
          - [x] Governed Obsidian Remote Access workflow passed on the same SHA.
          - [x] Canonical Dominion Brain published and authenticated public route passed.
          - [x] Complete live-truth Command Center deployed with 11/11 lanes, connected revenue runtime, connected autopilot, and receipts present.
          - [x] Full live production acceptance passed on the VM for the exact SHA.
          - [x] Final read-only runtime observer passed after deployment.
          - [x] Content engine entrypoint compiled and exposed the campaign command.

          ## Evidence

          - Strict dry-run: $dry_run
          - Governed deployment: $deploy_run
          - Obsidian verification: $obsidian_run
          - Dominion Brain publish: $brain_run
          - Complete Command Center deploy: $command_center_run
          - Live production acceptance: $acceptance_run
          - Final runtime observer: $observer_run
          - Deployment status: issue #55
          - Dry-run status: issue #78

          ## Production state

          The governed control plane, canonical Brain, and complete live-truth Command Center are deployed on foundation-vm at \`$TARGET_SHA\`. The release passed exact-SHA synchronization, fail-closed deployment, authenticated access, 11/11 internal lane truth, connected revenue/autopilot state, full runtime acceptance, and the final read-only observer.

          Paid services were not activated and no secrets were written to GitHub.
          EOF
          gh issue edit 79 --body-file /tmp/issue79.md
          gh issue close 79 --reason completed
          gh issue close 76 --reason completed || true
