name: Fix Gemini Port (RETIRED)

# This one-time direct-SSH repair is intentionally retired. Runtime changes must
# ship through the governed Foundation VM deployment with an exact main SHA.

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Type RETIRED to acknowledge this workflow is disabled"
        required: true
        type: string

permissions:
  contents: read

jobs:
  retired:
    if: ${{ inputs.acknowledge == 'RETIRED' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm governed replacement
        run: |
          echo "This legacy repair is retired."
          echo "Use Deploy Foundation VM — Governed with an exact main commit SHA."
