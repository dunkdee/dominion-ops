name: Fix Gemini Port 2
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Move gemini-server from 5055 to 5056
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            echo "=== BACKUP ==="
            cp /opt/ai_agents/gemini/server.py /opt/ai_agents/gemini/server.py.bak
            cp ~/buddy_core/jarvis/jarvis_core.py ~/buddy_core/jarvis/jarvis_core.py.bak
            cp ~/buddy_core/port_manifest.json ~/buddy_core/port_manifest.json.bak

            echo "=== PATCH server.py ==="
            sed -i "s/port=5055/port=5056/g" /opt/ai_agents/gemini/server.py
            grep 'app.run' /opt/ai_agents/gemini/server.py

            echo "=== PATCH jarvis_core.py ==="
            sed -i 's/"gemini_server": 5055/"gemini_server": 5056/' ~/buddy_core/jarvis/jarvis_core.py
            grep -n 'gemini_server' ~/buddy_core/jarvis/jarvis_core.py | head -5

            echo "=== PATCH port_manifest.json ==="
            sed -i 's/"5055": "gemini-server"/"5056": "gemini-server"/' ~/buddy_core/port_manifest.json
            cat ~/buddy_core/port_manifest.json

            echo "=== RESTART GEMINI ==="
            sudo systemctl restart gemini-server
            sleep 4
            systemctl status gemini-server --no-pager | head -12
            ss -tlnp | grep 5056 && echo "5056 UP" || echo "5056 not up yet"

            echo "=== RESTART BUDDY ==="
            sudo systemctl restart buddy-bridge dominion-buddy-web
            sleep 3
            systemctl status buddy-bridge --no-pager | head -6
            systemctl status dominion-buddy-web --no-pager | head -6

            echo "=== TEST ==="
            curl -sf -X POST http://127.0.0.1:5056/orchestrate -H 'Content-Type: application/json' -d '{"prompt":"ping"}' --max-time 10 || echo "no response"
            echo "=== DONE ==="
