name: Frontend Control App CI

on:
  push:
    branches: ["feat/dominion-control-app"]
    paths:
      - "apps/frontend/**"
      - "apps/dominion_publisher/service.py"
      - ".github/workflows/frontend-control-app-ci.yml"
  pull_request:
    paths:
      - "apps/frontend/**"
      - "apps/dominion_publisher/service.py"
      - ".github/workflows/frontend-control-app-ci.yml"

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ensure committed dependency lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f apps/frontend/package-lock.json ]]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd apps/frontend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "generated=true" >> "$GITHUB_OUTPUT"
      - name: Commit generated dependency lock
        if: github.event_name == 'push' && steps.lock.outputs.generated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/package-lock.json
          git commit -m "build(frontend): lock control app dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Require lock before proof
        if: steps.lock.outputs.generated != 'true'
        run: test -f apps/frontend/package-lock.json
      - name: Install locked dependencies
        if: steps.lock.outputs.generated != 'true'
        working-directory: apps/frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        if: steps.lock.outputs.generated != 'true'
        working-directory: apps/frontend
        run: npm run typecheck
      - name: Production build
        if: steps.lock.outputs.generated != 'true'
        working-directory: apps/frontend
        run: npm run build
      - name: Integration smoke test
        if: steps.lock.outputs.generated != 'true'
        working-directory: apps/frontend
        run: npm run smoke
      - name: Governance negative controls
        if: steps.lock.outputs.generated != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e apps/frontend/pages/api/publisher/jobs/publish.ts
          ! grep -R --line-number -E 'NEXT_PUBLIC_.*(TOKEN|SECRET|KEY)' apps/frontend --exclude-dir=node_modules --exclude=package-lock.json
          grep -R --line-number 'RESTRICTED_HOLD' apps/frontend/pages apps/frontend/lib
          python -m py_compile apps/dominion_publisher/service.py
          grep -F 'DOMINION_FRONTEND_PUBLIC_URL' apps/dominion_publisher/service.py
          grep -F 'Explicit approval is still required.' apps/dominion_publisher/service.py
      - name: Container build
        if: steps.lock.outputs.generated != 'true'
        run: docker build --pull -t dominion-control:${GITHUB_SHA} apps/frontend
