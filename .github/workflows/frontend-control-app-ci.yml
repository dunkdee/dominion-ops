name: Frontend Control App CI

on:
  push:
    branches: ["feat/dominion-control-app"]
    paths:
      - "apps/frontend/**"
      - "apps/dominion_publisher/service.py"
      - ".github/workflows/frontend-control-app-ci.yml"
  pull_request:
    paths:
      - "apps/frontend/**"
      - "apps/dominion_publisher/service.py"
      - ".github/workflows/frontend-control-app-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require locked maintenance-LTS framework
        working-directory: apps/frontend
        run: |
          test -f package-lock.json
          node -e "const p=require('./package.json'); if(p.dependencies.next!=='15.5.24') throw new Error('Next maintenance-LTS pin drifted')"
          node -e "const l=require('./package-lock.json'); if(l.packages[''].dependencies.next!=='15.5.24') throw new Error('lockfile Next pin drifted')"
      - name: Install locked dependencies
        working-directory: apps/frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/frontend
        run: npm run typecheck
      - name: Production build
        working-directory: apps/frontend
        run: npm run build
      - name: Integration smoke test
        working-directory: apps/frontend
        run: npm run smoke
      - name: Governance negative controls
        shell: bash
        run: |
          set -euo pipefail
          test ! -e apps/frontend/pages/api/publisher/jobs/publish.ts
          ! grep -R --line-number -E 'NEXT_PUBLIC_.*(TOKEN|SECRET|KEY)' apps/frontend --exclude-dir=node_modules --exclude=package-lock.json
          grep -R --line-number 'RESTRICTED_HOLD' apps/frontend/pages apps/frontend/lib
          python -m py_compile apps/dominion_publisher/service.py
          grep -F 'DOMINION_FRONTEND_PUBLIC_URL' apps/dominion_publisher/service.py
          grep -F 'Explicit approval is still required.' apps/dominion_publisher/service.py
      - name: Container build
        run: docker build --pull -t dominion-control:${GITHUB_SHA} apps/frontend
