name: Gemini Port Read
on:
  workflow_dispatch:
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read gemini server and buddy-web code
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "====== GEMINI SERVER.PY FILE TYPE ======"
            file /opt/ai_agents/gemini/server.py

            echo "====== GEMINI PORT (strings search) ======"
            strings /opt/ai_agents/gemini/server.py 2>/dev/null | grep -iE 'port|5055|5056|listen|bind|run|host' | head -30

            echo "====== GEMINI DIR LISTING ======"
            ls -la /opt/ai_agents/gemini/

            echo "====== GEMINI CONFIG/ENV FILES ======"
            find /opt/ai_agents/gemini/ -name '*.env' -o -name '*.conf' -o -name '*.cfg' -o -name '*.ini' -o -name '*.py' 2>/dev/null | head -20

            echo "====== READABLE PY FILES IN GEMINI DIR ======"
            for f in /opt/ai_agents/gemini/*.py; do
              if file "$f" | grep -q text; then
                echo "--- $f ---"
                cat "$f"
              else
                echo "--- $f (binary, skipping) ---"
              fi
            done

            echo "====== BUDDY-WEB SERVICE FILE ======"
            cat /etc/systemd/system/dominion-buddy-web.service

            echo "====== BUDDY-WEB SCRIPT ======"
            BUDDY_PY=$(grep -oP 'ExecStart=.*\.py' /etc/systemd/system/dominion-buddy-web.service | grep -oP '/.*\.py' | head -1)
            echo "Script: $BUDDY_PY"
            if [ -n "$BUDDY_PY" ] && [ -f "$BUDDY_PY" ]; then
              grep -n '5055\|port\|brain\|BRAIN\|gemini\|GEMINI\|url\|URL\|host\|HOST' "$BUDDY_PY" | head -30
            fi

            echo "====== BUDDY-BRIDGE SERVICE FILE ======"
            cat /etc/systemd/system/buddy-bridge.service

            echo "====== BUDDY-BRIDGE SCRIPT (port refs) ======"
            BRIDGE_PY=$(grep -oP 'ExecStart=.*\.py' /etc/systemd/system/buddy-bridge.service | grep -oP '/.*\.py' | head -1)
            echo "Script: $BRIDGE_PY"
            if [ -n "$BRIDGE_PY" ] && [ -f "$BRIDGE_PY" ]; then
              grep -n '5055\|port\|brain\|BRAIN\|gemini\|GEMINI\|url\|URL' "$BRIDGE_PY" | head -30
            fi

            echo "====== FREE PORTS (5050-5070) ======"
            for p in 5050 5051 5052 5053 5054 5056 5057 5058 5060 5065 5070; do
              ss -tlnp | grep -q ":$p " && echo "$p: IN USE" || echo "$p: FREE"
            done

            echo "====== GREP 5055 ACROSS BUDDY CODE ======"
            grep -rn '5055' /home/*/buddy_core/ /home/*/dominion/agents/ 2>/dev/null | grep -v '.pyc' | head -30
