name: Governed External Message Canary

# Routine verification is system-owned: every successful Buddy Runtime deploy
# automatically runs VERIFY ONLY against the exact deployed SHA. External
# delivery remains Founder-gated and can only occur through an explicit manual
# SEND CANARY dispatch.

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: "Founder-supplied canary recipient email address"
        required: true
        type: string
      expected_sha:
        description: "Full commit SHA the runtime must report"
        required: true
        type: string
      confirm:
        description: "Type SEND CANARY to deliver, or VERIFY ONLY to stop before sending"
        required: true
        type: string
  workflow_run:
    workflows: ["Deploy Buddy Runtime"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  canary:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: foundation-vm-production
    steps:
      - name: Resolve execution mode
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RECIPIENT: ${{ inputs.recipient }}
          MANUAL_EXPECTED_SHA: ${{ inputs.expected_sha }}
          MANUAL_CONFIRM: ${{ inputs.confirm }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          AUTO_RECIPIENT: ${{ vars.GOVERNED_CANARY_RECIPIENT }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            recipient="${AUTO_RECIPIENT:-dewayne@dominionhealing.org}"
            expected_sha="$DEPLOY_SHA"
            confirm="VERIFY ONLY"
            mode="AUTO_VERIFY_AFTER_DEPLOY"
          else
            recipient="$MANUAL_RECIPIENT"
            expected_sha="$MANUAL_EXPECTED_SHA"
            confirm="$MANUAL_CONFIRM"
            mode="MANUAL_FOUNDER_DISPATCH"
          fi
          printf 'recipient=%s\n' "$recipient" >> "$GITHUB_OUTPUT"
          printf 'expected_sha=%s\n' "$expected_sha" >> "$GITHUB_OUTPUT"
          printf 'confirm=%s\n' "$confirm" >> "$GITHUB_OUTPUT"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          echo "CANARY_EXECUTION_MODE=$mode"

      - name: Checkout exact verification source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.expected_sha }}

      - name: Validate inputs and Founder authority
        shell: bash
        env:
          RECIPIENT: ${{ steps.resolve.outputs.recipient }}
          EXPECTED_SHA: ${{ steps.resolve.outputs.expected_sha }}
          CONFIRM: ${{ steps.resolve.outputs.confirm }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          FOUNDER_ACTOR: dunkdee
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "A full 40-character SHA is required"; exit 1; }
          [[ "$RECIPIENT" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]] || { echo "A single valid recipient address is required"; exit 1; }
          case "$CONFIRM" in
            "SEND CANARY"|"VERIFY ONLY") ;;
            *) echo "confirm must be exactly 'SEND CANARY' or 'VERIFY ONLY'"; exit 1 ;;
          esac
          if [ "$CONFIRM" = "SEND CANARY" ]; then
            [ "$ACTOR" = "$FOUNDER_ACTOR" ] || { echo "SEND CANARY requires the Founder actor"; exit 1; }
            [ "$TRIGGERING_ACTOR" = "$FOUNDER_ACTOR" ] || { echo "SEND CANARY requires the Founder triggering actor"; exit 1; }
          fi

      - name: Require deployment secrets
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" || { echo "VM_HOST secret is missing"; exit 1; }
          test -n "$VM_USER" || { echo "VM_USER secret is missing"; exit 1; }
          test -n "$VM_SSH_KEY" || { echo "VM_SSH_KEY secret is missing"; exit 1; }

      - name: Prepare SSH
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/canary_key"
          chmod 600 "$HOME/.ssh/canary_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Run governed canary on foundation-vm
        id: canary
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RECIPIENT: ${{ steps.resolve.outputs.recipient }}
          EXPECTED_SHA: ${{ steps.resolve.outputs.expected_sha }}
          CONFIRM: ${{ steps.resolve.outputs.confirm }}
        run: |
          set -euo pipefail
          remote_dir="/tmp/dominion_governed_canary_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          remote_script="$remote_dir/governed_message_canary.py"

          # Keep the canary script out of /tmp itself. The VM may contain legacy
          # top-level Python files there (for example operator.py) that can shadow
          # Python stdlib modules when a script is executed directly from /tmp.
          ssh -i "$HOME/.ssh/canary_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "install -d -m 700 '$remote_dir'"

          scp -i "$HOME/.ssh/canary_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            scripts/runtime/governed_message_canary.py \
            "$VM_USER@$VM_HOST:$remote_script"

          recipient_b64="$(printf '%s' "$RECIPIENT" | base64 -w0)"
          send_flag=0
          if [ "$CONFIRM" = "SEND CANARY" ]; then send_flag=1; fi

          set +e
          ssh -i "$HOME/.ssh/canary_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "RECIPIENT_B64='$recipient_b64' EXPECTED_SHA='$EXPECTED_SHA' SEND_FLAG='$send_flag' REMOTE_DIR='$remote_dir' REMOTE_SCRIPT='$remote_script' bash -s" <<'REMOTE' \
            | tee canary-output.txt
          set -euo pipefail
          cleanup() { rm -rf -- "$REMOTE_DIR"; }
          trap cleanup EXIT

          # Execute the canary with the exact Python runtime already proven by
          # the healthy Buddy web service. Bare /usr/bin/python3 on the VM does
          # not necessarily carry Buddy's installed dependencies.
          buddy_exec="$(systemctl show dominion-buddy-web.service -p ExecStart --value 2>/dev/null || true)"
          buddy_python="$(printf '%s\n' "$buddy_exec" | sed -n 's/.*path=\([^ ;]*\).*/\1/p' | head -1)"
          test -n "$buddy_python" || { echo 'CANARY_BUDDY_PYTHON=UNRESOLVED'; exit 8; }
          test -x "$buddy_python" || { echo 'CANARY_BUDDY_PYTHON=NOT_EXECUTABLE'; exit 8; }
          "$buddy_python" -c 'import dotenv' >/dev/null 2>&1 || { echo 'CANARY_BUDDY_PYTHON_DOTENV=UNAVAILABLE'; exit 8; }
          echo 'CANARY_BUDDY_PYTHON=RESOLVED'

          recipient="$(printf '%s' "$RECIPIENT_B64" | base64 -d)"
          args=("$buddy_python" "$REMOTE_SCRIPT" --recipient "$recipient" --expected-sha "$EXPECTED_SHA")
          if [ "$SEND_FLAG" = "1" ]; then args+=(--send); fi
          set +e
          "${args[@]}"
          rc=$?
          set -e
          exit "$rc"
          REMOTE
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-message-canary-evidence
          path: canary-output.txt
          if-no-files-found: warn

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/canary_key" "$HOME/.ssh/known_hosts"
