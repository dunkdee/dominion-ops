name: Governed Meta Binding

# Drives the existing scripts/dominion_publisher/meta_control.sh on the
# foundation VM through one governed path, so Meta binding does not require a
# separate manual lane. The Publisher listens on loopback only, so every
# subcommand must run on the VM; this workflow is that single flow.
#
# status/start/candidates are read-only. bind is the one mutation, and it is
# gated on the Founder actor plus an exact confirm string, and never selects an
# account on its own -- the Page id is always supplied explicitly.
#
# Provider secrets and the Publisher operator token are never printed:
# meta_control.sh reads the operator token from the 0600 runtime env on the VM
# and it is never passed through workflow inputs, outputs, or logs.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "status | start | candidates | bind"
        required: true
        type: choice
        options:
          - status
          - audit
          - configure
          - start
          - candidates
          - bind
      page_id:
        description: "Facebook Page id — required for bind only, never inferred"
        required: false
        type: string
      confirm:
        description: "For bind, type BIND META PAGE. Ignored for other actions."
        required: false
        type: string
      config_id:
        description: "For configure only — Facebook Login for Business configuration id. Not a secret. Blank uses classic login."
        required: false
        type: string

permissions:
  contents: read

# Shared with the canary and Foundation VM deploys so two VM operations can
# never overlap.
concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: foundation-vm-production
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate action and Founder authority
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          PAGE_ID: ${{ inputs.page_id }}
          CONFIRM: ${{ inputs.confirm }}
          CONFIG_ID: ${{ inputs.config_id }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          FOUNDER_ACTOR: dunkdee
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            status|audit|start|candidates) ;;
            configure)
              # Provisioning credentials is a mutation. Founder only.
              [ "$ACTOR" = "$FOUNDER_ACTOR" ] || { echo "configure requires the Founder actor"; exit 1; }
              [ "$TRIGGERING_ACTOR" = "$FOUNDER_ACTOR" ] || { echo "configure requires the Founder triggering actor"; exit 1; }
              test -n "$META_APP_ID" || { echo "META_APP_ID secret is missing"; exit 1; }
              test -n "$META_APP_SECRET" || { echo "META_APP_SECRET secret is missing"; exit 1; }
              # Optional, but when supplied it must be a bare numeric id: it is
              # interpolated into the payload, never into a shell command.
              if [ -n "$CONFIG_ID" ]; then
                [[ "$CONFIG_ID" =~ ^[0-9]{5,}$ ]] || { echo "config_id must be a numeric Facebook Login for Business configuration id"; exit 1; }
              fi
              ;;
            bind)
              [ "$CONFIRM" = "BIND META PAGE" ] || { echo "bind requires confirm to be exactly 'BIND META PAGE'"; exit 1; }
              # Numeric Facebook Page id. Rejects paths, flags and shell metacharacters.
              [[ "$PAGE_ID" =~ ^[0-9]{5,}$ ]] || { echo "bind requires a numeric Facebook Page id"; exit 1; }
              [ "$ACTOR" = "$FOUNDER_ACTOR" ] || { echo "bind requires the Founder actor"; exit 1; }
              [ "$TRIGGERING_ACTOR" = "$FOUNDER_ACTOR" ] || { echo "bind requires the Founder triggering actor"; exit 1; }
              ;;
            *) echo "unknown action: $ACTION"; exit 1 ;;
          esac
          echo "META_BINDING_ACTION=$ACTION"

      - name: Require protected VM access
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" || { echo "VM_HOST secret is missing"; exit 1; }
          test -n "$VM_USER" || { echo "VM_USER secret is missing"; exit 1; }
          test -n "$VM_SSH_KEY" || { echo "VM_SSH_KEY secret is missing"; exit 1; }

      - name: Prepare SSH
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/meta_key"
          chmod 600 "$HOME/.ssh/meta_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Run governed meta control on foundation-vm
        id: meta
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          ACTION: ${{ inputs.action }}
          PAGE_ID: ${{ inputs.page_id }}
          APPROVED_BY: ${{ github.actor }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          CONFIG_ID: ${{ inputs.config_id }}
        run: |
          set -euo pipefail
          remote_dir="/tmp/dominion_meta_binding_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          remote_script="$remote_dir/meta_control.sh"

          # Keep the script out of /tmp itself: the VM carries legacy top-level
          # Python files there that can shadow stdlib modules for helpers the
          # script invokes.
          ssh -i "$HOME/.ssh/meta_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "install -d -m 700 '$remote_dir'"

          scp -i "$HOME/.ssh/meta_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            scripts/dominion_publisher/meta_control.sh \
            "$VM_USER@$VM_HOST:$remote_script"

          if [ "$ACTION" = "configure" ]; then
            # The payload is built by python (correct JSON escaping) and piped
            # directly into ssh stdin, which the remote forwards to the
            # configure module. The secret is never an argument, never lands in
            # a file, and GitHub redacts it from logs regardless.
            set +e
            python3 -c 'import json,os,sys; sys.stdout.write(json.dumps({"app_id": os.environ["META_APP_ID"], "app_secret": os.environ["META_APP_SECRET"], "config_id": os.environ.get("CONFIG_ID", "")}))' \
              | ssh -i "$HOME/.ssh/meta_key" \
                -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
                "$VM_USER@$VM_HOST" \
                "bash '$remote_script' configure-stdin" \
                | tee meta-output.txt
            rc=${PIPESTATUS[1]}
            set -e
            ssh -i "$HOME/.ssh/meta_key" -o BatchMode=yes -o IdentitiesOnly=yes \
              "$VM_USER@$VM_HOST" "rm -rf -- '$remote_dir'" || true
            echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
            exit "$rc"
          fi

          set +e
          ssh -i "$HOME/.ssh/meta_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "ACTION='$ACTION' PAGE_ID='$PAGE_ID' APPROVED_BY='$APPROVED_BY' REMOTE_DIR='$remote_dir' REMOTE_SCRIPT='$remote_script' bash -s" <<'REMOTE' \
            | tee meta-output.txt
          set -uo pipefail
          cleanup() { rm -rf -- "$REMOTE_DIR"; }
          trap cleanup EXIT
          chmod 700 "$REMOTE_SCRIPT"

          case "$ACTION" in
            status)
              # Health only. Reports whether the Meta app is configured and
              # whether a Page is bound, without touching either.
              curl -fsS --max-time 10 http://127.0.0.1:5112/health \
                | python3 -m json.tool
              ;;
            audit)
              # Read-only. Answers one question: does a Meta app record already
              # exist in ANY candidate vault root? configure_meta.py defaults to
              # ~/.dominion/publisher/credential-vault while service.py defaults
              # to DB_PATH.parent/credential-vault, so a record written with
              # DOMINION_PUBLISHER_VAULT unset would be invisible to the service.
              # Only opens a vault that already has vault.json.enc, because
              # CredentialVault.__init__ creates the directory and a key.
              state_root="$HOME/.dominion/publisher"
              env_file="$state_root/runtime.env"
              effective="$(sed -n 's/^DOMINION_PUBLISHER_VAULT=//p' "$env_file" 2>/dev/null | head -1)"
              echo "RUNTIME_ENV_PRESENT=$([ -s "$env_file" ] && echo YES || echo NO)"
              echo "DOMINION_PUBLISHER_VAULT_SET=$([ -n "$effective" ] && echo YES || echo NO)"
              echo "EFFECTIVE_VAULT_ROOT=${effective:-<unset>}"
              cd "$state_root/runtime/release" || exit 30
              for root in "$effective" "$HOME/.dominion/publisher/credential-vault" "$HOME/DominionsArk/data/credential-vault"; do
                [ -n "$root" ] || continue
                enc="$root/vault.json.enc"
                if [ -f "$enc" ]; then
                  echo "VAULT_ROOT=$root enc=YES bytes=$(stat -c %s "$enc") mtime=$(stat -c %y "$enc")"
                  "$state_root/venv/bin/python" -c 'import sys;from apps.dominion_publisher.vault import CredentialVault;a=CredentialVault(sys.argv[1]).meta_app();print("  META_APP_RECORD=PRESENT app_id_suffix=%s configured_at=%s redirect=%s graph=%s"%(str(a.get("app_id",""))[-4:],a.get("configured_at"),a.get("redirect_uri"),a.get("graph_version")) if a else "  META_APP_RECORD=ABSENT")' "$root" || echo "  META_APP_RECORD=UNREADABLE"
                else
                  echo "VAULT_ROOT=$root dir=$([ -d "$root" ] && echo YES || echo NO) enc=NO"
                fi
              done
              ;;

            start)
              bash "$REMOTE_SCRIPT" start
              ;;
            candidates)
              bash "$REMOTE_SCRIPT" candidates
              ;;
            bind)
              bash "$REMOTE_SCRIPT" bind "$PAGE_ID" "$APPROVED_BY"
              ;;
          esac
          rc=$?
          echo "META_CONTROL_EXIT=$rc"
          exit $rc
          REMOTE
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Upload meta binding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-meta-binding-evidence
          path: meta-output.txt
          if-no-files-found: warn

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/meta_key" "$HOME/.ssh/known_hosts"
