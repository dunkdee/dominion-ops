name: Integrity Installation Contract

on:
  pull_request:
    paths:
      - 'governance/integrity_installation_contract.json'
      - 'scripts/validate_integrity_installation_contract.py'
      - 'tests/test_integrity_installation_contract.py'
      - 'docs/INTEGRITY_INSTALLATION_CHECKLIST.md'
  push:
    branches: [main]
    paths:
      - 'governance/integrity_installation_contract.json'
      - 'scripts/validate_integrity_installation_contract.py'
      - 'tests/test_integrity_installation_contract.py'
      - 'docs/INTEGRITY_INSTALLATION_CHECKLIST.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_integrity_installation_contract.py
      - run: python -m pytest -q tests/test_integrity_installation_contract.py
