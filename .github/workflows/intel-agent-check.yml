name: Intel Agent Diagnostic

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose dominion-intel agent on VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          timeout: 60s
          script: |
            echo "====== SERVICE FILE ======"
            cat /etc/systemd/system/dominion-intel.service 2>/dev/null || echo "SERVICE FILE NOT FOUND"

            echo ""
            echo "====== SERVICE STATUS ======"
            systemctl status dominion-intel.service 2>&1 || true

            echo ""
            echo "====== LAST 30 JOURNAL LINES ======"
            journalctl -u dominion-intel.service -n 30 --no-pager 2>&1 || echo "no journal entries"

            echo ""
            echo "====== PYTHON FILE (first 120 lines) ======"
            head -120 ~/buddy_core/agents/dominion_intel_trading.py 2>/dev/null || echo "FILE NOT FOUND"

            echo ""
            echo "====== BUDDY_CORE AGENTS DIR ======"
            ls -la ~/buddy_core/agents/ 2>/dev/null || echo "DIR NOT FOUND"

            echo ""
            echo "====== GEMINI SERVER STATUS ======"
            systemctl status gemini-server.service 2>&1 | head -20 || true

            echo ""
            echo "====== ALL INTEL/BUDDY RELATED PROCESSES ======"
            ps aux | grep -iE "intel|buddy|gemini|dominion_intel" | grep -v grep || echo "none running"

            echo ""
            echo "====== ALPHA ENGINE HEALTH ======"
            curl -sf http://localhost:8787/health 2>/dev/null || echo "alpha engine not responding"
