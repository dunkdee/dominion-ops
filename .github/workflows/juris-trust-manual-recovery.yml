name: Juris Trust Recovery
run-name: Juris trust recovery

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type exactly RECOVER to authorize the one-time private transfer
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: juris-trust-manual-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ inputs.confirm == 'RECOVER' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RECOVERY_DIR: /tmp/juris-trust-private-recovery
      REPORT_BRANCH: audit/juris-recovery-runtime-20260721
      REPORT_PATH: .github/recovery/juris-run-report.json
      ARTIFACT_NAME: juris-trust-case-private-recovery

    steps:
      - name: Publish run start pointer
        uses: actions/github-script@v7
        env:
          RUN_STATE: started
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: context.sha,
              });
            }
            let existingSha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              existingSha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const report = {
              artifact_name: process.env.ARTIFACT_NAME,
              commit_sha: context.sha,
              event: context.eventName,
              run_id: context.runId,
              run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              status: process.env.RUN_STATE,
              workflow: context.workflow,
            };
            const request = {
              owner,
              repo,
              path,
              branch,
              message: `audit: Juris recovery run ${context.runId} started`,
              content: Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64'),
            };
            if (existingSha) request.sha = existingSha;
            await github.rest.repos.createOrUpdateFileContents(request);

      - name: Validate VM connection secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Configure strict SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer only the verified Juris trust case
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          umask 077
          rm -rf "$RECOVERY_DIR"
          install -d -m 700 "$RECOVERY_DIR"
          ssh \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VM_USER@$VM_HOST" 'python3 -' \
            > "$RECOVERY_DIR/trust_Dewayne_L_Singleton_20260414_084645.txt" <<'PY'
          import hashlib
          import stat
          import sys
          from pathlib import Path

          expected_name = "trust_Dewayne_L_Singleton_20260414_084645.txt"
          expected_size = 9299
          expected_sha256 = "e45cb33b478df63e0edeba3a4a69882317bfe1786ee53e8266c20de32e0d8f77"
          cases_root = (Path.home() / "dominion" / "agents" / "juris" / "cases").resolve(strict=True)
          candidate = cases_root / expected_name
          if candidate.is_symlink():
              raise SystemExit("Refusing symlinked case file")
          target = candidate.resolve(strict=True)
          if target.parent != cases_root:
              raise SystemExit("Resolved case file escaped the authorized directory")
          metadata = target.stat()
          if not stat.S_ISREG(metadata.st_mode):
              raise SystemExit("Authorized case path is not a regular file")
          data = target.read_bytes()
          if len(data) != expected_size:
              raise SystemExit("Authorized case size no longer matches inventory")
          if hashlib.sha256(data).hexdigest() != expected_sha256:
              raise SystemExit("Authorized case hash no longer matches inventory")
          sys.stdout.buffer.write(data)
          PY
          printf '%s  %s\n' \
            'e45cb33b478df63e0edeba3a4a69882317bfe1786ee53e8266c20de32e0d8f77' \
            "$RECOVERY_DIR/trust_Dewayne_L_Singleton_20260414_084645.txt" \
            | sha256sum --check --status
          test "$(wc -c < "$RECOVERY_DIR/trust_Dewayne_L_Singleton_20260414_084645.txt")" -eq 9299

      - name: Upload 1-day private recovery artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.RECOVERY_DIR }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          include-hidden-files: false

      - name: Remove temporary runner copies
        if: ${{ always() }}
        run: |
          set -eu
          rm -rf "$RECOVERY_DIR"
          rm -f ~/.ssh/id_vm ~/.ssh/known_hosts

      - name: Publish terminal run status
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          RUN_STATE: ${{ job.status }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            let existingSha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              existingSha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const report = {
              artifact_name: process.env.ARTIFACT_NAME,
              commit_sha: context.sha,
              event: context.eventName,
              run_id: context.runId,
              run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              status: process.env.RUN_STATE,
              workflow: context.workflow,
            };
            const request = {
              owner,
              repo,
              path,
              branch,
              message: `audit: Juris recovery run ${context.runId} ${process.env.RUN_STATE}`,
              content: Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64'),
            };
            if (existingSha) request.sha = existingSha;
            await github.rest.repos.createOrUpdateFileContents(request);
