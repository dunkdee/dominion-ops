name: One-time Juris trust-project file recovery

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/juris-trust-recovery.yml"

permissions:
  contents: read

concurrency:
  group: juris-trust-project-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate VM connection secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Configure pinned-host SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Locate authorized Juris trust-project file metadata
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            "$VM_USER@$VM_HOST" 'python3 -' <<'PY'
          import hashlib
          import os
          import re
          import stat
          from pathlib import Path

          home = Path.home().resolve()
          roots = [
              home / "dominion" / "agents" / "juris",
              home / "buddy_core" / "agents" / "juris",
              home / "buddy_core" / "checkpoints" / "juris",
          ]
          allowed = {
              ".py", ".json", ".md", ".txt", ".yaml", ".yml",
              ".pdf", ".doc", ".docx", ".odt", ".rtf",
          }
          name_pattern = re.compile(
              r"trust|primal|dominion|legacy|settlor|grantor|trustee|"
              r"beneficiar|certificate|declaration|schedule|agreement|"
              r"indenture|memorandum",
              re.IGNORECASE,
          )
          matches = []
          for root in roots:
              if not root.is_dir():
                  continue
              for directory, directory_names, file_names in os.walk(
                  root, followlinks=False
              ):
                  directory_path = Path(directory)
                  directory_names[:] = [
                      name
                      for name in directory_names
                      if not (directory_path / name).is_symlink()
                      and name not in {".git", "__pycache__", "node_modules"}
                  ]
                  for file_name in file_names:
                      path = directory_path / file_name
                      try:
                          metadata = path.lstat()
                      except OSError:
                          continue
                      if not stat.S_ISREG(metadata.st_mode):
                          continue
                      if path.suffix.casefold() not in allowed:
                          continue
                      relative = path.relative_to(home).as_posix()
                      if not name_pattern.search(relative):
                          continue
                      digest = None
                      if metadata.st_size <= 25 * 1024 * 1024:
                          hasher = hashlib.sha256()
                          try:
                              with path.open("rb") as source:
                                  for chunk in iter(
                                      lambda: source.read(1024 * 1024), b""
                                  ):
                                      hasher.update(chunk)
                              digest = hasher.hexdigest()
                          except OSError:
                              pass
                      matches.append((relative, metadata.st_size, digest))

          if len(matches) > 500:
              raise SystemExit("Juris metadata match count exceeded safety cap")
          print("JURIS_PROJECT_FILE_MATCHES_BEGIN")
          for relative, size, digest in sorted(matches):
              print(
                  f"{relative}\t{size}\t"
                  f"{digest or 'UNREADABLE_OR_TOO_LARGE'}"
              )
          print("JURIS_PROJECT_FILE_MATCHES_END")
          print(f"JURIS_PROJECT_FILE_MATCH_COUNT={len(matches)}")
          PY
