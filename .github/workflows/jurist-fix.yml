name: Jurist Repair — Governed Service Recovery

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REPAIR JURIST"
        required: true
        type: string
      commit_sha:
        description: "Exact 40-character main commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read

jobs:
  fix:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'REPAIR JURIST' &&
      inputs.commit_sha == github.sha &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Repair Jurist service and fast-forward baby-api source
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 5m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail

            echo "=============================="
            echo "  JURIST SERVICE ERROR LOGS"
            echo "=============================="
            journalctl -u dominion-juris -n 30 --no-pager 2>/dev/null || true

            echo ""
            echo "=============================="
            echo "  CHECK PYTHON DEPS FOR JURIST"
            echo "=============================="
            python3 -c "import dotenv; print('dotenv OK')"
            python3 -c "import requests; print('requests OK')"
            python3 -c "import http.server; print('http.server OK')"
            python3 -c "import sys; sys.path.insert(0, '/home/$USER/buddy_core'); from core.juris_protocol import JurisProtocol; print('JurisProtocol OK')"

            echo ""
            echo "=============================="
            echo "  VERIFY + FAST-FORWARD SOURCE"
            echo "=============================="
            cd ~/dominion-ops
            test -z "$(git status --porcelain)" || { echo "REFUSE: production worktree is dirty"; exit 31; }
            branch="$(git branch --show-current)"
            if [ -n "$branch" ] && [ "$branch" != "main" ]; then
              echo "REFUSE: production repo is on an unexpected branch"; exit 32
            fi
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$EXPECTED_SHA" || { echo "REFUSE: requested SHA does not equal origin/main"; exit 33; }
            if [ "$branch" = "main" ]; then
              git merge --ff-only origin/main
            else
              test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo "REFUSE: detached production HEAD is not exact requested SHA"; exit 32; }
            fi
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo "REFUSE: deployed provenance mismatch"; exit 34; }
            echo "DEPLOY_PROVENANCE=PASS sha=$EXPECTED_SHA"

            echo ""
            echo "=============================="
            echo "  RESTART JURIST SERVICE"
            echo "=============================="
            sudo systemctl restart dominion-juris
            sleep 4
            sudo systemctl is-active --quiet dominion-juris

            echo ""
            echo "=============================="
            echo "  REBUILD + RESTART BABY-API"
            echo "=============================="
            docker compose up -d --build baby-api
            sleep 20

            echo ""
            echo "=============================="
            echo "  TEST /ask/juris ENDPOINT"
            echo "=============================="
            curl --fail --silent --show-error http://localhost:8080/ask/juris | python3 -m json.tool

            echo "JURIST_REPAIR=PASS"
