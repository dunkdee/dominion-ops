name: Meta Candidate Snapshot

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  candidates:
    if: >-
      github.event.issue.number == 305 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'RUN_META_CANDIDATES:')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: foundation-vm-production
    concurrency:
      group: foundation-vm-production
      cancel-in-progress: false
    steps:
      - name: Prove owner-authorized Meta candidate boundary
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$ISSUE_NUMBER" = "305" || { echo "ERROR: Meta candidate snapshot must originate from issue 305"; exit 1; }
          test "$COMMENT_USER" = "$REPOSITORY_OWNER" || { echo "ERROR: Meta candidate snapshot actor is not repository owner"; exit 1; }
          test "$AUTHOR_ASSOCIATION" = "OWNER" || { echo "ERROR: Meta candidate snapshot lacks OWNER association"; exit 1; }
          main_sha="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/main" | jq -r '.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: unable to resolve current main SHA"; exit 1; }
          expected="RUN_META_CANDIDATES:$main_sha"
          test "$COMMENT_BODY" = "$expected" || {
            echo "ERROR: Meta candidate snapshot authorization is not bound to current main"
            echo "expected_token=$expected"
            exit 1
          }
          echo "META_CANDIDATES_AUTHORIZATION=PASS actor=$COMMENT_USER issue=$ISSUE_NUMBER main_sha=$main_sha"

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Require Foundation VM connection material
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" || { echo "ERROR: VM_HOST is not configured"; exit 1; }
          test -n "$VM_USER" || { echo "ERROR: VM_USER is not configured"; exit 1; }
          test -n "$VM_SSH_KEY" || { echo "ERROR: VM_SSH_KEY is not configured"; exit 1; }
          test -n "$VM_SSH_KNOWN_HOSTS" || { echo "ERROR: VM_SSH_KNOWN_HOSTS is not configured"; exit 1; }

      - name: Prepare pinned SSH trust
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          grep -Eq '^foundation-vm[[:space:]]+(ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa)[[:space:]]+' "$HOME/.ssh/known_hosts" || {
            echo "ERROR: VM_SSH_KNOWN_HOSTS must contain a foundation-vm host-key alias entry"
            exit 1
          }
          ssh-keygen -l -f "$HOME/.ssh/known_hosts" >/dev/null
          echo "FOUNDATION_VM_HOST_IDENTITY=PINNED alias=foundation-vm"

      - name: Read sanitized Meta binding candidates
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          remote_dir="/tmp/dominion_meta_candidates_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          remote_script="$remote_dir/meta_control.sh"
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o HostKeyAlias=foundation-vm -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" "install -d -m 700 '$remote_dir'"
          scp -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o HostKeyAlias=foundation-vm -o StrictHostKeyChecking=yes \
            scripts/dominion_publisher/meta_control.sh \
            "$VM_USER@$VM_HOST:$remote_script"

          set +e
          output="$(ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o HostKeyAlias=foundation-vm -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "chmod 700 '$remote_script' && bash '$remote_script' candidates")"
          rc=$?
          set -e
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o HostKeyAlias=foundation-vm -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" "rm -rf -- '$remote_dir'" || true
          test "$rc" -eq 0 || { printf '%s\n' "$output"; exit "$rc"; }

          python3 - "$output" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          candidates = payload.get("candidates")
          if not isinstance(candidates, list):
              raise SystemExit("ERROR: candidates response must contain a list")
          allowed = {"page_id", "page_name", "instagram_account_id", "tasks"}
          safe = []
          for item in candidates:
              if not isinstance(item, dict):
                  raise SystemExit("ERROR: candidate entry must be an object")
              unexpected = set(item) - allowed
              if unexpected:
                  raise SystemExit(f"ERROR: unsafe candidate fields returned: {sorted(unexpected)}")
              page_id = str(item.get("page_id", "")).strip()
              page_name = str(item.get("page_name", "")).strip()
              if not page_id or not page_name:
                  raise SystemExit("ERROR: candidate missing page_id or page_name")
              safe.append({
                  "page_id": page_id,
                  "page_name": page_name,
                  "instagram_account_id": item.get("instagram_account_id"),
                  "tasks": list(item.get("tasks", [])),
              })
          print(f"META_CANDIDATES_RECEIPT=PASS count={len(safe)}")
          print(json.dumps({"candidates": safe}, sort_keys=True))
          PY

      - name: Cleanup temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
