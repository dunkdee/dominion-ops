name: Governed Meta Configure Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  configure:
    if: >-
      github.event.issue.number == 305 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'RUN_META_CONFIGURE:')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: foundation-vm-production
    concurrency:
      group: foundation-vm-production
      cancel-in-progress: false

    steps:
      - name: Prove owner-authorized Meta configure boundary
        id: auth
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ISSUE_NUMBER" = "305" || { echo "ERROR: Meta configure must originate from issue 305"; exit 1; }
          test "$COMMENT_USER" = "$REPOSITORY_OWNER" || { echo "ERROR: Meta configure actor is not repository owner"; exit 1; }
          test "$AUTHOR_ASSOCIATION" = "OWNER" || { echo "ERROR: Meta configure lacks OWNER association"; exit 1; }

          main_sha="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/main" | jq -r '.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: unable to resolve current main SHA"; exit 1; }

          prefix="RUN_META_CONFIGURE:$main_sha:"
          [[ "$COMMENT_BODY" == "$prefix"* ]] || {
            echo "ERROR: Meta configure authorization is not bound to current main"
            echo "expected_prefix=$prefix"
            exit 1
          }
          config_id="${COMMENT_BODY#"$prefix"}"
          [[ "$config_id" =~ ^[0-9]{5,}$ ]] || { echo "ERROR: config_id must be a bare numeric Facebook Login for Business configuration id"; exit 1; }
          test "$COMMENT_BODY" = "$prefix$config_id" || { echo "ERROR: Meta configure command has unexpected trailing content"; exit 1; }

          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "config_id=$config_id" >> "$GITHUB_OUTPUT"
          echo "META_CONFIGURE_AUTHORIZATION=PASS actor=$COMMENT_USER issue=$ISSUE_NUMBER main_sha=$main_sha config_id=$config_id"

      - name: Checkout exact authorized source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.auth.outputs.main_sha }}
          fetch-depth: 1

      - name: Require protected connection and Meta secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_HOST" || { echo "ERROR: VM_HOST is not configured"; exit 1; }
          test -n "$VM_USER" || { echo "ERROR: VM_USER is not configured"; exit 1; }
          test -n "$VM_SSH_KEY" || { echo "ERROR: VM_SSH_KEY is not configured"; exit 1; }
          test -n "$VM_SSH_KNOWN_HOSTS" || { echo "ERROR: VM_SSH_KNOWN_HOSTS is not configured"; exit 1; }
          test -n "$META_APP_ID" || { echo "ERROR: META_APP_ID is not configured"; exit 1; }
          test -n "$META_APP_SECRET" || { echo "ERROR: META_APP_SECRET is not configured"; exit 1; }

      - name: Prepare pinned SSH trust
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          grep -Eq '^foundation-vm[[:space:]]+(ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa)[[:space:]]+' "$HOME/.ssh/known_hosts" || {
            echo "ERROR: VM_SSH_KNOWN_HOSTS must contain a foundation-vm host-key alias entry"
            exit 1
          }
          ssh-keygen -l -f "$HOME/.ssh/known_hosts" >/dev/null
          echo "FOUNDATION_VM_HOST_IDENTITY=PINNED alias=foundation-vm"

      - name: Configure new Login for Business configuration and prove generated URL
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          CONFIG_ID: ${{ steps.auth.outputs.config_id }}
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="/tmp/dominion_meta_configure_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          remote_script="$remote_dir/meta_control.sh"
          cleanup() {
            ssh -i "$HOME/.ssh/foundation_vm_key" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o HostKeyAlias=foundation-vm -o StrictHostKeyChecking=yes \
              "$VM_USER@$VM_HOST" "rm -rf -- '$remote_dir'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o HostKeyAlias=foundation-vm -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" "install -d -m 700 '$remote_dir'"
          scp -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o HostKeyAlias=foundation-vm -o StrictHostKeyChecking=yes \
            scripts/dominion_publisher/meta_control.sh \
            "$VM_USER@$VM_HOST:$remote_script"

          set +e
          python3 -c 'import json,os,sys; sys.stdout.write(json.dumps({"app_id":os.environ["META_APP_ID"],"app_secret":os.environ["META_APP_SECRET"],"config_id":os.environ["CONFIG_ID"]}))' \
            | ssh -i "$HOME/.ssh/foundation_vm_key" \
                -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
                -o HostKeyAlias=foundation-vm -o StrictHostKeyChecking=yes \
                "$VM_USER@$VM_HOST" \
                "chmod 700 '$remote_script' && bash '$remote_script' configure-stdin" \
            | tee meta-configure-output.txt
          rc=${PIPESTATUS[1]}
          set -e
          test "$rc" -eq 0 || exit "$rc"
          grep -Eq '^META_APP_CONFIGURED=PASS .*login_flow=business$' meta-configure-output.txt

          output="$(ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o HostKeyAlias=foundation-vm -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "bash '$remote_script' start")"
          printf '%s\n' "$output" | tee -a meta-configure-output.txt
          grep -Fxq 'META_BINDING_START=PASS' <<< "$output"
          authorization_url="$(sed -n 's/^AUTHORIZATION_URL=//p' <<< "$output" | head -1)"
          expires="$(sed -n 's/^EXPIRES_IN_SECONDS=//p' <<< "$output" | head -1)"

          python3 - "$authorization_url" "$expires" "$CONFIG_ID" <<'PY'
          import sys
          from urllib.parse import parse_qs, urlparse

          url, expires, expected_config = sys.argv[1:]
          parsed = urlparse(url)
          assert parsed.scheme == "https"
          assert parsed.netloc == "www.facebook.com"
          params = parse_qs(parsed.query)
          assert params.get("redirect_uri", [""])[0] == "https://dominionhealing.org/oauth/meta/callback"
          assert params.get("response_type", [""])[0] == "code"
          assert params.get("config_id", [""])[0] == expected_config
          assert params.get("override_default_response_type", [""])[0] == "true"
          assert params.get("state", [""])[0]
          assert expires.isdigit() and 0 < int(expires) <= 600
          print(f"META_CONFIGURE_RECEIPT=PASS config_id={expected_config} expires_in_seconds={expires}")
          PY

      - name: Upload redacted Meta configure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: meta-configure-evidence
          path: meta-configure-output.txt
          if-no-files-found: warn

      - name: Cleanup temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
