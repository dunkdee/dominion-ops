name: Model Gateway CI

on:
  pull_request:
    paths:
      - 'apps/command-center/model_gateway.py'
      - 'apps/command-center/intelligence.py'
      - 'config/model-routes.example.json'
      - 'tests/test_model_gateway.py'
      - '.github/workflows/model-gateway-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/command-center/model_gateway.py'
      - 'apps/command-center/intelligence.py'
      - 'config/model-routes.example.json'
      - 'tests/test_model_gateway.py'
      - '.github/workflows/model-gateway-ci.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run gateway tests
        run: python -m unittest tests.test_model_gateway -v
