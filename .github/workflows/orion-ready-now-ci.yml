name: ORION Ready-Now Staging Checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'systems/orion-extreme-v3/READY_NOW.md'
      - 'systems/orion-extreme-v3/scripts/**'

jobs:
  validate-staging-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile systems/orion-extreme-v3/scripts/configure_telegram.py
      - run: bash -n systems/orion-extreme-v3/scripts/ready_now.sh
      - run: test -s systems/orion-extreme-v3/READY_NOW.md
      - run: echo 'Core runtime validation is recorded in the delivered ORION_READY_NOW_V3_3 artifact (33/33 tests plus doctor PASS).'
