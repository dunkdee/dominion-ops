name: PR235 Approval Auth Final Closure

on:
  push:
    branches:
      - governance/elite-end-to-end-remediation

permissions:
  contents: write

jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: governance/elite-end-to-end-remediation
          fetch-depth: 0

      - name: Verify lineage and staged patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor d082988fd32fc394c3da904ec91e4a2dc9f47d0a HEAD
          test -f .github/scripts/pr235_approval_auth_final_patch.py
          test -z "$(git status --porcelain)"

      - name: Apply current independent-review closures
        shell: bash
        run: |
          set -Eeuo pipefail
          python .github/scripts/pr235_approval_auth_final_patch.py
          rm -f .github/workflows/pr235-approval-auth-final.yml
          git diff --check
          test ! -e .github/scripts/pr235_approval_auth_final_patch.py
          test ! -e .github/workflows/pr235-approval-auth-final.yml

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run focused authority and review regressions
        run: |
          python -m pytest -q \
            tests/test_pr235_approval_auth_boundary.py \
            tests/test_pr235_final_authority_closure.py \
            tests/test_watchmen_review_closure.py \
            tests/test_pr235_final_review_round2.py \
            tests/test_buddy_phone_login.py \
            tests/test_buddy_authority_execution.py

      - name: Run Elite Governance validator
        run: python scripts/validate_elite_governance.py

      - name: Run full repository Python suite
        run: python -m pytest -q

      - name: Publish exact tested source
        shell: bash
        run: |
          set -Eeuo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: require real auth for Founder approval resume"
          git push origin HEAD:governance/elite-end-to-end-remediation
          echo "FINAL_SHA=$(git rev-parse HEAD)"
