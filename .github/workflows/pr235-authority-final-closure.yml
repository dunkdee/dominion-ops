name: PR235 Final Authority Review Closure

on:
  push:
    branches:
      - governance/elite-end-to-end-remediation

permissions:
  contents: write

jobs:
  close-final-authority-findings:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: governance/elite-end-to-end-remediation
          fetch-depth: 0

      - name: Verify bounded helper-only delta
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 55545be0fc12d7fac77dab6b0f954b6bef356542 HEAD
          unexpected="$(git diff --name-only 55545be0fc12d7fac77dab6b0f954b6bef356542 HEAD | grep -vE '^\.github/(scripts/pr235_authority_closure_patch\.py|workflows/pr235-authority-final-closure\.yml)$' || true)"
          test -z "$unexpected" || { printf 'Unexpected helper delta:\n%s\n' "$unexpected"; exit 41; }
          test -z "$(git status --porcelain)"

      - name: Apply three independent-review closures
        run: python .github/scripts/pr235_authority_closure_patch.py

      - name: Install repository test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run focused final regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q \
            tests/test_pr235_final_authority_closure.py \
            tests/test_buddy_authority_execution.py \
            tests/test_watchmen_review_closure.py \
            tests/test_watchmen_audit_state.py \
            tests/test_watchmen_audit_failclosed.py \
            tests/test_radah_autopilot.py

      - name: Run Elite Governance validator
        run: python scripts/validate_elite_governance.py

      - name: Run full repository Python suite
        run: python -m pytest -q

      - name: Publish exact tested closure
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test ! -e .github/scripts/pr235_authority_closure_patch.py
          test ! -e .github/workflows/pr235-authority-final-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close final authority durability findings"
          git push origin HEAD:governance/elite-end-to-end-remediation
          echo "FINAL_SHA=$(git rev-parse HEAD)"
