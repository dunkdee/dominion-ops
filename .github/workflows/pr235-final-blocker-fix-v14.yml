name: PR235 Final Blocker Closure V14

on:
  push:
    branches:
      - governance/elite-end-to-end-remediation

permissions:
  contents: write

jobs:
  close-final-review-blockers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: governance/elite-end-to-end-remediation
          fetch-depth: 0

      - name: Verify lineage
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 5b6a9baa8aed9deefbb6a61f4b17bc36ce643e99 HEAD
          test -z "$(git status --porcelain)"

      - name: Apply bounded final review fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, value):
              Path(path).write_text(value, encoding="utf-8")

          def replace_once(path, old, new):
              value = read(path)
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:140]!r}")
              write(path, value.replace(old, new, 1))

          # 1) External delivery must bind to meaningful capability-specific
          # receipt evidence AND the tamper-evident Saraqael chain before VERIFIED.
          p = "buddy_core/core/operator.py"
          replace_once(
              p,
              '''try:
              from core.authorization import AuthorizationError, AuthorizationLedger, payload_fingerprint
          except ImportError:  # standalone runtime vs canonical repo import path
              from buddy_core.core.authorization import AuthorizationError, AuthorizationLedger, payload_fingerprint
          ''',
              '''try:
              from core.authorization import AuthorizationError, AuthorizationLedger, payload_fingerprint
          except ImportError:  # standalone runtime vs canonical repo import path
              from buddy_core.core.authorization import AuthorizationError, AuthorizationLedger, payload_fingerprint

          try:
              from watchmen.saraqael import log as governed_audit_log
          except ImportError:  # repository/package execution used by CI/tests
              from buddy_core.watchmen.saraqael import log as governed_audit_log
          ''',
          )

          marker = '''    def _execute_external(self, index: int, step: dict, cap: dict, context: dict,
                            authorization: dict) -> dict:
          '''
          helper = '''    @staticmethod
              def _validate_delivery_evidence(capability: str, evidence: Any) -> tuple[bool, str | None]:
                  """Require a real capability-specific receipt plus provenance and observation time.

                  A truthy dict, URL, or error object is not a delivery receipt.  At least one
                  evidence item must carry a recognized receipt identifier, source/platform
                  provenance, and a timestamp.  This is intentionally fail-closed.
                  """
                  if not isinstance(evidence, list) or not evidence:
                      return False, None

                  receipt_keys = {
                      "external.publish": ("platform_receipt_id", "publication_id", "post_id", "receipt_id"),
                      "external.message": ("send_receipt_id", "message_id", "receipt_id"),
                      "external.spend": ("financial_receipt_id", "transaction_id", "payment_id", "receipt_id"),
                      "external.submit": ("submission_receipt_id", "submission_id", "receipt_id"),
                      "external.browser": ("browser_action_id", "action_id", "receipt_id"),
                      "external.credential_or_network": ("change_receipt_id", "change_id", "receipt_id"),
                  }.get(capability, ("receipt_id",))
                  provenance_keys = ("platform", "provider", "system", "source")
                  time_keys = ("observed_at", "delivered_at", "timestamp", "created_at")

                  for item in evidence:
                      if not isinstance(item, dict) or not item:
                          continue
                      receipt_id = next(
                          (str(item.get(key)).strip() for key in receipt_keys if str(item.get(key) or "").strip()),
                          None,
                      )
                      provenance = next(
                          (str(item.get(key)).strip() for key in provenance_keys if str(item.get(key) or "").strip()),
                          None,
                      )
                      observed_at = next(
                          (str(item.get(key)).strip() for key in time_keys if str(item.get(key) or "").strip()),
                          None,
                      )
                      if receipt_id and provenance and observed_at:
                          if capability == "external.credential_or_network":
                              required = ("before_state", "after_state", "verification", "rollback_receipt")
                              if not all(item.get(field) not in (None, "", {}, []) for field in required):
                                  continue
                          return True, receipt_id
                  return False, None

              def _execute_external(self, index: int, step: dict, cap: dict, context: dict,
                            authorization: dict) -> dict:
          '''
          replace_once(p, marker, helper)

          replace_once(
              p,
              '''        evidence = outcome.get("evidence")
                  if not (isinstance(evidence, list) and evidence and
                          all(isinstance(item, dict) and bool(item) for item in evidence)):
                      return {**base, "status": "DELIVERED_UNVERIFIED",
                              "errors": [{"attempt": 1, "error": "DeliveryEvidenceMissing",
                                          "detail": "delivery occurred but governed delivery evidence is absent or malformed"}],
                              "result": outcome.get("result"),
                              "evidence": evidence if isinstance(evidence, list) else []}

                  try:
                      audit("external_action_executed", {
                          "capability": step["capability"],
                          "approval_id": authorization.get("approval_id"),
                          "destination": step.get("destination"),
                          "payload_hash": authorization.get("payload_hash"),
                      })
                  except Exception as exc:
                      return {**base, "status": "DELIVERED_AUDIT_UNAVAILABLE",
                              "errors": [{"attempt": 1, "error": "PostDeliveryAuditUnavailable",
                                          "detail": type(exc).__name__}],
                              "result": outcome.get("result"), "evidence": evidence}

                  return {**base, "status": "VERIFIED", "errors": [],
                          "result": outcome.get("result"), "evidence": evidence}
          ''',
              '''        evidence = outcome.get("evidence")
                  evidence_ok, receipt_id = self._validate_delivery_evidence(
                      step["capability"], evidence
                  )
                  if not evidence_ok:
                      return {**base, "status": "DELIVERED_UNVERIFIED",
                              "errors": [{"attempt": 1, "error": "DeliveryEvidenceMissing",
                                          "detail": "delivery occurred but no capability-specific receipt with provenance and timestamp was present"}],
                              "result": outcome.get("result"),
                              "evidence": evidence if isinstance(evidence, list) else []}

                  evidence_hash = hashlib.sha256(
                      json.dumps(evidence, sort_keys=True, ensure_ascii=True, separators=(",", ":")).encode("utf-8")
                  ).hexdigest()
                  try:
                      governed_entry = governed_audit_log(
                          "buddy_operator",
                          "external_action_executed",
                          "ok",
                          {
                              "capability": step["capability"],
                              "approval_id": authorization.get("approval_id"),
                              "destination": step.get("destination"),
                              "payload_hash": authorization.get("payload_hash"),
                              "delivery_receipt_id": receipt_id,
                              "delivery_evidence_sha256": evidence_hash,
                          },
                      )
                  except Exception as exc:
                      return {**base, "status": "DELIVERED_AUDIT_UNAVAILABLE",
                              "errors": [{"attempt": 1, "error": "PostDeliveryAuditUnavailable",
                                          "detail": type(exc).__name__}],
                              "result": outcome.get("result"), "evidence": evidence}

                  audit_ref = {
                      "seq": governed_entry.get("seq"),
                      "hash": governed_entry.get("hash"),
                      "event": governed_entry.get("event"),
                  }
                  return {**base, "status": "VERIFIED", "errors": [],
                          "result": outcome.get("result"), "evidence": evidence,
                          "governed_audit": audit_ref}
          ''',
          )

          # 2) Rollback restore must stop immediately if returning to PREVIOUS_SHA
          # fails. Never clean/apply patches on the wrong commit.
          p = "scripts/deploy_foundation_vm_remote.sh"
          replace_once(
              p,
              '''  set +e
              # Move HEAD and worktree back to the previous release. `switch --detach`
              # without --force refuses on unexpected drift instead of destroying it,
              # which is the fail-closed behaviour governance requires.
              git switch --detach --quiet "$PREVIOUS_SHA"
              git clean -fdq

              if [ -s "$LOCAL_STATE_BACKUP/index.patch" ]; then
                git apply --index --binary --whitespace=nowarn "$LOCAL_STATE_BACKUP/index.patch"
                rc=$?
              fi
          ''',
              '''  set +e
              # Move HEAD and worktree back to the previous release. `switch --detach`
              # without --force refuses on unexpected drift instead of destroying it.
              # A failed switch is terminal for restore: do not clean or apply state on
              # an unknown commit.
              restore_output="$(git switch --detach --quiet "$PREVIOUS_SHA" 2>&1)"
              rc=$?
              if [ "$rc" -eq 0 ]; then
                clean_output="$(git clean -fdq 2>&1)"
                rc=$?
                if [ -n "$clean_output" ]; then
                  restore_output="${restore_output};${clean_output}"
                fi
              fi

              if [ "$rc" -eq 0 ] && [ -s "$LOCAL_STATE_BACKUP/index.patch" ]; then
                restore_output="$(git apply --index --binary --whitespace=nowarn "$LOCAL_STATE_BACKUP/index.patch" 2>&1)"
                rc=$?
              fi
          ''',
          )

          # 3) Update the existing valid-delivery regression so its evidence is a
          # real governed platform receipt, not just a URL, and assert audit binding.
          p = "tests/test_buddy_authority_execution.py"
          replace_once(p, "import unittest\n", "import unittest\nfrom unittest import mock\n")
          replace_once(
              p,
              '''            return {"delivered": True,
                              "result": {"posted": True, "url": "https://example.invalid/p/1"},
                              "evidence": [{"url": "https://example.invalid/p/1"}]}
          ''',
              '''            return {"delivered": True,
                              "result": {"posted": True, "url": "https://example.invalid/p/1"},
                              "evidence": [{
                                  "platform_receipt_id": "post_123",
                                  "platform": "example.invalid",
                                  "observed_at": "2026-09-05T04:30:00Z",
                                  "url": "https://example.invalid/p/1",
                              }]}
          ''',
          )
          replace_once(
              p,
              '''        record = self.run_plan(authorization_id=held["approval_id"])
                  self.assertEqual(record["status"], "COMPLETE")
                  receipt = self.last(record)
                  self.assertEqual(receipt["status"], "VERIFIED")
                  self.assertTrue(receipt["result"]["posted"])
          ''',
              '''        with mock.patch(
                      "core.operator.governed_audit_log",
                      return_value={"seq": 9, "hash": "a" * 64, "event": "external_action_executed"},
                  ) as governed_audit:
                      record = self.run_plan(authorization_id=held["approval_id"])
                  self.assertEqual(record["status"], "COMPLETE")
                  receipt = self.last(record)
                  self.assertEqual(receipt["status"], "VERIFIED")
                  self.assertTrue(receipt["result"]["posted"])
                  self.assertEqual(receipt["governed_audit"]["seq"], 9)
                  governed_audit.assert_called_once()
          ''',
          )

          insert_before = '''    def test_every_declared_external_capability_has_a_bound_executor(self):
          '''
          new_tests = '''    def test_error_object_is_not_accepted_as_delivery_receipt(self):
                  def deliver(step, context):
                      return {
                          "delivered": True,
                          "result": {"posted": True},
                          "evidence": [{"error": "receipt unavailable"}],
                      }

                  self.operator._external_executors["external:publish"] = deliver
                  held = self.run_plan()["held"]
                  self.ledger.grant(held["approval_id"])
                  record = self.run_plan(authorization_id=held["approval_id"])
                  self.assertEqual(record["status"], "BLOCKED")
                  receipt = self.last(record)
                  self.assertEqual(receipt["status"], "DELIVERED_UNVERIFIED")
                  self.assertEqual(receipt["errors"][0]["error"], "DeliveryEvidenceMissing")

              def test_valid_receipt_cannot_be_verified_if_governed_audit_is_unavailable(self):
                  def deliver(step, context):
                      return {
                          "delivered": True,
                          "result": {"posted": True},
                          "evidence": [{
                              "platform_receipt_id": "post_456",
                              "platform": "example.invalid",
                              "observed_at": "2026-09-05T04:31:00Z",
                          }],
                      }

                  self.operator._external_executors["external:publish"] = deliver
                  held = self.run_plan()["held"]
                  self.ledger.grant(held["approval_id"])
                  with mock.patch("core.operator.governed_audit_log", side_effect=RuntimeError("audit down")):
                      record = self.run_plan(authorization_id=held["approval_id"])
                  self.assertEqual(record["status"], "BLOCKED")
                  receipt = self.last(record)
                  self.assertEqual(receipt["status"], "DELIVERED_AUDIT_UNAVAILABLE")

              def test_every_declared_external_capability_has_a_bound_executor(self):
          '''
          replace_once(p, insert_before, new_tests)

          # 4) Regression checks for the two Copilot authority/rollback findings.
          regression = r'''"""PR #235 final independent-review blocker regressions."""
          from __future__ import annotations

          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]


          class FinalReviewBlockerTests(unittest.TestCase):
              def test_bridge_authorization_validates_real_bearer_token(self):
                  source = (ROOT / "buddy_core" / "buddy_bridge_api.py").read_text(encoding="utf-8")
                  self.assertIn('expected = f"Bearer {BUDDY_WEB_TOKEN}"', source)
                  self.assertIn("hmac.compare_digest(auth, expected)", source)
                  self.assertNotIn('Authorization: ******', source)

              def test_rollback_checks_switch_before_clean_or_patch(self):
                  source = (ROOT / "scripts" / "deploy_foundation_vm_remote.sh").read_text(encoding="utf-8")
                  restore = source.split("restore_local_state()", 1)[1].split("quarantine_local_state()", 1)[0]
                  self.assertIn('rc=$?', restore)
                  self.assertIn('if [ "$rc" -eq 0 ]; then', restore)
                  self.assertLess(restore.index('git switch --detach'), restore.index('git clean -fdq'))
                  self.assertIn('if [ "$rc" -eq 0 ] && [ -s "$LOCAL_STATE_BACKUP/index.patch" ]', restore)

              def test_operator_uses_tamper_evident_audit_for_external_delivery(self):
                  source = (ROOT / "buddy_core" / "core" / "operator.py").read_text(encoding="utf-8")
                  external = source.split("def _execute_external", 1)[1].split("def _no_delivery_backend", 1)[0]
                  self.assertIn("governed_audit_log(", external)
                  self.assertIn("delivery_evidence_sha256", external)
                  self.assertNotIn('audit("external_action_executed"', external)

              def test_operator_requires_receipt_provenance_and_timestamp(self):
                  source = (ROOT / "buddy_core" / "core" / "operator.py").read_text(encoding="utf-8")
                  self.assertIn("platform_receipt_id", source)
                  self.assertIn("provenance_keys", source)
                  self.assertIn("time_keys", source)


          if __name__ == "__main__":
              unittest.main()
          '''
          Path("tests/test_pr235_final_review_blockers.py").write_text(
              textwrap.dedent(regression), encoding="utf-8"
          )

          # Remove this one-shot workflow from the candidate tree.
          Path(".github/workflows/pr235-final-blocker-fix-v14.yml").unlink()
          print("PR235_FINAL_BLOCKERS_PATCHED")
          PY

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Focused blocker regressions
        run: |
          set -Eeuo pipefail
          python -m pytest -q \
            tests/test_pr235_final_review_blockers.py \
            tests/test_buddy_authority_execution.py \
            tests/test_pr235_approval_auth_boundary.py \
            tests/test_pr235_final_authority_closure.py \
            tests/test_watchmen_review_closure.py

      - name: Elite governance validator
        run: python scripts/validate_elite_governance.py

      - name: Full repository suite
        run: python -m pytest -q

      - name: Publish tested blocker fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test ! -e .github/workflows/pr235-final-blocker-fix-v14.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close final PR235 review blockers"
          git push origin HEAD:governance/elite-end-to-end-remediation
          echo "FINAL_FIX_SHA=$(git rev-parse HEAD)"
