name: PR235 Final Security Closure

on:
  push:
    branches:
      - governance/elite-end-to-end-remediation
    paths:
      - scripts/pr235_final_security_closure.py

permissions:
  contents: write

concurrency:
  group: pr235-final-security-closure
  cancel-in-progress: false

jobs:
  close-final-security-findings:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact remediation branch
        uses: actions/checkout@v4
        with:
          ref: governance/elite-end-to-end-remediation
          fetch-depth: 0

      - name: Verify bounded lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "governance/elite-end-to-end-remediation"
          git merge-base --is-ancestor 07011a941b86d829a010ce9267e845b5fb68ec9c HEAD
          test -z "$(git status --porcelain)"

      - name: Apply exact security closure
        run: python scripts/pr235_final_security_closure.py

      - name: Remove one-shot applicator before tested commit
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/pr235_final_security_closure.py .github/workflows/pr235-final-security-closure.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile changed Python
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            buddy_core/core/authorization.py \
            buddy_core/core/operator.py \
            buddy_core/buddy_web.py \
            buddy_core/watchmen/saraqael.py \
            tests/test_pr235_final_security_closure.py

      - name: Commit exact code under test
        id: code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add buddy_core/core/authorization.py buddy_core/core/operator.py buddy_core/buddy_web.py buddy_core/watchmen/saraqael.py tests/test_pr235_final_security_closure.py
          git commit -m "fix: close final authority and audit attack surface"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Focused security closure suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_pr235_final_security_closure.py \
            tests/test_buddy_authority_execution.py \
            tests/test_governance_review_regressions.py \
            tests/test_watchmen_audit_state.py \
            tests/test_watchmen_audit_failclosed.py \
            2>&1 | tee /tmp/pr235-focused.log

      - name: Elite Governance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_elite_governance.py 2>&1 | tee /tmp/pr235-elite.log

      - name: Full repository Python suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q 2>&1 | tee /tmp/pr235-full.log

      - name: Record exact-SHA closure receipt
        env:
          CODE_SHA: ${{ steps.code.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def summary(path):
              lines = Path(path).read_text(encoding="utf-8", errors="replace").splitlines()
              return lines[-1] if lines else "no summary"

          now = datetime.now(timezone.utc)
          receipt = {
              "schema": "dominion-remediation-receipt-v1",
              "pr": 235,
              "tested_code_sha": os.environ["CODE_SHA"],
              "focused_suite": {"status": "PASS", "summary": summary("/tmp/pr235-focused.log")},
              "elite_governance": {"status": "PASS", "summary": summary("/tmp/pr235-elite.log")},
              "full_python_suite": {"status": "PASS", "summary": summary("/tmp/pr235-full.log")},
              "closed_findings": [
                  "authorization records HMAC-authenticated with machine-local secret",
                  "external executor inputs restricted to exact authorized payload",
                  "capability-specific receipts enforced for every external capability",
                  "non-JSON delivery evidence fails closed into truthful receipt",
                  "browser Founder approval wired to exact held authorization id",
                  "Saraqael checkout detection no longer aliases HOME to repository root",
                  "explicit Watchmen signing-key files inside source checkout rejected"
              ],
              "temporary_applicator_removed": True,
              "release_authorized": False,
              "production_proven": False,
              "observed_at": now.isoformat(),
              "note": "Test evidence only; independent exact-SHA review and Five Council remain required before merge/deploy."
          }
          out = Path("governance/remediation_receipts") / (now.strftime("%Y-%m-%dT%H%MZ") + "-pr235-final-security-closure.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(out)
          PY
          git add governance/remediation_receipts
          git commit -m "docs: record PR235 final security closure evidence"
          test -z "$(git status --porcelain)"

      - name: Publish tested fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin governance/elite-end-to-end-remediation
          git merge-base --is-ancestor origin/governance/elite-end-to-end-remediation HEAD
          git push origin HEAD:governance/elite-end-to-end-remediation
