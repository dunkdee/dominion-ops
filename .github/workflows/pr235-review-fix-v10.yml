name: PR235 Final Focused Closure V10

on:
  push:
    branches:
      - governance/elite-end-to-end-remediation

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: governance/elite-end-to-end-remediation
          fetch-depth: 0

      - name: Verify exact bootstrap parent
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "00371f96d7e5168d9433519ea427131ea441555b"
          test -z "$(git status --porcelain)"

      - name: Apply reviewed remediation and close focused regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          v8 = Path('.github/workflows/pr235-review-fix-v8.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n\n      - name: Install repository-wide test dependencies"
          if start not in v8 or end not in v8:
              raise SystemExit('v8 remediation payload markers missing')
          payload = v8.split(start, 1)[1].split(end, 1)[0]
          normalized = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in payload.splitlines()
          ) + '\n'
          compile(normalized, '<pr235-v8-remediation>', 'exec')
          exec(normalized, {'__name__': '__main__'})

          op_path = Path('buddy_core/core/operator.py')
          lines = op_path.read_text(encoding='utf-8').splitlines(keepends=True)
          method_start = next((i for i, line in enumerate(lines)
                               if line.lstrip().startswith('def _execute_external(')), None)
          method_end = next((i for i, line in enumerate(lines)
                             if method_start is not None and i > method_start
                             and line.lstrip().startswith('def _no_delivery_backend(')), None)
          if method_start is None or method_end is None:
              raise SystemExit('operator external method boundaries missing')
          matches = [i for i in range(method_start, method_end)
                     if '"authority_ref": {' in lines[i]]
          if len(matches) != 1:
              raise SystemExit(f'operator authority_ref block count={len(matches)}')
          key_i = matches[0]
          key_indent = len(lines[key_i]) - len(lines[key_i].lstrip(' '))
          close_i = None
          for i in range(key_i + 1, method_end):
              stripped = lines[i].strip()
              indent = len(lines[i]) - len(lines[i].lstrip(' '))
              if indent == key_indent and stripped == '},':
                  close_i = i
                  break
          if close_i is None:
              raise SystemExit('operator authority_ref closing brace missing')
          block = lines[key_i:close_i + 1]
          alias = block.copy()
          alias[0] = alias[0].replace('"authority_ref"', '"authorization"', 1)
          lines[close_i + 1:close_i + 1] = alias
          op_path.write_text(''.join(lines), encoding='utf-8')

          key_tests = Path('tests/test_watchmen_audit_state.py')
          tests = key_tests.read_text(encoding='utf-8')
          if tests.count('an-explicit-operator-key') != 2:
              raise SystemExit('unexpected env-key fixture shape')
          if tests.count('key-from-an-external-file') != 2:
              raise SystemExit('unexpected file-key fixture shape')
          tests = tests.replace('an-explicit-operator-key',
                                '0123456789abcdef0123456789abcdef')
          tests = tests.replace('key-from-an-external-file',
                                'fedcba9876543210fedcba9876543210')
          marker = '    def test_blank_key_sources_fail_closed_rather_than_defaulting(self):\n'
          weak_test = '    def test_weak_explicit_key_fails_closed(self):\n        self._env(saraqael.ENV_HMAC_KEY, "too-short")\n        with self.assertRaises(WatchmenStateError):\n            saraqael._resolve_key()\n\n'
          if marker not in tests:
              raise SystemExit('Watchmen weak-key test insertion marker missing')
          if 'def test_weak_explicit_key_fails_closed' not in tests:
              tests = tests.replace(marker, weak_test + marker, 1)
          key_tests.write_text(tests, encoding='utf-8')

          auto_tests = Path('tests/test_radah_autopilot.py')
          auto = auto_tests.read_text(encoding='utf-8')
          old = '"receipts": [{"capability": "brain.reason", "status": "COMPLETE"}],'
          new = '"receipts": [{"step": 1, "capability": "brain.reason", "status": "VERIFIED"}],'
          if auto.count(old) != 1:
              raise SystemExit(f'autopilot productive fixture count={auto.count(old)}')
          auto_tests.write_text(auto.replace(old, new, 1), encoding='utf-8')

          for helper in Path('.github/workflows').glob('pr235-review-fix*.yml'):
              helper.unlink()

          for candidate in (
              Path('buddy_core/core/operator.py'),
              Path('buddy_core/watchmen/saraqael.py'),
              Path('scripts/autopilot/lane_supervisor.py'),
              Path('scripts/validate_elite_governance.py'),
              Path('tests/test_watchmen_audit_state.py'),
              Path('tests/test_radah_autopilot.py'),
          ):
              compile(candidate.read_text(encoding='utf-8'), str(candidate), 'exec')
          print('PR235_FINAL_FOCUSED_CLOSURE=APPLIED')
          PY

      - name: Install repository-wide test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Compile changed Python surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile buddy_core/core/authorization.py buddy_core/core/operator.py buddy_core/core/learning_engine.py buddy_core/buddy_web.py buddy_core/buddy_bridge_api.py buddy_core/sentinel.py buddy_core/watchmen/saraqael.py scripts/autopilot/lane_supervisor.py scripts/validate_elite_governance.py tests/test_governance_review_regressions.py tests/test_watchmen_audit_state.py tests/test_radah_autopilot.py

      - name: Focused independent-review regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_governance_review_regressions.py tests/test_buddy_authority_execution.py tests/test_watchmen_audit_state.py tests/test_watchmen_audit_failclosed.py tests/test_radah_autopilot.py tests/test_alpaca_paper_readonly_bridge.py

      - name: Elite governance validator
        run: python scripts/validate_elite_governance.py

      - name: Full repository Python suite
        run: python -m pytest -q

      - name: Publish tested remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test -z "$(find .github/workflows -maxdepth 1 -name 'pr235-review-fix*.yml' -print)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close PR235 independent governance regressions"
          git push origin HEAD:governance/elite-end-to-end-remediation
          echo "FINAL_FIX_SHA=$(git rev-parse HEAD)"
