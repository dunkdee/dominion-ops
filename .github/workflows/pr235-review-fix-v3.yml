name: PR235 Independent Review Fix Applicator V3

on:
  push:
    branches:
      - governance/elite-end-to-end-remediation

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: governance/elite-end-to-end-remediation
          fetch-depth: 0

      - name: Verify bootstrap-only delta
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 8e2c85d21e213a216631bbd07c2f30a6c6f67ac9 HEAD
          unexpected="$(git diff --name-only 8e2c85d21e213a216631bbd07c2f30a6c6f67ac9 HEAD | grep -vE '^\.github/workflows/pr235-review-fix(-v[23])?\.yml$' || true)"
          test -z "$unexpected" || { printf 'Unexpected bootstrap changes:\n%s\n' "$unexpected"; exit 41; }
          test -z "$(git status --porcelain)"

      - name: Apply reviewed TRUE_DELTA
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          v2 = Path('.github/workflows/pr235-review-fix-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in v2 or end_marker not in v2:
              raise SystemExit('cannot extract reviewed V2 patcher')
          script = v2.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(script)

          # V2 reached this exact independent-review finding before stopping.
          # Remove only its brittle operator subsection and apply that subsection
          # below from the exact live source shape.
          left = script.index('# Malformed/failed authorization lookup must yield a truthful BLOCKED receipt.')
          right = script.index('# Sentinel must distinguish an audit outage from an ordinary env-file error.')
          script = script[:left] + script[right:]
          exec(compile(script, '<pr235-v2-reviewed-patcher>', 'exec'), {'__name__': '__main__'})

          p = Path('buddy_core/core/operator.py')
          source = p.read_text(encoding='utf-8')

          def replace_once(old, new):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'operator exact replacement expected once, found {count}: {old[:100]!r}')
              source = source.replace(old, new, 1)

          replace_once(
              'from core.authorization import AuthorizationLedger, payload_fingerprint\n',
              'from core.authorization import AuthorizationError, AuthorizationLedger, payload_fingerprint\n',
          )
          replace_once(
              'from buddy_core.core.authorization import AuthorizationLedger, payload_fingerprint\n',
              'from buddy_core.core.authorization import AuthorizationError, AuthorizationLedger, payload_fingerprint\n',
          )
          replace_once(
              '''                    redeemed = self._ledger.verify_and_consume(
                        supplied,
                        capability=step["capability"],
                        instruction=step["instruction"],
                        content=step.get("content"),
                        destination=destination,
                    )
''',
              '''                    try:
                        redeemed = self._ledger.verify_and_consume(
                            supplied,
                            capability=step["capability"],
                            instruction=step["instruction"],
                            content=step.get("content"),
                            destination=destination,
                        )
                    except AuthorizationError as exc:
                        redeemed = {"ok": False, "error": str(exc) or "authorization_error"}
                    except OSError:
                        redeemed = {"ok": False, "error": "authorization_storage_unavailable"}
''',
          )
          p.write_text(source, encoding='utf-8')

          # V2 deletes V1 and V2. V3 removes itself so the final PR tree has no
          # temporary applicators.
          helper = Path('.github/workflows/pr235-review-fix-v3.yml')
          if helper.exists():
              helper.unlink()
          print('PR235_REVIEW_TRUE_DELTA_V3=APPLIED')
          PY

      - name: Install complete test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Focused regressions
        run: |
          set -Eeuo pipefail
          python -m pytest -q \
            tests/test_governance_review_regressions.py \
            tests/test_buddy_authority_execution.py \
            tests/test_watchmen_audit_state.py \
            tests/test_watchmen_audit_failclosed.py \
            tests/test_alpaca_paper_readonly_bridge.py

      - name: Elite governance validator
        run: python scripts/validate_elite_governance.py

      - name: Full repository suite
        run: python -m pytest -q

      - name: Publish exact tested fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test ! -e .github/workflows/pr235-review-fix.yml
          test ! -e .github/workflows/pr235-review-fix-v2.yml
          test ! -e .github/workflows/pr235-review-fix-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close independent governance review findings"
          git push origin HEAD:governance/elite-end-to-end-remediation
          echo "FINAL_FIX_SHA=$(git rev-parse HEAD)"
