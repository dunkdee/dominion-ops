name: PR235 Final Independent Review Remediation

on:
  push:
    branches:
      - governance/elite-end-to-end-remediation

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact remediation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: governance/elite-end-to-end-remediation
          fetch-depth: 0

      - name: Verify exact bootstrap parent
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "a9408ccca037ebde866d0345b49a84984ab4f799"
          test -z "$(git status --porcelain)"

      - name: Apply all unresolved independent-review findings
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, value):
              Path(path).write_text(value, encoding="utf-8")

          def replace_once(path, old, new):
              value = read(path)
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}: {old[:100]!r}")
              write(path, value.replace(old, new, 1))

          def replace_between(path, start, end, replacement):
              value = read(path)
              a = value.find(start)
              if a < 0:
                  raise SystemExit(f"{path}: start marker missing: {start!r}")
              b = value.find(end, a + len(start))
              if b < 0:
                  raise SystemExit(f"{path}: end marker missing: {end!r}")
              write(path, value[:a] + replacement + value[b:])

          # ------------------------------------------------------------------
          # 1. Authorization ledger: cross-process serialization + safe atomics.
          # ------------------------------------------------------------------
          p = "buddy_core/core/authorization.py"
          replace_once(p, "import os\nimport uuid\n", "import os\nimport tempfile\nimport uuid\nfrom contextlib import contextmanager\n")
          replace_once(
              p,
              "from typing import Any\n",
              '''from typing import Any

          try:
              import fcntl
          except ImportError:  # pragma: no cover - Windows
              fcntl = None

          try:
              import msvcrt
          except ImportError:  # pragma: no cover - POSIX
              msvcrt = None
          ''',
          )
          replace_once(
              p,
              '        self.sequence_path = self.root / "sequence.json"\n',
              '        self.sequence_path = self.root / "sequence.json"\n        self.lock_path = self.root / ".ledger.lock"\n',
          )
          replace_once(
              p,
              "    def _path(self, approval_id: str) -> Path:\n",
              '''    @contextmanager
              def _exclusive_lock(self):
                  """Serialize grant/deny/redeem across processes, failing closed."""
                  try:
                      fd = os.open(self.lock_path, os.O_CREAT | os.O_RDWR, 0o600)
                  except OSError as exc:
                      raise AuthorizationError("authorization_lock_unavailable") from exc
                  try:
                      try:
                          os.chmod(self.lock_path, 0o600)
                      except OSError:
                          pass
                      if fcntl is not None:
                          try:
                              fcntl.flock(fd, fcntl.LOCK_EX)
                          except OSError as exc:
                              raise AuthorizationError("authorization_lock_unavailable") from exc
                          try:
                              yield
                          finally:
                              try:
                                  fcntl.flock(fd, fcntl.LOCK_UN)
                              except OSError:
                                  pass
                          return
                      if msvcrt is not None:  # pragma: no cover - Windows
                          try:
                              if os.fstat(fd).st_size == 0:
                                  os.write(fd, b"0")
                                  os.fsync(fd)
                              os.lseek(fd, 0, os.SEEK_SET)
                              msvcrt.locking(fd, msvcrt.LK_LOCK, 1)
                          except OSError as exc:
                              raise AuthorizationError("authorization_lock_unavailable") from exc
                          try:
                              yield
                          finally:
                              try:
                                  os.lseek(fd, 0, os.SEEK_SET)
                                  msvcrt.locking(fd, msvcrt.LK_UNLCK, 1)
                              except OSError:
                                  pass
                          return
                      raise AuthorizationError("authorization_lock_unsupported")
                  finally:
                      os.close(fd)

              def _atomic_write_text(self, path: Path, value: str) -> None:
                  fd, tmp = tempfile.mkstemp(dir=str(path.parent), prefix=path.name + ".", suffix=".tmp")
                  try:
                      if hasattr(os, "fchmod"):
                          try:
                              os.fchmod(fd, 0o600)
                          except OSError:
                              pass
                      with os.fdopen(fd, "w", encoding="utf-8") as fh:
                          fd = None
                          fh.write(value)
                          fh.flush()
                          os.fsync(fh.fileno())
                      os.replace(tmp, path)
                      try:
                          path.chmod(0o600)
                      except OSError:
                          pass
                  except BaseException:
                      if fd is not None:
                          try:
                              os.close(fd)
                          except OSError:
                              pass
                      try:
                          os.unlink(tmp)
                      except OSError:
                          pass
                      raise

              def _path(self, approval_id: str) -> Path:
          ''',
          )
          replace_between(
              p,
              "    def _write(self, record: dict) -> dict:\n",
              "    def load(self, approval_id: str) -> dict | None:\n",
              '''    def _write(self, record: dict) -> dict:
                  path = self._path(record["approval_id"])
                  self._atomic_write_text(path, canonical_json(record) + "\\n")
                  return record

          ''',
          )
          replace_between(
              p,
              "    def _next_sequence(self) -> int:\n",
              "    def _receipt(self, event: str, record: dict, **extra) -> None:\n",
              '''    def _next_sequence(self) -> int:
                  current = 0
                  if self.sequence_path.is_file():
                      try:
                          current = int(json.loads(self.sequence_path.read_text(encoding="utf-8"))["sequence"])
                      except (OSError, ValueError, KeyError, TypeError):
                          current = 0
                  nxt = current + 1
                  self._atomic_write_text(
                      self.sequence_path, canonical_json({"sequence": nxt}) + "\\n"
                  )
                  return nxt

          ''',
          )
          replace_once(
              p,
              '    def grant(self, approval_id: str, *, approver: str = "founder") -> dict:\n',
              '''    def grant(self, approval_id: str, *, approver: str = "founder") -> dict:
                  with self._exclusive_lock():
                      return self._grant_locked(approval_id, approver=approver)

              def _grant_locked(self, approval_id: str, *, approver: str = "founder") -> dict:
          ''',
          )
          replace_once(
              p,
              '    def deny(self, approval_id: str, *, approver: str = "founder", reason: str = "") -> dict:\n',
              '''    def deny(self, approval_id: str, *, approver: str = "founder", reason: str = "") -> dict:
                  with self._exclusive_lock():
                      return self._deny_locked(approval_id, approver=approver, reason=reason)

              def _deny_locked(self, approval_id: str, *, approver: str = "founder", reason: str = "") -> dict:
          ''',
          )
          replace_once(
              p,
              '''    def verify_and_consume(self, approval_id: str, *, capability: str, instruction: str,
                                     content: Any = None, destination: str | None = None) -> dict:
          ''',
              '''    def verify_and_consume(self, approval_id: str, *, capability: str, instruction: str,
                                     content: Any = None, destination: str | None = None) -> dict:
                  with self._exclusive_lock():
                      return self._verify_and_consume_locked(
                          approval_id,
                          capability=capability,
                          instruction=instruction,
                          content=content,
                          destination=destination,
                      )

              def _verify_and_consume_locked(self, approval_id: str, *, capability: str, instruction: str,
                                              content: Any = None, destination: str | None = None) -> dict:
          ''',
          )

          # ------------------------------------------------------------------
          # 2. Buddy operator: exact artifact binding, resumable authority,
          #    truthful delivered states, and safe authorization failures.
          # ------------------------------------------------------------------
          p = "buddy_core/core/operator.py"
          replace_once(p, "import hashlib\n", "import copy\nimport hashlib\n")
          replace_once(p, "import re\n", "import re\nimport tempfile\n")
          replace_once(
              p,
              "from core.authorization import AuthorizationLedger, payload_fingerprint\n",
              "from core.authorization import AuthorizationError, AuthorizationLedger, payload_fingerprint\n",
          )
          replace_once(
              p,
              "from buddy_core.core.authorization import AuthorizationLedger, payload_fingerprint\n",
              "from buddy_core.core.authorization import AuthorizationError, AuthorizationLedger, payload_fingerprint\n",
          )
          replace_once(
              p,
              '        self.staged_dir = self.state_dir / "staged"\n',
              '''        self.staged_dir = self.state_dir / "staged"
                  self.held_dir = self.state_dir / "held"
                  self.held_dir.mkdir(parents=True, exist_ok=True)
                  try:
                      self.held_dir.chmod(0o700)
                  except OSError:
                      pass
          ''',
          )

          new_execute = r'''    def _freeze_external_step(self, step: dict, context: dict) -> dict:
              """Bind authority to the exact content/destination the executor will receive."""
              frozen = copy.deepcopy(step)
              if "content" not in frozen or frozen.get("content") is None:
                  outputs = [value for value in context.get("outputs", []) if value is not None]
                  frozen["content"] = copy.deepcopy(outputs[-1]) if outputs else None
              # Destination may legitimately be None, but no later executor may invent one.
              frozen["destination"] = step.get("destination")
              return frozen

          def _held_path(self, approval_id: str) -> Path:
              if not re.fullmatch(r"approval_[0-9a-f]{12}", approval_id or ""):
                  raise AuthorizationError("invalid approval_id")
              return self.held_dir / f"{approval_id}.json"

          def _persist_held_plan(self, approval_id: str, payload: dict) -> None:
              path = self._held_path(approval_id)
              fd, tmp = tempfile.mkstemp(dir=str(self.held_dir), prefix=path.name + ".", suffix=".tmp")
              try:
                  if hasattr(os, "fchmod"):
                      try:
                          os.fchmod(fd, 0o600)
                      except OSError:
                          pass
                  with os.fdopen(fd, "w", encoding="utf-8") as fh:
                      fd = None
                      json.dump(payload, fh, ensure_ascii=False, sort_keys=True)
                      fh.write("\n")
                      fh.flush()
                      os.fsync(fh.fileno())
                  os.replace(tmp, path)
                  try:
                      path.chmod(0o600)
                  except OSError:
                      pass
              except BaseException:
                  if fd is not None:
                      try:
                          os.close(fd)
                      except OSError:
                          pass
                  try:
                      os.unlink(tmp)
                  except OSError:
                      pass
                  raise

          def grant_and_resume(self, approval_id: str, *, session_id: str = "default",
                               approver: str = "founder") -> dict:
              """Authenticated product surfaces call this to grant and resume one stored hold."""
              try:
                  path = self._held_path(approval_id)
                  stored = json.loads(path.read_text(encoding="utf-8"))
                  if not isinstance(stored, dict):
                      raise ValueError("held state malformed")
                  pending = self._ledger.load(approval_id)
              except (AuthorizationError, OSError, ValueError, json.JSONDecodeError) as exc:
                  return {
                      "status": "BLOCKED",
                      "error": "HeldMissionUnavailable",
                      "detail": str(exc)[:200],
                      "approval_id": approval_id,
                  }
              if not pending or pending.get("payload_hash") != stored.get("payload_hash"):
                  return {"status": "BLOCKED", "error": "held_authority_mismatch", "approval_id": approval_id}

              granted = self._ledger.grant(approval_id, approver=approver)
              if not granted.get("ok"):
                  if granted.get("error") == "already_granted":
                      current = self._ledger.load(approval_id)
                      if not current or current.get("status") != "GRANTED":
                          return {"status": "BLOCKED", "error": granted.get("error"), "approval_id": approval_id}
                  else:
                      return {"status": "BLOCKED", "error": granted.get("error"), "approval_id": approval_id}

              plan = stored.get("plan")
              step_index = int(stored.get("step_index", 0))
              if not isinstance(plan, dict) or step_index < 1 or step_index > len(plan.get("steps") or []):
                  return {"status": "BLOCKED", "error": "held_plan_invalid", "approval_id": approval_id}
              plan = copy.deepcopy(plan)
              plan["steps"][step_index - 1]["authorization_id"] = approval_id
              return self.execute(plan, session_id=session_id)

          def execute(self, plan: dict, *, session_id: str = "default") -> dict:
              self._validate_plan(plan)
              evidence_policy = None
              if plan.get("kind") == "revenue":
                  evidence_policy = plan.get("evidence_policy")
                  if evidence_policy not in _EVIDENCE_POLICIES:
                      raise OperatorError(
                          "revenue mission requires a valid trusted evidence_policy; "
                          f"got {evidence_policy!r}"
                      )
              context = {
                  "objective": plan["objective"],
                  "conversation_context": plan.get("conversation_context", ""),
                  "outputs": [],
                  "sources": [],
                  "evidence_policy": evidence_policy,
              }
              receipts = []
              held = None

              for index, step in enumerate(plan["steps"], start=1):
                  cap = self.capabilities[step["capability"]]
                  if cap.get("auth_required") or cap.get("classification") in {
                      "privileged_write", "destructive"
                  }:
                      frozen_step = self._freeze_external_step(step, context)
                      destination = frozen_step.get("destination")
                      supplied = frozen_step.get("authorization_id")

                      if supplied:
                          try:
                              redeemed = self._ledger.verify_and_consume(
                                  supplied,
                                  capability=frozen_step["capability"],
                                  instruction=frozen_step["instruction"],
                                  content=frozen_step.get("content"),
                                  destination=destination,
                              )
                          except AuthorizationError as exc:
                              redeemed = {"ok": False, "error": str(exc) or "authorization_error"}
                          except OSError:
                              redeemed = {"ok": False, "error": "authorization_storage_unavailable"}
                          if not redeemed.get("ok"):
                              receipt = {
                                  "step": index,
                                  "capability": frozen_step["capability"],
                                  "status": "BLOCKED",
                                  "attempts": 0,
                                  "errors": [{"attempt": 0, "error": "AuthorizationRejected",
                                              "detail": redeemed.get("error", "authorization_denied")}],
                                  "result": None,
                                  "evidence": [],
                              }
                              receipts.append(receipt)
                              try:
                                  audit("external_authorization_rejected", {
                                      "mission_id": plan["mission_id"],
                                      "capability": frozen_step["capability"],
                                      "approval_id": supplied,
                                      "error": redeemed.get("error"),
                                  })
                              except Exception:
                                  pass
                              break

                          receipt = self._execute_external(
                              index, frozen_step, cap, context, redeemed["authorization"]
                          )
                          receipts.append(receipt)
                          if receipt["status"] != "VERIFIED":
                              break
                          context["outputs"].append(receipt.get("result"))
                          continue

                      try:
                          request = self._ledger.request(
                              mission_id=plan["mission_id"],
                              step=index,
                              capability=frozen_step["capability"],
                              instruction=frozen_step["instruction"],
                              content=frozen_step.get("content"),
                              destination=destination,
                              policy_tags=cap.get("tags", []),
                          )
                          frozen_plan = copy.deepcopy(plan)
                          frozen_plan["steps"][index - 1] = frozen_step
                          self._persist_held_plan(request["approval_id"], {
                              "approval_id": request["approval_id"],
                              "payload_hash": request["payload_hash"],
                              "step_index": index,
                              "session_id": session_id,
                              "plan": frozen_plan,
                          })
                      except (AuthorizationError, OSError, TypeError, ValueError) as exc:
                          receipts.append({
                              "step": index,
                              "capability": frozen_step["capability"],
                              "status": "BLOCKED",
                              "attempts": 0,
                              "errors": [{"attempt": 0, "error": "AuthorizationStorageUnavailable",
                                          "detail": str(exc)[:200]}],
                              "result": None,
                              "evidence": [],
                          })
                          break

                      held = {
                          "step": index,
                          "capability": frozen_step["capability"],
                          "instruction": frozen_step["instruction"],
                          "approval_id": request["approval_id"],
                          "payload_hash": request["payload_hash"],
                          "expires_at": request["expires_at"],
                          "reason": "FOUNDER_AUTHORIZATION_REQUIRED",
                          "policy_tags": cap.get("tags", []),
                      }
                      receipts.append({"step": index, "status": "HELD", **held})
                      try:
                          audit("external_boundary_held", {"mission_id": plan["mission_id"], **held})
                      except Exception:
                          pass
                      break

                  qualifying = set(step.get("evidence_any_of") or [])
                  if qualifying:
                      verified_caps = {
                          r["capability"] for r in receipts
                          if r.get("capability") in qualifying and r.get("status") == "VERIFIED"
                      }
                      if not verified_caps:
                          receipts.append({
                              "step": index, "capability": step["capability"], "status": "BLOCKED",
                              "attempts": 0,
                              "errors": [{"attempt": 0, "error": "EvidenceGate",
                                          "detail": "requires at least one VERIFIED governed evidence capability "
                                                    f"from {sorted(qualifying)}"}],
                              "result": None, "evidence": [],
                          })
                          break

                  receipt = self._execute_internal(index, step, cap, context)
                  receipts.append(receipt)
                  if receipt["status"] != "VERIFIED":
                      if step.get("evidence_required", True) is False:
                          receipts[-1] = {**receipt, "status": "SKIPPED"}
                          continue
                      break
                  context["outputs"].append(receipt.get("result"))
                  for ev in receipt.get("evidence", []):
                      if isinstance(ev, dict) and ev.get("url"):
                          context["sources"].append(ev)

              status = "HELD" if held else (
                  "COMPLETE"
                  if receipts and all(r["status"] in {"VERIFIED", "SKIPPED"} for r in receipts)
                  else "BLOCKED"
              )
              record = {
                  "mission_id": plan["mission_id"], "session_id": session_id,
                  "objective": plan["objective"], "status": status,
                  "evidence_policy": evidence_policy, "receipts": receipts, "held": held,
              }
              try:
                  record_mission(record)
              except Exception as exc:
                  delivered = any(
                      isinstance(r, dict) and r.get("authority_ref") and
                      r.get("status") in {"VERIFIED", "DELIVERED_UNVERIFIED", "DELIVERED_AUDIT_UNAVAILABLE"}
                      for r in receipts
                  )
                  record["status"] = "DELIVERED_AUDIT_UNAVAILABLE" if delivered else "BLOCKED"
                  record["persistence_error"] = type(exc).__name__
              return {**record, "response": self._mission_response(record)}

          # ---------- Planning / policy ----------
'''
          replace_between(
              p,
              "    def execute(self, plan: dict, *, session_id: str = \"default\") -> dict:\n",
              "    # ---------- Planning / policy ----------\n",
              textwrap.dedent(new_execute).lstrip("\n"),
          )

          new_external = r'''    def _execute_external(self, index: int, step: dict, cap: dict, context: dict,
                                  authorization: dict) -> dict:
              """Execute only redeemed exact authority; never fabricate delivery proof."""
              executor_name = cap.get("executor", "")
              executor = self._external_executors.get(executor_name)
              base = {
                  "step": index,
                  "capability": step["capability"],
                  "attempts": 1,
                  "authority_ref": {
                      "approval_id": authorization.get("approval_id"),
                      "authorization_sequence": authorization.get("authorization_sequence"),
                      "payload_hash": authorization.get("payload_hash"),
                      "approver": authorization.get("approver"),
                  },
              }
              if executor is None:
                  return {**base, "status": "BLOCKED",
                          "errors": [{"attempt": 1, "error": "ExecutorUnavailable",
                                      "detail": f"no governed executor bound for {executor_name or step['capability']}"}],
                          "result": None, "evidence": []}
              try:
                  outcome = executor(step, context)
              except Exception as exc:
                  return {**base, "status": "BLOCKED",
                          "errors": [{"attempt": 1, "error": type(exc).__name__, "detail": str(exc)[:300]}],
                          "result": None, "evidence": []}
              if not isinstance(outcome, dict) or not outcome.get("delivered"):
                  detail = ((outcome or {}).get("detail", "external delivery not performed")
                            if isinstance(outcome, dict) else "executor returned no governed result")
                  return {**base, "status": "BLOCKED",
                          "errors": [{"attempt": 1, "error": "ExternalDeliveryUnavailable", "detail": detail}],
                          "result": None, "evidence": []}

              evidence = outcome.get("evidence")
              if not (isinstance(evidence, list) and evidence and
                      all(isinstance(item, dict) and bool(item) for item in evidence)):
                  return {**base, "status": "DELIVERED_UNVERIFIED",
                          "errors": [{"attempt": 1, "error": "DeliveryEvidenceMissing",
                                      "detail": "delivery occurred but governed delivery evidence is absent or malformed"}],
                          "result": outcome.get("result"),
                          "evidence": evidence if isinstance(evidence, list) else []}

              try:
                  audit("external_action_executed", {
                      "capability": step["capability"],
                      "approval_id": authorization.get("approval_id"),
                      "destination": step.get("destination"),
                      "payload_hash": authorization.get("payload_hash"),
                  })
              except Exception as exc:
                  return {**base, "status": "DELIVERED_AUDIT_UNAVAILABLE",
                          "errors": [{"attempt": 1, "error": "PostDeliveryAuditUnavailable",
                                      "detail": type(exc).__name__}],
                          "result": outcome.get("result"), "evidence": evidence}

              return {**base, "status": "VERIFIED", "errors": [],
                      "result": outcome.get("result"), "evidence": evidence}

'''
          replace_between(
              p,
              "    def _execute_external(self, index: int, step: dict, cap: dict, context: dict,\n",
              "    def _no_delivery_backend(self, channel: str) -> dict:\n",
              textwrap.dedent(new_external).lstrip("\n"),
          )

          # ------------------------------------------------------------------
          # 3. Product surfaces: authenticated explicit approve+resume.
          # ------------------------------------------------------------------
          p = "buddy_core/buddy_web.py"
          replace_once(
              p,
              '''    message = body.get("message", "").strip()
              session_id = body.get("session_id", "default")

              if not message:
                  return JSONResponse({"error": "Empty message"}, status_code=400)
          ''',
              '''    message = body.get("message", "").strip()
              session_id = body.get("session_id", "default")
              approval_id = str(body.get("authorization_id") or "").strip()
              if body.get("approve") is True and approval_id:
                  result = get_operator().grant_and_resume(
                      approval_id, session_id=session_id, approver="founder"
                  )
                  payload = {"response": result.get("response") or result.get("error") or result.get("status"),
                             "session_id": session_id, **result}
                  return JSONResponse(payload, status_code=200 if result.get("status") == "COMPLETE" else 409)

              if not message:
                  return JSONResponse({"error": "Empty message"}, status_code=400)
          ''',
          )

          p = "buddy_core/buddy_bridge_api.py"
          replace_once(
              p,
              '''    command = (data.get("command") or "").strip()
              if not command:
                  return jsonify(error="no command"), 400
              session_id = (data.get("session_id") or "bridge").strip()[:120]
              simulate = bool(data.get("simulate", False))
          ''',
              '''    command = (data.get("command") or "").strip()
              session_id = (data.get("session_id") or "bridge").strip()[:120]
              approval_id = str(data.get("authorization_id") or "").strip()
              if data.get("approve") is True and approval_id:
                  result = get_operator().grant_and_resume(
                      approval_id, session_id=session_id, approver="founder"
                  )
                  log(f"[AUTH_RESUME] status={result.get('status')} approval={approval_id}")
                  return jsonify(result), 200 if result.get("status") == "COMPLETE" else 409
              if not command:
                  return jsonify(error="no command"), 400
              simulate = bool(data.get("simulate", False))
          ''',
          )

          # ------------------------------------------------------------------
          # 4. Durable mission evidence: preserve safe authority refs, redact secrets.
          # ------------------------------------------------------------------
          p = "buddy_core/core/learning_engine.py"
          replace_once(
              p,
