name: PR235 Final Remediation Runner V8

on:
  push:
    branches:
      - governance/elite-end-to-end-remediation

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: governance/elite-end-to-end-remediation
          fetch-depth: 0

      - name: Verify exact bootstrap parent
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "d5176429c49e3a49c5cdec907ffb996f22e251bd"
          test -z "$(git status --porcelain)"

      - name: Apply reviewed remediation and canonicalize each generated method
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          start = "          python - <<'PY'\n"
          end = "\n          PY\n\n      - name: Install repository-wide test dependencies"
          source = Path('.github/workflows/pr235-review-fix-v4.yml').read_text(encoding='utf-8')
          if start not in source or end not in source:
              raise SystemExit('v4 remediation payload markers missing')
          payload = source.split(start, 1)[1].split(end, 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in payload.splitlines()
          ) + '\n'

          tree = ast.parse(script)
          literals = {}
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              for target in node.targets:
                  if isinstance(target, ast.Name) and target.id in {'new_execute', 'new_external'}:
                      literals[target.id] = ast.literal_eval(node.value)
          if set(literals) != {'new_execute', 'new_external'}:
              raise SystemExit('reviewed operator method payloads missing')

          left_marker = '# 8. Elite validator: actual AST map binding, never comments/strings.'
          right_marker = '# 9. Test-suite correctness/dependencies.'
          left = script.find(left_marker)
          right = script.find(right_marker, left + 1)
          if left < 0 or right < 0:
              raise SystemExit('validator section markers missing')
          executable = script[:left] + '# validator patched structurally below\n' + script[right:]
          compile(executable, '<pr235-v4-reviewed>', 'exec')
          exec(executable, {'__name__': '__main__'})

          def canonical_method_block(raw: str, *, drop_planning_comment: bool = False) -> str:
              lines = raw.lstrip('\n').splitlines()
              if drop_planning_comment:
                  lines = [ln for ln in lines if ln.strip() != '# ---------- Planning / policy ----------']
              method_rows = [i for i, ln in enumerate(lines) if ln.lstrip().startswith('def ')]
              if not method_rows:
                  raise SystemExit('generated method block has no methods')

              out = []
              for pos, method_start in enumerate(method_rows):
                  method_end = method_rows[pos + 1] if pos + 1 < len(method_rows) else len(lines)
                  segment = lines[method_start:method_end]
                  method_raw_indent = len(segment[0]) - len(segment[0].lstrip(' '))

                  sig_end = 0
                  while sig_end < len(segment) and not segment[sig_end].rstrip().endswith(':'):
                      sig_end += 1
                  if sig_end >= len(segment):
                      raise SystemExit('generated method signature incomplete')
                  body_idx = sig_end + 1
                  while body_idx < len(segment) and not segment[body_idx].strip():
                      body_idx += 1
                  if body_idx >= len(segment):
                      raise SystemExit('generated method body missing')
                  first_body_indent = len(segment[body_idx]) - len(segment[body_idx].lstrip(' '))
                  body_level_missing = first_body_indent <= method_raw_indent

                  for rel, ln in enumerate(segment):
                      stripped = ln.lstrip(' ')
                      if not stripped:
                          out.append('')
                          continue
                      raw_indent = len(ln) - len(stripped)
                      if rel == 0:
                          desired = 4
                      elif rel <= sig_end:
                          desired = 4 + max(4, raw_indent - method_raw_indent)
                      else:
                          desired = 4 + max(0, raw_indent - method_raw_indent)
                          if body_level_missing:
                              desired += 4
                      out.append(' ' * desired + stripped)
              return '\n'.join(out).rstrip() + '\n\n'

          canonical_execute = canonical_method_block(literals['new_execute'], drop_planning_comment=True)
          canonical_external = canonical_method_block(literals['new_external'])

          op = Path('buddy_core/core/operator.py')
          op_lines = op.read_text(encoding='utf-8').splitlines(keepends=True)
          freeze_i = next((i for i, ln in enumerate(op_lines)
                           if ln.lstrip().startswith('def _freeze_external_step(')), None)
          planning_i = next((i for i, ln in enumerate(op_lines)
                             if freeze_i is not None and i > freeze_i
                             and ln.strip() == '# ---------- Planning / policy ----------'), None)
          if freeze_i is None or planning_i is None:
              raise SystemExit('operator execute block boundaries missing')
          end_i = planning_i + 1
          while end_i < len(op_lines) and (
              not op_lines[end_i].strip()
              or op_lines[end_i].strip() == '# ---------- Planning / policy ----------'
          ):
              end_i += 1
          replacement = canonical_execute + '    # ---------- Planning / policy ----------\n\n'
          op_lines[freeze_i:end_i] = replacement.splitlines(keepends=True)

          ext_i = next((i for i, ln in enumerate(op_lines)
                        if ln.lstrip().startswith('def _execute_external(')), None)
          backend_i = next((i for i, ln in enumerate(op_lines)
                            if ext_i is not None and i > ext_i
                            and ln.lstrip().startswith('def _no_delivery_backend(')), None)
          if ext_i is None or backend_i is None:
              raise SystemExit('operator external block boundaries missing')
          op_lines[ext_i:backend_i] = canonical_external.splitlines(keepends=True)
          op.write_text(''.join(op_lines), encoding='utf-8')

          vp = Path('scripts/validate_elite_governance.py')
          vtext = vp.read_text(encoding='utf-8')
          if 'import ast\n' not in vtext:
              vtext = vtext.replace('import json\nimport re\n', 'import ast\nimport json\nimport re\n', 1)
          helper = '''\ndef external_executor_bindings(source: str) -> set[str]:\n    try:\n        tree = ast.parse(source)\n    except SyntaxError:\n        return set()\n    found: set[str] = set()\n    for node in ast.walk(tree):\n        if not isinstance(node, (ast.Assign, ast.AnnAssign)):\n            continue\n        targets = node.targets if isinstance(node, ast.Assign) else [node.target]\n        matches = any(\n            isinstance(target, ast.Attribute)\n            and isinstance(target.value, ast.Name)\n            and target.value.id == "self"\n            and target.attr == "_external_executors"\n            for target in targets\n        )\n        if not matches or not isinstance(node.value, ast.Dict):\n            continue\n        for key in node.value.keys:\n            if isinstance(key, ast.Constant) and isinstance(key.value, str):\n                found.add(key.value)\n    return found\n\n'''
          if 'def external_executor_bindings(' not in vtext:
              marker = '\ndef collect_failures() -> list[dict]:\n'
              if marker not in vtext:
                  raise SystemExit('validator collect_failures marker missing')
              vtext = vtext.replace(marker, helper + 'def collect_failures() -> list[dict]:\n', 1)
          bs = vtext.find('    enabled_external = [\n')
          be = vtext.find('    authorization = read(AUTHORIZATION)\n', bs)
          if bs < 0 or be < 0:
              raise SystemExit('validator external block boundaries missing')
          vblock = '''    enabled_external = [\n        cap for cap in registry.get("capabilities", [])\n        if cap.get("enabled", True) and str(cap.get("executor", "")).startswith("external:")\n    ]\n    wired_external = external_executor_bindings(operator)\n    for cap in enabled_external:\n        executor = str(cap.get("executor"))\n        if executor not in wired_external:\n            failures.append({\n                "gate": "external_executor",\n                "reason": f"enabled external capability has no governed runtime executor: {cap.get('id')} ({executor})",\n            })\n\n'''
          vp.write_text(vtext[:bs] + vblock + vtext[be:], encoding='utf-8')

          for candidate in (op, vp):
              body = candidate.read_text(encoding='utf-8')
              try:
                  compile(body, str(candidate), 'exec')
              except SyntaxError as exc:
                  lines = body.splitlines()
                  lo = max(0, (exc.lineno or 1) - 4)
                  hi = min(len(lines), (exc.lineno or 1) + 3)
                  print(f'SYNTAX_FAILURE={candidate}:{exc.lineno}:{exc.msg}')
                  for n in range(lo, hi):
                      print(f'{n+1:04d}: {lines[n]!r}')
                  raise

          for helper_path in Path('.github/workflows').glob('pr235-review-fix*.yml'):
              helper_path.unlink()
          print('PR235_CANONICAL_METHOD_REMEDIATION=APPLIED')
          PY

      - name: Install repository-wide test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Compile changed Python surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile buddy_core/core/authorization.py buddy_core/core/operator.py buddy_core/core/learning_engine.py buddy_core/buddy_web.py buddy_core/buddy_bridge_api.py buddy_core/sentinel.py buddy_core/watchmen/saraqael.py scripts/autopilot/lane_supervisor.py scripts/validate_elite_governance.py tests/test_governance_review_regressions.py

      - name: Focused independent-review regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_governance_review_regressions.py tests/test_buddy_authority_execution.py tests/test_watchmen_audit_state.py tests/test_watchmen_audit_failclosed.py tests/test_radah_autopilot.py tests/test_alpaca_paper_readonly_bridge.py

      - name: Elite governance validator
        run: python scripts/validate_elite_governance.py

      - name: Full repository Python suite
        run: python -m pytest -q

      - name: Publish tested remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test -z "$(find .github/workflows -maxdepth 1 -name 'pr235-review-fix*.yml' -print)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close independent governance review findings"
          git push origin HEAD:governance/elite-end-to-end-remediation
          echo "FINAL_FIX_SHA=$(git rev-parse HEAD)"
