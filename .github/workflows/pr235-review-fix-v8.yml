name: PR235 Final Remediation Runner V8

on:
  push:
    branches:
      - governance/elite-end-to-end-remediation

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: governance/elite-end-to-end-remediation
          fetch-depth: 0

      - name: Verify exact bootstrap parent
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "27b9701f53bbd4e0e49cd06a56564a58e27d12af"
          test -z "$(git status --porcelain)"

      - name: Apply reviewed remediation with canonical external executor block
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          import textwrap
          from pathlib import Path

          start = "          python - <<'PY'\n"
          end = "\n          PY\n\n      - name: Install repository-wide test dependencies"

          # Cache the canonical new_external source BEFORE v7 executes, because
          # the reviewed remediation intentionally deletes temporary workflows.
          v4 = Path('.github/workflows/pr235-review-fix-v4.yml').read_text(encoding='utf-8')
          if start not in v4 or end not in v4:
              raise SystemExit('v4 remediation payload markers missing')
          v4_payload = v4.split(start, 1)[1].split(end, 1)[0]
          normalized_v4 = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in v4_payload.splitlines()
          ) + '\n'
          tree = ast.parse(normalized_v4)
          raw_external = None
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              if any(isinstance(t, ast.Name) and t.id == 'new_external' for t in node.targets):
                  raw_external = ast.literal_eval(node.value)
                  break
          if not isinstance(raw_external, str) or 'def _execute_external(' not in raw_external:
              raise SystemExit('reviewed new_external assignment missing')
          canonical_external = textwrap.indent(
              textwrap.dedent(raw_external).lstrip('\n'),
              '    ',
          )
          if not canonical_external.endswith('\n'):
              canonical_external += '\n'

          # Reuse the reviewed v7 remediation payload exactly.
          v7 = Path('.github/workflows/pr235-review-fix-v7.yml').read_text(encoding='utf-8')
          if start not in v7 or end not in v7:
              raise SystemExit('v7 remediation payload markers missing')
          payload = v7.split(start, 1)[1].split(end, 1)[0]
          normalized_v7 = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in payload.splitlines()
          ) + '\n'
          compile(normalized_v7, '<pr235-v7-remediation>', 'exec')
          exec(normalized_v7, {'__name__': '__main__'})

          # Replace the malformed generated external block with the cached,
          # canonically class-indented reviewed block.
          op = Path('buddy_core/core/operator.py')
          lines = op.read_text(encoding='utf-8').splitlines(keepends=True)
          start_i = next(
              (i for i, line in enumerate(lines)
               if line.lstrip().startswith('def _execute_external(')),
              None,
          )
          end_i = next(
              (i for i, line in enumerate(lines)
               if i > (start_i if start_i is not None else -1)
               and line.lstrip().startswith('def _no_delivery_backend(')),
              None,
          )
          if start_i is None or end_i is None:
              raise SystemExit('operator external executor boundaries missing')
          canonical_lines = canonical_external.splitlines(keepends=True)
          op.write_text(''.join(lines[:start_i] + canonical_lines + lines[end_i:]), encoding='utf-8')

          # Remove every one-shot PR235 remediation workflow from the candidate tree.
          for helper in Path('.github/workflows').glob('pr235-review-fix*.yml'):
              helper.unlink()
          print('PR235_CANONICAL_EXTERNAL_REMEDIATION=APPLIED')
          PY

      - name: Install repository-wide test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Compile changed Python surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile buddy_core/core/authorization.py buddy_core/core/operator.py buddy_core/core/learning_engine.py buddy_core/buddy_web.py buddy_core/buddy_bridge_api.py buddy_core/sentinel.py buddy_core/watchmen/saraqael.py scripts/autopilot/lane_supervisor.py scripts/validate_elite_governance.py tests/test_governance_review_regressions.py

      - name: Focused independent-review regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_governance_review_regressions.py tests/test_buddy_authority_execution.py tests/test_watchmen_audit_state.py tests/test_watchmen_audit_failclosed.py tests/test_radah_autopilot.py tests/test_alpaca_paper_readonly_bridge.py

      - name: Elite governance validator
        run: python scripts/validate_elite_governance.py

      - name: Full repository Python suite
        run: python -m pytest -q

      - name: Publish tested remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test -z "$(find .github/workflows -maxdepth 1 -name 'pr235-review-fix*.yml' -print)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close independent governance review findings"
          git push origin HEAD:governance/elite-end-to-end-remediation
          echo "FINAL_FIX_SHA=$(git rev-parse HEAD)"
