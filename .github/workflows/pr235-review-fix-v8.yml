name: PR235 Final Remediation Runner V8

on:
  push:
    branches:
      - governance/elite-end-to-end-remediation

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: governance/elite-end-to-end-remediation
          fetch-depth: 0

      - name: Verify exact bootstrap parent
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "30174dfdbbbbb7ddf2280ac64ca55c2aacb91778"
          test -z "$(git status --porcelain)"

      - name: Apply reviewed remediation and repair generated indentation
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          # Reuse the already-reviewed v7 remediation payload exactly.
          source = Path('.github/workflows/pr235-review-fix-v7.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n\n      - name: Install repository-wide test dependencies"
          if start not in source or end not in source:
              raise SystemExit('v7 remediation payload markers missing')
          payload = source.split(start, 1)[1].split(end, 1)[0]
          normalized = '\n'.join(line[10:] if line.startswith('          ') else line for line in payload.splitlines()) + '\n'
          compile(normalized, '<pr235-v7-remediation>', 'exec')
          exec(normalized, {'__name__': '__main__'})

          # v7 fixed the main execute/resume block. The separately generated
          # _execute_external replacement has the same YAML-dedent defect: its
          # method body is one class indentation level short. Repair only that
          # exact generated region and preserve all nested relative indentation.
          op = Path('buddy_core/core/operator.py')
          text = op.read_text(encoding='utf-8')
          a = text.find('    def _execute_external(')
          b = text.find('    def _no_delivery_backend(', a)
          if a < 0 or b < 0:
              raise SystemExit('external executor generated block boundaries missing')
          repaired = []
          for line in text[a:b].splitlines(keepends=True):
              if line.strip() and not line.startswith('    def '):
                  line = '    ' + line
              repaired.append(line)
          op.write_text(text[:a] + ''.join(repaired) + text[b:], encoding='utf-8')

          # v7 removes itself; remove this one-shot runner too. The v4/v7 payload
          # removes the earlier temporary applicators.
          me = Path('.github/workflows/pr235-review-fix-v8.yml')
          if me.exists():
              me.unlink()
          print('PR235_V8_REMEDIATION=APPLIED')
          PY

      - name: Install repository-wide test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Compile changed Python surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile buddy_core/core/authorization.py buddy_core/core/operator.py buddy_core/core/learning_engine.py buddy_core/buddy_web.py buddy_core/buddy_bridge_api.py buddy_core/sentinel.py buddy_core/watchmen/saraqael.py scripts/autopilot/lane_supervisor.py scripts/validate_elite_governance.py tests/test_governance_review_regressions.py

      - name: Focused independent-review regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_governance_review_regressions.py tests/test_buddy_authority_execution.py tests/test_watchmen_audit_state.py tests/test_watchmen_audit_failclosed.py tests/test_radah_autopilot.py tests/test_alpaca_paper_readonly_bridge.py

      - name: Elite governance validator
        run: python scripts/validate_elite_governance.py

      - name: Full repository Python suite
        run: python -m pytest -q

      - name: Publish tested remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test -z "$(find .github/workflows -maxdepth 1 -name 'pr235-review-fix*.yml' -print)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close independent governance review findings"
          git push origin HEAD:governance/elite-end-to-end-remediation
          echo "FINAL_FIX_SHA=$(git rev-parse HEAD)"
