name: PR235 Focused Regression Closure V9

on:
  push:
    branches:
      - governance/elite-end-to-end-remediation

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: governance/elite-end-to-end-remediation
          fetch-depth: 0

      - name: Verify exact bootstrap parent
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "07529db9adb319a09990a118e350ed34fbb2c137"
          test -z "$(git status --porcelain)"

      - name: Apply reviewed remediation and close four focused regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          # V8 is the first applicator whose remediation, canonical method
          # generation, dependency installation, and compilation all passed.
          # Reuse that exact tested working-tree transformation before applying
          # only the four concrete focused-test corrections observed in CI.
          v8 = Path('.github/workflows/pr235-review-fix-v8.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n\n      - name: Install repository-wide test dependencies"
          if start not in v8 or end not in v8:
              raise SystemExit('v8 remediation payload markers missing')
          payload = v8.split(start, 1)[1].split(end, 1)[0]
          normalized = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in payload.splitlines()
          ) + '\n'
          compile(normalized, '<pr235-v8-remediation>', 'exec')
          exec(normalized, {'__name__': '__main__'})

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              value = p.read_text(encoding='utf-8')
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(value.replace(old, new, 1), encoding='utf-8')

          # 1. Preserve the established sanitized `authorization` receipt
          # contract while retaining the new explicit `authority_ref`. Both
          # contain identifiers/provenance only; no approval hash or secret.
          p = Path('buddy_core/core/operator.py')
          op = p.read_text(encoding='utf-8')
          authority_ref = '''            "authority_ref": {
                  "approval_id": authorization.get("approval_id"),
                  "authorization_sequence": authorization.get("authorization_sequence"),
                  "payload_hash": authorization.get("payload_hash"),
                  "approver": authorization.get("approver"),
              },
          '''
          if op.count(authority_ref) != 1:
              raise SystemExit(f'operator sanitized authority block count={op.count(authority_ref)}')
          authority_both = authority_ref + '''            "authorization": {
                  "approval_id": authorization.get("approval_id"),
                  "authorization_sequence": authorization.get("authorization_sequence"),
                  "payload_hash": authorization.get("payload_hash"),
                  "approver": authorization.get("approver"),
              },
          '''
          p.write_text(op.replace(authority_ref, authority_both, 1), encoding='utf-8')

          # 2/3. Keep the 256-bit minimum. The old tests used deliberately short
          # fixtures that are now correctly rejected, so strengthen the fixtures
          # instead of weakening Watchmen key validation.
          tp = Path('tests/test_watchmen_audit_state.py')
          tests = tp.read_text(encoding='utf-8')
          if tests.count('an-explicit-operator-key') != 2:
              raise SystemExit('unexpected env-key fixture shape')
          if tests.count('key-from-an-external-file') != 2:
              raise SystemExit('unexpected file-key fixture shape')
          tests = tests.replace(
              'an-explicit-operator-key',
              '0123456789abcdef0123456789abcdef',
          )
          tests = tests.replace(
              'key-from-an-external-file',
              'fedcba9876543210fedcba9876543210',
          )
          tp.write_text(tests, encoding='utf-8')

          # 4. Productive means top-level COMPLETE plus at least one genuinely
          # successful internal/external receipt. Preserve compatibility with
          # existing internal COMPLETE receipts while excluding HELD/BLOCKED,
          # empty, malformed, or skip-only cycles from progress/productivity.
          lp = Path('scripts/autopilot/lane_supervisor.py')
          lane = lp.read_text(encoding='utf-8')
          a = lane.find('def productive_complete(receipt: dict[str, Any]) -> bool:\n')
          b = lane.find('def persist_cycle(\n', a)
          if a < 0 or b < 0:
              raise SystemExit('productive_complete boundaries missing')
          productive = '''def productive_complete(receipt: dict[str, Any]) -> bool:
              if str(receipt.get("status", "")) != "COMPLETE" or not receipt.get("mission_id"):
                  return False
              rows = receipt.get("receipts")
              if not isinstance(rows, list) or not rows:
                  return False
              if not all(isinstance(row, dict) for row in rows):
                  return False
              statuses = [str(row.get("status", "")) for row in rows]
              allowed = {"VERIFIED", "COMPLETE", "SKIPPED"}
              successful = {"VERIFIED", "COMPLETE"}
              return all(status in allowed for status in statuses) and any(
                  status in successful for status in statuses
              )


          '''
          import textwrap
          lane = lane[:a] + textwrap.dedent(productive) + lane[b:]
          lp.write_text(lane, encoding='utf-8')

          # Security regression: explicitly prove short operator-supplied keys
          # remain rejected now that the positive fixtures are 256-bit.
          tests = tp.read_text(encoding='utf-8')
          marker = '    def test_blank_key_sources_fail_closed_rather_than_defaulting(self):\n'
          weak_test = '''    def test_weak_explicit_key_fails_closed(self):
              self._env(saraqael.ENV_HMAC_KEY, "too-short")
              with self.assertRaises(WatchmenStateError):
                  saraqael._resolve_key()

          '''
          if marker not in tests:
              raise SystemExit('Watchmen weak-key test insertion marker missing')
          if 'def test_weak_explicit_key_fails_closed' not in tests:
              tests = tests.replace(marker, textwrap.dedent(weak_test) + marker, 1)
          tp.write_text(tests, encoding='utf-8')

          # The reused V8 payload deletes all one-shot helpers; enforce that the
          # current V9 helper is absent from the candidate tree too.
          for helper in Path('.github/workflows').glob('pr235-review-fix*.yml'):
              helper.unlink()

          for candidate in (
              Path('buddy_core/core/operator.py'),
              Path('buddy_core/watchmen/saraqael.py'),
              Path('scripts/autopilot/lane_supervisor.py'),
              Path('tests/test_watchmen_audit_state.py'),
          ):
              compile(candidate.read_text(encoding='utf-8'), str(candidate), 'exec')
          print('PR235_FOCUSED_REGRESSION_CLOSURE=APPLIED')
          PY

      - name: Install repository-wide test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Compile changed Python surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile buddy_core/core/authorization.py buddy_core/core/operator.py buddy_core/core/learning_engine.py buddy_core/buddy_web.py buddy_core/buddy_bridge_api.py buddy_core/sentinel.py buddy_core/watchmen/saraqael.py scripts/autopilot/lane_supervisor.py scripts/validate_elite_governance.py tests/test_governance_review_regressions.py tests/test_watchmen_audit_state.py

      - name: Focused independent-review regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_governance_review_regressions.py tests/test_buddy_authority_execution.py tests/test_watchmen_audit_state.py tests/test_watchmen_audit_failclosed.py tests/test_radah_autopilot.py tests/test_alpaca_paper_readonly_bridge.py

      - name: Elite governance validator
        run: python scripts/validate_elite_governance.py

      - name: Full repository Python suite
        run: python -m pytest -q

      - name: Publish tested remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test -z "$(find .github/workflows -maxdepth 1 -name 'pr235-review-fix*.yml' -print)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close independent governance review findings"
          git push origin HEAD:governance/elite-end-to-end-remediation
          echo "FINAL_FIX_SHA=$(git rev-parse HEAD)"
