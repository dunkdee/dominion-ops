name: PR235 Independent Review Fix Applicator

on:
  push:
    branches:
      - governance/elite-end-to-end-remediation

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: governance/elite-end-to-end-remediation
          fetch-depth: 0

      - name: Verify bootstrap lineage
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "8e2c85d21e213a216631bbd07c2f30a6c6f67ac9"
          test -z "$(git status --porcelain)"

      - name: Apply the nine independent-review fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def text(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, value):
              Path(path).write_text(value, encoding="utf-8")

          def replace_once(path, old, new):
              value = text(path)
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              write(path, value.replace(old, new, 1))

          # Authorization ledger: serialize state transitions across processes.
          p = "buddy_core/core/authorization.py"
          replace_once(p, "import os\nimport uuid\n", "import os\nimport tempfile\nimport uuid\nfrom contextlib import contextmanager\n")
          replace_once(
              p,
              "from typing import Any\n",
              '''from typing import Any

          try:
              import fcntl  # POSIX cross-process advisory locking.
          except ImportError:  # pragma: no cover - Windows path
              fcntl = None

          try:
              import msvcrt  # Windows cross-process byte-range locking.
          except ImportError:  # pragma: no cover - POSIX path
              msvcrt = None
          ''',
          )
          replace_once(
              p,
              '        self.sequence_path = self.root / "sequence.json"\n',
              '        self.sequence_path = self.root / "sequence.json"\n        self.lock_path = self.root / ".ledger.lock"\n',
          )
          replace_once(
              p,
              "    def _path(self, approval_id: str) -> Path:\n",
              '''    @contextmanager
              def _exclusive_lock(self):
                  """Serialize grant/deny/consume across processes; fail closed without a lock."""
                  try:
                      fd = os.open(self.lock_path, os.O_CREAT | os.O_RDWR, 0o600)
                  except OSError as exc:
                      raise AuthorizationError("authorization lock unavailable") from exc
                  try:
                      try:
                          os.chmod(self.lock_path, 0o600)
                      except OSError:
                          pass

                      if fcntl is not None:
                          try:
                              fcntl.flock(fd, fcntl.LOCK_EX)
                          except OSError as exc:
                              raise AuthorizationError("authorization lock unavailable") from exc
                          try:
                              yield
                          finally:
                              try:
                                  fcntl.flock(fd, fcntl.LOCK_UN)
                              except OSError:
                                  pass
                          return

                      if msvcrt is not None:  # pragma: no cover - Windows runner path
                          try:
                              if os.fstat(fd).st_size == 0:
                                  os.write(fd, b"\\0")
                                  os.fsync(fd)
                              os.lseek(fd, 0, os.SEEK_SET)
                              msvcrt.locking(fd, msvcrt.LK_LOCK, 1)
                          except OSError as exc:
                              raise AuthorizationError("authorization lock unavailable") from exc
                          try:
                              yield
                          finally:
                              try:
                                  os.lseek(fd, 0, os.SEEK_SET)
                                  msvcrt.locking(fd, msvcrt.LK_UNLCK, 1)
                              except OSError:
                                  pass
                          return

                      raise AuthorizationError("cross-process authorization lock unsupported")
                  finally:
                      os.close(fd)

              def _atomic_write_text(self, path: Path, value: str) -> None:
                  """Crash-safe, collision-free replacement for one ledger state file."""
                  fd, tmp = tempfile.mkstemp(
                      dir=str(path.parent), prefix=path.name + ".", suffix=".tmp"
                  )
                  try:
                      if hasattr(os, "fchmod"):
                          try:
                              os.fchmod(fd, 0o600)
                          except OSError:
                              pass
                      with os.fdopen(fd, "w", encoding="utf-8") as fh:
                          fd = None
                          fh.write(value)
                          fh.flush()
                          os.fsync(fh.fileno())
                      os.replace(tmp, path)
                      try:
                          path.chmod(0o600)
                      except OSError:
                          pass
                  except BaseException:
                      if fd is not None:
                          try:
                              os.close(fd)
                          except OSError:
                              pass
                      try:
                          os.unlink(tmp)
                      except OSError:
                          pass
                      raise

              def _path(self, approval_id: str) -> Path:
          ''',
          )
          replace_once(
              p,
              '''    def _write(self, record: dict) -> dict:
                  path = self._path(record["approval_id"])
                  tmp = path.with_suffix(".tmp")
                  tmp.write_text(canonical_json(record) + "\\n", encoding="utf-8")
                  os.replace(tmp, path)
                  try:
                      path.chmod(0o600)
                  except OSError:
                      pass
                  return record
          ''',
              '''    def _write(self, record: dict) -> dict:
                  path = self._path(record["approval_id"])
                  self._atomic_write_text(path, canonical_json(record) + "\\n")
                  return record
          ''',
          )
          replace_once(
              p,
              '''        tmp = self.sequence_path.with_suffix(".tmp")
                  tmp.write_text(canonical_json({"sequence": nxt}) + "\\n", encoding="utf-8")
                  os.replace(tmp, self.sequence_path)
                  return nxt
          ''',
              '''        self._atomic_write_text(
                      self.sequence_path, canonical_json({"sequence": nxt}) + "\\n"
                  )
                  return nxt
          ''',
          )
          replace_once(
              p,
              '    def grant(self, approval_id: str, *, approver: str = "founder") -> dict:\n',
              '''    def grant(self, approval_id: str, *, approver: str = "founder") -> dict:
                  with self._exclusive_lock():
                      return self._grant_locked(approval_id, approver=approver)

              def _grant_locked(self, approval_id: str, *, approver: str = "founder") -> dict:
          ''',
          )
          replace_once(
              p,
              '    def deny(self, approval_id: str, *, approver: str = "founder", reason: str = "") -> dict:\n',
              '''    def deny(self, approval_id: str, *, approver: str = "founder", reason: str = "") -> dict:
                  with self._exclusive_lock():
                      return self._deny_locked(approval_id, approver=approver, reason=reason)

              def _deny_locked(self, approval_id: str, *, approver: str = "founder", reason: str = "") -> dict:
          ''',
          )
          replace_once(
              p,
              '''    def verify_and_consume(self, approval_id: str, *, capability: str, instruction: str,
                                         content: Any = None, destination: str | None = None) -> dict:
          ''',
              '''    def verify_and_consume(self, approval_id: str, *, capability: str, instruction: str,
                                         content: Any = None, destination: str | None = None) -> dict:
                  with self._exclusive_lock():
                      return self._verify_and_consume_locked(
                          approval_id,
                          capability=capability,
                          instruction=instruction,
                          content=content,
                          destination=destination,
                      )

              def _verify_and_consume_locked(self, approval_id: str, *, capability: str, instruction: str,
                                              content: Any = None, destination: str | None = None) -> dict:
          ''',
          )

          # Operator: malformed/storage authorization failures become governed BLOCKED receipts.
          p = "buddy_core/core/operator.py"
          replace_once(
              p,
              "from core.authorization import AuthorizationLedger, payload_fingerprint\n",
              "from core.authorization import AuthorizationError, AuthorizationLedger, payload_fingerprint\n",
          )
          replace_once(
              p,
              "from buddy_core.core.authorization import AuthorizationLedger, payload_fingerprint\n",
              "from buddy_core.core.authorization import AuthorizationError, AuthorizationLedger, payload_fingerprint\n",
          )
          replace_once(
              p,
              '''            redeemed = self._ledger.verify_and_consume(
                          supplied,
                          capability=step["capability"],
                          instruction=step["instruction"],
                          content=step.get("content"),
                          destination=destination,
                      )
          ''',
              '''            try:
                          redeemed = self._ledger.verify_and_consume(
                              supplied,
                              capability=step["capability"],
                              instruction=step["instruction"],
                              content=step.get("content"),
                              destination=destination,
                          )
                      except AuthorizationError as exc:
                          redeemed = {"ok": False, "error": str(exc) or "authorization_error"}
                      except OSError:
                          redeemed = {"ok": False, "error": "authorization_storage_unavailable"}
          ''',
          )

          # Sentinel: distinguish governed-audit outage from ordinary file write failure.
          p = "buddy_core/sentinel.py"
          replace_once(
              p,
              '''                    except Exception as e:
                                  issues.append(f"Failed to write canonical {key} to {CANONICAL_TOKEN_FILE.name}: {e}")
          ''',
              '''                    except AuditUnavailable as e:
                                  issues.append(
                                      f"Canonical {key} mutation blocked/unaccepted: governed audit unavailable ({e})"
                                  )
                                  log.critical(
                                      f"  Canonical {key} mutation blocked/unaccepted because governed audit is unavailable: {e}"
                                  )
                              except Exception as e:
                                  issues.append(f"Failed to write canonical {key} to {CANONICAL_TOKEN_FILE.name}: {e}")
          ''',
          )
          replace_once(
              p,
              '''                except Exception as e:
                              issues.append(f"Failed to strip {key} from {env_file.name}: {e}")
          ''',
              '''                except AuditUnavailable as e:
                              issues.append(
                                  f"{key} desync mutation blocked/unaccepted: governed audit unavailable ({e})"
                              )
                              log.critical(
                                  f"  {key} desync mutation blocked/unaccepted because governed audit is unavailable: {e}"
                              )
                          except Exception as e:
                              issues.append(f"Failed to strip {key} from {env_file.name}: {e}")
          ''',
          )
          replace_once(
              p,
              '''            except Exception as e:
                          issues.append(f"Failed to sync {key} to {env_file.name}: {e}")
          ''',
              '''            except AuditUnavailable as e:
                          issues.append(
                              f"{key} sync mutation blocked/unaccepted: governed audit unavailable ({e})"
                          )
                          log.critical(
                              f"  {key} sync mutation blocked/unaccepted because governed audit is unavailable: {e}"
                          )
                      except Exception as e:
                          issues.append(f"Failed to sync {key} to {env_file.name}: {e}")
          ''',
          )

          # Saraqael: fsync parent directory after replacement so rename is crash-durable.
          p = "buddy_core/watchmen/saraqael.py"
          replace_once(
              p,
              '''        os.replace(tmp, path)
              except BaseException:
          ''',
              '''        os.replace(tmp, path)
                  if _posix_modes_required():
                      dir_fd = None
                      try:
                          flags = os.O_RDONLY | getattr(os, "O_DIRECTORY", 0)
                          dir_fd = os.open(str(directory), flags)
                          os.fsync(dir_fd)
                      except (OSError, NotImplementedError) as exc:
                          raise WatchmenStateError(
                              f"cannot fsync audit state directory after replacement: {exc}"
                          ) from exc
                      finally:
                          if dir_fd is not None:
                              try:
                                  os.close(dir_fd)
                              except OSError:
                                  pass
              except BaseException:
          ''',
          )

          # Governance validator: use the actual AST executor map, not substring presence.
          p = "scripts/validate_elite_governance.py"
          replace_once(p, "import json\nimport re\n", "import ast\nimport json\nimport re\n")
          replace_once(
              p,
              "\ndef collect_failures() -> list[dict]:\n",
              '''
          def _external_executor_bindings(source: str) -> set[str]:
              """Return literal keys from the real self._external_executors dict assignment."""
              try:
                  tree = ast.parse(source)
              except SyntaxError:
                  return set()

              bindings: set[str] = set()
              for node in ast.walk(tree):
                  if not isinstance(node, (ast.Assign, ast.AnnAssign)):
                      continue
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  is_map = any(
                      isinstance(target, ast.Attribute)
                      and isinstance(target.value, ast.Name)
                      and target.value.id == "self"
                      and target.attr == "_external_executors"
                      for target in targets
                  )
                  if not is_map or not isinstance(node.value, ast.Dict):
                      continue
                  for key in node.value.keys:
                      if isinstance(key, ast.Constant) and isinstance(key.value, str):
                          bindings.add(key.value)
              return bindings


          def collect_failures() -> list[dict]:
          ''',
          )
          replace_once(
              p,
              '''    enabled_external = [
                  cap for cap in registry.get("capabilities", [])
                  if cap.get("enabled", True) and str(cap.get("executor", "")).startswith("external:")
              ]
              for cap in enabled_external:
                  executor = str(cap.get("executor"))
                  # An enabled external capability is only real if the operator has a
                  # governed dispatch path. Merely declaring external:* is not an executor.
                  if executor not in operator or "_external_executors" not in operator:
                      failures.append({
                          "gate": "external_executor",
                          "reason": f"enabled external capability has no governed runtime executor: {cap.get('id')} ({executor})",
                      })
          ''',
              '''    enabled_external = [
                  cap for cap in registry.get("capabilities", [])
                  if cap.get("enabled", True) and str(cap.get("executor", "")).startswith("external:")
              ]
              wired_external = _external_executor_bindings(operator)
              for cap in enabled_external:
                  executor = str(cap.get("executor"))
                  # Only a real runtime map binding satisfies this gate; comments and
                  # unrelated strings cannot impersonate an executor.
                  if executor not in wired_external:
                      failures.append({
                          "gate": "external_executor",
                          "reason": f"enabled external capability has no governed runtime executor: {cap.get('id')} ({executor})",
                      })
          ''',
          )

          # Misplaced HTTP-dependency skip decorator.
          p = "tests/test_alpaca_paper_readonly_bridge.py"
          replace_once(
              p,
              '''@unittest.skipUnless(HTTP_DEPS, "fastapi/httpx not installed on this runner")

          def _route_paths(routes) -> set:
          ''',
              '''def _route_paths(routes) -> set:
          ''',
          )
          replace_once(
              p,
              "\n\nclass LiveServicePreservationTests(unittest.TestCase):\n",
              '\n\n@unittest.skipUnless(HTTP_DEPS, "fastapi/httpx not installed on this runner")\nclass LiveServicePreservationTests(unittest.TestCase):\n',
          )

          # Replace tautological key assertion with real shape/entropy sanity checks.
          p = "tests/test_watchmen_audit_state.py"
          replace_once(
              p,
              '''        self.assertGreaterEqual(len(key), 32)
                  self.assertEqual(len(set(key)), len(set(key)))
                  self.assertNotIn(b"dominion", key.lower())
          ''',
              '''        self.assertEqual(len(key), 64)
                  decoded = key.decode("ascii")
                  self.assertTrue(all(ch in "0123456789abcdef" for ch in decoded))
                  self.assertNotEqual(int(decoded, 16), 0)
                  self.assertNotIn(b"dominion", key.lower())
          ''',
          )

          # Full-suite dependency coverage.
          p = "requirements-test.txt"
          replace_once(p, "requests\n\n# FastAPI form parsing", "requests\njinja2\n\n# FastAPI form parsing")

          # Deployment workflows: allow canonical exact-SHA detached state, reject arbitrary branches.
          p = ".github/workflows/activate-alpha-paper-24x7.yml"
          replace_once(
              p,
              '''            test -z "$(git status --porcelain)" || { echo 'REFUSE: production worktree dirty'; exit 31; }
                      test "$(git branch --show-current)" = "main" || { echo 'REFUSE: production repo not on main'; exit 32; }
                      git fetch origin main
                      git cat-file -e "$expected_sha^{commit}"
                      test "$(git rev-parse origin/main)" = "$expected_sha" || { echo 'REFUSE: expected SHA is not origin/main'; exit 33; }
                      git merge --ff-only origin/main
                      release_sha="$(git rev-parse HEAD)"
          ''',
              '''            test -z "$(git status --porcelain)" || { echo 'REFUSE: production worktree dirty'; exit 31; }
                      branch="$(git branch --show-current)"
                      if [ -n "$branch" ] && [ "$branch" != "main" ]; then
                        echo 'REFUSE: production repo is on an unexpected branch'
                        exit 32
                      fi
                      git fetch origin main
                      git cat-file -e "$expected_sha^{commit}"
                      test "$(git rev-parse origin/main)" = "$expected_sha" || { echo 'REFUSE: expected SHA is not origin/main'; exit 33; }
                      if [ "$branch" = "main" ]; then
                        git merge --ff-only origin/main
                      else
                        test "$(git rev-parse HEAD)" = "$expected_sha" || { echo 'REFUSE: detached production HEAD is not the exact requested SHA'; exit 32; }
                      fi
                      release_sha="$(git rev-parse HEAD)"
          ''',
          )

          p = ".github/workflows/jurist-fix.yml"
          replace_once(
              p,
              '''            test -z "$(git status --porcelain)" || { echo "REFUSE: production worktree is dirty"; exit 31; }
                      test "$(git branch --show-current)" = "main" || { echo "REFUSE: production repo is not on main"; exit 32; }
                      git fetch origin main
                      test "$(git rev-parse origin/main)" = "$EXPECTED_SHA" || { echo "REFUSE: requested SHA does not equal origin/main"; exit 33; }
                      git merge --ff-only origin/main
                      test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo "REFUSE: deployed provenance mismatch"; exit 34; }
          ''',
              '''            test -z "$(git status --porcelain)" || { echo "REFUSE: production worktree is dirty"; exit 31; }
                      branch="$(git branch --show-current)"
                      if [ -n "$branch" ] && [ "$branch" != "main" ]; then
                        echo "REFUSE: production repo is on an unexpected branch"
                        exit 32
                      fi
                      git fetch origin main
                      test "$(git rev-parse origin/main)" = "$EXPECTED_SHA" || { echo "REFUSE: requested SHA does not equal origin/main"; exit 33; }
                      if [ "$branch" = "main" ]; then
                        git merge --ff-only origin/main
                      else
                        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo "REFUSE: detached production HEAD is not the exact requested SHA"; exit 32; }
                      fi
                      test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo "REFUSE: deployed provenance mismatch"; exit 34; }
          ''',
          )

          regression = '''"""Regression coverage for PR #235 independent review findings."""
          from __future__ import annotations

          import importlib.util
          import multiprocessing
          import os
          import sys
          import tempfile
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          sys.path.insert(0, str(ROOT))
          sys.path.insert(0, str(ROOT / "buddy_core"))

          from core.authorization import AuthorizationLedger  # noqa: E402
          from core.operator import BuddyOperator  # noqa: E402

          CAP = "external.publish"
          INSTRUCTION = "publish the approved traffic package"
          CONTENT = {"body": "the approved words"}
          DEST = "dominionhealing.org/r/voltedge-speaker-offer-v1"


          def _redeem_worker(state_dir: str, approval_id: str, start, out) -> None:
              ledger = AuthorizationLedger(Path(state_dir))
              start.wait()
              out.put(ledger.verify_and_consume(
                  approval_id,
                  capability=CAP,
                  instruction=INSTRUCTION,
                  content=CONTENT,
                  destination=DEST,
              ))


          class AuthorizationReviewRegressions(unittest.TestCase):
              @unittest.skipUnless(os.name == "posix", "cross-process race regression uses fork")
              def test_same_authorization_can_be_consumed_by_exactly_one_process(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      state = Path(tmp)
                      ledger = AuthorizationLedger(state)
                      request = ledger.request(
                          mission_id="race", step=1, capability=CAP,
                          instruction=INSTRUCTION, content=CONTENT, destination=DEST,
                      )
                      self.assertTrue(ledger.grant(request["approval_id"])["ok"])
                      ctx = multiprocessing.get_context("fork")
                      start = ctx.Event()
                      out = ctx.Queue()
                      workers = [ctx.Process(
                          target=_redeem_worker,
                          args=(str(state), request["approval_id"], start, out),
                      ) for _ in range(8)]
                      for worker in workers:
                          worker.start()
                      start.set()
                      for worker in workers:
                          worker.join(10)
                          self.assertEqual(worker.exitcode, 0)
                      results = [out.get(timeout=2) for _ in workers]
                      self.assertEqual(sum(bool(r.get("ok")) for r in results), 1)
                      self.assertEqual(
                          sum(r.get("error") == "already_consumed" for r in results),
                          len(workers) - 1,
                      )

              def test_malformed_authorization_id_returns_blocked_receipt(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      operator = BuddyOperator(state_dir=Path(tmp))
                      plan = {
                          "mission_id": "malformed_auth",
                          "objective": "must block",
                          "evidence_policy": "HYBRID",
                          "steps": [{
                              "capability": CAP,
                              "instruction": INSTRUCTION,
                              "content": CONTENT,
                              "destination": DEST,
                              "authorization_id": "../approval",
                          }],
                      }
                      record = operator.execute(plan, session_id="review-regression")
                      self.assertEqual(record["status"], "BLOCKED")
                      self.assertEqual(record["receipts"][-1]["status"], "BLOCKED")


          class GovernanceReviewRegressions(unittest.TestCase):
              @classmethod
              def setUpClass(cls):
                  path = ROOT / "scripts" / "validate_elite_governance.py"
                  spec = importlib.util.spec_from_file_location("elite_governance_review", path)
                  assert spec and spec.loader
                  cls.gov = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(cls.gov)

              def test_external_executor_gate_uses_real_ast_assignment(self):
                  fake = '# self._external_executors = {"external:publish": "fake"}\\n' \
                         'note = "external:publish _external_executors"\\n'
                  self.assertEqual(self.gov._external_executor_bindings(fake), set())
                  real = 'self._external_executors = {"external:publish": self._publish}\\n'
                  self.assertEqual(self.gov._external_executor_bindings(real), {"external:publish"})

              def test_deployment_workflows_accept_only_main_or_exact_detached_head(self):
                  for rel in (
                      ".github/workflows/activate-alpha-paper-24x7.yml",
                      ".github/workflows/jurist-fix.yml",
                  ):
                      source = (ROOT / rel).read_text(encoding="utf-8")
                      self.assertIn('branch="$(git branch --show-current)"', source)
                      self.assertIn('[ -n "$branch" ] && [ "$branch" != "main" ]', source)
                      self.assertIn("detached production HEAD", source)

              def test_full_suite_declares_jinja2(self):
                  deps = {
                      line.strip().lower()
                      for line in (ROOT / "requirements-test.txt").read_text(encoding="utf-8").splitlines()
                      if line.strip() and not line.startswith("#")
                  }
                  self.assertIn("jinja2", deps)

              def test_skip_decorator_is_on_live_service_test_class(self):
                  source = (ROOT / "tests" / "test_alpaca_paper_readonly_bridge.py").read_text(encoding="utf-8")
                  marker = '@unittest.skipUnless(HTTP_DEPS, "fastapi/httpx not installed on this runner")'
                  self.assertNotIn(marker + "\\n\\ndef _route_paths", source)
                  self.assertIn(marker + "\\nclass LiveServicePreservationTests", source)

              def test_sentinel_has_explicit_audit_unavailable_paths_for_env_mutations(self):
                  source = (ROOT / "buddy_core" / "sentinel.py").read_text(encoding="utf-8")
                  self.assertGreaterEqual(source.count("except AuditUnavailable as e:"), 4)
                  self.assertIn("mutation blocked/unaccepted", source)

              def test_saraqael_fsyncs_parent_directory_after_replace(self):
                  source = (ROOT / "buddy_core" / "watchmen" / "saraqael.py").read_text(encoding="utf-8")
                  atomic = source.split("def _atomic_write", 1)[1].split("# ── Chain helpers", 1)[0]
                  self.assertIn("os.replace(tmp, path)", atomic)
                  self.assertIn("os.open(str(directory)", atomic)
                  self.assertIn("os.fsync(dir_fd)", atomic)


          if __name__ == "__main__":
              unittest.main()
          '''
          # Dedent the embedded regression module before writing it.
          import textwrap
          Path("tests/test_governance_review_regressions.py").write_text(
              textwrap.dedent(regression), encoding="utf-8"
          )

          # One-shot applicator: remove itself from the final candidate tree.
