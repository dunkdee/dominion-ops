name: PR235 Round Two Closure

on:
  push:
    branches:
      - governance/elite-end-to-end-remediation

permissions:
  contents: write

jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: governance/elite-end-to-end-remediation
          fetch-depth: 0

      - name: Verify staged source
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor a26ca7a44dc2b7c1270ed84990e83836fc00d392 HEAD
          test -f .github/scripts/pr235_round2_patch.py
          test -z "$(git status --porcelain)"

      - name: Apply final independent-review fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python .github/scripts/pr235_round2_patch.py
          rm -f .github/workflows/pr235-round2-apply.yml
          git diff --check
          test ! -e .github/scripts/pr235_round2_patch.py
          test ! -e .github/workflows/pr235-round2-apply.yml

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run round-two regressions
        run: python -m pytest -q tests/test_pr235_final_review_round2.py tests/test_pr235_final_authority_closure.py tests/test_governance_review_regressions.py tests/test_buddy_authority_execution.py tests/test_radah_autopilot.py

      - name: Run Elite Governance validator
        run: python scripts/validate_elite_governance.py

      - name: Run full repository Python suite
        run: python -m pytest -q

      - name: Publish tested final source
        shell: bash
        run: |
          set -Eeuo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close final PR235 independent review findings"
          git push origin HEAD:governance/elite-end-to-end-remediation
          echo "FINAL_SHA=$(git rev-parse HEAD)"
