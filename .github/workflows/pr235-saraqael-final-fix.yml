name: PR235 Saraqael Final Review Closure

on:
  push:
    branches:
      - governance/elite-end-to-end-remediation

permissions:
  contents: write

jobs:
  close-review-findings:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: governance/elite-end-to-end-remediation
          fetch-depth: 0

      - name: Verify bounded helper-only delta
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 4cc44036f8d5da4206d59582d400eb34facc22b9 HEAD
          unexpected="$(git diff --name-only 4cc44036f8d5da4206d59582d400eb34facc22b9 HEAD | grep -vE '^\.github/(workflows/pr235-saraqael-final-fix\.yml|scripts/pr235_saraqael_patch\.py)$' || true)"
          test -z "$unexpected" || { printf 'Unexpected helper delta:\n%s\n' "$unexpected"; exit 41; }
          test -z "$(git status --porcelain)"

      - name: Apply bounded Saraqael review patch
        run: python .github/scripts/pr235_saraqael_patch.py

      - name: Install repository test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run focused review regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q \
            tests/test_watchmen_review_closure.py \
            tests/test_watchmen_audit_state.py \
            tests/test_watchmen_audit_failclosed.py \
            tests/test_buddy_authority_execution.py \
            tests/test_radah_autopilot.py

      - name: Run Elite Governance validator
        run: python scripts/validate_elite_governance.py

      - name: Run full repository Python suite
        run: python -m pytest -q

      - name: Publish exact tested closure
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test ! -e .github/workflows/pr235-saraqael-final-fix.yml
          test ! -e .github/scripts/pr235_saraqael_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close final Saraqael review findings"
          git push origin HEAD:governance/elite-end-to-end-remediation
          echo "FINAL_SHA=$(git rev-parse HEAD)"
