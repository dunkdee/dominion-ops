name: PR235 Source Publish V11

on:
  push:
    branches:
      - governance/elite-end-to-end-remediation

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: governance/elite-end-to-end-remediation
          fetch-depth: 0

      - name: Verify exact bootstrap parent
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "7168a0888e87f99e04085851b55ee1a5f94093ca"
          test -z "$(git status --porcelain)"

      - name: Apply already-tested V10 remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr235-review-fix-v10.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n\n      - name: Install repository-wide test dependencies"
          if start not in source or end not in source:
              raise SystemExit('V10 remediation payload markers missing')
          payload = source.split(start, 1)[1].split(end, 1)[0]
          normalized = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in payload.splitlines()
          ) + '\n'
          compile(normalized, '<pr235-v10-remediation>', 'exec')
          exec(normalized, {'__name__': '__main__'})
          PY

      - name: Install repository-wide test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Focused independent-review regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_governance_review_regressions.py tests/test_buddy_authority_execution.py tests/test_watchmen_audit_state.py tests/test_watchmen_audit_failclosed.py tests/test_radah_autopilot.py tests/test_alpaca_paper_readonly_bridge.py

      - name: Elite governance validator
        run: python scripts/validate_elite_governance.py

      - name: Full repository Python suite
        run: python -m pytest -q

      - name: Record workflow delta for connector follow-up
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'NON_HELPER_WORKFLOW_DELTA_BEGIN'
          git status --short -- .github/workflows | grep -v 'pr235-' || true
          for f in $(git diff --name-only -- .github/workflows | grep -v '/pr235-' || true); do
            echo "WORKFLOW_DIFF_BEGIN=$f"
            git diff -- "$f"
            echo "WORKFLOW_DIFF_END=$f"
          done
          echo 'NON_HELPER_WORKFLOW_DELTA_END'

      - name: Publish tested non-workflow remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**'
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          git commit -m "fix: close PR235 independent governance regressions"
          git push origin HEAD:governance/elite-end-to-end-remediation
          echo "SOURCE_FIX_SHA=$(git rev-parse HEAD)"
