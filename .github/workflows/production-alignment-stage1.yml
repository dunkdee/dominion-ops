name: Production Alignment Stage 1

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type exactly ALIGN_STAGE_1 to apply the guarded repair
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-alignment-stage-1
  cancel-in-progress: false

jobs:
  align:
    if: ${{ inputs.confirm == 'ALIGN_STAGE_1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      REPORT_DIR: /tmp/dominion-alignment-stage1
      REPORT_FILE: /tmp/dominion-alignment-stage1/result.json
      REPORT_BRANCH: audit/alignment-stage1-20260721
      REPORT_PATH: governance/stage1_result.json
      ARTIFACT_NAME: dominion-alignment-stage1

    steps:
      - name: Validate VM connection secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Configure strict SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Apply guarded alignment repair
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$REPORT_DIR"
          ssh \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VM_USER@$VM_HOST" 'sudo -n python3 -' > "$REPORT_FILE" <<'PY'
          import json
          import subprocess
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          SHOW_PROPERTIES = (
              "LoadState,ActiveState,SubState,UnitFileState,NRestarts,MainPID,"
              "Description,FragmentPath"
          )

          duplicate_pairs = [
              ("alchemist-api.service", "dominion-alchemist.service"),
              ("conductor-api.service", "dominion-conductor.service"),
              ("juris-api.service", "dominion-juris.service"),
          ]
          approval_gated_units = [
              "conductor-autonomous.service",
              "dominion-social-poster.service",
              "dominion-publish.service",
              "dominion-youtube.service",
              "dominion-kdp.service",
          ]
          surplus_unit = "dominion-surplus-scraper.service"
          observed_units = sorted(
              {item for pair in duplicate_pairs for item in pair}
              | set(approval_gated_units)
              | {surplus_unit}
          )

          def command(args, timeout=30):
              result = subprocess.run(
                  args,
                  check=False,
                  capture_output=True,
                  text=True,
                  timeout=timeout,
              )
              return {
                  "returncode": result.returncode,
                  "stdout": result.stdout.strip()[:4000],
                  "stderr": result.stderr.strip()[:4000],
              }

          def unit_state(unit):
              result = command([
                  "systemctl",
                  "show",
                  unit,
                  f"--property={SHOW_PROPERTIES}",
                  "--no-pager",
              ])
              values = {"unit": unit}
              for line in result["stdout"].splitlines():
                  if "=" in line:
                      key, value = line.split("=", 1)
                      values[key] = value
              values["query_returncode"] = result["returncode"]
              return values

          def loaded(state):
              return state.get("LoadState") == "loaded"

          actions = []
          skipped = []
          errors = []
          before = {unit: unit_state(unit) for unit in observed_units}

          for legacy, canonical in duplicate_pairs:
              legacy_state = before[legacy]
              canonical_state = before[canonical]
              canonical_running = (
                  canonical_state.get("ActiveState") == "active"
                  and canonical_state.get("SubState") == "running"
              )
              legacy_looping = (
                  legacy_state.get("ActiveState") in {"activating", "failed"}
                  or legacy_state.get("SubState") == "auto-restart"
              )
              if not loaded(legacy_state):
                  skipped.append({"unit": legacy, "reason": "legacy unit not loaded"})
                  continue
              if not canonical_running:
                  skipped.append({
                      "unit": legacy,
                      "reason": "canonical replacement is not active/running",
                      "canonical": canonical,
                  })
                  continue
              if not legacy_looping:
                  skipped.append({
                      "unit": legacy,
                      "reason": "legacy unit is not in a proven restart/failure loop",
                  })
                  continue
              stop = command(["systemctl", "stop", legacy])
              disable = command(["systemctl", "disable", legacy])
              command(["systemctl", "reset-failed", legacy])
              if stop["returncode"] == 0 and disable["returncode"] == 0:
                  actions.append({
                      "unit": legacy,
                      "action": "stopped_and_disabled_duplicate",
                      "canonical": canonical,
                  })
              else:
                  errors.append({
                      "unit": legacy,
                      "operation": "disable_duplicate",
                      "stop_returncode": stop["returncode"],
                      "disable_returncode": disable["returncode"],
                  })

          for unit in approval_gated_units:
              state = before[unit]
              if not loaded(state):
                  skipped.append({"unit": unit, "reason": "approval-gated unit not loaded"})
                  continue
              if state.get("ActiveState") in {"active", "activating", "reloading"}:
                  stop = command(["systemctl", "stop", unit])
                  if stop["returncode"] != 0:
                      errors.append({
                          "unit": unit,
                          "operation": "stop_approval_gated_unit",
                          "returncode": stop["returncode"],
                      })
                      continue
              disable = command(["systemctl", "disable", unit])
              command(["systemctl", "reset-failed", unit])
              if disable["returncode"] == 0:
                  actions.append({
                      "unit": unit,
                      "action": "disabled_pending_human_approval",
                  })
              else:
                  errors.append({
                      "unit": unit,
                      "operation": "disable_approval_gated_unit",
                      "returncode": disable["returncode"],
                  })

          surplus_state = before[surplus_unit]
          surplus_stuck = (
              surplus_state.get("ActiveState") == "activating"
              or surplus_state.get("SubState") in {"start", "auto-restart"}
          )
          if loaded(surplus_state) and surplus_stuck:
              stop = command(["systemctl", "stop", surplus_unit], timeout=60)
              disable = command(["systemctl", "disable", surplus_unit])
              command(["systemctl", "reset-failed", surplus_unit])
              if stop["returncode"] == 0 and disable["returncode"] == 0:
                  actions.append({
                      "unit": surplus_unit,
                      "action": "quarantined_stuck_scraper",
                      "preserved_services": [
                          "dominion-surplus-dashboard.service",
                          "dominion-review-queue.service",
                      ],
                  })
              else:
                  errors.append({
                      "unit": surplus_unit,
                      "operation": "quarantine_stuck_scraper",
                      "stop_returncode": stop["returncode"],
                      "disable_returncode": disable["returncode"],
                  })
          else:
              skipped.append({
                  "unit": surplus_unit,
                  "reason": "scraper no longer appears stuck; no change applied",
              })

          after = {unit: unit_state(unit) for unit in observed_units}

          core_units = [
              "caddy.service",
              "dominion-alchemist.service",
              "dominion-conductor.service",
              "dominion-juris.service",
              "dominion-alpha.service",
              "dominion-gatekeeper.service",
              "dominion-store.service",
          ]
          core_unit_state = {unit: unit_state(unit) for unit in core_units}

          def health(name, port, path):
              url = f"http://127.0.0.1:{port}{path}"
              try:
                  with urllib.request.urlopen(url, timeout=5) as response:
                      return {
                          "name": name,
                          "port": port,
                          "path": path,
                          "reachable": True,
                          "status": response.status,
                      }
              except urllib.error.HTTPError as exc:
                  return {
                      "name": name,
                      "port": port,
                      "path": path,
                      "reachable": True,
                      "status": exc.code,
                  }
              except Exception as exc:
                  return {
                      "name": name,
                      "port": port,
                      "path": path,
                      "reachable": False,
                      "status": None,
                      "error_type": type(exc).__name__,
                  }

          checks = [
              health("baby-api", 8080, "/"),
              health("wix-agent", 8082, "/ready"),
              health("dominion-web", 8090, "/"),
              health("n8n", 5678, "/healthz"),
              health("alpha-engine", 8787, "/health"),
          ]
          unhealthy_units = [
              unit
              for unit, state in core_unit_state.items()
              if state.get("ActiveState") != "active"
              or state.get("SubState") != "running"
          ]
          unhealthy_http = [
              item["name"]
              for item in checks
              if not item["reachable"] or item["status"] != 200
          ]

          success = not errors and not unhealthy_units and not unhealthy_http
          payload = {
              "alignment_stage": 1,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "success": success,
              "actions": actions,
              "skipped": skipped,
              "errors": errors,
              "before": before,
              "after": after,
              "core_units": core_unit_state,
              "health_checks": checks,
              "unhealthy_core_units": unhealthy_units,
              "unhealthy_health_checks": unhealthy_http,
              "safety": {
                  "secrets_collected": False,
                  "environment_values_collected": False,
                  "logs_collected": False,
                  "unit_file_contents_collected": False,
                  "persistent_data_deleted": False,
                  "canonical_services_restarted": False,
              },
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

          python3 -m json.tool "$REPORT_FILE" >/dev/null
          chmod 600 "$REPORT_FILE"

      - name: Upload private Stage 1 report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPORT_FILE }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 9

      - name: Publish Stage 1 audit branch
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            const sourceSha = context.sha;
            const ref = `heads/${branch}`;
            try {
              await github.rest.git.getRef({ owner, repo, ref });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: sourceSha,
              });
            }
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, 'utf8'));
            report.workflow = {
              run_id: context.runId,
              run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              source_sha: sourceSha,
              artifact_name: process.env.ARTIFACT_NAME,
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              message: `audit: production alignment Stage 1 run ${context.runId}`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Enforce successful result
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_FILE"]).read_text(encoding="utf-8"))
          if not report.get("success"):
              raise SystemExit(
                  "Stage 1 completed with a failed core verification; inspect the private report"
              )
          PY

      - name: Remove temporary runner material
        if: ${{ always() }}
        run: |
          set -eu
          rm -rf "$REPORT_DIR"
          rm -f ~/.ssh/id_vm ~/.ssh/known_hosts
