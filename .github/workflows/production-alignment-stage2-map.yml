name: Production Alignment Stage 2 Map

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type exactly MAP_STAGE_2 to run the read-only ownership map
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-alignment-stage2-map
  cancel-in-progress: false

jobs:
  map:
    if: ${{ inputs.confirm == 'MAP_STAGE_2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      REPORT_DIR: /tmp/dominion-alignment-stage2
      REPORT_FILE: /tmp/dominion-alignment-stage2/stage2_map.json
      REPORT_BRANCH: audit/alignment-stage2-map-20260721
      REPORT_PATH: governance/stage2_map.json
      ARTIFACT_NAME: dominion-alignment-stage2-map

    steps:
      - name: Publish run pointer
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            const sourceSha = context.sha;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: sourceSha,
              });
            }
            const report = {
              map_version: 2,
              status: 'started',
              workflow: {
                run_id: context.runId,
                run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                source_sha: sourceSha,
                artifact_name: process.env.ARTIFACT_NAME,
              },
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `audit: Stage-2 map run ${context.runId} started`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Validate VM connection secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Configure strict SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Collect fault-tolerant read-only map
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$REPORT_DIR"
          ssh \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VM_USER@$VM_HOST" 'python3 -' > "$REPORT_FILE" <<'PY'
          import hashlib
          import json
          import re
          import shutil
          import socket
          import subprocess
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          KEYWORDS = (
              "dominion", "conductor", "juris", "alchemist", "n8n", "caddy",
              "gemini", "alpha", "surplus", "wix", "tiktok", "youtube",
              "kdp", "backup", "guardian", "sentinel", "gatekeeper",
          )
          CRITICAL = (
              "caddy.service", "dominion-alchemist.service", "dominion-alpha.service",
              "dominion-conductor.service", "dominion-gatekeeper.service",
              "dominion-juris.service", "dominion-store.service", "gemini-server.service",
          )
          HEALTH = (
              ("baby-api", 8080, "/"), ("wix-agent", 8082, "/ready"),
              ("dominion-web", 8090, "/"), ("n8n", 5678, "/healthz"),
              ("alpha-engine", 8787, "/health"), ("conductor", 5060, "/healthz"),
          )
          probe_errors = []

          def command(args, timeout=20, cwd=None):
              try:
                  result = subprocess.run(
                      args, cwd=cwd, check=False, capture_output=True,
                      text=True, timeout=timeout,
                  )
                  return {"returncode": result.returncode, "stdout": (result.stdout or "").strip()}
              except Exception as exc:
                  probe_errors.append({"probe": args[0] if args else "unknown", "error_type": type(exc).__name__})
                  return {"returncode": None, "stdout": ""}

          def first(value):
              return value.splitlines()[0].strip() if value else ""

          def safe_int(value):
              match = re.search(r"-?\d+", value or "")
              if not match:
                  return None
              try:
                  return int(match.group(0))
              except ValueError:
                  return None

          def prop(unit, name):
              result = command(["systemctl", "show", unit, "--property", name, "--value"])
              return first(result["stdout"]) if result["returncode"] == 0 else ""

          def service_names():
              names = set(CRITICAL)
              for args in (
                  ["systemctl", "list-units", "--all", "--type=service", "--no-legend", "--no-pager"],
                  ["systemctl", "list-unit-files", "--type=service", "--no-legend", "--no-pager"],
              ):
                  result = command(args)
                  for line in result["stdout"].splitlines():
                      parts = line.split()
                      name = parts[0] if parts else ""
                      lowered = name.lower()
                      if name.endswith(".service") and any(key in lowered for key in KEYWORDS):
                          names.add(name)
              return sorted(names)

          def service_record(unit):
              return {
                  "unit": unit,
                  "description": prop(unit, "Description"),
                  "load_state": prop(unit, "LoadState"),
                  "active_state": prop(unit, "ActiveState"),
                  "sub_state": prop(unit, "SubState"),
                  "unit_file_state": prop(unit, "UnitFileState"),
                  "fragment_path": prop(unit, "FragmentPath") or None,
                  "working_directory": prop(unit, "WorkingDirectory") or None,
                  "user": prop(unit, "User") or None,
                  "restart_policy": prop(unit, "Restart") or None,
                  "restart_usec": prop(unit, "RestartUSec") or None,
                  "n_restarts": safe_int(prop(unit, "NRestarts")),
                  "memory_current": safe_int(prop(unit, "MemoryCurrent")),
                  "result": prop(unit, "Result") or None,
                  "triggered_by": sorted(filter(None, prop(unit, "TriggeredBy").split())),
              }

          def timer_records():
              result = command(["systemctl", "list-unit-files", "--type=timer", "--no-legend", "--no-pager"])
              records = []
              for line in result["stdout"].splitlines():
                  parts = line.split()
                  unit = parts[0] if parts else ""
                  lowered = unit.lower()
                  if not unit.endswith(".timer") or not any(key in lowered for key in KEYWORDS):
                      continue
                  records.append({
                      "unit": unit,
                      "active_state": prop(unit, "ActiveState"),
                      "unit_file_state": prop(unit, "UnitFileState"),
                      "next_elapse": prop(unit, "NextElapseUSecRealtime") or None,
                      "last_trigger": prop(unit, "LastTriggerUSec") or None,
                      "triggers": sorted(filter(None, prop(unit, "Triggers").split())),
                  })
              return records

          def docker_records():
              if not shutil.which("docker"):
                  return {"available": False, "containers": [], "compose_projects": []}
              result = command(["docker", "ps", "--all", "--quiet"])
              containers = []
              for container_id in result["stdout"].splitlines():
                  inspected = command(["docker", "inspect", container_id], timeout=30)
                  if inspected["returncode"] != 0:
                      continue
                  try:
                      item = json.loads(inspected["stdout"])[0]
                  except Exception as exc:
                      probe_errors.append({"probe": "docker-inspect", "error_type": type(exc).__name__})
                      continue
                  labels = item.get("Config", {}).get("Labels") or {}
                  ports = []
                  for container_port, bindings in (item.get("NetworkSettings", {}).get("Ports") or {}).items():
                      for binding in bindings or []:
                          ports.append({
                              "container_port": container_port,
                              "host_ip": binding.get("HostIp"),
                              "host_port": binding.get("HostPort"),
                          })
                  host = item.get("HostConfig", {}) or {}
                  state = item.get("State", {}) or {}
                  health = state.get("Health") or {}
                  restart = host.get("RestartPolicy") or {}
                  containers.append({
                      "name": str(item.get("Name") or "").lstrip("/"),
                      "image": item.get("Config", {}).get("Image"),
                      "state": state.get("Status"),
                      "health": health.get("Status"),
                      "restart_policy": restart.get("Name"),
                      "memory_limit": host.get("Memory"),
                      "nano_cpus": host.get("NanoCpus"),
                      "pids_limit": host.get("PidsLimit"),
                      "compose_project": labels.get("com.docker.compose.project"),
                      "compose_service": labels.get("com.docker.compose.service"),
                      "compose_working_dir": labels.get("com.docker.compose.project.working_dir"),
                      "compose_config_files": labels.get("com.docker.compose.project.config_files"),
                      "ports": ports,
                  })
              compose = command(["docker", "compose", "ls", "--format", "json"])
              projects = []
              if compose["returncode"] == 0 and compose["stdout"]:
                  try:
                      parsed = json.loads(compose["stdout"])
                      for item in parsed if isinstance(parsed, list) else [parsed]:
                          if isinstance(item, dict):
                              projects.append({
                                  "name": item.get("Name"),
                                  "status": item.get("Status"),
                                  "config_files": item.get("ConfigFiles"),
                              })
                  except Exception as exc:
                      probe_errors.append({"probe": "docker-compose", "error_type": type(exc).__name__})
              return {"available": True, "containers": containers, "compose_projects": projects}

          def sanitize_remote(value):
              value = (value or "").strip()
              if not value:
                  return None
              if "://" not in value:
                  return value
              parsed = urllib.parse.urlsplit(value)
              host = parsed.hostname or ""
              if parsed.port:
                  host = f"{host}:{parsed.port}"
              return urllib.parse.urlunsplit((parsed.scheme, host, parsed.path, parsed.query, parsed.fragment))

          def file_hash(path):
              digest = hashlib.sha256()
              try:
                  with path.open("rb") as handle:
                      for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                          digest.update(chunk)
                  return digest.hexdigest()
              except OSError as exc:
                  probe_errors.append({"probe": "file-hash", "error_type": type(exc).__name__})
                  return None

          def repository_record(path):
              path = path.expanduser()
              record = {
                  "path": str(path), "exists": path.exists(), "is_git_repository": False,
                  "head": None, "branch": None, "origin": None,
                  "dirty_entry_count": None, "compose_sha256": None,
              }
              if not path.is_dir():
                  return record
              head = command(["git", "rev-parse", "HEAD"], cwd=str(path))
              if head["returncode"] == 0:
                  record["is_git_repository"] = True
                  record["head"] = first(head["stdout"])
                  branch = command(["git", "branch", "--show-current"], cwd=str(path))
                  record["branch"] = first(branch["stdout"]) or None
                  origin = command(["git", "remote", "get-url", "origin"], cwd=str(path))
                  record["origin"] = sanitize_remote(first(origin["stdout"])) if origin["returncode"] == 0 else None
                  dirty = command(["git", "status", "--porcelain"], cwd=str(path))
                  record["dirty_entry_count"] = len(dirty["stdout"].splitlines()) if dirty["returncode"] == 0 else None
              compose = path / "docker-compose.yml"
              if compose.is_file():
                  record["compose_sha256"] = file_hash(compose)
              return record

          def health_check(name, port, path):
              try:
                  with urllib.request.urlopen(f"http://127.0.0.1:{port}{path}", timeout=5) as response:
                      return {"name": name, "port": port, "path": path, "reachable": True, "status": response.status}
              except urllib.error.HTTPError as exc:
                  return {"name": name, "port": port, "path": path, "reachable": True, "status": exc.code}
              except Exception as exc:
                  return {"name": name, "port": port, "path": path, "reachable": False, "status": None, "error_type": type(exc).__name__}

          def backup_inventory():
              records = []
              for path in (
                  Path("/var/backups"), Path("/opt/dominion/backups"),
                  Path.home() / "backups", Path.home() / "dominion" / "backups",
                  Path.home() / "dominion-ops" / "backups",
              ):
                  record = {"path": str(path), "exists": path.is_dir(), "file_count": 0, "latest_mtime": None, "total_bytes": 0}
                  latest = None
                  if path.is_dir():
                      try:
                          iterator = path.rglob("*")
                          for item in iterator:
                              try:
                                  if not item.is_file():
                                      continue
                                  stat = item.stat()
                              except OSError:
                                  continue
                              record["file_count"] += 1
                              record["total_bytes"] += stat.st_size
                              latest = max(latest or stat.st_mtime, stat.st_mtime)
                      except OSError as exc:
                          probe_errors.append({"probe": "backup-inventory", "error_type": type(exc).__name__})
                  if latest is not None:
                      record["latest_mtime"] = datetime.fromtimestamp(latest, timezone.utc).isoformat()
                  records.append(record)
              return records

          names = service_names()
          services = [service_record(unit) for unit in names]
          start = {unit: safe_int(prop(unit, "NRestarts")) or 0 for unit in CRITICAL}
          time.sleep(20)
          end = {unit: safe_int(prop(unit, "NRestarts")) or 0 for unit in CRITICAL}
          deltas = {
              unit: {
                  "start": start[unit], "end": end[unit], "delta": end[unit] - start[unit],
                  "active_state": prop(unit, "ActiveState"), "sub_state": prop(unit, "SubState"),
              }
              for unit in CRITICAL
          }

          caddy_file = Path("/etc/caddy/Caddyfile")
          caddy = {"config_exists": caddy_file.is_file(), "validator_available": bool(shutil.which("caddy")), "valid": None}
          if caddy_file.is_file() and shutil.which("caddy"):
              caddy["valid"] = command(["caddy", "validate", "--config", str(caddy_file)])["returncode"] == 0

          payload = {
              "map_version": 2,
              "status": "success",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "host": {"hostname": socket.gethostname()},
              "repositories": [repository_record(path) for path in (
                  Path.home() / "dominion-ops", Path.home() / "desktop-tutorial",
                  Path("/opt/dominion"), Path("/opt/dominions-ark"),
              )],
              "services": services,
              "timers": timer_records(),
              "restart_deltas_20_seconds": deltas,
              "docker": docker_records(),
              "health_checks": [health_check(*item) for item in HEALTH],
              "backup_inventory": backup_inventory(),
              "caddy_validation": caddy,
              "probe_errors": probe_errors,
              "safety": {
                  "services_changed": False,
                  "environment_values_collected": False,
                  "logs_collected": False,
                  "file_contents_collected": False,
                  "customer_data_collected": False,
                  "command_arguments_collected": False,
              },
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

          python3 -m json.tool "$REPORT_FILE" >/dev/null
          chmod 600 "$REPORT_FILE"

      - name: Upload private Stage-2 map
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPORT_FILE }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 9

      - name: Publish terminal Stage-2 map
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            const sourceSha = context.sha;
            let report = {
              map_version: 2,
              status: process.env.JOB_STATUS,
            };
            if (fs.existsSync(process.env.REPORT_FILE)) {
              report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, 'utf8'));
              report.status = process.env.JOB_STATUS === 'success' ? 'success' : process.env.JOB_STATUS;
            }
            report.workflow = {
              run_id: context.runId,
              run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              source_sha: sourceSha,
              artifact_name: process.env.ARTIFACT_NAME,
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `audit: Stage-2 map run ${context.runId} ${report.status}`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Remove temporary audit material
        if: ${{ always() }}
        run: |
          set -eu
          rm -rf "$REPORT_DIR"
          rm -f ~/.ssh/id_vm ~/.ssh/known_hosts
