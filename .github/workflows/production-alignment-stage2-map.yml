name: Production Alignment Stage 2 Map

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type exactly MAP_STAGE_2 to run the read-only ownership map
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-alignment-stage2-map
  cancel-in-progress: false

jobs:
  map:
    if: ${{ inputs.confirm == 'MAP_STAGE_2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      REPORT_DIR: /tmp/dominion-alignment-stage2
      REPORT_FILE: /tmp/dominion-alignment-stage2/stage2_map.json
      REPORT_BRANCH: audit/alignment-stage2-map-20260721
      REPORT_PATH: governance/stage2_map.json
      ARTIFACT_NAME: dominion-alignment-stage2-map

    steps:
      - name: Validate VM connection secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Configure strict SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Collect read-only ownership and stability map
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$REPORT_DIR"
          ssh \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VM_USER@$VM_HOST" 'python3 -' > "$REPORT_FILE" <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import socket
          import subprocess
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          KEYWORDS = (
              "dominion", "conductor", "juris", "alchemist", "n8n", "caddy",
              "gemini", "alpha", "surplus", "wix", "tiktok", "youtube",
              "kdp", "backup", "guardian", "sentinel", "gatekeeper",
          )

          CRITICAL_UNITS = (
              "caddy.service",
              "dominion-alchemist.service",
              "dominion-alpha.service",
              "dominion-conductor.service",
              "dominion-gatekeeper.service",
              "dominion-juris.service",
              "dominion-store.service",
              "gemini-server.service",
          )

          HEALTH_CHECKS = (
              ("baby-api", 8080, "/"),
              ("wix-agent", 8082, "/ready"),
              ("dominion-web", 8090, "/"),
              ("n8n", 5678, "/healthz"),
              ("alpha-engine", 8787, "/health"),
              ("conductor-healthz", 5060, "/healthz"),
          )

          def command(args, timeout=20, cwd=None):
              try:
                  result = subprocess.run(
                      args,
                      cwd=cwd,
                      check=False,
                      capture_output=True,
                      text=True,
                      timeout=timeout,
                  )
              except (FileNotFoundError, subprocess.TimeoutExpired) as exc:
                  return {
                      "available": False,
                      "returncode": None,
                      "stdout": "",
                      "stderr_type": type(exc).__name__,
                  }
              return {
                  "available": True,
                  "returncode": result.returncode,
                  "stdout": (result.stdout or "").strip(),
                  "stderr_type": None if not result.stderr else "present",
              }

          def first_line(value):
              return value.splitlines()[0].strip() if value else ""

          def systemctl_value(unit, prop):
              result = command(["systemctl", "show", unit, "--property", prop, "--value"])
              return first_line(result["stdout"]) if result["returncode"] == 0 else ""

          def safe_exec_path(raw):
              if not raw:
                  return None
              match = re.search(r"(?:^|[ {;])path=([^ ;}]+)", raw)
              if match:
                  return match.group(1)
              token = raw.strip().split(" ", 1)[0]
              return token if token.startswith("/") else None

          def environment_file_paths(raw):
              if not raw:
                  return []
              values = []
              for match in re.finditer(r"(?:^|\s)-?([^\s;]+)", raw):
                  value = match.group(1).strip("\"'")
                  if value.startswith("/"):
                      values.append(value)
              return sorted(set(values))

          def relevant_service_names():
              names = set(CRITICAL_UNITS)
              for args in (
                  ["systemctl", "list-units", "--all", "--type=service", "--no-legend", "--no-pager"],
                  ["systemctl", "list-unit-files", "--type=service", "--no-legend", "--no-pager"],
              ):
                  result = command(args)
                  if result["returncode"] != 0:
                      continue
                  for line in result["stdout"].splitlines():
                      name = line.split(None, 1)[0] if line.split() else ""
                      lowered = name.lower()
                      if name.endswith(".service") and any(key in lowered for key in KEYWORDS):
                          names.add(name)
              return sorted(names)

          def service_record(unit):
              raw_exec = systemctl_value(unit, "ExecStart")
              record = {
                  "unit": unit,
                  "description": systemctl_value(unit, "Description"),
                  "load_state": systemctl_value(unit, "LoadState"),
                  "active_state": systemctl_value(unit, "ActiveState"),
                  "sub_state": systemctl_value(unit, "SubState"),
                  "unit_file_state": systemctl_value(unit, "UnitFileState"),
                  "fragment_path": systemctl_value(unit, "FragmentPath") or None,
                  "working_directory": systemctl_value(unit, "WorkingDirectory") or None,
                  "user": systemctl_value(unit, "User") or None,
                  "group": systemctl_value(unit, "Group") or None,
                  "exec_start_path": safe_exec_path(raw_exec),
                  "environment_files": environment_file_paths(systemctl_value(unit, "EnvironmentFiles")),
                  "restart_policy": systemctl_value(unit, "Restart") or None,
                  "restart_usec": systemctl_value(unit, "RestartUSec") or None,
                  "n_restarts": int(systemctl_value(unit, "NRestarts") or 0),
                  "result": systemctl_value(unit, "Result") or None,
                  "exec_main_status": systemctl_value(unit, "ExecMainStatus") or None,
                  "active_enter_timestamp": systemctl_value(unit, "ActiveEnterTimestamp") or None,
                  "memory_current": int(systemctl_value(unit, "MemoryCurrent") or 0),
                  "wants": sorted(filter(None, systemctl_value(unit, "Wants").split())),
                  "requires": sorted(filter(None, systemctl_value(unit, "Requires").split())),
                  "part_of": sorted(filter(None, systemctl_value(unit, "PartOf").split())),
                  "triggered_by": sorted(filter(None, systemctl_value(unit, "TriggeredBy").split())),
              }
              return record

          def timer_records():
              result = command(["systemctl", "list-unit-files", "--type=timer", "--no-legend", "--no-pager"])
              names = []
              if result["returncode"] == 0:
                  for line in result["stdout"].splitlines():
                      name = line.split(None, 1)[0] if line.split() else ""
                      lowered = name.lower()
                      if name.endswith(".timer") and any(key in lowered for key in KEYWORDS):
                          names.append(name)
              records = []
              for unit in sorted(set(names)):
                  records.append({
                      "unit": unit,
                      "description": systemctl_value(unit, "Description"),
                      "active_state": systemctl_value(unit, "ActiveState"),
                      "sub_state": systemctl_value(unit, "SubState"),
                      "unit_file_state": systemctl_value(unit, "UnitFileState"),
                      "next_elapse": systemctl_value(unit, "NextElapseUSecRealtime") or None,
                      "last_trigger": systemctl_value(unit, "LastTriggerUSec") or None,
                      "triggers": sorted(filter(None, systemctl_value(unit, "Triggers").split())),
                  })
              return records

          def docker_records():
              if not shutil.which("docker"):
                  return {"available": False, "containers": [], "compose_projects": []}
              ids_result = command(["docker", "ps", "--all", "--quiet"])
              containers = []
              if ids_result["returncode"] == 0:
                  for container_id in ids_result["stdout"].splitlines():
                      inspect = command(["docker", "inspect", container_id], timeout=30)
                      if inspect["returncode"] != 0:
                          continue
                      try:
                          item = json.loads(inspect["stdout"])[0]
                      except (json.JSONDecodeError, IndexError, TypeError):
                          continue
                      labels = item.get("Config", {}).get("Labels") or {}
                      compose_labels = {
                          key: value
                          for key, value in labels.items()
                          if key in {
                              "com.docker.compose.project",
                              "com.docker.compose.project.config_files",
                              "com.docker.compose.project.working_dir",
                              "com.docker.compose.service",
                              "com.docker.compose.version",
                          }
                      }
                      ports = []
                      for container_port, bindings in (item.get("NetworkSettings", {}).get("Ports") or {}).items():
                          if not bindings:
                              continue
                          for binding in bindings:
                              ports.append({
                                  "container_port": container_port,
                                  "host_ip": binding.get("HostIp"),
                                  "host_port": binding.get("HostPort"),
                              })
                      mounts = []
                      for mount in item.get("Mounts") or []:
                          mounts.append({
                              "type": mount.get("Type"),
                              "source": mount.get("Source"),
                              "destination": mount.get("Destination"),
                              "rw": mount.get("RW"),
                          })
                      health = item.get("State", {}).get("Health") or {}
                      restart_policy = item.get("HostConfig", {}).get("RestartPolicy") or {}
                      containers.append({
                          "name": str(item.get("Name") or "").lstrip("/"),
                          "id_short": str(item.get("Id") or "")[:12],
                          "image": item.get("Config", {}).get("Image"),
                          "state": item.get("State", {}).get("Status"),
                          "health": health.get("Status"),
                          "created": item.get("Created"),
                          "restart_policy": restart_policy.get("Name"),
                          "memory_limit": item.get("HostConfig", {}).get("Memory"),
                          "nano_cpus": item.get("HostConfig", {}).get("NanoCpus"),
                          "pids_limit": item.get("HostConfig", {}).get("PidsLimit"),
                          "network_mode": item.get("HostConfig", {}).get("NetworkMode"),
                          "compose_labels": compose_labels,
                          "ports": sorted(ports, key=lambda row: (row.get("host_port") or "", row.get("container_port") or "")),
                          "mounts": sorted(mounts, key=lambda row: row.get("destination") or ""),
                      })
              compose = command(["docker", "compose", "ls", "--format", "json"])
              projects = []
              if compose["returncode"] == 0 and compose["stdout"]:
                  try:
                      parsed = json.loads(compose["stdout"])
                      parsed = parsed if isinstance(parsed, list) else [parsed]
                      for item in parsed:
                          if isinstance(item, dict):
                              projects.append({
                                  "name": item.get("Name"),
                                  "status": item.get("Status"),
                                  "config_files": item.get("ConfigFiles"),
                              })
                  except json.JSONDecodeError:
                      pass
              return {
                  "available": True,
                  "containers": sorted(containers, key=lambda row: row.get("name") or ""),
                  "compose_projects": projects,
              }

          def sanitize_remote(value):
              value = value.strip()
              if not value:
                  return None
              if "://" not in value:
                  return value
              parsed = urllib.parse.urlsplit(value)
              host = parsed.hostname or ""
              if parsed.port:
                  host = f"{host}:{parsed.port}"
              return urllib.parse.urlunsplit((parsed.scheme, host, parsed.path, parsed.query, parsed.fragment))

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def repository_record(path):
              path = path.expanduser()
              record = {
                  "path": str(path),
                  "exists": path.exists(),
                  "resolved_path": str(path.resolve()) if path.exists() else None,
                  "is_git_repository": False,
                  "head": None,
                  "branch": None,
                  "origin": None,
                  "dirty_entry_count": None,
                  "compose_sha256": None,
              }
              if not path.is_dir():
                  return record
              head = command(["git", "rev-parse", "HEAD"], cwd=str(path))
              if head["returncode"] != 0:
                  compose_path = path / "docker-compose.yml"
                  if compose_path.is_file():
                      record["compose_sha256"] = sha256_file(compose_path)
                  return record
              record["is_git_repository"] = True
              record["head"] = first_line(head["stdout"])
              branch = command(["git", "branch", "--show-current"], cwd=str(path))
              record["branch"] = first_line(branch["stdout"]) or None
              origin = command(["git", "remote", "get-url", "origin"], cwd=str(path))
              record["origin"] = sanitize_remote(first_line(origin["stdout"])) if origin["returncode"] == 0 else None
              dirty = command(["git", "status", "--porcelain"], cwd=str(path))
              record["dirty_entry_count"] = len(dirty["stdout"].splitlines()) if dirty["returncode"] == 0 else None
              compose_path = path / "docker-compose.yml"
              if compose_path.is_file():
                  record["compose_sha256"] = sha256_file(compose_path)
              return record

          def listening_ports():
              if not shutil.which("ss"):
                  return []
              result = command(["ss", "-lntpH"])
              records = []
              if result["returncode"] != 0:
                  return records
              for line in result["stdout"].splitlines():
                  fields = line.split()
                  if len(fields) < 4:
                      continue
                  local = fields[3]
                  process_field = " ".join(fields[5:]) if len(fields) > 5 else ""
                  process_names = sorted(set(re.findall(r'\(\("([^\"]+)"', process_field)))
                  pid_values = sorted(set(int(value) for value in re.findall(r"pid=(\d+)", process_field)))
                  records.append({
                      "local": local,
                      "process_names": process_names,
                      "pids": pid_values,
                  })
              return records

          def health_check(name, port, path):
              url = f"http://127.0.0.1:{port}{path}"
              try:
                  with urllib.request.urlopen(url, timeout=5) as response:
                      return {"name": name, "port": port, "path": path, "reachable": True, "status": response.status}
              except urllib.error.HTTPError as exc:
                  return {"name": name, "port": port, "path": path, "reachable": True, "status": exc.code}
              except Exception as exc:
                  return {"name": name, "port": port, "path": path, "reachable": False, "status": None, "error_type": type(exc).__name__}

          def backup_records():
              candidates = (
                  Path("/var/backups"),
                  Path("/opt/dominion/backups"),
                  Path.home() / "backups",
                  Path.home() / "dominion" / "backups",
                  Path.home() / "dominion-ops" / "backups",
              )
              records = []
              for path in candidates:
                  record = {"path": str(path), "exists": path.is_dir(), "file_count": 0, "latest_mtime": None, "total_bytes": 0}
                  if path.is_dir():
                      latest = None
                      for item in path.rglob("*"):
                          try:
                              if not item.is_file():
                                  continue
                              stat = item.stat()
                          except OSError:
                              continue
                          record["file_count"] += 1
                          record["total_bytes"] += stat.st_size
                          latest = max(latest or stat.st_mtime, stat.st_mtime)
                      if latest is not None:
                          record["latest_mtime"] = datetime.fromtimestamp(latest, timezone.utc).isoformat()
                  records.append(record)
              return records

          service_names = relevant_service_names()
          services = [service_record(unit) for unit in service_names]

          restart_start = {
              unit: int(systemctl_value(unit, "NRestarts") or 0)
              for unit in CRITICAL_UNITS
          }
          time.sleep(45)
          restart_end = {
              unit: int(systemctl_value(unit, "NRestarts") or 0)
              for unit in CRITICAL_UNITS
          }
          restart_deltas = {
              unit: {
                  "start": restart_start[unit],
                  "end": restart_end[unit],
                  "delta": restart_end[unit] - restart_start[unit],
                  "active_state": systemctl_value(unit, "ActiveState"),
                  "sub_state": systemctl_value(unit, "SubState"),
              }
              for unit in CRITICAL_UNITS
          }

          caddy_config = Path("/etc/caddy/Caddyfile")
          caddy_validation = {"config_exists": caddy_config.is_file(), "validator_available": bool(shutil.which("caddy")), "valid": None}
          if caddy_config.is_file() and shutil.which("caddy"):
              result = command(["caddy", "validate", "--config", str(caddy_config)], timeout=20)
              caddy_validation["valid"] = result["returncode"] == 0

          repo_candidates = (
              Path.home() / "dominion-ops",
              Path.home() / "desktop-tutorial",
              Path("/opt/dominion"),
              Path("/opt/dominions-ark"),
          )

          payload = {
              "map_version": 1,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "host": {"hostname": socket.gethostname()},
              "repositories": [repository_record(path) for path in repo_candidates],
              "services": services,
              "timers": timer_records(),
              "restart_deltas_45_seconds": restart_deltas,
              "docker": docker_records(),
              "listening_ports": listening_ports(),
              "health_checks": [health_check(*item) for item in HEALTH_CHECKS],
              "backup_inventory": backup_records(),
              "caddy_validation": caddy_validation,
              "safety": {
                  "services_changed": False,
                  "environment_values_collected": False,
                  "logs_collected": False,
                  "file_contents_collected": False,
                  "customer_data_collected": False,
                  "command_arguments_collected": False,
              },
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

          python3 -m json.tool "$REPORT_FILE" >/dev/null
          chmod 600 "$REPORT_FILE"

      - name: Upload private Stage-2 map
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPORT_FILE }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 9

      - name: Publish Stage-2 map branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            const sourceSha = context.sha;
            const ref = `heads/${branch}`;
            try {
              await github.rest.git.getRef({ owner, repo, ref });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: sourceSha });
            }
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, 'utf8'));
            report.workflow = {
              run_id: context.runId,
              run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              source_sha: sourceSha,
              artifact_name: process.env.ARTIFACT_NAME,
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              message: `audit: Stage-2 ownership map run ${context.runId}`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Remove temporary audit material
        if: ${{ always() }}
        run: |
          set -eu
          rm -rf "$REPORT_DIR"
          rm -f ~/.ssh/id_vm ~/.ssh/known_hosts
