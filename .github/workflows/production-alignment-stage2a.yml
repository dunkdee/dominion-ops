name: Production Alignment Stage 2A

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type exactly ALIGN_STAGE_2A to apply the guarded supervisor and timer repair
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-alignment-stage2a
  cancel-in-progress: false

jobs:
  align:
    if: ${{ inputs.confirm == 'ALIGN_STAGE_2A' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      REPORT_DIR: /tmp/dominion-alignment-stage2a
      REPORT_FILE: /tmp/dominion-alignment-stage2a/result.json
      REPORT_BRANCH: audit/alignment-stage2a-20260721
      REPORT_PATH: governance/stage2a_result.json
      ARTIFACT_NAME: dominion-alignment-stage2a

    steps:
      - name: Publish run pointer
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            const sourceSha = context.sha;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: sourceSha,
              });
            }
            const report = {
              alignment_stage: '2A',
              status: 'started',
              workflow: {
                run_id: context.runId,
                run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                source_sha: sourceSha,
                artifact_name: process.env.ARTIFACT_NAME,
              },
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `ops: Stage-2A run ${context.runId} started`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Validate VM connection secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Configure strict SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Apply guarded supervisor and timer repair
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$REPORT_DIR"
          ssh \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VM_USER@$VM_HOST" 'python3 -' > "$REPORT_FILE" <<'PY'
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          CANONICAL = (
              "caddy.service",
              "dominion-alchemist.service",
              "dominion-alpha.service",
              "dominion-conductor.service",
              "dominion-gatekeeper.service",
              "dominion-juris.service",
              "dominion-store.service",
              "gemini-server.service",
          )
          LEGACY = {
              "alchemist-api.service": "dominion-alchemist.service",
              "conductor-api.service": "dominion-conductor.service",
              "juris-api.service": "dominion-juris.service",
          }
          PUBLISH_TIMERS = (
              "conductor-autonomous.timer",
              "dominion-kdp.timer",
              "dominion-publish.timer",
              "dominion-social-poster.timer",
              "dominion-youtube.timer",
          )
          PUBLISH_SERVICES = (
              "conductor-autonomous.service",
              "dominion-kdp.service",
              "dominion-publish.service",
              "dominion-social-poster.service",
              "dominion-youtube.service",
          )
          HEALTH = (
              ("baby-api", 8080, "/"),
              ("wix-agent", 8082, "/ready"),
              ("dominion-web", 8090, "/"),
              ("n8n", 5678, "/healthz"),
              ("alpha-engine", 8787, "/health"),
          )
          WATCH_RESTARTS = CANONICAL + ("dominion-review-queue.service",)

          def run(args, timeout=30):
              try:
                  result = subprocess.run(
                      args,
                      check=False,
                      capture_output=True,
                      text=True,
                      timeout=timeout,
                  )
              except (FileNotFoundError, subprocess.TimeoutExpired) as exc:
                  return {"returncode": None, "error_type": type(exc).__name__}
              return {
                  "returncode": result.returncode,
                  "stderr_present": bool(result.stderr),
              }

          def systemctl(*args):
              return run(["sudo", "-n", "systemctl", *args])

          def value(unit, prop):
              try:
                  result = subprocess.run(
                      ["systemctl", "show", unit, "--property", prop, "--value"],
                      check=False,
                      capture_output=True,
                      text=True,
                      timeout=10,
                  )
              except Exception:
                  return ""
              return (result.stdout or "").splitlines()[0].strip() if result.returncode == 0 and result.stdout else ""

          def integer(value_text):
              try:
                  return int(value_text)
              except (TypeError, ValueError):
                  return 0

          def state(unit):
              return {
                  "unit": unit,
                  "active_state": value(unit, "ActiveState"),
                  "sub_state": value(unit, "SubState"),
                  "unit_file_state": value(unit, "UnitFileState"),
                  "n_restarts": integer(value(unit, "NRestarts")),
              }

          def healthy(unit):
              item = state(unit)
              return item["active_state"] == "active" and item["sub_state"] == "running"

          def health_check(name, port, path):
              url = f"http://127.0.0.1:{port}{path}"
              try:
                  with urllib.request.urlopen(url, timeout=5) as response:
                      return {"name": name, "port": port, "path": path, "reachable": True, "status": response.status}
              except urllib.error.HTTPError as exc:
                  return {"name": name, "port": port, "path": path, "reachable": True, "status": exc.code}
              except Exception as exc:
                  return {"name": name, "port": port, "path": path, "reachable": False, "status": None, "error_type": type(exc).__name__}

          actions = []
          errors = []
          before = {unit: state(unit) for unit in set(CANONICAL + tuple(LEGACY) + PUBLISH_TIMERS + PUBLISH_SERVICES + ("dominion-port-healer.service", "dominion-review-queue.service"))}

          missing_canonical = [unit for unit in CANONICAL if not healthy(unit)]
          if missing_canonical:
              errors.append({"error": "canonical_not_healthy_before_change", "units": missing_canonical})
          else:
              healer = systemctl("disable", "--now", "dominion-port-healer.service")
              actions.append({"action": "disabled_reactivation_supervisor", "unit": "dominion-port-healer.service", "result": healer})

              for legacy, canonical in LEGACY.items():
                  if healthy(canonical):
                      stop = systemctl("disable", "--now", legacy)
                      mask = systemctl("mask", "--runtime", legacy)
                      systemctl("reset-failed", legacy)
                      actions.append({
                          "action": "retired_legacy_runtime_mask",
                          "unit": legacy,
                          "canonical": canonical,
                          "stop_result": stop,
                          "mask_result": mask,
                      })
                  else:
                      errors.append({"error": "canonical_lost_before_legacy_retirement", "unit": legacy, "canonical": canonical})

              for timer in PUBLISH_TIMERS:
                  result = systemctl("disable", "--now", timer)
                  actions.append({"action": "disabled_approval_gated_timer", "unit": timer, "result": result})
              for service in PUBLISH_SERVICES:
                  result = systemctl("disable", "--now", service)
                  actions.append({"action": "kept_approval_gated_service_inactive", "unit": service, "result": result})

              for unit in ("caddy.service", "dominion-conductor.service", "gemini-server.service"):
                  if healthy(unit):
                      result = systemctl("enable", unit)
                      actions.append({"action": "enabled_canonical_boot_persistence", "unit": unit, "result": result})

          restart_start = {unit: integer(value(unit, "NRestarts")) for unit in WATCH_RESTARTS}
          time.sleep(30)
          restart_end = {unit: integer(value(unit, "NRestarts")) for unit in WATCH_RESTARTS}
          restart_deltas = {
              unit: {
                  "start": restart_start[unit],
                  "end": restart_end[unit],
                  "delta": restart_end[unit] - restart_start[unit],
                  "state": state(unit),
              }
              for unit in WATCH_RESTARTS
          }

          after = {unit: state(unit) for unit in before}
          checks = [health_check(*item) for item in HEALTH]
          unhealthy_checks = [item for item in checks if not item["reachable"] or item["status"] != 200]
          legacy_reactivated = [unit for unit in LEGACY if after[unit]["active_state"] in {"active", "activating"}]
          timers_left_active = [unit for unit in PUBLISH_TIMERS if after[unit]["active_state"] == "active"]
          canonical_unhealthy = [unit for unit in CANONICAL if not healthy(unit)]
          canonical_restart_deltas = {
              unit: item["delta"]
              for unit, item in restart_deltas.items()
              if unit in CANONICAL and item["delta"] != 0
          }
          follow_up = []
          review_delta = restart_deltas["dominion-review-queue.service"]["delta"]
          if review_delta:
              follow_up.append({"issue": "surplus_review_queue_restarted_during_sample", "delta": review_delta})

          success = not any((errors, unhealthy_checks, legacy_reactivated, timers_left_active, canonical_unhealthy, canonical_restart_deltas))
          payload = {
              "alignment_stage": "2A",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "success": success,
              "actions": actions,
              "errors": errors,
              "before": before,
              "after": after,
              "health_checks": checks,
              "unhealthy_health_checks": unhealthy_checks,
              "legacy_reactivated": legacy_reactivated,
              "approval_timers_left_active": timers_left_active,
              "canonical_unhealthy": canonical_unhealthy,
              "restart_deltas_30_seconds": restart_deltas,
              "canonical_restart_deltas": canonical_restart_deltas,
              "follow_up_required": follow_up,
              "safety": {
                  "compose_changed": False,
                  "repository_worktree_changed": False,
                  "persistent_data_deleted": False,
                  "databases_changed": False,
                  "dns_changed": False,
                  "secrets_collected": False,
                  "logs_collected": False,
                  "environment_values_collected": False,
              },
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          if not success:
              raise SystemExit(1)
          PY

          python3 -m json.tool "$REPORT_FILE" >/dev/null
          chmod 600 "$REPORT_FILE"

      - name: Upload private Stage-2A result
        if: ${{ always() && hashFiles('/tmp/dominion-alignment-stage2a/result.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPORT_FILE }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 9

      - name: Publish terminal Stage-2A result
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            const sourceSha = context.sha;
            let report = {
              alignment_stage: '2A',
              success: false,
              status: process.env.JOB_STATUS,
              error: 'Stage-2A did not produce a readable report',
            };
            if (fs.existsSync(process.env.REPORT_FILE)) {
              try {
                report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, 'utf8'));
              } catch (error) {
                report.parse_error = error.name;
              }
            }
            report.workflow = {
              run_id: context.runId,
              run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              source_sha: sourceSha,
              artifact_name: process.env.ARTIFACT_NAME,
              job_status: process.env.JOB_STATUS,
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `ops: Stage-2A run ${context.runId} terminal result`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Remove temporary material
        if: ${{ always() }}
        run: |
          set -eu
          rm -rf "$REPORT_DIR"
          rm -f ~/.ssh/id_vm ~/.ssh/known_hosts
