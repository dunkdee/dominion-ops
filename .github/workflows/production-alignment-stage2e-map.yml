name: Production Alignment Stage 2E Map

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type exactly MAP_STAGE_2E to map exact cutover and rollback ownership
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-alignment-stage2e-map
  cancel-in-progress: false

jobs:
  map:
    if: ${{ inputs.confirm == 'MAP_STAGE_2E' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPORT_DIR: /tmp/dominion-alignment-stage2e
      REPORT_FILE: /tmp/dominion-alignment-stage2e/result.json
      REMOTE_SCRIPT: /tmp/dominion-stage2e-cutover-map.py
      REPORT_BRANCH: audit/alignment-stage2e-map-20260722
      REPORT_PATH: governance/stage2e_cutover_map.json
      ARTIFACT_NAME: dominion-alignment-stage2e-map

    steps:
      - name: Publish run pointer
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            const sourceSha = context.sha;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner, repo, ref: `refs/heads/${branch}`, sha: sourceSha,
              });
            }
            const report = {
              alignment_stage: '2E-cutover-map',
              status: 'started',
              workflow: {
                run_id: context.runId,
                run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                source_sha: sourceSha,
                artifact_name: process.env.ARTIFACT_NAME,
              },
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `audit: Stage-2E cutover map run ${context.runId} started`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Validate VM connection secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Checkout exact mapper source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate mapper syntax
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/runtime/stage2e_cutover_map.py

      - name: Configure strict SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Collect exact read-only cutover map
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$REPORT_DIR"
          printf '%s\n' '{"alignment_stage":"2E-cutover-map","status":"collector_not_completed","success":false}' > "$REPORT_FILE"
          scp \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            scripts/runtime/stage2e_cutover_map.py \
            "$VM_USER@$VM_HOST:$REMOTE_SCRIPT"
          set +e
          ssh \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VM_USER@$VM_HOST" \
            "chmod 700 '$REMOTE_SCRIPT' && python3 '$REMOTE_SCRIPT'; RC=\$?; rm -f '$REMOTE_SCRIPT'; exit \$RC" \
            > "$REPORT_FILE"
          RC=$?
          set -e
          python3 -m json.tool "$REPORT_FILE" >/dev/null
          chmod 600 "$REPORT_FILE"
          echo "MAP_RC=$RC" >> "$GITHUB_ENV"

      - name: Upload private Stage-2E map
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPORT_FILE }}
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9

      - name: Publish terminal Stage-2E map
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            let report;
            if (fs.existsSync(process.env.REPORT_FILE)) {
              try {
                report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, 'utf8'));
              } catch (error) {
                report = { alignment_stage: '2E-cutover-map', status: 'report_parse_failed', success: false };
              }
            } else {
              report = { alignment_stage: '2E-cutover-map', status: 'report_missing', success: false };
            }
            report.workflow = {
              run_id: context.runId,
              run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              source_sha: context.sha,
              artifact_name: process.env.ARTIFACT_NAME,
              job_status: process.env.JOB_STATUS,
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `audit: Stage-2E cutover map run ${context.runId} ${process.env.JOB_STATUS}`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Enforce map result
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["REPORT_FILE"])
          if not path.is_file():
              raise SystemExit("cutover map report missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          if not report.get("success"):
              raise SystemExit("cutover map did not pass verification")
          if not report.get("containers_unchanged"):
              raise SystemExit("container inventory changed during read-only map")
          PY

      - name: Remove temporary runner material
        if: ${{ always() }}
        run: |
          set -eu
          rm -rf "$REPORT_DIR"
          rm -f ~/.ssh/id_vm ~/.ssh/known_hosts
