name: Production Alignment Stage 2F Baby Recovery

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type exactly RECOVER_BABY_STAGE_2F to restore Baby API only
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-alignment-stage2f-baby-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ inputs.confirm == 'RECOVER_BABY_STAGE_2F' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPORT_DIR: /tmp/dominion-alignment-stage2f-baby-recovery
      REPORT_FILE: /tmp/dominion-alignment-stage2f-baby-recovery/result.json
      REMOTE_SCRIPT: /tmp/stage2f_baby_api_recovery.py
      REPORT_BRANCH: audit/alignment-stage2f-baby-recovery-20260722
      REPORT_PATH: governance/stage2f_baby_recovery_result.json
      ARTIFACT_NAME: dominion-alignment-stage2f-baby-recovery
      APPROVED_SOURCE_SHA: 10646094aa3a5a1e0d4d18dc5508a33d2f5ec2a3
      RELEASE_ROOT: /home/malachisingleton8/dominion-releases/dominion-ops-10646094aa3a
      EXPECTED_COMPOSE_SHA: 42e2e90c41e9c154bf96f3ba2dc277811f873626af41b747474fcea6a494c8eb
      EXPECTED_ENV_SHA: 757601b1009add4252902ee3176e5c16fb8fd39b8182b8883b2420a3aa9ad0cd

    steps:
      - name: Publish run pointer
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            const sourceSha = context.sha;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner, repo, ref: `refs/heads/${branch}`, sha: sourceSha,
              });
            }
            const report = {
              alignment_stage: '2F-baby-recovery',
              status: 'started',
              workflow: {
                run_id: context.runId,
                run_attempt: context.runAttempt,
                run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                source_sha: sourceSha,
                artifact_name: process.env.ARTIFACT_NAME,
              },
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `audit: Stage-2F Baby recovery run ${context.runId} started`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Validate VM connection secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Checkout exact recovery source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate recovery script
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/runtime/stage2f_baby_api_recovery.py

      - name: Configure strict SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Recover canonical Baby API only
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$REPORT_DIR"
          printf '%s\n' '{"alignment_stage":"2F-baby-recovery","status":"collector_not_completed","success":false}' > "$REPORT_FILE"
          scp \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            scripts/runtime/stage2f_baby_api_recovery.py \
            "$VM_USER@$VM_HOST:$REMOTE_SCRIPT"
          set +e
          ssh \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VM_USER@$VM_HOST" \
            "chmod 700 '$REMOTE_SCRIPT' && sudo -n env APPROVED_SOURCE_SHA='$APPROVED_SOURCE_SHA' RELEASE_ROOT='$RELEASE_ROOT' EXPECTED_COMPOSE_SHA='$EXPECTED_COMPOSE_SHA' EXPECTED_ENV_SHA='$EXPECTED_ENV_SHA' RUN_ID='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' python3 '$REMOTE_SCRIPT'; RC=\$?; rm -f '$REMOTE_SCRIPT'; exit \$RC" \
            > "$REPORT_FILE" 2> "$REPORT_DIR/remote.stderr"
          RC=$?
          set -e
          python3 -m json.tool "$REPORT_FILE" >/dev/null
          chmod 600 "$REPORT_FILE"
          echo "RECOVERY_RC=$RC" >> "$GITHUB_ENV"

      - name: Upload private Baby recovery result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPORT_FILE }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: Publish terminal Baby recovery result
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          RECOVERY_RESULT_CODE: ${{ env.RECOVERY_RC }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            const resultCode = process.env.RECOVERY_RESULT_CODE;
            const terminalStatus = resultCode === '0' ? 'success' : 'failure';
            let report;
            if (fs.existsSync(process.env.REPORT_FILE)) {
              try {
                report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, 'utf8'));
              } catch (error) {
                report = { alignment_stage: '2F-baby-recovery', status: 'report_parse_failed', success: false };
              }
            } else {
              report = { alignment_stage: '2F-baby-recovery', status: 'report_missing', success: false };
            }
            report.workflow = {
              run_id: context.runId,
              run_attempt: context.runAttempt,
              run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              source_sha: context.sha,
              artifact_name: process.env.ARTIFACT_NAME,
              run_returncode: resultCode || null,
              job_status: terminalStatus,
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `audit: Stage-2F Baby recovery run ${context.runId} ${terminalStatus}`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Enforce Baby recovery result
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["REPORT_FILE"])
          if not path.is_file():
              raise SystemExit("Baby recovery report missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          if not report.get("success"):
              raise SystemExit("Baby API recovery did not pass verification")
          after = report.get("after") or report.get("baby_api") or {}
          if after.get("image_id") != "sha256:089445475d96ca3630fd4821af3c0304d38de5ece89a529b3782a398e38c3c82":
              raise SystemExit("Baby API canonical image was not verified")
          if not report.get("unaffected_containers_unchanged", True):
              raise SystemExit("unaffected container identity changed")
          PY

      - name: Remove temporary runner material
        if: ${{ always() }}
        run: |
          set -eu
          rm -rf "$REPORT_DIR"
          rm -f ~/.ssh/id_vm ~/.ssh/known_hosts
