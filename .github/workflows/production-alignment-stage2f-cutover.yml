name: Production Alignment Stage 2F Cutover

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type exactly CUTOVER_STAGE_2F to perform the guarded canonical cutover
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-alignment-stage2f-cutover
  cancel-in-progress: false

jobs:
  cutover:
    if: ${{ inputs.confirm == 'CUTOVER_STAGE_2F' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REPORT_DIR: /tmp/dominion-alignment-stage2f
      REPORT_FILE: /tmp/dominion-alignment-stage2f/result.json
      REMOTE_ENGINE: /tmp/stage2f_guarded_cutover.py
      REMOTE_ENTRYPOINT: /tmp/stage2f_guarded_cutover_entrypoint.py
      REPORT_BRANCH: audit/alignment-stage2f-cutover-20260722
      REPORT_PATH: governance/stage2f_cutover_result.json
      ARTIFACT_NAME: dominion-alignment-stage2f-cutover
      APPROVED_SOURCE_SHA: 10646094aa3a5a1e0d4d18dc5508a33d2f5ec2a3
      RELEASE_ROOT: /home/malachisingleton8/dominion-releases/dominion-ops-10646094aa3a
      EXPECTED_COMPOSE_SHA: 42e2e90c41e9c154bf96f3ba2dc277811f873626af41b747474fcea6a494c8eb
      EXPECTED_ENV_SHA: 757601b1009add4252902ee3176e5c16fb8fd39b8182b8883b2420a3aa9ad0cd

    steps:
      - name: Publish run pointer
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            const sourceSha = context.sha;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner, repo, ref: `refs/heads/${branch}`, sha: sourceSha,
              });
            }
            const report = {
              alignment_stage: '2F-cutover',
              status: 'started',
              workflow: {
                run_id: context.runId,
                run_attempt: context.runAttempt,
                run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                source_sha: sourceSha,
                artifact_name: process.env.ARTIFACT_NAME,
              },
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `audit: Stage-2F cutover run ${context.runId} attempt ${context.runAttempt} started`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Validate VM connection secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Checkout exact cutover source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate cutover scripts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/runtime/stage2f_guarded_cutover.py \
            scripts/runtime/stage2f_guarded_cutover_entrypoint.py

      - name: Configure strict SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Apply guarded canonical cutover
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$REPORT_DIR"
          printf '%s\n' '{"alignment_stage":"2F-cutover","status":"collector_not_completed","success":false}' > "$REPORT_FILE"
          scp \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            scripts/runtime/stage2f_guarded_cutover.py \
            "$VM_USER@$VM_HOST:$REMOTE_ENGINE"
          scp \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            scripts/runtime/stage2f_guarded_cutover_entrypoint.py \
            "$VM_USER@$VM_HOST:$REMOTE_ENTRYPOINT"
          set +e
          ssh \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VM_USER@$VM_HOST" \
            "chmod 700 '$REMOTE_ENGINE' '$REMOTE_ENTRYPOINT' && sudo -n env APPROVED_SOURCE_SHA='$APPROVED_SOURCE_SHA' RELEASE_ROOT='$RELEASE_ROOT' EXPECTED_COMPOSE_SHA='$EXPECTED_COMPOSE_SHA' EXPECTED_ENV_SHA='$EXPECTED_ENV_SHA' RUN_ID='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' python3 '$REMOTE_ENTRYPOINT'; RC=\$?; rm -f '$REMOTE_ENGINE' '$REMOTE_ENTRYPOINT'; exit \$RC" \
            > "$REPORT_FILE" 2> "$REPORT_DIR/remote.stderr"
          RC=$?
          set -e
          python3 -m json.tool "$REPORT_FILE" >/dev/null
          chmod 600 "$REPORT_FILE"
          echo "CUTOVER_RC=$RC" >> "$GITHUB_ENV"

      - name: Upload private Stage-2F result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPORT_FILE }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: Publish terminal Stage-2F result
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            let report;
            if (fs.existsSync(process.env.REPORT_FILE)) {
              try {
                report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, 'utf8'));
              } catch (error) {
                report = { alignment_stage: '2F-cutover', status: 'report_parse_failed', success: false };
              }
            } else {
              report = { alignment_stage: '2F-cutover', status: 'report_missing', success: false };
            }
            report.workflow = {
              run_id: context.runId,
              run_attempt: context.runAttempt,
              run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              source_sha: context.sha,
              artifact_name: process.env.ARTIFACT_NAME,
              job_status: process.env.JOB_STATUS,
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `audit: Stage-2F cutover run ${context.runId} attempt ${context.runAttempt} ${process.env.JOB_STATUS}`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Enforce cutover result
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["REPORT_FILE"])
          if not path.is_file():
              raise SystemExit("cutover report missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          if not report.get("success"):
              raise SystemExit("guarded cutover did not pass verification")
          if report.get("rollback_performed"):
              raise SystemExit("guarded cutover rolled back")
          if not report.get("unaffected_containers_unchanged"):
              raise SystemExit("unaffected container inventory changed")
          PY

      - name: Remove temporary runner material
        if: ${{ always() }}
        run: |
          set -eu
          rm -rf "$REPORT_DIR"
          rm -f ~/.ssh/id_vm ~/.ssh/known_hosts
