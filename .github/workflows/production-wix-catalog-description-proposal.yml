name: Production Wix Catalog Description Proposal V2

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type exactly CREATE_WIX_DESCRIPTION_PROPOSAL_V2
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-wix-catalog-description-proposal-v2
  cancel-in-progress: false

jobs:
  propose:
    if: ${{ inputs.confirm == 'CREATE_WIX_DESCRIPTION_PROPOSAL_V2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPORT_DIR: /tmp/dominion-wix-description-proposal-v2
      REPORT_FILE: /tmp/dominion-wix-description-proposal-v2/result.json
      PROPOSAL_FILE: /tmp/dominion-wix-description-proposal-v2/wix_catalog_description_proposal_v2.json
      REMOTE_SCRIPT: /tmp/wix_catalog_description_proposal_v2.py
      REMOTE_PROPOSAL: /tmp/wix_catalog_description_proposal_v2.json
      REPORT_BRANCH: audit/wix-catalog-description-proposal-v2-20260722
      REPORT_PATH: governance/wix_catalog_description_proposal_v2_result.json
      ARTIFACT_NAME: dominion-wix-catalog-description-proposal-v2

    steps:
      - name: Publish run pointer
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner, repo, ref: `refs/heads/${branch}`, sha: context.sha,
              });
            }
            const report = {
              alignment_stage: 'wix-catalog-description-proposal-v2',
              status: 'started',
              workflow: {
                run_id: context.runId,
                run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                source_sha: context.sha,
                artifact_name: process.env.ARTIFACT_NAME,
              },
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `audit: Wix description proposal V2 run ${context.runId} started`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Validate VM connection secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Checkout exact proposal source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate proposal syntax
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/runtime/wix_catalog_description_proposal.py

      - name: Configure strict SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create private product-specific proposal V2
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$REPORT_DIR"
          printf '%s\n' '{"alignment_stage":"wix-catalog-description-proposal-v2","status":"collector_not_completed","success":false}' > "$REPORT_FILE"
          scp \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            scripts/runtime/wix_catalog_description_proposal.py \
            "$VM_USER@$VM_HOST:$REMOTE_SCRIPT"
          set +e
          ssh \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VM_USER@$VM_HOST" \
            "chmod 700 '$REMOTE_SCRIPT' && PROPOSAL_PATH='$REMOTE_PROPOSAL' python3 '$REMOTE_SCRIPT'; RC=\$?; rm -f '$REMOTE_SCRIPT'; exit \$RC" \
            > "$REPORT_FILE" 2> "$REPORT_DIR/remote.stderr"
          RC=$?
          set -e
          python3 -m json.tool "$REPORT_FILE" >/dev/null
          chmod 600 "$REPORT_FILE"
          if [ "$RC" -eq 0 ]; then
            scp \
              -i ~/.ssh/id_vm \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "$VM_USER@$VM_HOST:$REMOTE_PROPOSAL" \
              "$PROPOSAL_FILE"
            ssh \
              -i ~/.ssh/id_vm \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "$VM_USER@$VM_HOST" \
              "rm -f '$REMOTE_PROPOSAL'"
            chmod 600 "$PROPOSAL_FILE"
          fi
          echo "PROPOSAL_RC=$RC" >> "$GITHUB_ENV"

      - name: Upload private proposal V2
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.REPORT_FILE }}
            ${{ env.PROPOSAL_FILE }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: Publish terminal proposal V2 result
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          PROPOSAL_RESULT_CODE: ${{ env.PROPOSAL_RC }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            const resultCode = process.env.PROPOSAL_RESULT_CODE;
            const terminalStatus = resultCode === '0' ? 'success' : 'failure';
            let report;
            if (fs.existsSync(process.env.REPORT_FILE)) {
              try {
                report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, 'utf8'));
              } catch (error) {
                report = { alignment_stage: 'wix-catalog-description-proposal-v2', status: 'report_parse_failed', success: false };
              }
            } else {
              report = { alignment_stage: 'wix-catalog-description-proposal-v2', status: 'report_missing', success: false };
            }
            report.workflow = {
              run_id: context.runId,
              run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              source_sha: context.sha,
              artifact_name: process.env.ARTIFACT_NAME,
              run_returncode: resultCode || null,
              job_status: terminalStatus,
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `audit: Wix description proposal V2 run ${context.runId} ${terminalStatus}`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Enforce proposal V2 result
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["REPORT_FILE"])
          if not path.is_file():
              raise SystemExit("Wix description proposal V2 report missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          if not report.get("success"):
              raise SystemExit("Wix description proposal V2 did not complete")
          if not report.get("containers_unchanged"):
              raise SystemExit("container inventory changed during proposal generation")
          validation = report.get("validation") or {}
          required = (
              "all_product_ids_present",
              "all_revisions_present",
              "all_names_present",
              "all_current_hashes_present",
              "all_proposed_hashes_unique",
              "all_proposals_changed",
              "all_proposals_bounded",
              "all_titles_embedded",
              "all_variant_counts_positive",
              "all_variant_skus_present",
              "unsupported_generated_phrases_absent",
          )
          if validation.get("quality_version") != 2:
              raise SystemExit("proposal V2 quality version missing")
          if not all(validation.get(key) is True for key in required):
              raise SystemExit("proposal V2 validation failed")
          safety = report.get("safety") or {}
          forbidden = [
              "wix_mutations_performed",
              "products_changed",
              "inventory_changed",
              "orders_changed",
              "customer_data_collected",
              "order_data_collected",
              "inventory_quantities_collected",
              "environment_values_collected",
              "secret_values_collected",
              "raw_api_responses_collected",
              "raw_logs_collected",
              "containers_changed",
              "networks_changed",
              "volumes_changed",
              "databases_changed",
              "dns_changed",
              "brand_changes_proposed",
              "seo_changes_proposed",
          ]
          if any(safety.get(key) for key in forbidden):
              raise SystemExit("proposal V2 safety contract failed")
          PY

      - name: Remove temporary runner material
        if: ${{ always() }}
        run: |
          set -eu
          rm -rf "$REPORT_DIR"
          rm -f ~/.ssh/id_vm ~/.ssh/known_hosts
