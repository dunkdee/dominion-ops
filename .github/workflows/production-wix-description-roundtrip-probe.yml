name: Production Wix Description Round-Trip Probe

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type exactly PROBE_WIX_DESCRIPTION_ROUNDTRIP
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-wix-description-roundtrip-probe
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ inputs.confirm == 'PROBE_WIX_DESCRIPTION_ROUNDTRIP' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPORT_DIR: /tmp/dominion-wix-description-roundtrip
      REPORT_FILE: /tmp/dominion-wix-description-roundtrip/result.json
      REMOTE_PROBE: /tmp/wix_description_roundtrip_probe.py
      REMOTE_GENERATOR: /tmp/wix_catalog_description_proposal_v2.py
      REPORT_BRANCH: audit/wix-description-roundtrip-20260722
      REPORT_PATH: governance/wix_description_roundtrip_result.json
      ARTIFACT_NAME: dominion-wix-description-roundtrip-probe

    steps:
      - name: Publish run pointer
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: context.sha });
            }
            const report = {
              alignment_stage: 'wix-description-roundtrip-probe',
              status: 'started',
              workflow: {
                run_id: context.runId,
                run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                source_sha: context.sha,
                artifact_name: process.env.ARTIFACT_NAME,
              },
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `audit: Wix description round-trip probe ${context.runId} started`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Validate VM connection secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Checkout exact probe source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate probe syntax
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/runtime/wix_description_roundtrip_probe.py
          python3 -m py_compile scripts/runtime/wix_catalog_description_proposal.py

      - name: Configure strict SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Probe Wix canonicalization with mandatory rollback
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$REPORT_DIR"
          printf '%s\n' '{"alignment_stage":"wix-description-roundtrip-probe","status":"collector_not_completed","success":false}' > "$REPORT_FILE"
          scp -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            scripts/runtime/wix_description_roundtrip_probe.py \
            "$VM_USER@$VM_HOST:$REMOTE_PROBE"
          scp -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            scripts/runtime/wix_catalog_description_proposal.py \
            "$VM_USER@$VM_HOST:$REMOTE_GENERATOR"
          set +e
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VM_USER@$VM_HOST" \
            "chmod 700 '$REMOTE_PROBE' '$REMOTE_GENERATOR' && sudo -n env WIX_V2_GENERATOR='$REMOTE_GENERATOR' GITHUB_RUN_ID='${{ github.run_id }}' GITHUB_RUN_ATTEMPT='${{ github.run_attempt }}' python3 '$REMOTE_PROBE'; RC=\$?; sudo -n rm -f '$REMOTE_PROBE' '$REMOTE_GENERATOR'; exit \$RC" \
            > "$REPORT_FILE" 2> "$REPORT_DIR/remote.stderr"
          RC=$?
          set -e
          if ! python3 -m json.tool "$REPORT_FILE" >/dev/null 2>&1; then
            printf '%s\n' '{"alignment_stage":"wix-description-roundtrip-probe","status":"report_parse_failed","success":false}' > "$REPORT_FILE"
            RC=99
          fi
          chmod 600 "$REPORT_FILE"
          echo "PROBE_RC=$RC" >> "$GITHUB_ENV"

      - name: Upload private probe result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPORT_FILE }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: Publish terminal probe result
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          PROBE_RESULT_CODE: ${{ env.PROBE_RC }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            const resultCode = process.env.PROBE_RESULT_CODE;
            const terminalStatus = resultCode === '0' ? 'success' : 'failure';
            let report;
            if (fs.existsSync(process.env.REPORT_FILE)) {
              try {
                report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, 'utf8'));
              } catch (error) {
                report = { alignment_stage: 'wix-description-roundtrip-probe', status: 'report_parse_failed', success: false };
              }
            } else {
              report = { alignment_stage: 'wix-description-roundtrip-probe', status: 'report_missing', success: false };
            }
            report.workflow = {
              run_id: context.runId,
              run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              source_sha: context.sha,
              artifact_name: process.env.ARTIFACT_NAME,
              run_returncode: resultCode || null,
              job_status: terminalStatus,
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `audit: Wix description round-trip probe ${context.runId} ${terminalStatus}`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Enforce mandatory rollback probe result
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["REPORT_FILE"])
          if not path.is_file():
              raise SystemExit("Wix round-trip report missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          if not report.get("success"):
              raise SystemExit("Wix round-trip probe did not pass")
          if report.get("containers_unchanged") is not True:
              raise SystemExit("container inventory changed during probe")
          if report.get("target_id") != "31ab3699-504b-468c-a314-c7e5737b6683":
              raise SystemExit("unexpected probe target")
          rollback = report.get("rollback") or {}
          fallback = report.get("fallback_rollback") or {}
          if rollback.get("success") is not True and fallback.get("success") is not True:
              raise SystemExit("mandatory rollback did not succeed")
          safety = report.get("safety") or {}
          if safety.get("temporary_product_write_performed") is not True:
              raise SystemExit("probe write was not observed")
          if safety.get("net_products_changed") is not False:
              raise SystemExit("probe left a persistent product change")
          if safety.get("only_probe_product_targeted") is not True:
              raise SystemExit("probe scope violation")
          forbidden = [
              "inventory_changed", "orders_changed", "customer_data_collected",
              "order_data_collected", "inventory_quantities_collected",
              "environment_values_collected", "secret_values_collected",
              "raw_api_responses_collected", "raw_logs_collected",
              "containers_changed", "networks_changed", "volumes_changed",
              "databases_changed", "dns_changed", "full_descriptions_reported",
          ]
          if any(safety.get(key) for key in forbidden):
              raise SystemExit("probe safety contract failed")
          if any(item.get("status") != 200 for item in report.get("protected_health_after") or []):
              raise SystemExit("protected health failed after probe")
          PY

      - name: Remove temporary runner material
        if: ${{ always() }}
        run: |
          set -eu
          rm -rf "$REPORT_DIR"
          rm -f ~/.ssh/id_vm ~/.ssh/known_hosts
