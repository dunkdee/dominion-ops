name: Production Wix Storefront Layout Audit V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-wix-storefront-layout-audit-v2
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPORT_DIR: /tmp/dominion-wix-storefront-layout-audit-v2
      REPORT_FILE: /tmp/dominion-wix-storefront-layout-audit-v2/terminal_summary.json
      REPORT_BRANCH: audit/wix-storefront-layout-v2-20260722
      REPORT_PATH: governance/wix_storefront_layout_audit_v2.json
      ARTIFACT_NAME: dominion-wix-storefront-layout-audit-v2

    steps:
      - name: Publish run pointer
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: context.sha });
            }
            const report = {
              alignment_stage: 'wix-storefront-layout-audit-v2',
              status: 'started',
              workflow: {
                run_id: context.runId,
                run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                source_sha: context.sha,
                artifact_name: process.env.ARTIFACT_NAME,
              },
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `audit: Wix storefront layout V2 run ${context.runId} started`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Checkout exact audit source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate audit source
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/runtime/wix_storefront_layout_audit.py

      - name: Prepare public-only audit metadata
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$REPORT_DIR"
          cat > "$REPORT_DIR/metadata.json" <<'JSON'
          {
            "published_urls": [],
            "site_properties": {},
            "sample_products": [
              {
                "category": "charging",
                "slug": "esoulk-black-18w-pd-charger-amp-usb-a-3ft-c-to-iphone-cable"
              },
              {
                "category": "case",
                "slug": "samsung-s10e-triangle-package-case"
              },
              {
                "category": "audio",
                "slug": "portable-wireless-bluetooth-speaker-with-tws-function-rechargeable-bluetooth-s"
              }
            ],
            "fallback_candidates": [
              "https://dominionhealing.org",
              "https://www.dominionhealing.org",
              "https://shop.dominionhealing.org"
            ],
            "collection_errors": [],
            "safety": {
              "public_metadata_only": true,
              "wix_mutations_performed": false,
              "customer_data_collected": false,
              "order_data_collected": false,
              "secret_values_collected": false
            }
          }
          JSON
          chmod 600 "$REPORT_DIR/metadata.json"

      - name: Install private visual audit browser
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium

      - name: Audit desktop and mobile storefront read-only
        run: |
          set +e
          python3 scripts/runtime/wix_storefront_layout_audit.py \
            --metadata "$REPORT_DIR/metadata.json" \
            --output "$REPORT_DIR/storefront"
          RC=$?
          set -e
          echo "AUDIT_RC=$RC" >> "$GITHUB_ENV"

      - name: Build terminal audit report
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["REPORT_DIR"])
          public_path = root / "storefront" / "public_summary.json"
          if public_path.is_file():
              storefront = json.loads(public_path.read_text(encoding="utf-8"))
          else:
              storefront = {
                  "audit": "wix-storefront-layout-wording",
                  "success": False,
                  "summary": {},
                  "safety": {
                      "public_pages_only": True,
                      "forms_submitted": False,
                      "buttons_clicked": False,
                      "cart_changed": False,
                      "checkout_started": False,
                      "wix_management_mutations": False,
                  },
              }
          success = bool(storefront.get("success")) and os.environ.get("AUDIT_RC") == "0"
          report = {
              "alignment_stage": "wix-storefront-layout-audit-v2",
              "status": "success" if success else "failed",
              "success": success,
              "storefront": storefront,
              "errors": [] if success else ["storefront_audit_failed"],
              "next_gate": "Human review of private screenshots and wording findings before any Wix editor or product-content mutation",
              "safety": {
                  "public_pages_only": True,
                  "wix_mutations_performed": False,
                  "products_changed": False,
                  "inventory_changed": False,
                  "orders_changed": False,
                  "forms_submitted": False,
                  "buttons_clicked": False,
                  "cart_changed": False,
                  "checkout_started": False,
                  "customer_data_collected": False,
                  "order_data_collected": False,
                  "secret_values_collected": False,
                  "environment_values_collected": False,
                  "vm_connected": False,
                  "screenshots_private_artifact_only": True
              }
          }
          Path(os.environ["REPORT_FILE"]).write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          chmod 600 "$REPORT_FILE"

      - name: Upload private screenshots and detailed audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.REPORT_FILE }}
            ${{ env.REPORT_DIR }}/storefront/private_report.json
            ${{ env.REPORT_DIR }}/storefront/screenshots/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: Publish terminal storefront audit
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            let report;
            try {
              report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, 'utf8'));
            } catch (error) {
              report = { alignment_stage: 'wix-storefront-layout-audit-v2', status: 'report_missing', success: false };
            }
            report.workflow = {
              run_id: context.runId,
              run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              source_sha: context.sha,
              artifact_name: process.env.ARTIFACT_NAME,
              job_status: report.success ? 'success' : 'failure',
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `audit: Wix storefront layout V2 run ${context.runId} ${report.status || 'unknown'}`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Enforce read-only storefront audit
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["REPORT_FILE"])
          if not path.is_file():
              raise SystemExit("Wix storefront audit report missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          safety = report.get("safety") or {}
          forbidden = [
              "wix_mutations_performed", "products_changed", "inventory_changed",
              "orders_changed", "forms_submitted", "buttons_clicked", "cart_changed",
              "checkout_started", "customer_data_collected", "order_data_collected",
              "secret_values_collected", "environment_values_collected", "vm_connected",
          ]
          if any(safety.get(key) for key in forbidden):
              raise SystemExit("storefront audit safety contract failed")
          if not report.get("success"):
              raise SystemExit("Wix storefront layout audit did not pass")
          PY

      - name: Remove temporary runner material
        if: ${{ always() }}
        run: |
          set -eu
          rm -rf "$REPORT_DIR"
