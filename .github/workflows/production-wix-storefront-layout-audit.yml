name: Production Wix Storefront Layout Audit

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type exactly AUDIT_WIX_STOREFRONT_LAYOUT_READ_ONLY
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-wix-storefront-layout-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ inputs.confirm == 'AUDIT_WIX_STOREFRONT_LAYOUT_READ_ONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REPORT_DIR: /tmp/dominion-wix-storefront-layout-audit
      REPORT_FILE: /tmp/dominion-wix-storefront-layout-audit/terminal_summary.json
      REPORT_BRANCH: audit/wix-storefront-layout-20260722
      REPORT_PATH: governance/wix_storefront_layout_audit.json
      ARTIFACT_NAME: dominion-wix-storefront-layout-audit

    steps:
      - name: Publish run pointer
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: context.sha });
            }
            const report = {
              alignment_stage: 'wix-storefront-layout-audit',
              status: 'started',
              workflow: {
                run_id: context.runId,
                run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                source_sha: context.sha,
                artifact_name: process.env.ARTIFACT_NAME,
              },
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `audit: Wix storefront layout run ${context.runId} started`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Validate VM connection secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Checkout exact audit source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate audit syntax
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/runtime/wix_storefront_layout_audit.py

      - name: Configure strict SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare read-only collectors
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$REPORT_DIR"
          cat > "$REPORT_DIR/vm_snapshot.py" <<'PY'
          import json
          import subprocess
          import urllib.error
          import urllib.request

          protected = (
              ("baby-api", 8080, "/"),
              ("wix-agent", 8082, "/ready"),
              ("dominion-web", 8090, "/"),
              ("n8n", 5678, "/healthz"),
              ("alpha-engine", 8787, "/health"),
              ("conductor", 5060, "/health"),
          )
          health = []
          for name, port, path in protected:
              row = {"name": name, "port": port, "path": path, "reachable": False, "status": None}
              try:
                  with urllib.request.urlopen(f"http://127.0.0.1:{port}{path}", timeout=5) as response:
                      response.read(1024)
                      row.update({"reachable": True, "status": response.status})
              except urllib.error.HTTPError as exc:
                  row.update({"reachable": True, "status": exc.code})
              except Exception as exc:
                  row["error_type"] = type(exc).__name__
              health.append(row)
          result = subprocess.run(
              ["docker", "ps", "--all", "--format", "{{.Names}}|{{.ID}}|{{.Image}}|{{.Status}}"],
              capture_output=True, text=True, check=False, timeout=30,
          )
          containers = sorted(line for line in result.stdout.splitlines() if line.strip()) if result.returncode == 0 else []
          print(json.dumps({"health": health, "containers": containers}, sort_keys=True))
          PY
          cat > "$REPORT_DIR/wix_public_metadata.py" <<'PY'
          import json
          import httpx
          import wix_client as wix

          headers = {
              "Authorization": wix.WIX_API_KEY,
              "wix-site-id": wix.WIX_SITE_ID,
              "Content-Type": "application/json",
          }
          errors = []
          published_urls = []
          site_properties = {}
          try:
              response = httpx.get(
                  "https://www.wixapis.com/urls-server/v2/published-site-urls",
                  headers=headers, timeout=30.0,
              )
              response.raise_for_status()
              published_urls = (response.json() or {}).get("urls") or []
          except Exception as exc:
              errors.append({"operation": "published_urls", "error_type": type(exc).__name__})
          try:
              response = httpx.get(
                  "https://www.wixapis.com/site-properties/v4/properties",
                  headers=headers, timeout=30.0,
              )
              response.raise_for_status()
              props = (response.json() or {}).get("properties") or {}
              site_properties = {
                  "siteDisplayName": props.get("siteDisplayName"),
                  "businessName": props.get("businessName"),
                  "description": props.get("description"),
                  "email": props.get("email"),
                  "phone": props.get("phone"),
                  "language": props.get("language"),
                  "paymentCurrency": props.get("paymentCurrency"),
                  "timeZone": props.get("timeZone"),
              }
          except Exception as exc:
              errors.append({"operation": "site_properties", "error_type": type(exc).__name__})
          version = wix.detect_catalog_version()
          products = wix.get_all_products(version)
          categories = {
              "charging": ("charger", "cable", "adapter", "power bank"),
              "case": ("case", "cover", "bumper", "folio"),
              "audio": ("speaker", "headset", "earbud", "headphone"),
          }
          samples = []
          used = set()
          for category, tokens in categories.items():
              for product in products:
                  name = str(product.get("name") or "")
                  slug = str(product.get("slug") or "")
                  product_id = str(product.get("id") or "")
                  if product_id in used or not slug:
                      continue
                  if any(token in name.lower() for token in tokens):
                      samples.append({"category": category, "id": product_id, "name": name, "slug": slug})
                      used.add(product_id)
                      break
          print(json.dumps({
              "catalog_version": version,
              "published_urls": published_urls,
              "site_properties": site_properties,
              "sample_products": samples,
              "fallback_candidates": [
                  "https://dominionhealing.org",
                  "https://www.dominionhealing.org",
                  "https://shop.dominionhealing.org",
              ],
              "collection_errors": errors,
              "safety": {
                  "public_metadata_only": True,
                  "secret_values_collected": False,
                  "customer_data_collected": False,
                  "order_data_collected": False,
                  "inventory_quantities_collected": False,
                  "wix_mutations_performed": False,
              },
          }, sort_keys=True))
          PY
          chmod 600 "$REPORT_DIR"/*.py

      - name: Capture VM state and Wix public metadata
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VM_USER@$VM_HOST" "python3 -" < "$REPORT_DIR/vm_snapshot.py" > "$REPORT_DIR/vm_before.json"
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VM_USER@$VM_HOST" "docker exec -i wix-agent python -" < "$REPORT_DIR/wix_public_metadata.py" > "$REPORT_DIR/wix_public_metadata.json"
          python3 -m json.tool "$REPORT_DIR/vm_before.json" >/dev/null
          python3 -m json.tool "$REPORT_DIR/wix_public_metadata.json" >/dev/null

      - name: Install private visual audit browser
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium

      - name: Audit desktop and mobile storefront read-only
        run: |
          set -euo pipefail
          python3 scripts/runtime/wix_storefront_layout_audit.py \
            --metadata "$REPORT_DIR/wix_public_metadata.json" \
            --output "$REPORT_DIR/storefront"

      - name: Capture final VM state and build terminal report
        if: ${{ always() }}
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VM_USER@$VM_HOST" "python3 -" < "$REPORT_DIR/vm_snapshot.py" > "$REPORT_DIR/vm_after.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["REPORT_DIR"])
          before = json.loads((root / "vm_before.json").read_text(encoding="utf-8"))
          after = json.loads((root / "vm_after.json").read_text(encoding="utf-8"))
          summary_path = root / "storefront" / "public_summary.json"
          summary = json.loads(summary_path.read_text(encoding="utf-8")) if summary_path.is_file() else {
              "audit": "wix-storefront-layout-wording", "success": False,
              "summary": {}, "safety": {},
          }
          health_before_ok = all(item.get("status") == 200 for item in before.get("health") or [])
          health_after_ok = all(item.get("status") == 200 for item in after.get("health") or [])
          containers_unchanged = before.get("containers") == after.get("containers")
          success = bool(summary.get("success")) and health_before_ok and health_after_ok and containers_unchanged
          terminal = {
              "alignment_stage": "wix-storefront-layout-audit",
              "status": "success" if success else "failed",
              "success": success,
              "storefront": summary,
              "protected_health_before": before.get("health") or [],
              "protected_health_after": after.get("health") or [],
              "containers_unchanged": containers_unchanged,
              "errors": [],
              "next_gate": "Human review of private screenshots and wording findings before any Wix editor or product-content mutation",
              "safety": {
                  "wix_mutations_performed": False,
                  "products_changed": False,
                  "inventory_changed": False,
                  "orders_changed": False,
                  "forms_submitted": False,
                  "cart_changed": False,
                  "checkout_started": False,
                  "customer_data_collected": False,
                  "order_data_collected": False,
                  "secret_values_collected": False,
                  "environment_values_collected": False,
                  "containers_changed": not containers_unchanged,
                  "databases_changed": False,
                  "networks_changed": False,
                  "volumes_changed": False,
                  "dns_changed": False,
                  "screenshots_private_artifact_only": True,
              },
          }
          if not summary.get("success"):
              terminal["errors"].append("storefront_audit_failed")
          if not health_before_ok:
              terminal["errors"].append("protected_health_failed_before")
          if not health_after_ok:
              terminal["errors"].append("protected_health_failed_after")
          if not containers_unchanged:
              terminal["errors"].append("container_inventory_changed")
          Path(os.environ["REPORT_FILE"]).write_text(json.dumps(terminal, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          chmod 600 "$REPORT_FILE"

      - name: Upload private screenshots and detailed audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.REPORT_FILE }}
            ${{ env.REPORT_DIR }}/storefront/private_report.json
            ${{ env.REPORT_DIR }}/storefront/screenshots/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: Publish terminal storefront audit
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REPORT_BRANCH;
            const path = process.env.REPORT_PATH;
            let report;
            if (fs.existsSync(process.env.REPORT_FILE)) {
              try {
                report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, 'utf8'));
              } catch (error) {
                report = { alignment_stage: 'wix-storefront-layout-audit', status: 'report_parse_failed', success: false };
              }
            } else {
              report = { alignment_stage: 'wix-storefront-layout-audit', status: 'report_missing', success: false };
            }
            report.workflow = {
              run_id: context.runId,
              run_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              source_sha: context.sha,
              artifact_name: process.env.ARTIFACT_NAME,
              job_status: report.success ? 'success' : 'failure',
            };
            const content = Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `audit: Wix storefront layout run ${context.runId} ${report.status || 'unknown'}`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Enforce read-only storefront audit
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["REPORT_FILE"])
          if not path.is_file():
              raise SystemExit("Wix storefront audit report missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          if not report.get("success"):
              raise SystemExit("Wix storefront layout audit did not pass")
          if report.get("containers_unchanged") is not True:
              raise SystemExit("container inventory changed during storefront audit")
          safety = report.get("safety") or {}
          forbidden = [
              "wix_mutations_performed", "products_changed", "inventory_changed",
              "orders_changed", "forms_submitted", "cart_changed", "checkout_started",
              "customer_data_collected", "order_data_collected", "secret_values_collected",
              "environment_values_collected", "containers_changed", "databases_changed",
              "networks_changed", "volumes_changed", "dns_changed",
          ]
          if any(safety.get(key) for key in forbidden):
              raise SystemExit("storefront audit safety contract failed")
          if any(item.get("status") != 200 for item in report.get("protected_health_after") or []):
              raise SystemExit("protected health failed after storefront audit")
          PY

      - name: Remove temporary runner material
        if: ${{ always() }}
        run: |
          set -eu
          rm -rf "$REPORT_DIR"
          rm -f ~/.ssh/id_vm ~/.ssh/known_hosts
