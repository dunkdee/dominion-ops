name: RADAH MEMSHALAH Production Activate Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/radah-production-activate-once.yml'

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  activate-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: foundation-vm-production
    env:
      RELEASE_SHA: 21c39e870a28161584c595af23dfc6a0d1fb8f10
    steps:
      - name: Checkout exact verified release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Re-prove release contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          bash -n scripts/deploy_dominion_command_center.sh
          bash -n scripts/autopilot/install_autopilot.sh
          bash -n scripts/autopilot/disable_autopilot.sh
          python -m unittest tests.test_radah_autopilot -v
          python tests/test_dominion_command_center_ui.py
          python scripts/validate_buddy_authority_policy.py governance/buddy/buddy_authority_policy.json --root .
          echo "RADAH_RELEASE_CONTRACT=PASS sha=$RELEASE_SHA"

      - name: Require protected production access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          test -n "$OBSIDIAN_PASSWORD"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stage verified production bundle
        id: stage
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/radah-production-${GITHUB_RUN_ID}.tgz"
          remote_bundle="/tmp/radah-production-${GITHUB_RUN_ID}.tgz"
          remote_root="/tmp/radah-production-${GITHUB_RUN_ID}"
          password_file="$RUNNER_TEMP/obsidian-password-${GITHUB_RUN_ID}"
          remote_password="/tmp/obsidian-password-${GITHUB_RUN_ID}"

          tar -czf "$bundle" \
            obsidian \
            scripts/deploy_dominion_command_center.sh \
            scripts/autopilot \
            governance/radah_memshalah_autopilot_policy.json \
            governance/verticals.json

          umask 077
          printf '%s' "$OBSIDIAN_PASSWORD" > "$password_file"

          scp -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$bundle" "$VM_USER@$VM_HOST:$remote_bundle"
          scp -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$password_file" "$VM_USER@$VM_HOST:$remote_password"
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" \
            "chmod 600 '$remote_bundle' '$remote_password'"

          echo "remote_bundle=$remote_bundle" >> "$GITHUB_OUTPUT"
          echo "remote_root=$remote_root" >> "$GITHUB_OUTPUT"
          echo "remote_password=$remote_password" >> "$GITHUB_OUTPUT"

      - name: Deploy Command Center V3 and activate production supervisor
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          REMOTE_BUNDLE: ${{ steps.stage.outputs.remote_bundle }}
          REMOTE_ROOT: ${{ steps.stage.outputs.remote_root }}
          REMOTE_PASSWORD: ${{ steps.stage.outputs.remote_password }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "$VM_USER@$VM_HOST" \
            "REMOTE_BUNDLE='$REMOTE_BUNDLE' REMOTE_ROOT='$REMOTE_ROOT' PASSWORD_FILE='$REMOTE_PASSWORD' RUN_ID='$GITHUB_RUN_ID' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cleanup() {
            rm -rf "$REMOTE_ROOT"
            rm -f "$REMOTE_BUNDLE" "$PASSWORD_FILE"
          }
          trap cleanup EXIT

          test -f "$REMOTE_BUNDLE"
          test -f "$PASSWORD_FILE"
          test -f "$HOME/buddy_core/core/operator.py"
          mkdir -m 700 "$REMOTE_ROOT"
          tar -xzf "$REMOTE_BUNDLE" -C "$REMOTE_ROOT"

          password="$(cat "$PASSWORD_FILE")"
          test -n "$password"
          export OBSIDIAN_PASSWORD="$password"

          echo "=== COMMAND CENTER V3 ==="
          ASSET_ROOT="$REMOTE_ROOT" RUN_ID="$RUN_ID" bash "$REMOTE_ROOT/scripts/deploy_dominion_command_center.sh"

          echo "=== RADAH MEMSHALAH AUTOPILOT ==="
          ASSET_ROOT="$REMOTE_ROOT" RUN_ID="$RUN_ID" bash "$REMOTE_ROOT/scripts/autopilot/install_autopilot.sh"

          echo "=== FINAL PRODUCTION PROOF ==="
          test "$(systemctl is-active dominion-radah-autopilot.timer)" = active
          test "$(systemctl is-enabled dominion-radah-autopilot.timer)" = enabled
          test -s "$HOME/.dominion/autopilot/state.json"
          python3 - "$HOME/.dominion/autopilot/state.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p.get('cycles',0) >= 1
          lanes=p.get('lanes',{})
          assert lanes
          print(f"AUTOPILOT_STATE=PASS cycles={p['cycles']} lanes_touched={len(lanes)}")
          PY
          echo "RADAH_PRODUCTION=PASS release_sha=$RELEASE_SHA"
          REMOTE

      - name: Cleanup runner and remote staging
        if: always()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          REMOTE_BUNDLE: ${{ steps.stage.outputs.remote_bundle }}
          REMOTE_ROOT: ${{ steps.stage.outputs.remote_root }}
          REMOTE_PASSWORD: ${{ steps.stage.outputs.remote_password }}
        shell: bash
        run: |
          set +e
          if [ -f "$HOME/.ssh/foundation_vm_key" ]; then
            ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" \
              "rm -rf '$REMOTE_ROOT'; rm -f '$REMOTE_BUNDLE' '$REMOTE_PASSWORD'" >/dev/null 2>&1
          fi
          rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP"/radah-production-*.tgz "$RUNNER_TEMP"/obsidian-password-*
