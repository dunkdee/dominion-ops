name: RADAH MEMSHALAH Buddy Runtime Diagnostic Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/radah-production-activate-once.yml'

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: foundation-vm-production
    steps:
      - name: Require protected VM access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Identify proven Buddy interpreter and missing import
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== BUDDY SERVICE UNIT ==='
          sudo systemctl show dominion-buddy-web.service -p ExecStart -p User -p WorkingDirectory --no-pager 2>&1 | sed -E 's/(Environment(File)?=).*/\1[redacted]/' || true
          echo '=== BUDDY RUNNING INTERPRETER ==='
          buddy_pid="$(systemctl show dominion-buddy-web.service -p MainPID --value 2>/dev/null || true)"
          echo "BUDDY_PID_PRESENT=$([ -n "$buddy_pid" ] && [ "$buddy_pid" != 0 ] && echo yes || echo no)"
          if [ -n "$buddy_pid" ] && [ "$buddy_pid" != 0 ]; then
            readlink -f "/proc/$buddy_pid/exe" 2>/dev/null | sed "s#$HOME#~#g" || true
            tr '\0' ' ' < "/proc/$buddy_pid/cmdline" 2>/dev/null | sed "s#$HOME#~#g" || true
            echo
          fi
          echo '=== SYSTEM PYTHON IMPORT ==='
          /usr/bin/python3 - <<'PY'
          import sys, traceback
          from pathlib import Path
          root = Path.home() / 'buddy_core'
          sys.path.insert(0, str(root))
          try:
              import core.operator
              print('SYSTEM_PYTHON_OPERATOR_IMPORT=PASS')
          except Exception as exc:
              print(f'SYSTEM_PYTHON_OPERATOR_IMPORT=FAIL type={type(exc).__name__} detail={exc}')
              traceback.print_exc(limit=8)
          PY
          echo '=== CANDIDATE PYTHONS ==='
          for py in "$HOME/buddy_core/.venv/bin/python" "$HOME/buddy_core/venv/bin/python" "$HOME/.venv/bin/python" "$HOME/venv/bin/python"; do
            if [ -x "$py" ]; then
              echo "CANDIDATE=$(printf '%s' "$py" | sed "s#$HOME#~#g")"
              "$py" - <<'PY'
          import sys
          from pathlib import Path
          root = Path.home() / 'buddy_core'
          sys.path.insert(0, str(root))
          try:
              import core.operator
              print('OPERATOR_IMPORT=PASS')
          except Exception as exc:
              print(f'OPERATOR_IMPORT=FAIL type={type(exc).__name__} detail={exc}')
          PY
            fi
          done
          echo '=== END DIAGNOSTIC ==='
          REMOTE

      - name: Cleanup runner access material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
