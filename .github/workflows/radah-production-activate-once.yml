name: RADAH MEMSHALAH Mission Diagnostic Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/radah-production-activate-once.yml'

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: foundation-vm-production
    steps:
      - name: Require protected VM access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" && test -n "$VM_USER" && test -n "$VM_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read bounded mission failure evidence
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== AUTOPILOT STATE ==='
          systemctl is-active dominion-radah-autopilot.timer 2>/dev/null || true
          systemctl is-enabled dominion-radah-autopilot.timer 2>/dev/null || true
          echo '=== SERVICE JOURNAL ==='
          sudo journalctl -u dominion-radah-autopilot.service --since '2026-08-25 19:00:55 UTC' --until '2026-08-25 19:01:10 UTC' --no-pager -n 220 2>&1 || true
          echo '=== LATEST RECEIPTS ==='
          find "$HOME/.dominion/autopilot/receipts" -maxdepth 1 -type f -name '*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -4 | cut -d' ' -f2- | while read -r f; do
            echo "--- $(basename "$f") ---"
            python3 - "$f" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          keep={k:p.get(k) for k in ('created_at','lane','status','mission_id','held','supervisor_error','receipts')}
          print(json.dumps(keep,ensure_ascii=False,sort_keys=True))
          PY
          done
          echo '=== STATE SUMMARY ==='
          python3 - "$HOME/.dominion/autopilot/state.json" <<'PY' 2>/dev/null || true
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          print(json.dumps({'cycles':p.get('cycles'),'lanes':p.get('lanes')},sort_keys=True))
          PY
          REMOTE

      - name: Cleanup runner access material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
