name: RADAH MEMSHALAH Production Activate Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/radah-production-activate-once.yml'

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  activate-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: foundation-vm-production
    env:
      RELEASE_SHA: cdcbd3d80060d7eca938bd6f27a98120217eb911
    steps:
      - name: Checkout exact corrected release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Re-prove autopilot release contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          bash -n scripts/autopilot/install_autopilot.sh
          bash -n scripts/autopilot/disable_autopilot.sh
          python -m unittest tests.test_radah_autopilot -v
          python scripts/validate_buddy_authority_policy.py governance/buddy/buddy_authority_policy.json --root .
          grep -Fq 'dominion_env' scripts/autopilot/install_autopilot.sh
          ! grep -Fq 'ExecStart=/usr/bin/python3' scripts/autopilot/install_autopilot.sh
          echo "RADAH_RUNTIME_FIX_CONTRACT=PASS sha=$RELEASE_SHA"

      - name: Require protected production access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stage exact autopilot bundle
        id: stage
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/radah-autopilot-${GITHUB_RUN_ID}.tgz"
          remote_bundle="/tmp/radah-autopilot-${GITHUB_RUN_ID}.tgz"
          remote_root="/tmp/radah-autopilot-${GITHUB_RUN_ID}"
          tar -czf "$bundle" scripts/autopilot governance/radah_memshalah_autopilot_policy.json governance/verticals.json
          scp -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$bundle" "$VM_USER@$VM_HOST:$remote_bundle"
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" \
            "chmod 600 '$remote_bundle'"
          echo "remote_bundle=$remote_bundle" >> "$GITHUB_OUTPUT"
          echo "remote_root=$remote_root" >> "$GITHUB_OUTPUT"

      - name: Activate governed production supervisor
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          REMOTE_BUNDLE: ${{ steps.stage.outputs.remote_bundle }}
          REMOTE_ROOT: ${{ steps.stage.outputs.remote_root }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "$VM_USER@$VM_HOST" \
            "REMOTE_BUNDLE='$REMOTE_BUNDLE' REMOTE_ROOT='$REMOTE_ROOT' RUN_ID='$GITHUB_RUN_ID' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cleanup() {
            rm -rf "$REMOTE_ROOT"
            rm -f "$REMOTE_BUNDLE"
          }
          trap cleanup EXIT
          test -f "$REMOTE_BUNDLE"
          mkdir -m 700 "$REMOTE_ROOT"
          tar -xzf "$REMOTE_BUNDLE" -C "$REMOTE_ROOT"

          echo '=== RADAH MEMSHALAH AUTOPILOT ==='
          ASSET_ROOT="$REMOTE_ROOT" RUN_ID="$RUN_ID" bash "$REMOTE_ROOT/scripts/autopilot/install_autopilot.sh"

          echo '=== FINAL PRODUCTION PROOF ==='
          test "$(systemctl is-active dominion-radah-autopilot.timer)" = active
          test "$(systemctl is-enabled dominion-radah-autopilot.timer)" = enabled
          test -s "$HOME/.dominion/autopilot/state.json"
          python3 - "$HOME/.dominion/autopilot/state.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p.get('cycles',0) >= 1
          lanes=p.get('lanes',{})
          assert lanes
          assert any(v.get('last_status') in {'COMPLETE','HELD'} for v in lanes.values())
          print(f"AUTOPILOT_STATE=PASS cycles={p['cycles']} lanes_touched={len(lanes)}")
          PY
          for spec in \
            'n8n|http://127.0.0.1:5678/healthz' \
            'conductor|http://127.0.0.1:5060/health' \
            'alpha_engine|http://127.0.0.1:8787/health' \
            'dominion_web|http://127.0.0.1:8090/' \
            'wix_agent|http://127.0.0.1:8082/ready'; do
            name="${spec%%|*}"; url="${spec#*|}"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 "$url" || true)"
            test "$code" = 200
            echo "PRODUCTION_HEALTH=PASS name=$name status=200"
          done
          buddy_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:5070/buddy || true)"
          test "$buddy_code" = 401
          echo 'PRODUCTION_HEALTH=PASS name=buddy auth=protected'
          echo "RADAH_PRODUCTION=PASS release_sha=$RELEASE_SHA"
          REMOTE

      - name: Cleanup runner and remote staging
        if: always()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          REMOTE_BUNDLE: ${{ steps.stage.outputs.remote_bundle }}
          REMOTE_ROOT: ${{ steps.stage.outputs.remote_root }}
        run: |
          set +e
          if [ -f "$HOME/.ssh/foundation_vm_key" ]; then
            ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" \
              "rm -rf '$REMOTE_ROOT'; rm -f '$REMOTE_BUNDLE'" >/dev/null 2>&1
          fi
          rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP"/radah-autopilot-*.tgz
