name: RADAH MEMSHALAH Autopilot Diagnostic Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/radah-production-activate-once.yml'

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: foundation-vm-production
    steps:
      - name: Require protected VM access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read preserved first-start evidence only
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== HOST ==='
          id
          python3 --version 2>&1 || true
          echo '=== BUDDY SOURCE ==='
          test -f "$HOME/buddy_core/core/operator.py" && echo 'BUDDY_OPERATOR=PASS' || echo 'BUDDY_OPERATOR=FAIL'
          test -d "$HOME/.dominion" && echo 'DOMINION_STATE_ROOT=PASS' || echo 'DOMINION_STATE_ROOT=FAIL'
          echo '=== AUTOPILOT POST-ROLLBACK STATE ==='
          systemctl is-active dominion-radah-autopilot.service 2>/dev/null || true
          systemctl is-active dominion-radah-autopilot.timer 2>/dev/null || true
          systemctl is-enabled dominion-radah-autopilot.timer 2>/dev/null || true
          find "$HOME/.dominion/autopilot" -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null | sed "s#$HOME#~#g" | head -80 || true
          echo '=== FIRST-START JOURNAL ==='
          sudo journalctl -u dominion-radah-autopilot.service --since '2026-08-25 18:29:45 UTC' --until '2026-08-25 18:30:15 UTC' --no-pager -n 160 2>&1 || true
          echo '=== END DIAGNOSTIC ==='
          REMOTE

      - name: Cleanup runner access material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
