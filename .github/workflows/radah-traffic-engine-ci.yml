name: RADAH Traffic Engine CI

on:
  pull_request:
    paths:
      - 'OPS/radah-traffic-engine/**'
      - '.github/workflows/radah-traffic-engine-ci.yml'
  push:
    branches:
      - 'feat/radah-traffic-engine-v2-2'
    paths:
      - 'OPS/radah-traffic-engine/**'
      - '.github/workflows/radah-traffic-engine-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OPS/radah-traffic-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m compileall -q app
