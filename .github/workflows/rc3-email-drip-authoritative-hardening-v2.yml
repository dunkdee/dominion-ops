name: RC3 Email Drip — Authoritative Hardening V2

on:
  push:
    branches:
      - rc3/email-drip-review-ready-20260809
    paths:
      - .github/workflows/rc3-email-drip-authoritative-hardening-v2.yml

permissions:
  contents: write

concurrency:
  group: rc3-email-drip-authoritative-hardening-v2
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact review branch
        uses: actions/checkout@v5
        with:
          ref: rc3/email-drip-review-ready-20260809
          fetch-depth: 0

      - name: Structurally harden source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path("services/email_drip/email_drip.py")
          source = path.read_text(encoding="utf-8")
          ast.parse(source)

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              source = source.replace(old, new, 1)

          def node_offsets(text: str, node: ast.AST) -> tuple[int, int]:
              lines = text.splitlines(keepends=True)
              if not hasattr(node, "lineno") or getattr(node, "end_lineno", None) is None:
                  raise SystemExit("AST node missing source range")
              start = sum(len(line) for line in lines[: node.lineno - 1])
              end = sum(len(line) for line in lines[: node.end_lineno])
              while end < len(text) and text[end] == "\n":
                  end += 1
              return start, end

          def replace_function(name: str, replacement: str) -> None:
              global source
              tree = ast.parse(source)
              node = next((n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == name), None)
              if node is None:
                  raise SystemExit(f"function not found: {name}")
              start, end = node_offsets(source, node)
              source = source[:start] + replacement.strip("\n") + "\n\n" + source[end:]
              ast.parse(source)

          def insert_before_function(name: str, addition: str) -> None:
              global source
              tree = ast.parse(source)
              node = next((n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == name), None)
              if node is None:
                  raise SystemExit(f"function not found for insert: {name}")
              start, _ = node_offsets(source, node)
              source = source[:start] + addition.strip("\n") + "\n\n" + source[start:]
              ast.parse(source)

          def replace_assignment(name: str, replacement: str) -> None:
              global source
              tree = ast.parse(source)
              found = []
              for node in tree.body:
                  if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == name for t in node.targets):
                      found.append(node)
                  elif isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name) and node.target.id == name:
                      found.append(node)
              if len(found) != 1:
                  raise SystemExit(f"assignment {name}: expected 1, found {len(found)}")
              start, end = node_offsets(source, found[0])
              source = source[:start] + replacement.strip("\n") + "\n\n" + source[end:]
              ast.parse(source)

          replace_once("import hmac\n", "import hmac\nimport hashlib\n", "hashlib import")
          replace_once(
              "Deploy: systemd service on foundation-vm  |  SendGrid for delivery",
              "Deploy: systemd service on foundation-vm  |  PrivateEmail SMTP for controlled delivery",
