              'Readers who pick up all three tell us it feels like a personal development system, not just a stack of books.': 'Together, the three books offer different kinds of structured practice: puzzles, reflection, and financial planning.',
              'Your brain is already better for it.': 'Thank you for spending these two weeks with us.',

              'That instinct is backed by hard science. A 2015 study published in <em>Psychological Science</em> found that people who write about their goals are <strong>42% more likely to achieve them</strong> than those who simply think about them.': 'Writing a goal down can make a vague intention more concrete. Research on goal setting has also examined action commitments and accountability. No writing exercise guarantees an outcome, but a clear written next step can make progress easier to track.',
              'reflection architecture designed to rewire how you think about your own potential': 'reflection structure designed to help you examine how you think about your own potential',
              'the science behind gratitude journaling -- and why most people do it wrong': 'a practical approach to gratitude journaling -- and how to make prompts more specific',
              'Why most gratitude journals fail (and what works instead)': 'A more specific way to practice gratitude',
              'The Gratitude Mistake Almost Everyone Makes': 'Make Gratitude More Specific',
              '<p>You have probably heard that gratitude journaling improves happiness. That is true -- but there is a catch most people miss.</p>\n<p><strong>Writing "I\'m grateful for my family" every day does almost nothing.</strong></p>\n<p>Research from UC Davis psychologist Robert Emmons shows that gratitude only rewires your brain when it is <em>specific</em> and <em>novel</em>. Here is the difference:</p>': '<p>Research reviews suggest gratitude practices can produce small average improvements in well-being, although effects vary from person to person.</p>\n<p>One useful way to make a gratitude entry more concrete is to describe a specific moment rather than repeat the same broad phrase every day. Here is the difference:</p>',
              '<p>The second version forces your brain to relive the experience. That activates the prefrontal cortex and floods your system with dopamine and serotonin -- the same chemicals targeted by antidepressants, generated naturally.</p>\n<p>The <em>Sovereign Mind Journal</em> is structured around this principle. Every prompt pushes you past surface-level answers into the kind of specific reflection that actually changes your neurochemistry.</p>': '<p>The second version records what actually happened, which can make the entry easier to remember and reflect on later.</p>\n<p>The <em>Sovereign Mind Journal</em> uses specific prompts to move beyond one-line answers and create a more detailed record of your own observations.</p>',
              '"I stopped needing my therapist to tell me what I already knew"': 'A structured way to notice your own patterns',
              '<h2 style="color:#5b4a3f;">What Guided Journaling Unlocks</h2>\n<p>Hi {{name}},</p>\n<p>We hear from readers regularly. These two messages capture something important:</p>\n<blockquote style="border-left:4px solid #c9a96e;padding:10px 15px;background:#faf6f0;margin:15px 0;">\n"After 30 days with this journal, I stopped needing my therapist to tell me what I already knew. The prompts helped me see my own patterns clearly for the first time." -- <em>J. Carter</em>\n</blockquote>\n<blockquote style="border-left:4px solid #c9a96e;padding:10px 15px;background:#faf6f0;margin:15px 0;">\n"I have tried five different journals. They all felt generic. This one asks questions that actually make me think. I look forward to it every morning." -- <em>S. Mitchell</em>\n</blockquote>\n<p>Self-awareness is not a personality trait. It is a skill -- and like any skill, it improves with the right practice and the right structure. That is exactly what guided journaling provides.</p>\n<p>The question is not whether journaling works. The question is whether you are using a system designed to work for you.</p>': '<h2 style="color:#5b4a3f;">Use Prompts to Notice Patterns</h2>\n<p>Hi {{name}},</p>\n<p>A blank page asks you to invent both the question and the answer. A guided journal removes the first problem by giving you a specific prompt to respond to.</p>\n<p>That structure can help you compare what you wrote across days and weeks, notice recurring themes, and decide what you want to do next.</p>\n<p>It is a reflection tool, not a substitute for professional mental-health care.</p>',
              'Over the past week, you have seen the science, the method, and the results.': 'Over the past week, you have seen the method and the structure.',
              'This is not a diary. It is a cognitive operating system for people who refuse to leave their potential on the table.': 'This is a structured journal for people who want prompts, checkpoints, and a repeatable reflection routine.',
              'Ninety days from now, you will either be the same person or someone who took the time to build a sovereign mind. The journal just makes the process clear.': 'Ninety days gives you a defined practice window. What you get from it depends on how consistently and thoughtfully you use it.',
              'structured reflection reshapes your thinking': 'structured reflection can help you examine your thinking',
              'Golden Years Word Search</strong> -- cognitive sharpness through engaging mental exercise': 'Golden Years Word Search</strong> -- recreational puzzle practice',
              'Debt Freedom Planner</strong> -- financial control through a proven payoff system': 'Debt Freedom Planner</strong> -- structured debt-payoff planning',
              'Readers who combine all three consistently report that the effect is compounding. A clear mind makes better financial decisions. A sharp brain sustains long-term discipline. Financial freedom removes the stress that clouds everything else.': 'The three books serve different purposes: reflection, recreational puzzles, and financial planning. You can use whichever tool fits the area you want to work on.',

              'Thank you for signing up. You just did something that 78% of Americans avoid: you acknowledged that debt is worth confronting head-on.': 'Thank you for signing up. You chose to look at your debt directly and turn it into a set of numbers you can work with.',
              'Here is the truth nobody tells you: <strong>debt is not a character flaw. It is a math problem.</strong> And math problems have solutions.': 'Debt can carry emotional weight, but a repayment plan starts with concrete numbers: balances, interest rates, minimum payments, and available cash flow.',
              'the two most effective debt payoff strategies': 'two common debt payoff strategies',
              'There are dozens of debt strategies out there, but only two have survived serious academic scrutiny:': 'Two common approaches organize extra payments in different ways:',
              'Pay minimums on everything. Throw extra money at your <em>smallest</em> balance first. When it is gone, roll that payment into the next smallest. The wins come fast, and the psychological momentum is real. A Northwestern University study found snowball users are 14% more likely to eliminate all debt.': 'Pay required minimums, then direct available extra money to the smallest balance first. When that balance is paid, roll that amount toward the next balance. Some people prefer this approach because it creates earlier account closures.',
              'Pay minimums on everything. Throw extra money at the <em>highest interest rate</em> first. You save more money over time, but the first payoff takes longer. This method suits people who are motivated by efficiency over emotion.': 'Pay required minimums, then direct available extra money to the highest interest rate first. With the same payment amounts and no special constraints, prioritizing higher rates generally reduces interest cost compared with paying lower-rate balances first.',
              'includes worksheets for both methods so you can map out your exact timeline either way': 'includes worksheets for both methods so you can build and revise a working timeline',
              '"We paid off $23,000 in 11 months using this planner"': 'Why visible progress matters in a payoff plan',
              '<h2 style="color:#5b4a3f;">From Overwhelmed to Debt-Free</h2>\n<p>Hi {{name}},</p>\n<p>Numbers on a page are powerful. But real stories are what make people take action:</p>\n<blockquote style="border-left:4px solid #c9a96e;padding:10px 15px;background:#faf6f0;margin:15px 0;">\n"My wife and I sat down with this planner on a Sunday afternoon. Seeing everything mapped out -- balances, interest rates, the payoff timeline -- changed the conversation. We stopped fighting about money and started working as a team. Eleven months later, $23,000 gone." -- <em>D. and K. Williams</em>\n</blockquote>\n<blockquote style="border-left:4px solid #c9a96e;padding:10px 15px;background:#faf6f0;margin:15px 0;">\n"I tried apps, spreadsheets, everything. Something about writing it down by hand and physically checking off each payment made it stick. I am four months in and already eliminated two credit cards." -- <em>T. Nguyen</em>\n</blockquote>\n<p>The common thread is not willpower. It is structure. When you can see the path laid out in front of you, the daily discipline gets easier because you know exactly where each dollar is going and exactly when freedom arrives.</p>': '<h2 style="color:#5b4a3f;">Make Progress Visible</h2>\n<p>Hi {{name}},</p>\n<p>A payoff plan is easier to evaluate when balances, rates, required payments, and extra payments are visible in one place.</p>\n<p>Tracking each update also gives you a record you can compare against your original estimate. If income, expenses, rates, or balances change, revise the plan rather than treating the first timeline as a promise.</p>\n<p>The planner is designed to make that record-keeping straightforward.</p>',
              'You have learned the two strategies. You have seen what structured planning does for real people.': 'You have compared two common strategies and seen how a written plan can organize the numbers.',
              'Budget frameworks that find extra payoff money you did not know you had': 'Budget worksheets that help you identify possible room for extra payments',
              'This planner does not just tell you to pay off debt. It shows you exactly how, in what order, and by what date.': 'This planner helps you choose an order, estimate a timeline, and track progress. Results depend on your balances, rates, fees, income, and payment amounts.',
              'eliminate financial stress with a clear, structured payoff system': 'organize debt-payoff planning with a clear, structured system',
              'Money, mind, and mental fitness. When all three are working together, the compounding effect is remarkable. Readers who use the full set consistently report feeling more in control of their lives than they have in years.': 'The three books address different activities: debt-payoff planning, guided reflection, and recreational puzzles. Use the tools that fit your goals and circumstances.',

              'principles from the book that have transformed lives. Real principles. No hype.': 'principles from the book for you to consider. No hype.',
              'This is not theory. This is a daily practice that changes how you see everything.': 'This is a repeatable practice for examining beliefs, assumptions, and choices.',
              'What readers say about Divine Sovereignty': 'Questions Divine Sovereignty asks you to examine',
              '<h2 style="color:#5b4a3f;">This Book Changes People</h2>': '<h2 style="color:#5b4a3f;">Questions Worth Examining</h2>',
              '<blockquote style="border-left:4px solid #d4af37;padding:10px 15px;background:#faf6f0;margin:15px 0;">"This book does not just inspire -- it rebuilds. A blueprint for those ready to break free."</blockquote>\n<blockquote style="border-left:4px solid #d4af37;padding:10px 15px;background:#faf6f0;margin:15px 0;">"Rarely does a book challenge you spiritually, psychologically, and practically all at once."</blockquote>\n<blockquote style="border-left:4px solid #d4af37;padding:10px 15px;background:#faf6f0;margin:15px 0;">"If you are tired of surface-level spirituality and want real transformation, this is your manual."</blockquote>': '<ul>\n<li>Which beliefs did you inherit without examining?</li>\n<li>Which values do you want your decisions to reflect?</li>\n<li>Where do responsibility, faith, and personal agency meet in your daily life?</li>\n</ul>\n<p>The book develops these questions through its own spiritual and personal-development framework.</p>',
              'Freedom, healing, and wealth -- all in one book': 'Freedom, purpose, and responsibility -- inside one book',
              'Divine Sovereignty covers the full transformation:': 'Divine Sovereignty is organized around three parts:',
              'Destroying bondage, creator mindset, wealth as divine right': 'Examining bondage, creator mindset, responsibility, and beliefs about wealth',
              '<strong>"Sovereignty is internal freedom that produces external impact."</strong><br>-- Divine Sovereignty, Chapter 1': '<strong>The book\'s core theme:</strong> internal authority should show up in your decisions, habits, and responsibilities.',
          }
          for old, new in replacements.items():
              replace_once(old, new, f"copy hardening: {old[:45]}")

          # Add book-specific disclaimers and a single canonical unsubscribe footer.
          insert_anchor = 'BOOK_EMAILS["free_audit_hold"] = {}\n'
          replace_once(
              insert_anchor,
              insert_anchor + '''\nBOOK_DISCLAIMERS = {
              "golden_years": "Recreational and general educational content only; not medical advice or treatment.",
              "sovereign_mind": "Personal reflection and general educational content only; not mental-health treatment.",
              "debt_freedom": "General educational planning content only; not individualized financial, tax, or legal advice.",
              "divine_sovereignty": "Spiritual and personal-development content; not medical, legal, or financial advice.",
              "free_audit_hold": "",
          }\n''',
              "book disclaimers",
          )

          # Replace scheduler with a shared pure planning path used by both preflight and live execution.
          scheduler_anchor = '# ---------------------------------------------------------------------------\n# Drip scheduler logic\n# ---------------------------------------------------------------------------\n'
          helper = r'''
          # ---------------------------------------------------------------------------
          # Drip scheduler logic
          # ---------------------------------------------------------------------------


          def _plan_due_message(lead: dict, now: datetime) -> dict:
              """Return one scheduler-faithful candidate or a non-send status; never mutate state."""
              email = str(lead.get("email", "")).strip().lower()
              captured_raw = str(lead.get("captured_at", "")).strip()
              if not email or "@" not in email or not captured_raw:
                  return {"status": "ghost_or_invalid", "lead_ref": _lead_ref(email)}

              suppression = _suppression_state(email)
              if suppression == "error":
                  return {"status": "suppression_error", "lead_ref": _lead_ref(email)}
              if suppression == "suppressed":
                  return {"status": "suppressed", "lead_ref": _lead_ref(email)}

              try:
                  captured = datetime.fromisoformat(captured_raw.replace("Z", "+00:00"))
                  if captured.tzinfo is None:
                      return {"status": "invalid_captured_at", "lead_ref": _lead_ref(email)}
              except (TypeError, ValueError):
                  return {"status": "invalid_captured_at", "lead_ref": _lead_ref(email)}

              days_since = (now - captured).days
              already_sent = set(lead.get("emails_sent", []))
              resolved_from_source = _resolve_book(str(lead.get("source", "")))
              book = "free_audit_hold" if resolved_from_source == "free_audit_hold" else lead.get("book", DEFAULT_BOOK)
              emails = BOOK_EMAILS.get(book, BOOK_EMAILS[DEFAULT_BOOK])
              if not emails:
                  return {"status": "no_email_content", "book": book, "lead_ref": _lead_ref(email)}

              for step in DRIP_SCHEDULE:
                  if step["key"] in already_sent:
                      continue
                  if days_since < step["day"]:
                      continue
                  email_content = emails.get(step["key"])
                  if not email_content:
                      continue
                  unsubscribe_url = (lead.get("unsubscribe_url") or "").strip() or _unsubscribe_url(email)
                  if not unsubscribe_url:
                      return {"status": "unsubscribe_unavailable", "book": book, "step": step["key"], "lead_ref": _lead_ref(email)}
                  return {
                      "status": "candidate",
                      "email": email,
                      "lead_ref": _lead_ref(email),
                      "name": lead.get("name") or "Friend",
                      "book": book,
                      "step": step["key"],
                      "subject": email_content["subject"],
                      "body": email_content["body"],
                      "unsubscribe_url": unsubscribe_url,
                  }

              return {"status": "no_due_email", "book": book, "lead_ref": _lead_ref(email)}


          def _build_preflight_report(data: Optional[dict] = None, now: Optional[datetime] = None) -> dict:
              """Use the exact scheduler planner to report blast radius without transport or state mutation."""
              snapshot = _load_leads() if data is None else data
              if not isinstance(snapshot, dict) or not isinstance(snapshot.get("leads"), list):
                  raise ValueError("invalid lead store schema")
              current = now or datetime.now(timezone.utc)
              status_counts = {}
              candidates = []
              for lead in snapshot["leads"]:
                  plan = _plan_due_message(lead, current)
                  status = plan["status"]
                  status_counts[status] = status_counts.get(status, 0) + 1
                  if status == "candidate":
                      candidates.append({
                          "book": plan["book"],
                          "step": plan["step"],
                          "subject": plan["subject"],
                      })
              return {
                  "total_leads": len(snapshot["leads"]),
                  "candidate_count": len(candidates),
                  "candidates": candidates,
                  "status_counts": status_counts,
                  "free_audit_candidate_count": sum(1 for item in candidates if item["book"] == "free_audit_hold"),
                  "pii_fields_included": False,
                  "transport_invoked": False,
                  "state_mutated": False,
              }
          '''
          replace_once(scheduler_anchor, helper.strip("\n") + "\n\n", "scheduler helpers")

          replace_function("_run_drip_cycle", r'''
          def _run_drip_cycle() -> int:
              """Execute one scheduler cycle; state advances only after approved SMTP returns success."""
              now = datetime.now(timezone.utc)
              sent_count = 0
              changed = False

              try:
                  with LEADS_LOCK:
                      data = _load_leads()
                      if not isinstance(data, dict) or not isinstance(data.get("leads"), list):
                          raise ValueError("invalid lead store schema")
                      data.setdefault("stats", {}).setdefault("emails_sent", 0)

                      for lead in data["leads"]:
                          plan = _plan_due_message(lead, now)
                          status = plan["status"]
                          if status == "ghost_or_invalid":
                              log.warning("Ghost/invalid drip lead skipped; report-only, no deletion")
                              continue
                          if status == "invalid_captured_at":
                              log.warning("Invalid captured_at skipped lead_ref=%s; report-only, no deletion", plan["lead_ref"])
                              continue
                          if status == "suppression_error":
                              log.error("Suppression check failed; send blocked lead_ref=%s", plan["lead_ref"])
                              continue
                          if status != "candidate":
                              continue

                          if DRIP_SEND_MODE != "live":
                              log.info(
                                  "DRIP HOLD: due email blocked lead_ref=%s book=%s step=%s",
                                  plan["lead_ref"], plan["book"], plan["step"],
                              )
                              continue

                          body = plan["body"].replace("{{name}}", plan["name"])
                          disclaimer = BOOK_DISCLAIMERS.get(plan["book"], "")
                          safe_url = html_lib.escape(plan["unsubscribe_url"], quote=True)
                          body += '<hr style="margin-top:28px;border:0;border-top:1px solid #ddd;">'
                          if disclaimer:
                              body += f'<p style="font-size:12px;color:#777">{html_lib.escape(disclaimer)}</p>'
                          body += (
                              '<p style="font-size:12px;color:#777">'
                              'You received this because you signed up at Dominion Healing. '
                              f'<a href="{safe_url}">Unsubscribe</a>'
                              '</p>'
                          )

                          success = _send_email(plan["email"], plan["name"], plan["subject"], body)
                          if success:
                              lead.setdefault("emails_sent", []).append(plan["step"])
                              lead["last_sent_at"] = now.isoformat()
                              data["stats"]["emails_sent"] += 1
                              sent_count += 1
                              changed = True

                      if changed:
                          _save_leads(data)
              except (RuntimeError, json.JSONDecodeError, OSError, Timeout, TypeError, ValueError) as exc:
                  log.error("Drip cycle blocked: %s", type(exc).__name__)
                  return 0

              log.info("Drip cycle complete: %d emails sent", sent_count)
              return sent_count
          ''')

          # Remove remaining raw-email log output and update status surface.
          replace_once(
              'log.info("Captured lead: %s for book=%s source=%s", email, book, source_value)',
              'log.info("Captured lead_ref=%s for book=%s source=%s", _lead_ref(email), book, source_value)',
              "capture log redaction",
          )
          replace_once(
              '"sendgrid_configured": bool(SENDGRID_API_KEY),',
              '"sendgrid_configured": False,\n        "smtp_configured": bool(GMAIL_ADDRESS and GMAIL_PASSWORD),\n        "transport": "smtp",',
              "status transport",
          )
          replace_once(
              'log.info("Email drip engine online | from=%s | sendgrid=%s", FROM_EMAIL, bool(SENDGRID_API_KEY))',
              'log.info("Email drip engine online | from=%s | transport=smtp | mode=%s", FROM_EMAIL, DRIP_SEND_MODE)',
              "startup log",
          )

          ast.parse(source)
          forbidden = [
              "Johns Hopkins confirmed",
              "13%",
              "42% more likely",
              "dopamine and serotonin",
              "same chemicals targeted by antidepressants",
              "$23,000 in 11 months",
              "14% more likely",
              "78% of Americans",
              "transformed lives",
              "trying SendGrid",
              "sendgrid.SendGridAPIClient",
          ]
          found = [item for item in forbidden if item in source]
          if found:
              raise SystemExit(f"forbidden legacy claims/transport remain: {found}")
          if 'mailto:{FROM_EMAIL}?subject=Unsubscribe' in source:
              raise SystemExit("legacy mailto unsubscribe remains")

          path.write_text(source, encoding="utf-8", newline="\n")
          PY
          python3 -m py_compile services/email_drip/email_drip.py

      - name: Add deterministic governance tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests
          cat > tests/test_email_drip_governance.py <<'PY'
          from __future__ import annotations

          import importlib.util
          import json
          import smtplib
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          import pytest

          SOURCE = Path(__file__).parents[1] / "services" / "email_drip" / "email_drip.py"


          def load_module(tmp_path: Path, monkeypatch: pytest.MonkeyPatch, *, mode: str = "hold"):
              secret = tmp_path / "webhook_secret.key"
              secret.write_text("synthetic-test-secret", encoding="utf-8")
              leads = tmp_path / "leads.json"
              leads.write_text(json.dumps({"leads": [], "stats": {"total_captured": 0, "emails_sent": 0}}), encoding="utf-8")
              suppression = tmp_path / "suppression.json"
              suppression.write_text(json.dumps({"emails": []}), encoding="utf-8")
              monkeypatch.setenv("DRIP_WEBHOOK_SECRET_PATH", str(secret))
              monkeypatch.setenv("DRIP_LEADS_FILE", str(leads))
              monkeypatch.setenv("DRIP_SUPPRESSION_FILE", str(suppression))
              monkeypatch.setenv("DRIP_SEND_MODE", mode)
              monkeypatch.setenv("SMTP_EMAIL", "sender@example.invalid")
              monkeypatch.setenv("SMTP_PASSWORD", "synthetic-password")
              name = f"email_drip_test_{id(tmp_path)}_{mode}"
              spec = importlib.util.spec_from_file_location(name, SOURCE)
              module = importlib.util.module_from_spec(spec)
              assert spec and spec.loader
              sys.modules[name] = module
              spec.loader.exec_module(module)
              module.log.disabled = True
              return module, leads, suppression


          def due_lead(now: datetime, *, source: str = "sovereign_mind", book: str = "sovereign_mind") -> dict:
              return {
                  "email": "customer@example.invalid",
                  "name": "Customer",
                  "source": source,
                  "book": book,
                  "captured_at": (now - timedelta(days=7)).isoformat(),
                  "emails_sent": ["welcome", "value", "social_proof"],
                  "last_sent_at": None,
                  "unsubscribe_url": "",
              }


          def test_default_mode_is_hold(tmp_path, monkeypatch):
              module, _, _ = load_module(tmp_path, monkeypatch, mode="hold")
              assert module.DRIP_SEND_MODE == "hold"


          def test_preflight_uses_scheduler_planner_and_redacts_pii(tmp_path, monkeypatch):
              module, _, _ = load_module(tmp_path, monkeypatch)
              now = datetime.now(timezone.utc)
              data = {
                  "leads": [
                      due_lead(now),
                      {**due_lead(now), "email": "", "source": "website"},
                      {**due_lead(now), "source": "free-audit", "book": "sovereign_mind"},
                  ],
                  "stats": {"total_captured": 3, "emails_sent": 0},
              }
              report = module._build_preflight_report(data=data, now=now)
              assert report["candidate_count"] == 1
              assert report["candidates"] == [{
                  "book": "sovereign_mind",
                  "step": "soft_sell",
                  "subject": module.EMAILS_SOVEREIGN_MIND["soft_sell"]["subject"],
              }]
              assert report["status_counts"]["ghost_or_invalid"] == 1
              assert report["status_counts"]["no_email_content"] == 1
              assert report["free_audit_candidate_count"] == 0
              rendered = json.dumps(report)
              assert "customer@example.invalid" not in rendered
              assert report["transport_invoked"] is False
              assert report["state_mutated"] is False


          def test_hold_cycle_does_not_call_transport_or_advance_state(tmp_path, monkeypatch):
              module, leads_path, _ = load_module(tmp_path, monkeypatch, mode="hold")
              now = datetime.now(timezone.utc)
              data = {"leads": [due_lead(now)], "stats": {"total_captured": 1, "emails_sent": 0}}
              leads_path.write_text(json.dumps(data), encoding="utf-8")
              called = []
              monkeypatch.setattr(module, "_send_email", lambda *args, **kwargs: called.append(True) or True)
              assert module._run_drip_cycle() == 0
              assert called == []
              after = json.loads(leads_path.read_text(encoding="utf-8"))
              assert after == data


          def test_failed_transport_does_not_advance_state(tmp_path, monkeypatch):
              module, leads_path, _ = load_module(tmp_path, monkeypatch, mode="live")
              now = datetime.now(timezone.utc)
              data = {"leads": [due_lead(now)], "stats": {"total_captured": 1, "emails_sent": 0}}
              leads_path.write_text(json.dumps(data), encoding="utf-8")
              monkeypatch.setattr(module, "_send_email", lambda *args, **kwargs: False)
              assert module._run_drip_cycle() == 0
              after = json.loads(leads_path.read_text(encoding="utf-8"))
              assert after == data


          def test_success_advances_exactly_once(tmp_path, monkeypatch):
              module, leads_path, _ = load_module(tmp_path, monkeypatch, mode="live")
              now = datetime.now(timezone.utc)
              data = {"leads": [due_lead(now)], "stats": {"total_captured": 1, "emails_sent": 0}}
              leads_path.write_text(json.dumps(data), encoding="utf-8")
              monkeypatch.setattr(module, "_send_email", lambda *args, **kwargs: True)
              assert module._run_drip_cycle() == 1
              after = json.loads(leads_path.read_text(encoding="utf-8"))
              assert after["leads"][0]["emails_sent"].count("soft_sell") == 1
              assert after["stats"]["emails_sent"] == 1
              assert module._run_drip_cycle() == 0
              again = json.loads(leads_path.read_text(encoding="utf-8"))
              assert again["leads"][0]["emails_sent"].count("soft_sell") == 1
              assert again["stats"]["emails_sent"] == 1


          def test_suppression_schema_failure_is_fail_closed(tmp_path, monkeypatch):
              module, _, suppression_path = load_module(tmp_path, monkeypatch)
              suppression_path.write_text('{"emails":"not-a-list"}', encoding="utf-8")
              now = datetime.now(timezone.utc)
              report = module._build_preflight_report(
                  data={"leads": [due_lead(now)], "stats": {}}, now=now
              )
              assert report["candidate_count"] == 0
              assert report["status_counts"]["suppression_error"] == 1


          def test_smtp_failure_has_no_provider_or_outbox_fallback(tmp_path, monkeypatch):
              module, _, _ = load_module(tmp_path, monkeypatch, mode="live")
              monkeypatch.setenv("HOME", str(tmp_path))

              class FailingSMTP:
                  def __init__(self, *args, **kwargs):
                      raise OSError("synthetic smtp failure")

              monkeypatch.setattr(smtplib, "SMTP", FailingSMTP)
              assert module._send_email("customer@example.invalid", "Customer", "subject", "<p>body</p>") is False
              assert not (tmp_path / "email_outbox").exists()


          def test_customer_copy_has_no_legacy_unsupported_claim_markers():
              source = SOURCE.read_text(encoding="utf-8")
              forbidden = [
                  "Johns Hopkins confirmed",
                  "13%",
                  "42% more likely",
                  "dopamine and serotonin",
                  "same chemicals targeted by antidepressants",
                  "$23,000 in 11 months",
                  "14% more likely",
                  "78% of Americans",
                  "transformed lives",
                  "sendgrid.SendGridAPIClient",
                  "trying SendGrid",
                  "mailto:{FROM_EMAIL}?subject=Unsubscribe",
              ]
              assert [item for item in forbidden if item in source] == []
          PY

      - name: Add branch CI workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/rc3-email-drip-ci.yml <<'YAML'
          name: RC3 Email Drip CI

          on:
            pull_request:
              branches: [main]
              paths:
                - 'services/email_drip/**'
                - 'tests/test_email_drip_governance.py'
                - '.github/workflows/rc3-email-drip-ci.yml'
            push:
              branches:
                - rc3/email-drip-review-ready-20260809
              paths:
                - 'services/email_drip/**'
                - 'tests/test_email_drip_governance.py'
                - '.github/workflows/rc3-email-drip-ci.yml'

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-24.04
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v5
                - uses: actions/setup-python@v6
                  with:
                    python-version: '3.12'
                - name: Install test dependencies
                  run: python -m pip install --disable-pip-version-check 'fastapi>=0.110,<1' 'pydantic>=2,<3' 'filelock>=3,<4' 'uvicorn>=0.29,<1' 'pytest>=8,<9'
                - name: Compile
                  run: python -m py_compile services/email_drip/email_drip.py tests/test_email_drip_governance.py
                - name: Test
                  run: pytest -q tests/test_email_drip_governance.py
                - name: Reject secrets and runtime data
                  run: |
                    set -euo pipefail
                    ! git ls-files | grep -E '(^|/)\.env($|\.)|leads_drip\.json|email_suppression\.json|email_outbox'
          YAML

      - name: Validate locally on runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'fastapi>=0.110,<1' 'pydantic>=2,<3' 'filelock>=3,<4' 'uvicorn>=0.29,<1' 'pytest>=8,<9'
          python3 -m py_compile services/email_drip/email_drip.py tests/test_email_drip_governance.py
          pytest -q tests/test_email_drip_governance.py
          git diff --check
          ! git diff | grep -E '^\+[^+].*(EMAIL_PASSWORD|SMTP_PASSWORD|SENDGRID_API_KEY)=[^$]'

      - name: Commit reviewed-scope code and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dominion-github-engineer"
          git config user.email "actions@users.noreply.github.com"
          git add services/email_drip/email_drip.py tests/test_email_drip_governance.py .github/workflows/rc3-email-drip-ci.yml
          git diff --cached --check
          git commit -m "fix(rc3): fail-close Email Drip and unify activation preflight"
          git push origin HEAD:rc3/email-drip-review-ready-20260809
