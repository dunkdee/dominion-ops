name: RC3 Email Drip — Authoritative Hardening Pass

on:
  push:
    branches:
      - rc3/email-drip-review-ready-20260809
    paths:
      - .github/workflows/rc3-email-drip-authoritative-hardening.yml

permissions:
  contents: write

concurrency:
  group: rc3-email-drip-authoritative-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact review branch
        uses: actions/checkout@v5
        with:
          ref: rc3/email-drip-review-ready-20260809
          fetch-depth: 0

      - name: Apply deterministic source hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path("services/email_drip/email_drip.py")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              source = source.replace(old, new, 1)

          def function_span(text: str, name: str) -> tuple[int, int]:
              tree = ast.parse(text)
              node = next((n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == name), None)
              if node is None or node.end_lineno is None:
                  raise SystemExit(f"function not found: {name}")
              lines = text.splitlines(keepends=True)
              start = sum(len(line) for line in lines[: node.lineno - 1])
              end = sum(len(line) for line in lines[: node.end_lineno])
              while end < len(text) and text[end] == "\n":
                  end += 1
              return start, end

          def replace_function(name: str, replacement: str) -> None:
              global source
              start, end = function_span(source, name)
              source = source[:start] + replacement.strip("\n") + "\n\n" + source[end:]
              ast.parse(source)

          replace_once("import hmac\n", "import hmac\nimport hashlib\n", "hashlib import")
          replace_once(
              'Deploy: systemd service on foundation-vm  |  SendGrid for delivery',
              'Deploy: systemd service on foundation-vm  |  PrivateEmail SMTP for controlled delivery',
              "module delivery doc",
          )
          replace_once('SENDGRID_API_KEY = os.getenv("SENDGRID_API_KEY", "")\n', '', "remove SendGrid config")
          replace_once(
              'DRIP_SEND_MODE = os.getenv("DRIP_SEND_MODE", "hold").strip().lower()\n',
              'DRIP_SEND_MODE = os.getenv("DRIP_SEND_MODE", "hold").strip().lower()\n'
              'if DRIP_SEND_MODE not in {"hold", "live"}:\n'
              '    raise RuntimeError("DRIP_SEND_MODE must be hold or live")\n',
              "send mode validation",
          )
          replace_once(
              'SECRET_PATH = Path("/home/malachisingleton8/buddy_core/core/webhook_secret.key")',
              'SECRET_PATH = Path(os.getenv("DRIP_WEBHOOK_SECRET_PATH", "/home/malachisingleton8/buddy_core/core/webhook_secret.key"))',
              "secret path testability",
          )

          # Insert non-PII lead reference helper before transport.
          transport_header = "# ---------------------------------------------------------------------------\n# SendGrid delivery (graceful fallback)\n# ---------------------------------------------------------------------------\n"
          replace_once(
              transport_header,
              "# ---------------------------------------------------------------------------\n# Controlled SMTP delivery\n# ---------------------------------------------------------------------------\n\n\n"
              "def _lead_ref(email: str) -> str:\n"
              "    normalized = (email or \"\").strip().lower()\n"
              "    if not normalized:\n"
              "        return \"missing\"\n"
              "    return hashlib.sha256(normalized.encode(\"utf-8\")).hexdigest()[:12]\n\n",
              "transport header",
          )

          replace_function("_send_email", r'''
          def _send_email(to_email: str, to_name: str, subject: str, html_body: str) -> bool:
              """Send via the approved PrivateEmail SMTP rail only when explicitly live."""
              lead_ref = _lead_ref(to_email)
              if DRIP_SEND_MODE != "live":
                  log.info("DRIP HOLD: transport blocked lead_ref=%s mode=%s", lead_ref, DRIP_SEND_MODE)
                  return False

              if not GMAIL_ADDRESS or not GMAIL_PASSWORD:
                  log.error("SMTP blocked: credentials unavailable lead_ref=%s", lead_ref)
                  return False

              try:
                  import smtplib
                  from email.mime.text import MIMEText
                  from email.mime.multipart import MIMEMultipart

                  msg = MIMEMultipart("alternative")
                  msg["Subject"] = subject
                  msg["From"] = f"{FROM_NAME} <{FROM_EMAIL}>"
                  msg["To"] = to_email
                  msg["Reply-To"] = FROM_EMAIL
                  msg.attach(MIMEText(html_body, "html"))
                  with smtplib.SMTP(SMTP_HOST, SMTP_PORT, timeout=20) as srv:
                      srv.starttls()
                      srv.login(GMAIL_ADDRESS, GMAIL_PASSWORD)
                      srv.send_message(msg)
                  log.info("SMTP sent lead_ref=%s subject=%s", lead_ref, subject)
                  return True
              except Exception as exc:  # noqa: BLE001
                  log.error(
                      "SMTP failed lead_ref=%s error_type=%s; provider fallback disabled",
                      lead_ref,
                      type(exc).__name__,
                  )
                  return False
          ''')

          replace_function("_wrap_html", r'''
          def _wrap_html(body: str) -> str:
              return f"""<!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"></head>
          <body style="font-family:Georgia,serif;max-width:600px;margin:0 auto;padding:20px;color:#2d2d2d;line-height:1.7;">
          {body}
          </body></html>"""
          ''')

