name: RC3 Email Drip — Read-Only Canonical Capture

on:
  push:
    branches:
      - rc3/email-drip-canonicalize-20260809
    paths:
      - .github/workflows/rc3-email-drip-capture.yml

permissions:
  contents: write

concurrency:
  group: rc3-email-drip-canonical-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: rc3/email-drip-canonicalize-20260809
          fetch-depth: 0

      - name: Require VM read credentials
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Prepare SSH
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Capture exact production source read-only
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc3-email-drip"
          scp -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST:/home/malachisingleton8/email_drip/email_drip.py" \
            "$RUNNER_TEMP/rc3-email-drip/email_drip.py"

      - name: Verify production identity and safety
        shell: bash
        env:
          EXPECTED_SHA256: e4762cfc694df17df2df2d44df5429d219042d3be3209552ae9d4718f061cd6d
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/rc3-email-drip/email_drip.py"
          ACTUAL_SHA256="$(sha256sum "$SOURCE" | awk '{print $1}')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || {
            echo "Production source SHA does not match the accepted RC3 R4 Email Drip SHA"
            exit 1
          }
          python3 -m py_compile "$SOURCE"
          SOURCE="$SOURCE" python3 - <<'PY'
          import ast
          import os
          import re
          from pathlib import Path

          source_path = Path(os.environ["SOURCE"])
          text = source_path.read_text(encoding="utf-8")
          ast.parse(text)

          sensitive_name = re.compile(r"(?i)(password|passwd|api[_-]?key|secret|token|private[_-]?key)")
          findings = []
          tree = ast.parse(text)
          for node in ast.walk(tree):
              if not isinstance(node, (ast.Assign, ast.AnnAssign)):
                  continue
              targets = node.targets if isinstance(node, ast.Assign) else [node.target]
              value = node.value
              if not isinstance(value, ast.Constant) or not isinstance(value.value, str):
                  continue
              literal = value.value.strip()
              if not literal:
                  continue
              names = []
              for target in targets:
                  if isinstance(target, ast.Name):
                      names.append(target.id)
              for name in names:
                  if sensitive_name.search(name):
                      findings.append((node.lineno, name))
          if findings:
              for line, name in findings:
                  print(f"embedded_secret_literal_risk line={line} variable={name}")
              raise SystemExit(1)

          forbidden_runtime_data = (
              "leads_drip.json\" contents",
              "email_suppression.json\" contents",
          )
          if any(marker in text for marker in forbidden_runtime_data):
              raise SystemExit("runtime_customer_data_marker_detected")

          print("SOURCE_PARSE=PASS")
          print("EMBEDDED_SECRET_LITERAL_RISK=NO")
          print("CUSTOMER_RUNTIME_DATA_INCLUDED=NO")
          PY

      - name: Commit canonical VM source to feature branch
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/rc3-email-drip/email_drip.py"
          mkdir -p services/email_drip
          install -m 0644 "$SOURCE" services/email_drip/email_drip.py
          SHA256="$(sha256sum services/email_drip/email_drip.py | awk '{print $1}')"
          SIZE="$(stat -c '%s' services/email_drip/email_drip.py)"
          cat > services/email_drip/PROVENANCE.md <<EOF
          # Email Drip production-source provenance

          - Source VM path: \`/home/malachisingleton8/email_drip/email_drip.py\`
          - Captured by: \`RC3 Email Drip — Read-Only Canonical Capture\`
          - SHA-256: \`$SHA256\`
          - Size bytes: \`$SIZE\`
          - Accepted release lineage: \`DOMINION_ALPHA_RC3_20260809_R4\`
          - Capture policy: VM read-only; no runtime data, environment files, credentials, logs, or customer records copied.

          This file is a canonicalization snapshot. Repository review and Founder GO are still required before any deployment from GitHub.
          EOF

          git config user.name "dominion-github-canonicalizer"
          git config user.email "actions@users.noreply.github.com"
          git add services/email_drip/email_drip.py services/email_drip/PROVENANCE.md
          if git diff --cached --quiet; then
            echo "Canonical source already matches branch"
            exit 0
          fi
          git commit -m "chore(rc3): canonicalize production Email Drip source"
          git push origin HEAD:rc3/email-drip-canonicalize-20260809

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/foundation_vm_key"
