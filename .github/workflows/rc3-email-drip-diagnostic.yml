name: RC3 Email Drip — Read-Only Eligibility Diagnostic

on:
  push:
    branches:
      - rc3/email-drip-canonicalize-20260809
    paths:
      - .github/workflows/rc3-email-drip-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: rc3-email-drip-readonly-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require VM read credentials
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Prepare SSH
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read current service mode and run production-faithful dry diagnostic
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          echo "SERVICE_STATE_BEGIN"
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            'systemctl is-active dominion-email-drip.service; curl -fsS http://127.0.0.1:8099/health'
          echo
          echo "SERVICE_STATE_END"

          cat > "$RUNNER_TEMP/diag.py" <<'PY'
          import importlib.util
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          os.environ["DRIP_SEND_MODE"] = "hold"
          source = "/home/malachisingleton8/email_drip/email_drip.py"
          spec = importlib.util.spec_from_file_location("dominion_prod_email_drip_diag", source)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          module.log.disabled = True

          reverse_subject = {}
          for book, emails in module.BOOK_EMAILS.items():
              for step, content in emails.items():
                  reverse_subject.setdefault(content.get("subject", ""), []).append((book, step))

          attempts = []
          def recorder(_email, _name, subject, _body):
              matches = reverse_subject.get(subject, [])
              book, step = matches[0] if len(matches) == 1 else ("ambiguous", "ambiguous")
              attempts.append({"book": book, "step": step, "subject": subject})
              return False

          module._send_email = recorder
          module.DRIP_SEND_MODE = "live"
          sent = module._run_drip_cycle()
          if sent != 0:
              raise SystemExit("diagnostic unexpectedly advanced send state")

          data = json.loads(Path("/home/malachisingleton8/email_drip/leads_drip.json").read_text(encoding="utf-8"))
          now = datetime.now(timezone.utc)
          rows = []
          for lead in data.get("leads", []):
              email = str(lead.get("email", "")).strip().lower()
              captured_raw = str(lead.get("captured_at", "")).strip()
              source_value = str(lead.get("source", ""))
              resolved = module._resolve_book(source_value)
              effective_book = "free_audit_hold" if resolved == "free_audit_hold" else lead.get("book", module.DEFAULT_BOOK)
              reason = "scheduler_candidate"
              age_days = None
              if not email or "@" not in email or not captured_raw:
                  reason = "ghost_or_invalid_required_field"
              else:
                  try:
                      captured = datetime.fromisoformat(captured_raw)
                      age_days = (now - captured).days
                  except (TypeError, ValueError):
                      reason = "invalid_captured_at"
              candidate_timestamps = {}
              for key in ("created_at", "timestamp", "ts", "submitted_at", "last_sent_at"):
                  raw = str(lead.get(key, "") or "").strip()
                  if not raw:
                      continue
                  try:
                      parsed = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                      if parsed.tzinfo is None:
                          parsed = parsed.replace(tzinfo=timezone.utc)
                      candidate_timestamps[key] = {"present": True, "age_days": (now - parsed).days}
                  except (TypeError, ValueError):
                      candidate_timestamps[key] = {"present": True, "parseable": False}
              rows.append({
                  "reason": reason,
                  "email_present": bool(email),
                  "email_format_has_at": "@" in email,
                  "captured_at_present": bool(captured_raw),
                  "captured_at_age_days": age_days,
                  "source": source_value,
                  "stored_book": lead.get("book", ""),
                  "resolved_book": resolved,
                  "effective_book": effective_book,
                  "emails_sent": list(lead.get("emails_sent", [])),
                  "candidate_timestamps": candidate_timestamps,
              })

          report = {
              "mode_for_diagnostic": "live_with_transport_stub_returning_false",
              "transport_invocations": len(attempts),
              "transport_candidates": attempts,
              "state_advancement": 0,
              "total_leads": len(rows),
              "ghost_or_invalid_rows": sum(r["reason"] != "scheduler_candidate" for r in rows),
              "free_audit_transport_candidates": sum(a["book"] == "free_audit_hold" for a in attempts),
              "lead_rows_redacted": rows,
              "pii_fields_printed": False,
              "production_writes": False,
              "smtp_invoked": False,
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

          base64 -w0 "$RUNNER_TEMP/diag.py" > "$RUNNER_TEMP/diag.b64"
          PAYLOAD="$(cat "$RUNNER_TEMP/diag.b64")"
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "printf '%s' '$PAYLOAD' | base64 -d | /home/malachisingleton8/dominion_env/bin/python -"

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/foundation_vm_key" "$RUNNER_TEMP/diag.py" "$RUNNER_TEMP/diag.b64"
