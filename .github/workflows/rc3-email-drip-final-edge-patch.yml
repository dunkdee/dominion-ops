name: RC3 Email Drip — Final Edge-Case Patch

on:
  push:
    branches:
      - rc3/email-drip-review-ready-20260809
    paths:
      - .github/workflows/rc3-email-drip-final-edge-patch.yml

permissions:
  contents: write

concurrency:
  group: rc3-email-drip-final-edge-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v5
        with:
          ref: rc3/email-drip-review-ready-20260809
          fetch-depth: 0

      - name: Apply edge-case hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("services/email_drip/email_drip.py")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              "from pydantic import BaseModel, EmailStr",
              "from pydantic import BaseModel",
              "remove unused EmailStr",
          )
          replace_once(
              "# SendGrid delivery (graceful fallback)",
              "# Controlled PrivateEmail SMTP delivery (no provider fallback)",
              "transport section label",
          )

          anchor = "def _lead_ref(email: str) -> str:\n"
          validator = '''def _normalize_email(value: str) -> str:\n    """Normalize a conservative Internet email shape without adding a runtime dependency."""\n    email = str(value or "").strip().lower()\n    if not email or len(email) > 254 or email.count("@") != 1 or any(ch.isspace() for ch in email):\n        return ""\n    local, domain = email.rsplit("@", 1)\n    if not local or len(local) > 64 or not domain or "." not in domain:\n        return ""\n    if local.startswith(".") or local.endswith(".") or ".." in local:\n        return ""\n    labels = domain.split(".")\n    if len(labels[-1]) < 2:\n        return ""\n    for label in labels:\n        if (\n            not label\n            or len(label) > 63\n            or label.startswith("-")\n            or label.endswith("-")\n            or not all(ch.isalnum() or ch == "-" for ch in label)\n        ):\n            return ""\n    return email\n\n\n'''
          replace_once(anchor, validator + anchor, "shared email validator")

          replace_once(
              '    email = (payload.email or "").strip().lower()\n    if not email or "@" not in email:',
              '    email = _normalize_email(payload.email)\n    if not email:',
              "capture email validation",
          )
          replace_once(
              '                if str(lead.get("email", "")).lower() == email:',
              '                if _normalize_email(str(lead.get("email", ""))) == email:',
              "duplicate email normalization",
          )
          replace_once(
              '    email = str(lead.get("email", "")).strip().lower()\n    captured_raw = str(lead.get("captured_at", "")).strip()\n    if not email or "@" not in email or not captured_raw:\n        return {"status": "ghost_or_invalid", "lead_ref": _lead_ref(email)}',
              '    raw_email = str(lead.get("email", ""))\n    email = _normalize_email(raw_email)\n    captured_raw = str(lead.get("captured_at", "")).strip()\n    if not email or not captured_raw:\n        return {"status": "ghost_or_invalid", "lead_ref": _lead_ref(raw_email)}',
              "scheduler email parity",
          )
          replace_once(
              '    days_since = (now - captured).days\n    already_sent = set(lead.get("emails_sent", []))',
              '    days_since = (now - captured).days\n    sent_raw = lead.get("emails_sent", [])\n    if not isinstance(sent_raw, list):\n        return {"status": "invalid_emails_sent", "lead_ref": _lead_ref(email)}\n    already_sent = {str(value) for value in sent_raw}',
              "emails_sent schema fail-closed",
          )
          replace_once(
              '        if len(lead.get("emails_sent", [])) >= 5:\n            fully_dripped += 1',
              '        sent_steps = lead.get("emails_sent", [])\n        if isinstance(sent_steps, list) and len(sent_steps) >= 5:\n            fully_dripped += 1',
              "status schema tolerance",
          )

          path.write_text(source, encoding="utf-8", newline="\n")
          PY
          python -m py_compile services/email_drip/email_drip.py

      - name: Add edge-case tests
        shell: bash
        run: |
          set -euo pipefail
          cat >> tests/test_email_drip_governance.py <<'PY'


          @pytest.mark.parametrize(
              "bad_email",
              ["not-an-email", "bad@", "bad @example.com", "bad@example", "a..b@example.com", "a@-example.com"],
          )
          def test_capture_rejects_malformed_email(tmp_path, monkeypatch, bad_email):
              module, _, _ = load_module(tmp_path, monkeypatch)
              with pytest.raises(module.HTTPException) as exc:
                  module.capture_email(module.EmailCapture(email=bad_email, source="sovereign_mind"))
              assert exc.value.status_code == 400
              assert exc.value.detail == "invalid_email"


          def test_malformed_emails_sent_fails_closed_per_lead_without_blocking_valid_candidate(tmp_path, monkeypatch):
              module, _, _ = load_module(tmp_path, monkeypatch)
              now = datetime.now(timezone.utc)
              malformed = due_lead(now)
              malformed["emails_sent"] = None
              valid = due_lead(now)
              valid["email"] = "second@example.invalid"
              report = module._build_preflight_report(data={"leads": [malformed, valid], "stats": {}}, now=now)
              assert report["status_counts"]["invalid_emails_sent"] == 1
              assert report["candidate_count"] == 1
              assert report["candidates"][0]["step"] == "soft_sell"


          def test_scheduler_and_capture_share_email_validation(tmp_path, monkeypatch):
              module, _, _ = load_module(tmp_path, monkeypatch)
              now = datetime.now(timezone.utc)
              invalid = due_lead(now)
              invalid["email"] = "bad@"
              report = module._build_preflight_report(data={"leads": [invalid], "stats": {}}, now=now)
              assert report["candidate_count"] == 0
              assert report["status_counts"]["ghost_or_invalid"] == 1
          PY

      - name: Validate complete governance suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'fastapi>=0.110,<1' 'pydantic>=2,<3' 'filelock>=3,<4' 'uvicorn>=0.29,<1' 'pytest>=8,<9'
          python -m py_compile services/email_drip/email_drip.py tests/test_email_drip_governance.py
          pytest -q tests/test_email_drip_governance.py
          git diff --check

      - name: Commit source and tests only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dominion-github-engineer"
          git config user.email "actions@users.noreply.github.com"
          git add services/email_drip/email_drip.py tests/test_email_drip_governance.py
          git diff --cached --check
          git commit -m "fix(rc3): harden lead schema and shared email validation"
          git push origin HEAD:rc3/email-drip-review-ready-20260809
