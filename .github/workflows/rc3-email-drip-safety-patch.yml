name: RC3 Email Drip — Narrow Safety Patch

on:
  push:
    branches:
      - rc3/email-drip-review-ready-20260809
    paths:
      - .github/workflows/rc3-email-drip-safety-patch.yml

permissions:
  contents: write

concurrency:
  group: rc3-email-drip-narrow-safety-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact review branch
        uses: actions/checkout@v5
        with:
          ref: rc3/email-drip-review-ready-20260809
          fetch-depth: 0

      - name: Apply narrow fail-closed patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("services/email_drip/email_drip.py")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              '            if not SUPPRESSION_FILE.exists():\n                return "clear"',
              '            if not SUPPRESSION_FILE.exists():\n                return "error"',
              "missing suppression fail-closed",
          )
          replace_once(
              '    unsubscribe_url = (payload.unsubscribe_url or "").strip() or _unsubscribe_url(email)',
              '    unsubscribe_url = _unsubscribe_url(email)',
              "canonical unsubscribe capture",
          )
          replace_once(
              '    log.info("Captured lead_ref=%s for book=%s source=%s", _lead_ref(email), book, source_value)',
              '    log.info("Captured lead_ref=%s for book=%s", _lead_ref(email), book)',
              "capture log user input redaction",
          )
          replace_once(
              '    book = "free_audit_hold" if resolved_from_source == "free_audit_hold" else lead.get("book", DEFAULT_BOOK)\n    emails = BOOK_EMAILS.get(book, BOOK_EMAILS[DEFAULT_BOOK])\n    if not emails:',
              '    stored_book = str(lead.get("book", "")).strip()\n    book = "free_audit_hold" if resolved_from_source == "free_audit_hold" else (stored_book or resolved_from_source)\n    if book not in BOOK_EMAILS:\n        return {"status": "invalid_book", "book": book, "lead_ref": _lead_ref(email)}\n    emails = BOOK_EMAILS[book]\n    if not emails:',
              "invalid book fail-closed",
          )
          replace_once(
              '        unsubscribe_url = (lead.get("unsubscribe_url") or "").strip() or _unsubscribe_url(email)\n        if not unsubscribe_url:\n            return {"status": "unsubscribe_unavailable", "book": book, "step": step["key"], "lead_ref": _lead_ref(email)}',
              '        unsubscribe_url = _unsubscribe_url(email)',
              "canonical unsubscribe send",
          )
          replace_once(
              '                body = plan["body"].replace("{{name}}", plan["name"])',
              '                safe_name = html_lib.escape(str(plan["name"]), quote=True)\n                body = plan["body"].replace("{{name}}", safe_name)',
              "escape customer name",
          )
          replace_once(
              '            log.error("Drip cycle error: %s", exc)',
              '            log.error("Drip cycle error_type=%s", type(exc).__name__)',
              "background error redaction",
          )
          replace_once(
              '        host="0.0.0.0",',
              '        host=os.getenv("DRIP_HOST", "127.0.0.1"),',
              "loopback default binding",
          )

          path.write_text(source, encoding="utf-8", newline="\n")
          PY
          python -m py_compile services/email_drip/email_drip.py

      - name: Extend governance tests
        shell: bash
        run: |
          set -euo pipefail
          cat >> tests/test_email_drip_governance.py <<'PY'


          def test_missing_suppression_store_is_fail_closed(tmp_path, monkeypatch):
              module, _, suppression = load_module(tmp_path, monkeypatch)
              suppression.unlink()
              report = module._build_preflight_report(
                  data={"leads": [due_lead(datetime.now(timezone.utc))], "stats": {}}
              )
              assert report["candidate_count"] == 0
              assert report["status_counts"]["suppression_error"] == 1


          def test_unknown_stored_book_is_fail_closed(tmp_path, monkeypatch):
              module, _, _ = load_module(tmp_path, monkeypatch)
              now = datetime.now(timezone.utc)
              lead = due_lead(now, source="website", book="unapproved_sequence")
              report = module._build_preflight_report(data={"leads": [lead], "stats": {}}, now=now)
              assert report["candidate_count"] == 0
              assert report["status_counts"]["invalid_book"] == 1


          def test_capture_ignores_supplied_unsubscribe_url_and_logs_no_raw_source(tmp_path, monkeypatch):
              module, leads_path, _ = load_module(tmp_path, monkeypatch)
              payload = module.EmailCapture(
                  email="customer@example.invalid",
                  name="Customer",
                  source="sovereign_mind private-note-should-not-be-logged",
                  unsubscribe_url="https://attacker.invalid/unsubscribe",
              )
              result = module.capture_email(payload)
              assert result["status"] == "ok"
              lead = json.loads(leads_path.read_text(encoding="utf-8"))["leads"][0]
              assert lead["unsubscribe_url"].startswith(module.UNSUBSCRIBE_BASE_URL + "?")
              assert "attacker.invalid" not in lead["unsubscribe_url"]


          def test_scheduler_escapes_customer_name_before_transport(tmp_path, monkeypatch):
              module, leads_path, _ = load_module(tmp_path, monkeypatch, mode="live")
              now = datetime.now(timezone.utc)
              lead = due_lead(now)
              lead["name"] = '<img src=x onerror="alert(1)">'
              data = {"leads": [lead], "stats": {"total_captured": 1, "emails_sent": 0}}
              leads_path.write_text(json.dumps(data), encoding="utf-8")
              captured = {}

              def transport(_email, _name, _subject, body):
                  captured["body"] = body
                  return False

              monkeypatch.setattr(module, "_send_email", transport)
              assert module._run_drip_cycle() == 0
              assert "<img src=x" not in captured["body"]
              assert "&lt;img src=x" in captured["body"]
              assert "attacker.invalid" not in captured["body"]


          def test_service_defaults_to_loopback_binding():
              text = SOURCE.read_text(encoding="utf-8")
              assert 'host=os.getenv("DRIP_HOST", "127.0.0.1")' in text
              assert 'host="0.0.0.0"' not in text
          PY

      - name: Validate all Email Drip tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'fastapi>=0.110,<1' 'pydantic>=2,<3' 'filelock>=3,<4' 'uvicorn>=0.29,<1' 'pytest>=8,<9'
          python -m py_compile services/email_drip/email_drip.py tests/test_email_drip_governance.py
          pytest -q tests/test_email_drip_governance.py
          git diff --check

      - name: Commit source and tests only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dominion-github-engineer"
          git config user.email "actions@users.noreply.github.com"
          git add services/email_drip/email_drip.py tests/test_email_drip_governance.py
          git diff --cached --check
          git commit -m "fix(rc3): fail closed on suppression and canonicalize email ingress"
          git push origin HEAD:rc3/email-drip-review-ready-20260809
