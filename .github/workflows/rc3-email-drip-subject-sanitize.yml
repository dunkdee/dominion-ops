name: RC3 Email Drip Subject Sanitization

on:
  push:
    branches:
      - rc3/email-drip-review-ready-20260809
    paths:
      - .github/workflows/rc3-email-drip-subject-sanitize.yml
      - scripts/runtime/rc3_subject_sanitize_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rc3/email-drip-review-ready-20260809
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/runtime/rc3_subject_sanitize_patch.py
      - name: Validate
        run: |
          python -m pip install --disable-pip-version-check 'fastapi>=0.110,<1' 'pydantic>=2,<3' 'filelock>=3,<4' 'uvicorn>=0.29,<1' 'pytest>=8,<9'
          python -m py_compile services/email_drip/email_drip.py tests/test_email_drip_governance.py
          pytest -q tests/test_email_drip_governance.py
          git diff --check
      - name: Commit source and tests only
        run: |
          git config user.name dominion-github-engineer
          git config user.email actions@users.noreply.github.com
          git add services/email_drip/email_drip.py tests/test_email_drip_governance.py
          git diff --cached --check
          git commit -m 'fix(rc3): sanitize customer name in SMTP subject'
          git push origin HEAD:rc3/email-drip-review-ready-20260809
