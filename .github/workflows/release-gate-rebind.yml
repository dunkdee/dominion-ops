name: Release Gate Rebind

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: release-gate-rebind-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rebind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Generate exact-head checkpoint
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ARGS=(--pr "$PR_NUMBER" --head "$HEAD_SHA" --json-output /tmp/release-gate.json --markdown-output /tmp/release-gate.md)
          if [[ -n "${PREVIOUS_SHA:-}" && "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ]]; then
            ARGS+=(--previous "$PREVIOUS_SHA")
          fi
          python3 scripts/release_gate_rebind.py "${ARGS[@]}"

      - name: Install test dependency
        run: python3 -m pip install --disable-pip-version-check 'pytest>=8,<9'

      - name: Unit-test rebind contract
        run: python3 -m pytest tests/test_release_gate_rebind.py -q

      - name: Upsert canonical release-gate state comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- dominion-release-gate-state -->';
            const body = fs.readFileSync('/tmp/release-gate.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Emit fail-closed checkpoint receipt
        run: |
          cat /tmp/release-gate.json
          echo "RELEASE_GATE_REBIND=PASS"
