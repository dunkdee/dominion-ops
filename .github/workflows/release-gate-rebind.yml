name: Release Gate Rebind

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to rebind"
        required: true
        default: "279"
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: release-gate-rebind-${{ github.event.pull_request.number || inputs.pr_number || '279' }}
  cancel-in-progress: true

jobs:
  rebind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve release target
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            PR_NUMBER='${{ github.event.pull_request.number }}'
            HEAD_SHA='${{ github.event.pull_request.head.sha }}'
            PREVIOUS_SHA='${{ github.event.before }}'
          else
            PR_NUMBER='${{ inputs.pr_number }}'
            HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
            PREVIOUS_SHA=''
          fi
          test -n "$PR_NUMBER"
          test -n "$HEAD_SHA"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "PREVIOUS_SHA=$PREVIOUS_SHA" >> "$GITHUB_ENV"

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Generate exact-head checkpoint
        run: |
          set -euo pipefail
          ARGS=(--pr "$PR_NUMBER" --head "$HEAD_SHA" --json-output /tmp/release-gate.json --markdown-output /tmp/release-gate.md)
          if [[ -n "${PREVIOUS_SHA:-}" && "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ]]; then
            ARGS+=(--previous "$PREVIOUS_SHA")
          fi
          python3 scripts/release_gate_rebind.py "${ARGS[@]}"

      - name: Install test dependency
        run: python3 -m pip install --disable-pip-version-check 'pytest>=8,<9'

      - name: Unit-test rebind contract
        run: python3 -m pytest tests/test_release_gate_rebind.py -q

      - name: Upsert canonical release-gate state comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- dominion-release-gate-state -->';
            const body = fs.readFileSync('/tmp/release-gate.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              core.setFailed('Invalid PR_NUMBER');
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Emit fail-closed checkpoint receipt
        run: |
          cat /tmp/release-gate.json
          echo "RELEASE_GATE_REBIND=PASS"
