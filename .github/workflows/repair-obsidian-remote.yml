name: Repair Obsidian Remote
# Governed browser-native production cutover — canary proven 2026-08-10

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REPAIR OBSIDIAN REMOTE"
        required: true
        type: string
      commit_sha:
        description: "Exact 40-character main commit SHA"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  cutover:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'REPAIR OBSIDIAN REMOTE' &&
      inputs.commit_sha == github.sha &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: foundation-vm-production
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require protected secrets
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          test -n "$OBSIDIAN_PASSWORD"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -q 'image: lscr.io/linuxserver/obsidian:latest' docker-compose.yml
          grep -q '127.0.0.1:8083:3000' docker-compose.yml

      - name: Stage exact release bundle and protected access material
        id: stage
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          bundle="$RUNNER_TEMP/obsidian-cutover-${GITHUB_RUN_ID}.bundle"
          remote_bundle="/tmp/obsidian-cutover-${GITHUB_RUN_ID}.bundle"
          git update-ref refs/heads/dominion-release "$GITHUB_SHA"
          git bundle create "$bundle" refs/heads/dominion-release
          git bundle verify "$bundle"
          scp -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$bundle" "$VM_USER@$VM_HOST:$remote_bundle"

          quarantine="$RUNNER_TEMP/quarantine-obsidian-${GITHUB_RUN_ID}.sh"
          remote_quarantine="/tmp/quarantine-obsidian-${GITHUB_RUN_ID}.sh"
          cp scripts/quarantine_vm_repo_state.sh "$quarantine"
          chmod 700 "$quarantine"
          scp -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$quarantine" "$VM_USER@$VM_HOST:$remote_quarantine"

          password_file="$RUNNER_TEMP/obsidian-password-${GITHUB_RUN_ID}"
          remote_password="/tmp/obsidian-password-${GITHUB_RUN_ID}"
          umask 077
          printf '%s' "$OBSIDIAN_PASSWORD" > "$password_file"
          scp -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$password_file" "$VM_USER@$VM_HOST:$remote_password"

          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$VM_USER@$VM_HOST" "chmod 600 '$remote_bundle' '$remote_password'; chmod 700 '$remote_quarantine'"
          echo "remote_bundle=$remote_bundle" >> "$GITHUB_OUTPUT"
          echo "remote_quarantine=$remote_quarantine" >> "$GITHUB_OUTPUT"
          echo "remote_password=$remote_password" >> "$GITHUB_OUTPUT"

      - name: Promote browser-native Obsidian with automatic runtime rollback
        id: promote
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          TARGET_SHA: ${{ github.sha }}
          REMOTE_BUNDLE: ${{ steps.stage.outputs.remote_bundle }}
          REMOTE_QUARANTINE: ${{ steps.stage.outputs.remote_quarantine }}
          REMOTE_PASSWORD: ${{ steps.stage.outputs.remote_password }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 "$VM_USER@$VM_HOST" \
            "TARGET_SHA='$TARGET_SHA' BUNDLE='$REMOTE_BUNDLE' QUARANTINE='$REMOTE_QUARANTINE' PASSWORD_FILE='$REMOTE_PASSWORD' RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          trap 'rm -f "$BUNDLE" "$QUARANTINE" "$PASSWORD_FILE"' EXIT

          repo="$HOME/dominion-ops"
          test -d "$repo/.git"
          cd "$repo"
          password="$(cat "$PASSWORD_FILE")"
          test -n "$password"

          old_image_id="$(docker inspect --format '{{.Image}}' obsidian-remote)"
          old_vault_source="$(docker inspect obsidian-remote --format '{{range .Mounts}}{{if eq .Destination "/vaults/Dominion"}}{{.Source}}{{end}}{{end}}')"
          old_config_name="$(docker inspect obsidian-remote --format '{{range .Mounts}}{{if eq .Destination "/config"}}{{.Name}}{{end}}{{end}}')"
          old_config_source="$(docker inspect obsidian-remote --format '{{range .Mounts}}{{if eq .Destination "/config"}}{{.Source}}{{end}}{{end}}')"
          test -n "$old_image_id"
          test -n "$old_vault_source"
          test -n "$old_config_source"
          rollback_tag="dominion/obsidian-remote-rollback:${RUN_ID}"
          docker tag "$old_image_id" "$rollback_tag"
          echo "OBSIDIAN_ROLLBACK_SNAPSHOT=PASS image=$old_image_id vault=preserved config=preserved"

          switched=0
          rollback() {
            [ "$switched" -eq 1 ] || return 0
            echo 'OBSIDIAN_RUNTIME_ROLLBACK=START'
            docker rm -f obsidian-remote >/dev/null 2>&1 || true
            config_mount="$old_config_source:/config"
            if [ -n "$old_config_name" ]; then
              config_mount="$old_config_name:/config"
            fi
            docker run -d \
              --name obsidian-remote \
              --restart unless-stopped \
              -e PUID=1000 \
              -e PGID=1000 \
              -e TZ=America/New_York \
              -e CUSTOM_USER=dominion \
              -e PASSWORD="$password" \
              -e TITLE='Dominion Brain' \
              -e FM_HOME=/vaults \
              -v "$old_vault_source:/vaults/Dominion" \
              -v "$config_mount" \
              -p 127.0.0.1:8083:8080 \
              "$rollback_tag" >/dev/null
            restored=0
            for _ in $(seq 1 90); do
              state="$(docker inspect --format '{{.State.Status}}' obsidian-remote 2>/dev/null || true)"
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:8083/ || true)"
              if [ "$state" = running ] && [[ "$code" =~ ^(200|302)$ ]]; then
                restored=1
                break
              fi
              sleep 2
            done
            if [ "$restored" -eq 1 ]; then
              echo 'OBSIDIAN_RUNTIME_ROLLBACK=PASS'
            else
              echo 'OBSIDIAN_RUNTIME_ROLLBACK=FAIL'
            fi
          }
          fail() {
            reason="$1"
            echo "OBSIDIAN_CUTOVER=FAIL reason=$reason"
            docker inspect --format 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} image={{.Image}} error={{.State.Error}}' obsidian-remote 2>/dev/null || true
            docker logs --tail 120 obsidian-remote 2>&1 | sed -E 's/(password|passwd|token|secret)=([^ ]+)/\1=REDACTED/Ig' || true
            rollback
            exit 1
          }

          RUN_ID="obsidian-cutover-${RUN_ID}" DOMINION_REPO="$repo" bash "$QUARANTINE"
          git fetch "$BUNDLE" dominion-release:refs/remotes/dominion-release/obsidian >/dev/null 2>&1 || { echo 'OBSIDIAN_CUTOVER=FAIL reason=bundle_fetch'; exit 1; }
          git cat-file -e "${TARGET_SHA}^{commit}" || { echo 'OBSIDIAN_CUTOVER=FAIL reason=target_missing'; exit 1; }
          git checkout main >/dev/null 2>&1 || { echo 'OBSIDIAN_CUTOVER=FAIL reason=checkout_main'; exit 1; }
          git merge-base --is-ancestor HEAD "$TARGET_SHA" || { echo 'OBSIDIAN_CUTOVER=FAIL reason=non_fast_forward'; exit 1; }
          git merge --ff-only "$TARGET_SHA" >/dev/null 2>&1 || { echo 'OBSIDIAN_CUTOVER=FAIL reason=fast_forward'; exit 1; }
          test "$(git rev-parse HEAD)" = "$TARGET_SHA" || { echo 'OBSIDIAN_CUTOVER=FAIL reason=sha_mismatch'; exit 1; }
          test -z "$(git status --porcelain=v1 --untracked-files=no)" || { echo 'OBSIDIAN_CUTOVER=FAIL reason=tracked_dirty'; exit 1; }
          grep -q 'image: lscr.io/linuxserver/obsidian:latest' docker-compose.yml || { echo 'OBSIDIAN_CUTOVER=FAIL reason=canonical_image_missing'; exit 1; }
          grep -q '127.0.0.1:8083:3000' docker-compose.yml || { echo 'OBSIDIAN_CUTOVER=FAIL reason=canonical_port_missing'; exit 1; }

          umask 077
          touch .env
          tmp="$(mktemp "$repo/.env.obsidian.XXXXXX")"
          grep -v '^OBSIDIAN_PASSWORD=' .env > "$tmp" || true
          printf 'OBSIDIAN_PASSWORD=%s\n' "$password" >> "$tmp"
          chmod 600 "$tmp"
          mv "$tmp" .env
          docker compose config --quiet
          docker compose pull obsidian-remote
          new_image_id="$(docker image inspect lscr.io/linuxserver/obsidian:latest --format '{{.Id}}')"
          test -n "$new_image_id"
          docker compose up -d --no-deps --force-recreate obsidian-remote
          switched=1

          ready=0
          for _ in $(seq 1 120); do
            state="$(docker inspect --format '{{.State.Status}}' obsidian-remote 2>/dev/null || true)"
            code="$(curl -sS -u "dominion:$password" -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8083/ || true)"
            if [ "$state" = running ] && [[ "$code" =~ ^(200|302)$ ]]; then
              ready=1
              break
            fi
            sleep 3
          done
          [ "$ready" -eq 1 ] || fail local_authenticated_health

          active_image="$(docker inspect --format '{{.Image}}' obsidian-remote)"
          [ "$active_image" = "$new_image_id" ] || fail image_mismatch
          exposed="$(docker inspect --format '{{json .Config.ExposedPorts}}' obsidian-remote)"
          printf '%s' "$exposed" | grep -q '3000/tcp' || fail expected_web_port_missing
          if printf '%s' "$exposed" | grep -q '3389/tcp'; then fail legacy_xrdp_port_present; fi
          legacy="$(docker exec obsidian-remote sh -lc "ps -ef 2>/dev/null | grep -E '[x]rdp|[g]uacd' || true" 2>/dev/null || true)"
          [ -z "$legacy" ] || fail legacy_rdp_process_present

          local_unauth="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8083/ || true)"
          [ "$local_unauth" = 401 ] || fail local_auth_not_enforced

          live_vault_source="$(docker inspect obsidian-remote --format '{{range .Mounts}}{{if eq .Destination "/vaults/Dominion"}}{{.Source}}{{end}}{{end}}')"
          [ "$live_vault_source" = "$old_vault_source" ] || fail vault_mount_changed
          vault_rw="$(docker inspect obsidian-remote --format '{{range .Mounts}}{{if eq .Destination "/vaults/Dominion"}}{{.RW}}{{end}}{{end}}')"
          [ "$vault_rw" = true ] || fail vault_not_writable
          note_count="$(docker exec obsidian-remote sh -lc "find /vaults/Dominion -type f -name '*.md' 2>/dev/null | wc -l" | tr -d '[:space:]')"
          test "${note_count:-0}" -gt 0 || fail vault_notes_not_visible

          sudo caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          getent ahostsv4 vault.dominionhealing.org >/dev/null
          public=0
          for _ in $(seq 1 40); do
            code="$(curl -sS -u "dominion:$password" -o /dev/null -w '%{http_code}' --max-time 15 https://vault.dominionhealing.org || true)"
            if [[ "$code" =~ ^(200|302)$ ]]; then
              public=1
              break
            fi
            sleep 3
          done
          [ "$public" -eq 1 ] || fail public_authenticated_route
          public_unauth="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://vault.dominionhealing.org || true)"
          [ "$public_unauth" = 401 ] || fail public_auth_not_enforced

          echo "OBSIDIAN_CUTOVER=PASS sha=$TARGET_SHA image=$new_image_id legacy_rdp=absent local_auth=pass public_auth=pass vault_notes=$note_count"
          REMOTE

      - name: Record successful cutover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 84 --repo "$GITHUB_REPOSITORY" --body "Browser-native Obsidian production cutover passed on \`${GITHUB_SHA}\`. Legacy XRDP/guacd is absent, loopback and public authentication passed, and the Dominion vault mount remained intact. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true

      - name: Cleanup temporary release material
        if: always()
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          REMOTE_BUNDLE: ${{ steps.stage.outputs.remote_bundle }}
          REMOTE_QUARANTINE: ${{ steps.stage.outputs.remote_quarantine }}
          REMOTE_PASSWORD: ${{ steps.stage.outputs.remote_password }}
        run: |
          set +e
          if [ -f "$HOME/.ssh/foundation_vm_key" ]; then
            ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" "rm -f '$REMOTE_BUNDLE' '$REMOTE_QUARANTINE' '$REMOTE_PASSWORD'" >/dev/null 2>&1
          fi
          rm -f "$HOME/.ssh/foundation_vm_key" "$RUNNER_TEMP"/obsidian-cutover-*.bundle "$RUNNER_TEMP"/quarantine-obsidian-*.sh "$RUNNER_TEMP"/obsidian-password-*
