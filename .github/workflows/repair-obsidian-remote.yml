name: Repair Obsidian Remote
# Isolated browser-native replacement canary — 2026-08-10 22:56 EDT

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-obsidian-remote.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: foundation-vm-production
    steps:
      - name: Require protected secrets
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          test -n "$OBSIDIAN_PASSWORD"

      - name: Prepare SSH and protected password material
        id: stage
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          local_file="$RUNNER_TEMP/obsidian-password-${GITHUB_RUN_ID}"
          remote_file="/tmp/obsidian-password-${GITHUB_RUN_ID}"
          umask 077
          printf '%s' "$OBSIDIAN_PASSWORD" > "$local_file"
          scp -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$local_file" "$VM_USER@$VM_HOST:$remote_file"
          echo "remote_file=$remote_file" >> "$GITHUB_OUTPUT"

      - name: Run isolated LinuxServer Obsidian canary
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          PASSWORD_FILE: ${{ steps.stage.outputs.remote_file }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$VM_USER@$VM_HOST" \
            "PASSWORD_FILE='$PASSWORD_FILE' RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          canary="dominion-obsidian-canary-${RUN_ID}"
          cfg_volume="dominion_obsidian_canary_${RUN_ID}"
          cleanup() {
            docker rm -f "$canary" >/dev/null 2>&1 || true
            docker volume rm "$cfg_volume" >/dev/null 2>&1 || true
            rm -f "$PASSWORD_FILE"
          }
          trap cleanup EXIT

          password="$(cat "$PASSWORD_FILE")"
          test -n "$password"
          vault_source="$(docker inspect obsidian-remote --format '{{range .Mounts}}{{if eq .Destination "/vaults/Dominion"}}{{.Source}}{{end}}{{end}}')"
          test -n "$vault_source"
          test -d "$vault_source"
          echo "CANARY_VAULT_SOURCE=PASS"

          docker pull lscr.io/linuxserver/obsidian:latest
          image_id="$(docker image inspect lscr.io/linuxserver/obsidian:latest --format '{{.Id}}')"
          test -n "$image_id"
          exposed="$(docker image inspect lscr.io/linuxserver/obsidian:latest --format '{{json .Config.ExposedPorts}}')"
          echo "CANARY_IMAGE_PULL=PASS image=$image_id exposed=$exposed"
          printf '%s' "$exposed" | grep -q '3000/tcp' || { echo 'CANARY=FAIL reason=expected_http_port_missing'; exit 1; }
          if printf '%s' "$exposed" | grep -q '3389/tcp'; then
            echo 'CANARY=FAIL reason=legacy_xrdp_port_in_image'
            exit 1
          fi

          docker volume create "$cfg_volume" >/dev/null
          docker run -d \
            --name "$canary" \
            --shm-size=1g \
            --restart=no \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=America/New_York \
            -e CUSTOM_USER=dominion \
            -e PASSWORD="$password" \
            -e TITLE='Dominion Brain Canary' \
            -e FILE_MANAGER_PATH=/vaults/Dominion \
            -v "$vault_source:/vaults/Dominion:ro" \
            -v "$cfg_volume:/config" \
            -p 127.0.0.1:18083:3000 \
            lscr.io/linuxserver/obsidian:latest >/dev/null

          ready=0
          for _ in $(seq 1 120); do
            state="$(docker inspect --format '{{.State.Status}}' "$canary" 2>/dev/null || true)"
            code="$(curl -sS -u "dominion:$password" -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:18083/ || true)"
            if [ "$state" = running ] && [[ "$code" =~ ^(200|302)$ ]]; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            echo 'CANARY=FAIL reason=authenticated_http_health'
            docker inspect --format 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} exit={{.State.ExitCode}} error={{.State.Error}}' "$canary" 2>/dev/null || true
            docker logs --tail 120 "$canary" 2>&1 | sed -E 's/(password|passwd|token|secret)=([^ ]+)/\1=REDACTED/Ig' || true
            exit 1
          fi

          unauth="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:18083/ || true)"
          test "$unauth" = 401 || { echo "CANARY=FAIL reason=auth_not_enforced status=$unauth"; exit 1; }

          legacy="$(docker exec "$canary" sh -lc "ps -ef 2>/dev/null | grep -E '[x]rdp|[g]uacd' || true" 2>/dev/null || true)"
          test -z "$legacy" || { echo 'CANARY=FAIL reason=legacy_rdp_process_present'; exit 1; }

          mount_rw="$(docker inspect "$canary" --format '{{range .Mounts}}{{if eq .Destination "/vaults/Dominion"}}{{.RW}}{{end}}{{end}}')"
          test "$mount_rw" = false || { echo 'CANARY=FAIL reason=vault_not_read_only'; exit 1; }
          note_count="$(docker exec "$canary" sh -lc "find /vaults/Dominion -type f -name '*.md' 2>/dev/null | wc -l" | tr -d '[:space:]')"
          test "${note_count:-0}" -gt 0 || { echo 'CANARY=FAIL reason=vault_notes_not_visible'; exit 1; }

          echo "OBSIDIAN_BROWSER_CANARY=PASS image=$image_id auth=pass legacy_rdp=absent vault_readonly=true notes=$note_count"
          REMOTE

      - name: Cleanup access material
        if: always()
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          REMOTE_FILE: ${{ steps.stage.outputs.remote_file }}
        run: |
          set +e
          if [ -f "$HOME/.ssh/foundation_vm_key" ]; then
            ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" "rm -f '$REMOTE_FILE'" >/dev/null 2>&1
          fi
          rm -f "$HOME/.ssh/foundation_vm_key" "$RUNNER_TEMP"/obsidian-password-*
