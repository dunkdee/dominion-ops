name: Repair Obsidian Remote
# Container-only stale-RDP repair with rollback — 2026-08-10 22:54 EDT

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-obsidian-remote.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: foundation-vm-production
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Require protected secrets
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          test -n "$OBSIDIAN_PASSWORD"
          [[ "$OBSIDIAN_PASSWORD" =~ ^[A-Za-z0-9._~!@%+=:,/-]{16,128}$ ]]

      - name: Prepare SSH and password
        id: stage
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          local_file="$RUNNER_TEMP/obsidian-password-${GITHUB_RUN_ID}"
          remote_file="/tmp/obsidian-password-${GITHUB_RUN_ID}"
          umask 077
          printf '%s' "$OBSIDIAN_PASSWORD" > "$local_file"
          scp -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes "$local_file" "$VM_USER@$VM_HOST:$remote_file"
          echo "remote_file=$remote_file" >> "$GITHUB_OUTPUT"

      - name: Refresh stale remote image with rollback and verify runtime
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          PASSWORD_FILE: ${{ steps.stage.outputs.remote_file }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$VM_USER@$VM_HOST" \
            "PASSWORD_FILE='$PASSWORD_FILE' RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          trap 'rm -f "$PASSWORD_FILE"' EXIT

          repo="$HOME/dominion-ops"
          cd "$repo"
          test -f docker-compose.yml
          test -f "$PASSWORD_FILE"
          password="$(cat "$PASSWORD_FILE")"
          test -n "$password"

          umask 077
          touch .env
          tmp="$(mktemp "$repo/.env.obsidian.XXXXXX")"
          grep -v '^OBSIDIAN_PASSWORD=' .env > "$tmp" || true
          printf 'OBSIDIAN_PASSWORD=%s\n' "$password" >> "$tmp"
          chmod 600 "$tmp"
          mv "$tmp" .env
          docker compose config --quiet

          old_id="$(docker inspect --format '{{.Image}}' obsidian-remote)"
          test -n "$old_id"
          rollback_tag="dominion/obsidian-remote-rollback:${RUN_ID}"
          docker image inspect "$old_id" >/dev/null
          docker tag "$old_id" "$rollback_tag"
          echo "OBSIDIAN_IMAGE_SNAPSHOT=PASS old_id=$old_id rollback_tag=$rollback_tag"

          switched=0
          rollback() {
            if [ "$switched" -ne 1 ]; then
              return 0
            fi
            echo "OBSIDIAN_ROLLBACK=START"
            docker tag "$rollback_tag" ghcr.io/sytone/obsidian-remote:latest
            docker compose up -d --no-deps --force-recreate obsidian-remote || true
            restored=0
            for _ in $(seq 1 60); do
              state="$(docker inspect --format '{{.State.Status}}' obsidian-remote 2>/dev/null || true)"
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:8083/ || true)"
              if [ "$state" = running ] && [[ "$code" =~ ^(200|302|401)$ ]]; then
                restored=1
                break
              fi
              sleep 3
            done
            if [ "$restored" -eq 1 ]; then
              echo "OBSIDIAN_ROLLBACK=PASS old_id=$old_id"
            else
              echo "OBSIDIAN_ROLLBACK=FAIL old_id=$old_id"
            fi
          }
          fail() {
            reason="$1"
            echo "OBSIDIAN_REFRESH=FAIL reason=$reason"
            docker compose ps obsidian-remote || true
            docker inspect --format 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} image={{.Image}} error={{.State.Error}}' obsidian-remote 2>/dev/null || true
            docker logs --tail 120 obsidian-remote 2>&1 | sed -E 's/(password|passwd|token|secret)=([^ ]+)/\1=REDACTED/Ig' || true
            rollback
            exit 1
          }

          docker compose pull obsidian-remote
          new_id="$(docker image inspect ghcr.io/sytone/obsidian-remote:latest --format '{{.Id}}')"
          test -n "$new_id"
          echo "OBSIDIAN_IMAGE_PULL=PASS old_id=$old_id new_id=$new_id"
          if [ "$new_id" = "$old_id" ]; then
            echo "OBSIDIAN_REFRESH=FAIL reason=registry_latest_matches_stale_runtime"
            exit 2
          fi

          docker compose up -d --no-deps --force-recreate obsidian-remote
          switched=1

          ready=0
          for _ in $(seq 1 120); do
            state="$(docker inspect --format '{{.State.Status}}' obsidian-remote 2>/dev/null || true)"
            code="$(curl -sS -u "dominion:$password" -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8083/ || true)"
            if [ "$state" = running ] && [[ "$code" =~ ^(200|302)$ ]]; then
              ready=1
              break
            fi
            sleep 3
          done
          [ "$ready" -eq 1 ] || fail local_authenticated_health

          active_id="$(docker inspect --format '{{.Image}}' obsidian-remote)"
          [ "$active_id" = "$new_id" ] || fail active_image_mismatch

          exposed="$(docker inspect --format '{{json .Config.ExposedPorts}}' obsidian-remote)"
          echo "OBSIDIAN_EXPOSED_PORTS=$exposed"
          if printf '%s' "$exposed" | grep -q '3389/tcp'; then
            fail legacy_xrdp_port_present
          fi
          printf '%s' "$exposed" | grep -q '8080/tcp' || fail expected_web_port_missing

          legacy_processes="$(docker exec obsidian-remote sh -lc "ps -ef 2>/dev/null | grep -E '[g]uacd|[x]rdp' || true" 2>/dev/null || true)"
          [ -z "$legacy_processes" ] || fail legacy_rdp_process_present

          unauth="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8083/ || true)"
          [ "$unauth" = 401 ] || fail local_auth_not_enforced

          sudo caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          getent ahostsv4 vault.dominionhealing.org >/dev/null

          public=0
          for _ in $(seq 1 40); do
            code="$(curl -sS -u "dominion:$password" -o /dev/null -w '%{http_code}' --max-time 15 https://vault.dominionhealing.org || true)"
            if [[ "$code" =~ ^(200|302)$ ]]; then
              public=1
              break
            fi
            sleep 3
          done
          [ "$public" -eq 1 ] || fail public_authenticated_route

          public_unauth="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://vault.dominionhealing.org || true)"
          [ "$public_unauth" = 401 ] || fail public_auth_not_enforced

          echo "OBSIDIAN_REFRESH=PASS image=$new_id legacy_rdp=absent local_auth=pass public_auth=pass vault=preserved"
          REMOTE

      - name: Record success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 84 --repo "$GITHUB_REPOSITORY" --body "Obsidian Remote stale-RDP refresh passed. The current upstream image is running; legacy XRDP/guacd runtime is absent; local and public authentication checks passed; the vault mount was preserved. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true

      - name: Cleanup
        if: always()
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          REMOTE_FILE: ${{ steps.stage.outputs.remote_file }}
        run: |
          set +e
          if [ -f "$HOME/.ssh/foundation_vm_key" ]; then
            ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" "rm -f '$REMOTE_FILE'" >/dev/null 2>&1
          fi
          rm -f "$HOME/.ssh/foundation_vm_key" "$RUNNER_TEMP"/obsidian-password-*
