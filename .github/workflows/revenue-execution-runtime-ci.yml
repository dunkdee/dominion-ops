name: Dominion Revenue Execution Runtime CI

on:
  pull_request:
    paths:
      - 'apps/revenue_runtime/**'
      - 'governance/revenue_execution_policy.json'
      - 'scripts/revenue_runtime/**'
      - 'tests/test_revenue_execution_runtime.py'
      - 'tests/test_revenue_commercial_deploy.py'
      - 'tests/test_revenue_gate_e_zero_spend.py'
      - '.github/workflows/revenue-execution-runtime-ci.yml'
      - '.github/workflows/revenue-runtime-commercial-deploy.yml'
      - '.github/workflows/revenue-gate-e-zero-spend-proof.yml'
  push:
    branches: [main]
    paths:
      - 'apps/revenue_runtime/**'
      - 'governance/revenue_execution_policy.json'
      - 'scripts/revenue_runtime/**'
      - 'tests/test_revenue_execution_runtime.py'
      - 'tests/test_revenue_commercial_deploy.py'
      - 'tests/test_revenue_gate_e_zero_spend.py'
      - '.github/workflows/revenue-execution-runtime-ci.yml'
      - '.github/workflows/revenue-runtime-commercial-deploy.yml'
      - '.github/workflows/revenue-gate-e-zero-spend-proof.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install canonical repository test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Syntax and shell validation
        run: |
          python -m compileall -q apps/revenue_runtime
          bash -n scripts/revenue_runtime/install_revenue_runtime.sh
          bash -n scripts/revenue_runtime/disable_revenue_runtime.sh
          bash -n scripts/revenue_runtime/deploy_commercial_release_v1.sh
          bash -n scripts/revenue_runtime/prove_gate_e_zero_spend.sh
          python -m json.tool governance/revenue_execution_policy.json >/dev/null
      - name: Revenue execution contract tests
        run: python -m unittest tests.test_revenue_execution_runtime -v
      - name: Commercial deployment contract tests
        run: python -m unittest tests.test_revenue_commercial_deploy -v
      - name: Gate E zero-spend proof contract tests
        run: python -m unittest tests.test_revenue_gate_e_zero_spend -v
      - name: Preserve original simulation boundary tests
        run: python -m unittest tests.test_revenue_runtime -v
      - name: Static authority assertions
        run: |
          grep -Fq '"cro_reversible": true' governance/revenue_execution_policy.json
          grep -Fq '"price_change": false' governance/revenue_execution_policy.json
          grep -Fq '"paid_spend": false' governance/revenue_execution_policy.json
          grep -Fq '"destructive_change": false' governance/revenue_execution_policy.json
          grep -Fq 'require_current_revision' governance/revenue_execution_policy.json
          grep -Fq 'AMBIGUOUS_CANDIDATES' apps/revenue_runtime/evaluator.py
          grep -Fq 'DOMINION_REVENUE_RUNTIME=DISABLED' scripts/revenue_runtime/disable_revenue_runtime.sh
          grep -Fq 'DEPLOY_REVENUE_COMMERCIAL_RUNTIME:' .github/workflows/revenue-runtime-commercial-deploy.yml
          grep -Fq 'REVENUE_COMMERCIAL_RUNTIME_DEPLOY=PASS' scripts/revenue_runtime/deploy_commercial_release_v1.sh
          grep -Fq 'RUN_GATE_E_ZERO_SPEND:' .github/workflows/revenue-gate-e-zero-spend-proof.yml
          grep -Fq 'GATE_E_ZERO_SPEND_RUNTIME_PROOF=PASS' scripts/revenue_runtime/prove_gate_e_zero_spend.sh
          echo 'DOMINION_REVENUE_EXECUTION_CI=PASS'
