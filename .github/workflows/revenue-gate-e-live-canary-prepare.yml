name: Dominion Gate E Live Canary Prepare

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  prepare:
    if: >-
      github.event.issue.number == 305 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'PREPARE_GATE_E_LIVE_CANARY:')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: foundation-vm-production
    steps:
      - name: Prove owner authorization bound to current main
        id: authorize
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$ISSUE_NUMBER" = "305" || { echo 'ERROR: Gate E live canary authorization must originate from issue 305'; exit 1; }
          test "$COMMENT_USER" = "$REPOSITORY_OWNER" || { echo 'ERROR: Gate E live canary actor is not repository owner'; exit 1; }
          test "$AUTHOR_ASSOCIATION" = "OWNER" || { echo 'ERROR: Gate E live canary authorization lacks OWNER association'; exit 1; }
          main_sha="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/main" | jq -r '.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'ERROR: unable to resolve current main SHA'; exit 1; }
          expected="PREPARE_GATE_E_LIVE_CANARY:$main_sha:PREPARE GATE E"
          test "$COMMENT_BODY" = "$expected" || {
            echo 'ERROR: Gate E live canary authorization is not bound to current main and exact scope'
            echo "expected_token=$expected"
            exit 1
          }
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "GATE_E_LIVE_AUTHORIZATION=PASS actor=$COMMENT_USER issue=$ISSUE_NUMBER main_sha=$main_sha"

      - name: Checkout exact authorized main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.authorize.outputs.main_sha }}
          persist-credentials: false

      - name: Prove bounded live-canary asset
        env:
          MAIN_SHA: ${{ steps.authorize.outputs.main_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test -f scripts/revenue_runtime/prepare_gate_e_live_canary.sh
          bash -n scripts/revenue_runtime/prepare_gate_e_live_canary.sh
          echo "GATE_E_LIVE_ASSET_BOUNDARY=PASS source_sha=$MAIN_SHA"

      - name: Require Foundation VM connection material
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" || { echo 'ERROR: VM_HOST is not configured'; exit 1; }
          test -n "$VM_USER" || { echo 'ERROR: VM_USER is not configured'; exit 1; }
          test -n "$VM_SSH_KEY" || { echo 'ERROR: VM_SSH_KEY is not configured'; exit 1; }
          test -n "$VM_SSH_KNOWN_HOSTS" || { echo 'ERROR: VM_SSH_KNOWN_HOSTS is not configured'; exit 1; }

      - name: Prepare pinned SSH trust
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          grep -Eq '^foundation-vm[[:space:]]+(ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa)[[:space:]]+' "$HOME/.ssh/known_hosts" || {
            echo 'ERROR: VM_SSH_KNOWN_HOSTS must contain a foundation-vm host-key alias entry'
            exit 1
          }
          ssh-keygen -l -f "$HOME/.ssh/known_hosts" >/dev/null
          echo 'FOUNDATION_VM_HOST_IDENTITY=PINNED alias=foundation-vm'

      - name: Transfer bounded live-canary script
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o HostKeyAlias=foundation-vm -o StrictHostKeyChecking=yes \
            scripts/revenue_runtime/prepare_gate_e_live_canary.sh \
            "$VM_USER@$VM_HOST:/tmp/prepare-gate-e-live-$GITHUB_RUN_ID.sh"

      - name: Prepare one-time live attribution canary
        id: prepare
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          PRODUCT_ID: dbbcaa33-e143-4660-a238-d3182aa1701e
          TARGET_URL: https://www.voltedgegoods.com/product-page/strong-magnetic-360-rotation-mag-safe-air-vent-car-mount-dashboard-phone-holder
        run: |
          set -euo pipefail
          prep_log="$RUNNER_TEMP/gate-e-live-prep.log"
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o HostKeyAlias=foundation-vm -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "RUN_ID='$GITHUB_RUN_ID' PRODUCT_ID='$PRODUCT_ID' TARGET_URL='$TARGET_URL' bash /tmp/prepare-gate-e-live-$GITHUB_RUN_ID.sh; rc=\$?; rm -f /tmp/prepare-gate-e-live-$GITHUB_RUN_ID.sh; exit \$rc" \
            | tee "$prep_log"
          grep -Fq 'GATE_E_LIVE_RUNTIME_HEALTH=PASS' "$prep_log"
          grep -Fq 'GATE_E_LIVE_TARGET_BOUNDARY=PASS' "$prep_log"
          grep -Fq 'GATE_E_LIVE_EXPERIMENT_ACTIVE=PASS' "$prep_log"
          grep -Fq 'GATE_E_LIVE_CANARY_PREP=PASS' "$prep_log"
          grep -Fq 'automated_spend=false' "$prep_log"
          grep -Fq 'price_mutation=false' "$prep_log"
          grep -Fq 'synthetic_click=false' "$prep_log"
          receipt="$(grep -F 'GATE_E_LIVE_CANARY_PREP=PASS' "$prep_log" | tail -n1)"
          exp_id="$(printf '%s\n' "$receipt" | sed -n 's/.*experiment_id=\([^ ]*\).*/\1/p')"
          public_route="$(printf '%s\n' "$receipt" | sed -n 's/.*public_route=\([^ ]*\).*/\1/p')"
          test -n "$exp_id"
          test -n "$public_route"
          echo "experiment_id=$exp_id" >> "$GITHUB_OUTPUT"
          echo "public_route=$public_route" >> "$GITHUB_OUTPUT"
          echo "receipt=$receipt" >> "$GITHUB_OUTPUT"

      - name: Record live-canary preparation receipt on issue 305
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.authorize.outputs.main_sha }}
          EXPERIMENT_ID: ${{ steps.prepare.outputs.experiment_id }}
          PUBLIC_ROUTE: ${{ steps.prepare.outputs.public_route }}
          PREP_RECEIPT: ${{ steps.prepare.outputs.receipt }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ## Gate E live attribution canary — PREPARED

          Exact authorized main: \`$MAIN_SHA\`
          Experiment: \`$EXPERIMENT_ID\`
          Public signed route: $PUBLIC_ROUTE

          \`\`\`
          $PREP_RECEIPT
          \`\`\`

          Scope: one-time normal Catalog V3 checkout attribution canary. Automated paid spend remains disabled, automatic price changes remain disabled, auto-promotion is disabled, and the workflow created no synthetic click or payment. The experiment is intentionally ACTIVE so the real checkout browser can become the single click candidate. Do not open the signed route from multiple browsers/devices before completing the canary; ambiguity fails closed.
          EOF
          )"
          jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/comment.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/305/comments" >/dev/null
          echo 'GATE_E_LIVE_PREP_RECEIPT_RECORDED=PASS issue=305'

      - name: Cleanup temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"

  reconcile:
    if: >-
      github.event.issue.number == 305 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'RECONCILE_GATE_E_LIVE_CANARY:')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: foundation-vm-production
    steps:
      - name: Prove owner reconciliation authorization bound to current main and exact Wix order
        id: authorize
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$ISSUE_NUMBER" = "305"
          test "$COMMENT_USER" = "$REPOSITORY_OWNER"
          test "$AUTHOR_ASSOCIATION" = "OWNER"
          main_sha="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/main" | jq -r '.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          prefix="RECONCILE_GATE_E_LIVE_CANARY:$main_sha:"
          suffix=":RECONCILE GATE E"
          [[ "$COMMENT_BODY" == "$prefix"*"$suffix" ]] || {
            echo "ERROR: reconciliation authorization is not bound to current main and exact scope"
            exit 1
          }
          payload="${COMMENT_BODY#"$prefix"}"
          payload="${payload%"$suffix"}"
          IFS=':' read -r experiment_id order_id purchase_flow_id checkout_id extra <<< "$payload"
          test -z "${extra:-}"
          [[ "$experiment_id" =~ ^[A-Za-z0-9_-]{3,120}$ ]]
          [[ "$order_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$purchase_flow_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$checkout_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "experiment_id=$experiment_id" >> "$GITHUB_OUTPUT"
          echo "order_id=$order_id" >> "$GITHUB_OUTPUT"
          echo "purchase_flow_id=$purchase_flow_id" >> "$GITHUB_OUTPUT"
          echo "checkout_id=$checkout_id" >> "$GITHUB_OUTPUT"
          echo "GATE_E_LIVE_RECONCILE_AUTHORIZATION=PASS actor=$COMMENT_USER issue=$ISSUE_NUMBER main_sha=$main_sha order_id=$order_id"

      - name: Checkout exact authorized main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.authorize.outputs.main_sha }}
          persist-credentials: false

      - name: Prove bounded reconciliation asset
        env:
          MAIN_SHA: ${{ steps.authorize.outputs.main_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test -f scripts/revenue_runtime/reconcile_gate_e_live_canary.sh
          bash -n scripts/revenue_runtime/reconcile_gate_e_live_canary.sh
          echo "GATE_E_LIVE_RECONCILE_ASSET_BOUNDARY=PASS source_sha=$MAIN_SHA"

      - name: Require Foundation VM connection material
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          test -n "$VM_SSH_KNOWN_HOSTS"

      - name: Prepare pinned SSH trust
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          grep -Eq '^foundation-vm[[:space:]]+(ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa)[[:space:]]+' "$HOME/.ssh/known_hosts"
          ssh-keygen -l -f "$HOME/.ssh/known_hosts" >/dev/null
          echo 'FOUNDATION_VM_HOST_IDENTITY=PINNED alias=foundation-vm'

      - name: Transfer bounded reconciliation script
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o HostKeyAlias=foundation-vm -o StrictHostKeyChecking=yes \
            scripts/revenue_runtime/reconcile_gate_e_live_canary.sh \
            "$VM_USER@$VM_HOST:/tmp/reconcile-gate-e-live-$GITHUB_RUN_ID.sh"

      - name: Reconcile completed live canary and prove canonical attribution
        id: reconcile
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          EXPERIMENT_ID: ${{ steps.authorize.outputs.experiment_id }}
          ORDER_ID: ${{ steps.authorize.outputs.order_id }}
          PURCHASE_FLOW_ID: ${{ steps.authorize.outputs.purchase_flow_id }}
          CHECKOUT_ID: ${{ steps.authorize.outputs.checkout_id }}
          PRODUCT_ID: dbbcaa33-e143-4660-a238-d3182aa1701e
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/gate-e-live-reconcile.log"
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o HostKeyAlias=foundation-vm -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "EXPERIMENT_ID='$EXPERIMENT_ID' ORDER_ID='$ORDER_ID' PURCHASE_FLOW_ID='$PURCHASE_FLOW_ID' CHECKOUT_ID='$CHECKOUT_ID' PRODUCT_ID='$PRODUCT_ID' bash /tmp/reconcile-gate-e-live-$GITHUB_RUN_ID.sh; rc=\$?; rm -f /tmp/reconcile-gate-e-live-$GITHUB_RUN_ID.sh; exit \$rc" \
            | tee "$log"
          grep -Fq 'GATE_E_LIVE_RUNTIME_HEALTH=PASS' "$log"
          grep -Fq 'GATE_E_LIVE_EVALUATOR_RUN=PASS' "$log"
          grep -Fq 'GATE_E_WIX_NATIVE_LINK=PASS' "$log"
          grep -Fq 'SOURCE_TO_ORDER_ATTRIBUTION_RECEIPT=PASS' "$log"
          grep -Fq 'GATE_E_EVENT_LEDGER_PROOF=PASS' "$log"
          grep -Fq 'GATE_E_LIVE_CANARY_PAUSED=PASS' "$log"
          grep -Fq 'GATE_E_LIVE_RECONCILE=PASS' "$log"
          grep -Fq 'spend_cents=0' "$log"
          grep -Fq 'new_payment=false' "$log"
          grep -Fq 'new_refund=false' "$log"
          {
            echo 'proof_lines<<EOF'
            grep -E '^(GATE_E_LIVE_RUNTIME_HEALTH|GATE_E_LIVE_EVALUATOR_RUN|GATE_E_LIVE_EXPERIMENT_PROOF|GATE_E_WIX_NATIVE_LINK|SOURCE_TO_ORDER_ATTRIBUTION_RECEIPT|GATE_E_EVENT_LEDGER_PROOF|GATE_E_LIVE_CANARY_PAUSED|GATE_E_LIVE_RECONCILE)=' "$log"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Record canonical Gate E live reconciliation receipt on issue 305
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.authorize.outputs.main_sha }}
          ORDER_ID: ${{ steps.authorize.outputs.order_id }}
          PROOF_LINES: ${{ steps.reconcile.outputs.proof_lines }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ## Gate E live attribution reconciliation — PASS

          Exact authorized main: \`$MAIN_SHA\`
          Existing Wix order: \`$ORDER_ID\`

          \`\`\`
          $PROOF_LINES
          \`\`\`

          Evidence boundary: this closes Gate E with the already-completed zero-dollar Catalog V3 order and its Wix-native purchase-flow/checkout attribution. No new payment, refund, paid traffic, price mutation, provider change, or external publication was performed. Gate C/D real payment/refund capability remains preserved from order 10001. The live canary is paused after proof.
          EOF
          )"
          jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/comment.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/305/comments" >/dev/null
          echo 'GATE_E_LIVE_RECONCILE_RECEIPT_RECORDED=PASS issue=305'

      - name: Cleanup temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
