name: Dominion Gate E Zero-Spend Runtime Proof

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  prove:
    if: >-
      github.event.issue.number == 305 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'RUN_GATE_E_ZERO_SPEND:')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: foundation-vm-production
    steps:
      - name: Prove owner authorization bound to current main
        id: authorize
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$ISSUE_NUMBER" = "305" || { echo 'ERROR: Gate E proof authorization must originate from issue 305'; exit 1; }
          test "$COMMENT_USER" = "$REPOSITORY_OWNER" || { echo 'ERROR: Gate E proof actor is not repository owner'; exit 1; }
          test "$AUTHOR_ASSOCIATION" = "OWNER" || { echo 'ERROR: Gate E proof authorization lacks OWNER association'; exit 1; }
          main_sha="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/main" | jq -r '.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'ERROR: unable to resolve current main SHA'; exit 1; }
          expected="RUN_GATE_E_ZERO_SPEND:$main_sha:PROVE GATE E"
          test "$COMMENT_BODY" = "$expected" || {
            echo 'ERROR: Gate E proof authorization is not bound to current main and exact scope'
            echo "expected_token=$expected"
            exit 1
          }
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "GATE_E_ZERO_SPEND_AUTHORIZATION=PASS actor=$COMMENT_USER issue=$ISSUE_NUMBER main_sha=$main_sha"

      - name: Checkout exact authorized main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.authorize.outputs.main_sha }}
          persist-credentials: false

      - name: Prove bounded proof assets
        env:
          MAIN_SHA: ${{ steps.authorize.outputs.main_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test -f scripts/revenue_runtime/prove_gate_e_zero_spend.sh
          bash -n scripts/revenue_runtime/prove_gate_e_zero_spend.sh
          echo "GATE_E_PROOF_ASSET_BOUNDARY=PASS source_sha=$MAIN_SHA"

      - name: Require Foundation VM connection material
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" || { echo 'ERROR: VM_HOST is not configured'; exit 1; }
          test -n "$VM_USER" || { echo 'ERROR: VM_USER is not configured'; exit 1; }
          test -n "$VM_SSH_KEY" || { echo 'ERROR: VM_SSH_KEY is not configured'; exit 1; }
          test -n "$VM_SSH_KNOWN_HOSTS" || { echo 'ERROR: VM_SSH_KNOWN_HOSTS is not configured'; exit 1; }

      - name: Prepare pinned SSH trust
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          grep -Eq '^foundation-vm[[:space:]]+(ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa)[[:space:]]+' "$HOME/.ssh/known_hosts" || {
            echo 'ERROR: VM_SSH_KNOWN_HOSTS must contain a foundation-vm host-key alias entry'
            exit 1
          }
          ssh-keygen -l -f "$HOME/.ssh/known_hosts" >/dev/null
          echo 'FOUNDATION_VM_HOST_IDENTITY=PINNED alias=foundation-vm'

      - name: Transfer bounded proof script
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o HostKeyAlias=foundation-vm -o StrictHostKeyChecking=yes \
            scripts/revenue_runtime/prove_gate_e_zero_spend.sh \
            "$VM_USER@$VM_HOST:/tmp/prove-gate-e-zero-spend-$GITHUB_RUN_ID.sh"

      - name: Execute zero-spend source/campaign runtime proof
        id: proof
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          PRODUCT_ID: dbbcaa33-e143-4660-a238-d3182aa1701e
          TARGET_URL: https://www.voltedgegoods.com/product-page/strong-magnetic-360-rotation-mag-safe-air-vent-car-mount-dashboard-phone-holder
        run: |
          set -euo pipefail
          proof_log="$RUNNER_TEMP/gate-e-proof.log"
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o HostKeyAlias=foundation-vm -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "RUN_ID='$GITHUB_RUN_ID' PRODUCT_ID='$PRODUCT_ID' TARGET_URL='$TARGET_URL' bash /tmp/prove-gate-e-zero-spend-$GITHUB_RUN_ID.sh; rc=\$?; rm -f /tmp/prove-gate-e-zero-spend-$GITHUB_RUN_ID.sh; exit \$rc" \
            | tee "$proof_log"
          grep -Fq 'REVENUE_RUNTIME_HEALTH_PROOF=PASS' "$proof_log"
          grep -Fq 'SOURCE_CAMPAIGN_ROUTER_PROOF=PASS' "$proof_log"
          grep -Fq 'GATE_E_EVENT_LEDGER_PROOF=PASS' "$proof_log"
          grep -Fq 'GATE_E_ROLLBACK_PROOF=PASS' "$proof_log"
          grep -Fq 'GATE_E_ZERO_SPEND_RUNTIME_PROOF=PASS' "$proof_log"
          grep -Fq 'spend_cents=0' "$proof_log"
          grep -Fq 'purchase_events=0' "$proof_log"
          grep -Fq 'refund_events=0' "$proof_log"
          grep -Fq 'external_redirect_followed=false' "$proof_log"
          {
            echo 'proof_lines<<EOF'
            grep -E '^(REVENUE_RUNTIME_HEALTH_PROOF|SOURCE_CAMPAIGN_ROUTER_PROOF|GATE_E_EVENT_LEDGER_PROOF|GATE_E_ROLLBACK_PROOF|GATE_E_ZERO_SPEND_RUNTIME_PROOF)=' "$proof_log"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Record canonical Gate E proof receipt on issue 305
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.authorize.outputs.main_sha }}
          PROOF_LINES: ${{ steps.proof.outputs.proof_lines }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ## Gate E zero-spend runtime receipt — run $GITHUB_RUN_ID

          Exact authorized main: \`$MAIN_SHA\`

          \`\`\`
          $PROOF_LINES
          \`\`\`

          Scope: signed Revenue Runtime source/campaign routing and event-ledger proof only. No payment, refund, paid traffic, external storefront redirect follow, price mutation, provider change, or publication occurred. The proof experiment was paused before completion.
          EOF
          )"
          jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/comment.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/305/comments" >/dev/null
          echo 'GATE_E_CANONICAL_RECEIPT_RECORDED=PASS issue=305'

      - name: Cleanup temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
