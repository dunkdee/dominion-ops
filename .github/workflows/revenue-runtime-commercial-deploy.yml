name: Dominion Revenue Commercial Runtime Deploy

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.issue.number == 305 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'DEPLOY_REVENUE_COMMERCIAL_RUNTIME:')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: foundation-vm-production
    steps:
      - name: Prove owner authorization bound to current main
        id: authorize
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$ISSUE_NUMBER" = "305" || { echo 'ERROR: deploy authorization must originate from issue 305'; exit 1; }
          test "$COMMENT_USER" = "$REPOSITORY_OWNER" || { echo 'ERROR: deploy actor is not repository owner'; exit 1; }
          test "$AUTHOR_ASSOCIATION" = "OWNER" || { echo 'ERROR: deploy authorization lacks OWNER association'; exit 1; }
          main_sha="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/main" | jq -r '.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'ERROR: unable to resolve current main SHA'; exit 1; }
          expected="DEPLOY_REVENUE_COMMERCIAL_RUNTIME:$main_sha"
          test "$COMMENT_BODY" = "$expected" || {
            echo 'ERROR: commercial deploy authorization is not bound to current main'
            echo "expected_token=$expected"
            exit 1
          }
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "REVENUE_COMMERCIAL_DEPLOY_AUTHORIZATION=PASS actor=$COMMENT_USER issue=$ISSUE_NUMBER main_sha=$main_sha"

      - name: Checkout exact authorized main
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.authorize.outputs.main_sha }}
          persist-credentials: false

      - name: Prove checkout and package bounded assets
        env:
          MAIN_SHA: ${{ steps.authorize.outputs.main_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test -f scripts/revenue_runtime/install_revenue_runtime.sh
          test -f scripts/revenue_runtime/deploy_commercial_release_v1.sh
          test -d apps/revenue_runtime
          test -f governance/revenue_execution_policy.json
          stage="$RUNNER_TEMP/revenue-commercial-assets"
          mkdir -p "$stage/apps" "$stage/governance" "$stage/scripts"
          cp -a apps/revenue_runtime "$stage/apps/"
          cp -a governance/revenue_execution_policy.json "$stage/governance/"
          mkdir -p "$stage/scripts/revenue_runtime"
          cp -a scripts/revenue_runtime/install_revenue_runtime.sh "$stage/scripts/revenue_runtime/"
          cp -a scripts/revenue_runtime/deploy_commercial_release_v1.sh "$stage/scripts/revenue_runtime/"
          printf '%s\n' "$MAIN_SHA" > "$stage/SOURCE_SHA"
          tar -C "$stage" -czf "$RUNNER_TEMP/revenue-commercial-assets.tgz" .
          echo "REVENUE_COMMERCIAL_ASSET_BOUNDARY=PASS source_sha=$MAIN_SHA"

      - name: Require Foundation VM connection material
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" || { echo 'ERROR: VM_HOST is not configured'; exit 1; }
          test -n "$VM_USER" || { echo 'ERROR: VM_USER is not configured'; exit 1; }
          test -n "$VM_SSH_KEY" || { echo 'ERROR: VM_SSH_KEY is not configured'; exit 1; }
          test -n "$VM_SSH_KNOWN_HOSTS" || { echo 'ERROR: VM_SSH_KNOWN_HOSTS is not configured'; exit 1; }

      - name: Prepare pinned SSH trust
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          grep -Eq '^foundation-vm[[:space:]]+(ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa)[[:space:]]+' "$HOME/.ssh/known_hosts" || {
            echo 'ERROR: VM_SSH_KNOWN_HOSTS must contain a foundation-vm host-key alias entry'
            exit 1
          }
          ssh-keygen -l -f "$HOME/.ssh/known_hosts" >/dev/null
          echo 'FOUNDATION_VM_HOST_IDENTITY=PINNED alias=foundation-vm'

      - name: Transfer exact authorized assets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o HostKeyAlias=foundation-vm -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/revenue-commercial-assets.tgz" \
            "$VM_USER@$VM_HOST:/tmp/revenue-commercial-$GITHUB_RUN_ID.tgz"

      - name: Deploy and prove commercial runtime
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          MAIN_SHA: ${{ steps.authorize.outputs.main_sha }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o HostKeyAlias=foundation-vm -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "set -euo pipefail
             root=/tmp/revenue-commercial-$GITHUB_RUN_ID
             rm -rf \"\$root\"
             mkdir -p \"\$root\"
             tar -C \"\$root\" -xzf /tmp/revenue-commercial-$GITHUB_RUN_ID.tgz
             ASSET_ROOT=\"\$root\" RUN_ID='$GITHUB_RUN_ID' EXPECTED_SOURCE_SHA='$MAIN_SHA' bash \"\$root/scripts/revenue_runtime/deploy_commercial_release_v1.sh\"
             rm -rf \"\$root\" /tmp/revenue-commercial-$GITHUB_RUN_ID.tgz"

      - name: Cleanup temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
