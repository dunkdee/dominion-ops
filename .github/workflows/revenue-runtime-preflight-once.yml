name: Dominion Revenue Runtime Preflight Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revenue-runtime-preflight-once.yml'

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: foundation-vm-production
    steps:
      - name: Require protected VM access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" && test -n "$VM_USER" && test -n "$VM_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect runtime and ingress without mutation
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== INTERPRETER ==='
          buddy_exec="$(systemctl show dominion-buddy-web.service -p ExecStart --value 2>/dev/null || true)"
          buddy_python="$(printf '%s\n' "$buddy_exec" | sed -n 's/.*path=\([^ ;]*\).*/\1/p' | head -1)"
          test -n "$buddy_python" && test -x "$buddy_python"
          "$buddy_python" - <<'PY'
          import importlib.util
          names=['fastapi','uvicorn','httpx','sqlite3']
          missing=[n for n in names if importlib.util.find_spec(n) is None]
          assert not missing, missing
          print('REVENUE_RUNTIME_PYTHON=PASS modules=' + ','.join(names))
          PY

          echo '=== CONFIG PRESENCE ==='
          cd "$HOME/dominion-ops"
          for key in WIX_API_KEY WIX_SITE_ID; do
            if grep -q "^${key}=." .env 2>/dev/null; then echo "CONFIG_PRESENT=$key"; else echo "CONFIG_MISSING=$key"; fi
          done

          echo '=== PORT ==='
          if ss -ltn | awk '{print $4}' | grep -Eq '(^|:)8790$'; then
            echo 'PORT_8790=IN_USE'
          else
            echo 'PORT_8790=FREE'
          fi

          echo '=== CADDY VALIDATION ==='
          sudo caddy validate --config /etc/caddy/Caddyfile >/dev/null
          echo 'CADDY_VALIDATE=PASS'

          echo '=== SAFE ROUTE MAP ==='
          sudo grep -nE 'dominionhealing\.org|^[[:space:]]*(handle|handle_path|route|reverse_proxy|redir|respond)[[:space:]]' /etc/caddy/Caddyfile \
            | grep -vEi 'basic_auth|basicauth|password|token|secret|authorization' \
            | head -120 || true

          if sudo grep -Eq '(^|[[:space:]])/r(\*|/|[[:space:]])|/revenue(\*|/|[[:space:]])' /etc/caddy/Caddyfile; then
            echo 'REVENUE_INGRESS_PATH=COLLISION'
          else
            echo 'REVENUE_INGRESS_PATH=FREE'
          fi

          echo 'REVENUE_PREFLIGHT=PASS'
          REMOTE

      - name: Cleanup runner access material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
