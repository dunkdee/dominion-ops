name: Revenue Snapshot Integrity

on:
  pull_request:
    paths:
      - '.github/workflows/cron-status.yml'
      - '.github/workflows/revenue-snapshot-integrity.yml'
      - 'governance/revenue_snapshot_integrity_policy.json'
      - 'governance/integrity_installation_contract.json'
      - 'scripts/validate_revenue_snapshot_integrity.py'
      - 'scripts/validate_integrity_installation_contract.py'
      - 'tests/test_revenue_snapshot_workflow.py'
      - 'docs/INTEGRITY_INSTALLATION_CHECKLIST.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cron-status.yml'
      - '.github/workflows/revenue-snapshot-integrity.yml'
      - 'governance/revenue_snapshot_integrity_policy.json'
      - 'governance/integrity_installation_contract.json'
      - 'scripts/validate_revenue_snapshot_integrity.py'
      - 'scripts/validate_integrity_installation_contract.py'
      - 'tests/test_revenue_snapshot_workflow.py'
      - 'docs/INTEGRITY_INSTALLATION_CHECKLIST.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate revenue snapshot integrity contract
        run: python scripts/validate_revenue_snapshot_integrity.py
      - name: Validate installation closure contract
        run: python scripts/validate_integrity_installation_contract.py
      - name: Run regression test
        run: python -m unittest -v tests.test_revenue_snapshot_workflow
