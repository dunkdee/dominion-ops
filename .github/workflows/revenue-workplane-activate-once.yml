name: Dominion Revenue Probe Cleanup Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revenue-workplane-activate-once.yml'

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  cleanup-known-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: foundation-vm-production
    steps:
      - name: Require protected production access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" && test -n "$VM_USER" && test -n "$VM_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Remove only the known deployment verification impression
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          db="$HOME/.dominion/revenue-runtime/revenue.db"
          receipts="$HOME/.dominion/revenue-runtime/receipts"
          test -f "$db"
          mkdir -p "$receipts"
          chmod 700 "$receipts"

          buddy_exec="$(systemctl show dominion-buddy-web.service -p ExecStart --value)"
          buddy_python="$(printf '%s\n' "$buddy_exec" | sed -n 's/.*path=\([^ ;]*\).*/\1/p' | head -1)"
          test -x "$buddy_python"

          DB_PATH="$db" RECEIPT_PATH="$receipts/20260826-canary-public-verification-cleanup.json" "$buddy_python" - <<'PY'
          import json, os, sqlite3
          from pathlib import Path

          db_path = Path(os.environ['DB_PATH'])
          receipt_path = Path(os.environ['RECEIPT_PATH'])
          exp_id = 'voltedge-speaker-offer-v1'
          start = '2026-08-26T04:08:35+00:00'
          end = '2026-08-26T04:08:38+00:00'

          with sqlite3.connect(db_path, timeout=20) as db:
              db.row_factory = sqlite3.Row
              rows = db.execute(
                  "SELECT id,visitor_id,variant,event_type,revenue_cents,occurred_at,metadata_json "
                  "FROM events WHERE experiment_id=? AND occurred_at>=? AND occurred_at<=? ORDER BY occurred_at",
                  (exp_id, start, end),
              ).fetchall()
              if len(rows) != 1:
                  raise SystemExit(f'PROBE_CLEANUP=HOLD reason=unexpected_window_rows count={len(rows)}')
              row = dict(rows[0])
              if row['event_type'] != 'impression' or int(row['revenue_cents'] or 0) != 0:
                  raise SystemExit('PROBE_CLEANUP=HOLD reason=unexpected_event_shape')
              related = db.execute(
                  "SELECT COUNT(*) FROM events WHERE experiment_id=? AND visitor_id=? AND event_type<>'impression'",
                  (exp_id, row['visitor_id']),
              ).fetchone()[0]
              if related != 0:
                  raise SystemExit('PROBE_CLEANUP=HOLD reason=visitor_has_nonprobe_events')

              receipt = {
                  'schema': 'dominion-revenue-ledger-maintenance-v1',
                  'reason': 'remove_known_public_route_verification_impression',
                  'experiment_id': exp_id,
                  'deleted_event': row,
                  'window': {'start': start, 'end': end},
                  'synthetic_source_evidence': 'GitHub canary activation run 32929081710 public route verification after zero-metric assertion',
              }
              receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              receipt_path.chmod(0o600)
              db.execute('DELETE FROM events WHERE id=?', (row['id'],))
              db.commit()
              remaining = db.execute(
                  "SELECT COUNT(*) FROM events WHERE experiment_id=?",
                  (exp_id,),
              ).fetchone()[0]
              print(json.dumps({'PROBE_CLEANUP':'PASS','deleted_event_id':row['id'],'remaining_experiment_events':remaining}, sort_keys=True))
          PY

          runtime_root="$HOME/.dominion/autopilot/runtime"
          snapshot="$(cd "$runtime_root/scripts/autopilot" && "$buddy_python" revenue_workplane_supervisor.py --inspect-workplane)"
          printf '%s\n' "$snapshot"
          printf '%s' "$snapshot" | grep -q '"constraint": "QUALIFIED_TRAFFIC"'
          printf '%s' "$snapshot" | grep -q '"visitors": 0'
          printf '%s' "$snapshot" | grep -q '"clicks": 0'
          printf '%s' "$snapshot" | grep -q '"conversions": 0'
          printf '%s' "$snapshot" | grep -q '"revenue_cents": 0'

          test "$(systemctl is-active dominion-revenue-runtime.service)" = active
          test "$(systemctl is-active dominion-revenue-evaluator.timer)" = active
          test "$(systemctl is-active dominion-radah-autopilot.timer)" = active
          echo 'DOMINION_REVENUE_LEDGER=PASS synthetic_probe_removed=true real_constraint=QUALIFIED_TRAFFIC'
          REMOTE

      - name: Cleanup access material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
