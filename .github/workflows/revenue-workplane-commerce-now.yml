name: Dominion Revenue Authority Gate Diagnostic Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revenue-workplane-commerce-now.yml'

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: foundation-vm-production
    steps:
      - name: Require protected production access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" && test -n "$VM_USER" && test -n "$VM_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect live Buddy authority gate read-only
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          root="$HOME/buddy_core"
          test -d "$root"
          echo '=== LIVE BUDDY SERVICE ==='
          systemctl show dominion-buddy-web.service -p WorkingDirectory -p ExecStart --no-pager
          echo '=== AUTHORITY GATE LOCATIONS ==='
          grep -R -n -E 'CURRENT_AUTHORITY|L2_FIELD_NOT_CURRENT|L2_STALE|VOLTEDGE_STOREFRONT_LIVE' "$root" \
            --include='*.py' --include='*.json' --exclude-dir='__pycache__' | head -120 || true
          echo '=== REVENUE PREPARE REFERENCES ==='
          grep -R -n -E 'revenue\.prepare|current.authority|current_authority' "$root" \
            --include='*.py' --include='*.json' --exclude-dir='__pycache__' | head -160 || true
          echo '=== TARGET FILE HASHES ==='
          for f in "$root/core/operator.py" "$root/core/current_authority.py" "$root/config/capability_registry.json"; do
            if [ -f "$f" ]; then sha256sum "$f"; fi
          done
          echo 'BUDDY_REVENUE_AUTHORITY_DIAG=PASS'
          REMOTE

      - name: Cleanup access material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
