name: Dominion Revenue Work Plane Commerce Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revenue-workplane-commerce-now.yml'

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  commerce-now:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: foundation-vm-production
    steps:
      - name: Require protected production access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" && test -n "$VM_USER" && test -n "$VM_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Execute one bounded Commerce revenue mission
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          test "$(systemctl is-active dominion-radah-autopilot.timer)" = active
          test "$(systemctl is-active dominion-revenue-runtime.service)" = active
          test "$(systemctl is-active dominion-revenue-evaluator.timer)" = active

          runtime_root="$HOME/.dominion/autopilot/runtime"
          state_root="$HOME/.dominion/autopilot"
          buddy_exec="$(systemctl show dominion-buddy-web.service -p ExecStart --value)"
          buddy_python="$(printf '%s\n' "$buddy_exec" | sed -n 's/.*path=\([^ ;]*\).*/\1/p' | head -1)"
          test -x "$buddy_python"
          test -f "$runtime_root/scripts/autopilot/revenue_workplane_supervisor.py"

          before="$(find "$state_root/receipts" -maxdepth 1 -type f -name '*.json' 2>/dev/null | wc -l)"
          set +e
          output="$(cd "$runtime_root/scripts/autopilot" && RADAH_AUTOPILOT_ENABLED=1 "$buddy_python" revenue_workplane_supervisor.py --execute --lane commerce_fulfillment --state-dir "$state_root" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -eq 0
          printf '%s' "$output" | grep -q 'RADAH_AUTOPILOT=' 
          printf '%s' "$output" | grep -q 'lane=commerce_fulfillment'
          printf '%s' "$output" | grep -q 'bounded_cycle=true'
          printf '%s' "$output" | grep -q '"revenue_workplane"'
          printf '%s' "$output" | grep -q '"constraint": "QUALIFIED_TRAFFIC"'

          after="$(find "$state_root/receipts" -maxdepth 1 -type f -name '*.json' 2>/dev/null | wc -l)"
          test "$after" -gt "$before"
          latest="$(find "$state_root/receipts" -maxdepth 1 -type f -name '*.json' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -f "$latest"
          "$buddy_python" - "$latest" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); d=json.loads(p.read_text())
          assert d.get('lane') == 'commerce_fulfillment'
          assert d.get('status') in {'COMPLETE','HELD','BLOCKED'}
          assert 'revenue_workplane' in d
          if d.get('supervisor_error'):
              raise SystemExit('COMMERCE_MISSION=FAIL reason=supervisor_error')
          mission_id=d.get('mission_id')
          assert mission_id, 'mission_id missing'
          print(json.dumps({
              'COMMERCE_MISSION':'PASS',
              'status':d.get('status'),
              'mission_id':mission_id,
              'constraint':d['revenue_workplane'].get('constraint'),
              'receipt_count':len(d.get('receipts') or []),
              'held':d.get('held')
          }, sort_keys=True))
          PY
          echo 'DOMINION_REVENUE_COMMERCE_NOW=PASS'
          REMOTE

      - name: Cleanup access material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
