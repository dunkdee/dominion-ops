name: Dominion Revenue Authority Contract Diagnostic Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revenue-workplane-commerce-now.yml'

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: foundation-vm-production
    steps:
      - name: Require protected production access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" && test -n "$VM_USER" && test -n "$VM_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read exact live authority contract without mutation
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          root="$HOME/buddy_core"
          test -f "$root/core/radah_governance.py"
          test -f "$root/config/capability_registry.json"
          echo '=== REVENUE CAPABILITY LIVE JSON ==='
          python3 - "$root/config/capability_registry.json" <<'PY'
          import json,sys
          p=sys.argv[1]
          data=json.load(open(p,encoding='utf-8'))
          cap=next(c for c in data['capabilities'] if c.get('id')=='revenue.prepare')
          print(json.dumps(cap,indent=2,sort_keys=True))
          PY
          echo '=== L2 OBSERVATION MODEL ==='
          sed -n '400,465p' "$root/core/radah_governance.py"
          echo '=== REQUIRED FIELD VALIDATION ==='
          sed -n '570,625p' "$root/core/radah_governance.py"
          echo '=== AUTHORIZATION DECISION ==='
          sed -n '675,765p' "$root/core/radah_governance.py"
          echo '=== GOVERNANCE IMPORTS/CONSTANTS ==='
          sed -n '1,90p' "$root/core/radah_governance.py"
          echo '=== L2 VOLTEDGE REFRESH ==='
          sed -n '135,195p' "$root/core/layer2_refresh.py"
          echo '=== LIVE FILE HASHES ==='
          sha256sum "$root/core/radah_governance.py" "$root/core/layer2_refresh.py" "$root/config/capability_registry.json"
          echo 'BUDDY_REVENUE_AUTHORITY_CONTRACT_DIAG=PASS'
          REMOTE

      - name: Cleanup access material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
