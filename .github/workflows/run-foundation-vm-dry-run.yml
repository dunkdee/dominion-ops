name: Run Foundation VM Reconcile Dry Run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-foundation-vm-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: foundation-vm-reconcile-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: foundation-vm-production
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Require deployment secrets
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Prepare SSH
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transfer and run strict dry-run
        id: remote
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -uo pipefail
          remote_script="/tmp/dry-run-reconcile-foundation-vm-${GITHUB_RUN_ID}.sh"
          local_output="$RUNNER_TEMP/dry-run-reconcile-output.txt"

          scp -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            scripts/dry-run-reconcile-foundation-vm.sh \
            "$VM_USER@$VM_HOST:$remote_script"

          set +e
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$VM_USER@$VM_HOST" \
            "chmod 700 '$remote_script' && bash '$remote_script'; rc=\$?; rm -f '$remote_script'; exit \$rc" \
            2>&1 | tee "$local_output"
          rc=${PIPESTATUS[0]}
          set -e

          echo "exit_code=$rc" | tee -a "$local_output"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: Publish dry-run status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.remote.outputs.exit_code }}
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/dry-run-reconcile-output.txt"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          updated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          exit_code="${EXIT_CODE:-not-recorded}"
          summary="$(tail -n 100 "$output_file" 2>/dev/null || true)"
          overall="failure"
          if [ "$exit_code" = "0" ] && grep -q '^DRY RUN complete\. failures=0$' "$output_file"; then
            overall="success"
          fi

          python3 - "$overall" "$exit_code" "$run_url" "$updated_at" "$summary" > /tmp/dry-run-status.json <<'PY'
import json, sys
overall, exit_code, run_url, updated_at, summary = sys.argv[1:]
body = f"""# Foundation VM Dry-Run Status

- Overall: **{overall}**
- Exit code: `{exit_code}`
- Run: {run_url}
- Updated: `{updated_at}`

## Output tail

```text
{summary}
```
"""
print(json.dumps({"body": body}))
PY

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/78" \
            --data @/tmp/dry-run-status.json

      - name: Upload dry-run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-vm-dry-run-output
          path: ${{ runner.temp }}/dry-run-reconcile-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key"
