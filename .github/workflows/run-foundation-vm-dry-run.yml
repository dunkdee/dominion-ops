name: Run Foundation VM Reconcile Dry Run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-foundation-vm-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-vm-reconcile-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: foundation-vm-production
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Require deployment secrets
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Prepare SSH
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transfer and run strict dry-run
        id: remote
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -uo pipefail
          remote_script="/tmp/dry-run-reconcile-foundation-vm-${GITHUB_RUN_ID}.sh"
          local_output="$RUNNER_TEMP/dry-run-reconcile-output.txt"

          scp -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            scripts/dry-run-reconcile-foundation-vm.sh \
            "$VM_USER@$VM_HOST:$remote_script"

          set +e
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$VM_USER@$VM_HOST" \
            "chmod 700 '$remote_script' && bash '$remote_script'; rc=\$?; rm -f '$remote_script'; exit \$rc" \
            2>&1 | tee "$local_output"
          rc=${PIPESTATUS[0]}
          set -e

          echo "exit_code=$rc" | tee -a "$local_output"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: Upload dry-run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-vm-dry-run-output
          path: ${{ runner.temp }}/dry-run-reconcile-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key"

# Triggered by Dominion operator to execute the VM dry-run.
