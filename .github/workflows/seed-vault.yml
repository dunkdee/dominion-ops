name: Legacy Obsidian Vault Seeder — RETIRED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5

      - name: Verify governed Dominion Brain path
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/render_dominion_brain.py
          test -f scripts/deploy_dominion_brain_remote.sh
          test -f .github/workflows/dominion-brain-ci.yml
          test -f .github/workflows/publish-dominion-brain-production.yml
          echo "LEGACY_VAULT_SEEDER=RETIRED mutation=none"
          echo "CANONICAL_BRAIN_RENDERER=scripts/render_dominion_brain.py"
          echo "CANONICAL_BRAIN_PUBLISHER=.github/workflows/publish-dominion-brain-production.yml"

      - name: Enforce retired script guard
        shell: bash
        run: |
          set -euo pipefail
          output="$(python scripts/seed_vault.py 2>&1 || true)"
          printf '%s\n' "$output"
          grep -Fq 'LEGACY_VAULT_SEEDER=RETIRED' <<<"$output"
          echo "LEGACY_SEED_GUARD=PASS"
