name: Smart Deploy (RETIRED — use governed foundation VM deployment)

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Type RETIRED to confirm this legacy workflow remains disabled"
        required: true

permissions:
  contents: read

jobs:
  retired:
    if: ${{ github.event.inputs.acknowledge == 'RETIRED' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse legacy deployment path
        run: |
          echo "This workflow is retired because it automatically deployed every push, rewrote .env, force-recreated containers, and did not fail closed on health-check errors."
          echo "Use the governed Foundation VM deployment workflow instead."
          exit 1
