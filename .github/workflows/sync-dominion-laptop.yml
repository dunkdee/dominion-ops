name: Sync Dominion Laptop — Canonical Parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/sync_dominion_laptop.ps1'
      - 'scripts/quarantine_dominion_laptop_repo.ps1'
      - '.github/workflows/sync-dominion-laptop.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dominion-laptop-canonical-sync
  cancel-in-progress: false

jobs:
  validate-script:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Parse governed laptop scripts
        shell: pwsh
        run: |
          foreach ($path in @('scripts/sync_dominion_laptop.ps1','scripts/quarantine_dominion_laptop_repo.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
          Write-Host 'LAPTOP_PARITY_SCRIPTS_PARSE=PASS'

  build-canonical-brain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      brain_digest: ${{ steps.brain.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Render and verify canonical Brain
        id: brain
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/canonical-brain"
          target="$root/Dominion-Brain"
          python scripts/check_brain_inputs.py
          python scripts/render_dominion_brain.py "$target"
          digest="$(python - "$target/MANIFEST.json" <<'PY'
          import json,sys
          from pathlib import Path
          m=json.loads(Path(sys.argv[1]).read_text())
          assert m['schema']=='dominion-brain-manifest-v2'
          assert int(m['agent_count']) > 0
          d=m['source_revision']['sha256'].lower()
          assert len(d)==64 and all(c in '0123456789abcdef' for c in d)
          print(d)
          PY
          )"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "GITHUB_BRAIN_DIGEST=$digest"
      - uses: actions/upload-artifact@v4
        with:
          name: dominion-canonical-brain-${{ github.run_id }}
          path: ${{ runner.temp }}/canonical-brain/Dominion-Brain
          if-no-files-found: error
          retention-days: 1

  sync-canonical-laptop:
    if: github.event_name != 'pull_request'
    needs: [validate-script, build-canonical-brain]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    environment: dominion-laptop-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dominion-canonical-brain-${{ github.run_id }}
          path: ${{ runner.temp }}\dominion-canonical-brain
      - name: Verify workflow checkout and stage exact release inputs
        id: stage
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $expected = '${{ github.sha }}'.ToLowerInvariant()
          if ($actual -ne $expected) { throw "workflow checkout mismatch: $actual != $expected" }
          Write-Host "GITHUB_CANONICAL_SHA=$actual"
          Write-Host "GITHUB_BRAIN_DIGEST=${{ needs.build-canonical-brain.outputs.brain_digest }}"

          git update-ref refs/heads/dominion-release $expected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = Join-Path $env:RUNNER_TEMP ("dominion-laptop-{0}.bundle" -f $env:GITHUB_RUN_ID)
          git bundle create $bundle refs/heads/dominion-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git bundle verify $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $artifactRoot = Join-Path $env:RUNNER_TEMP 'dominion-canonical-brain'
          $manifest = Get-ChildItem -LiteralPath $artifactRoot -Filter MANIFEST.json -File -Recurse | Select-Object -First 1
          if (-not $manifest) { throw 'canonical Brain artifact manifest missing' }
          $brainRoot = $manifest.Directory.FullName
          "bundle=$bundle" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "brain_root=$brainRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Preserve laptop Git-visible drift locally
        shell: pwsh
        run: |
          & ./scripts/quarantine_dominion_laptop_repo.ps1 -RepoPath 'C:\Users\Dell\dominion-ops'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Synchronize canonical laptop repo and Obsidian brain
        shell: pwsh
        run: |
          & ./scripts/sync_dominion_laptop.ps1 `
            -ExpectedSha '${{ github.sha }}' `
            -ExpectedBrainDigest '${{ needs.build-canonical-brain.outputs.brain_digest }}' `
            -BundlePath '${{ steps.stage.outputs.bundle }}' `
            -BrainSourcePath '${{ steps.stage.outputs.brain_root }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'LAPTOP_PARITY=PASS'
      - name: Remove temporary release inputs
        if: always()
        shell: pwsh
        run: |
          $bundle = '${{ steps.stage.outputs.bundle }}'
          if ($bundle -and (Test-Path -LiteralPath $bundle)) { Remove-Item -LiteralPath $bundle -Force }
          $artifact = Join-Path $env:RUNNER_TEMP 'dominion-canonical-brain'
          if (Test-Path -LiteralPath $artifact) { Remove-Item -LiteralPath $artifact -Recurse -Force }
