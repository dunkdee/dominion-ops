name: Sync Dominion Laptop — Canonical Parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/sync_dominion_laptop.ps1'
      - '.github/workflows/sync-dominion-laptop.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dominion-laptop-canonical-sync
  cancel-in-progress: false

jobs:
  validate-script:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      brain_digest: ${{ steps.brain.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Parse governed laptop sync script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/sync_dominion_laptop.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'LAPTOP_SYNC_SCRIPT_PARSE=PASS'
      - name: Compute canonical GitHub brain digest
        id: brain
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('brain-' + [Guid]::NewGuid().ToString('N'))
          $target = Join-Path $root 'Dominion-Brain'
          python scripts/render_dominion_brain.py $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content -LiteralPath (Join-Path $target 'MANIFEST.json') -Raw | ConvertFrom-Json
          $digest = ([string]$manifest.source_revision.sha256).ToLowerInvariant()
          if ($digest -notmatch '^[0-9a-f]{64}$') { throw 'invalid canonical brain digest' }
          "digest=$digest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "GITHUB_BRAIN_DIGEST=$digest"

  sync-canonical-laptop:
    if: github.event_name != 'pull_request'
    needs: validate-script
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    environment: dominion-laptop-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify workflow checkout and build exact release bundle
        id: stage
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $expected = '${{ github.sha }}'.ToLowerInvariant()
          if ($actual -ne $expected) { throw "workflow checkout mismatch: $actual != $expected" }
          Write-Host "GITHUB_CANONICAL_SHA=$actual"
          Write-Host "GITHUB_BRAIN_DIGEST=${{ needs.validate-script.outputs.brain_digest }}"

          git update-ref refs/heads/dominion-release $expected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = Join-Path $env:RUNNER_TEMP ("dominion-laptop-{0}.bundle" -f $env:GITHUB_RUN_ID)
          git bundle create $bundle refs/heads/dominion-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git bundle verify $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "bundle=$bundle" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Synchronize canonical laptop repo and Obsidian brain
        shell: pwsh
        run: |
          & ./scripts/sync_dominion_laptop.ps1 `
            -ExpectedSha '${{ github.sha }}' `
            -ExpectedBrainDigest '${{ needs.validate-script.outputs.brain_digest }}' `
            -BundlePath '${{ steps.stage.outputs.bundle }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'LAPTOP_PARITY=PASS'
      - name: Remove temporary release bundle
        if: always()
        shell: pwsh
        run: |
          $bundle = '${{ steps.stage.outputs.bundle }}'
          if ($bundle -and (Test-Path -LiteralPath $bundle)) { Remove-Item -LiteralPath $bundle -Force }
