name: Dominion Canonical Parity — GitHub + VM + Laptop

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/sync_dominion_laptop.ps1'
      - 'scripts/quarantine_dominion_laptop_repo.ps1'
      - 'scripts/quarantine_vm_repo_state.sh'
      - 'scripts/render_dominion_brain.py'
      - 'scripts/check_brain_inputs.py'
      - 'brain/**'
      - 'agents/registry.json'
      - 'governance/**'
      - '.github/workflows/sync-dominion-laptop.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY CANONICAL PARITY"
        required: true
        type: string
      commit_sha:
        description: "Exact 40-character main commit SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dominion-canonical-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-scripts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Parse governed laptop scripts
        shell: powershell
        run: |
          foreach ($path in @('scripts/sync_dominion_laptop.ps1','scripts/quarantine_dominion_laptop_repo.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
          Write-Host 'LAPTOP_PARITY_SCRIPTS_PARSE=PASS'
      - name: Validate VM quarantine shell syntax
        shell: bash
        run: bash -n scripts/quarantine_vm_repo_state.sh

  build-canonical-brain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      brain_digest: ${{ steps.brain.outputs.digest }}
      agent_count: ${{ steps.brain.outputs.agent_count }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Render and verify canonical Brain
        id: brain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          root="$RUNNER_TEMP/canonical-brain"
          target="$root/Dominion-Brain"
          python scripts/check_brain_inputs.py
          python scripts/render_dominion_brain.py "$target"
          read -r digest agent_count <<EOF
          $(python - "$target/MANIFEST.json" <<'PY'
          import json,sys
          from pathlib import Path
          m=json.loads(Path(sys.argv[1]).read_text())
          assert m['schema']=='dominion-brain-manifest-v2'
          assert int(m['agent_count']) > 0
          assert isinstance(m.get('files'), list) and m['files']
          d=m['source_revision']['sha256'].lower()
          assert len(d)==64 and all(c in '0123456789abcdef' for c in d)
          print(d, int(m['agent_count']))
          PY
          )
          EOF
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "agent_count=$agent_count" >> "$GITHUB_OUTPUT"
          echo "GITHUB_BRAIN_DIGEST=$digest"
          echo "GITHUB_AGENT_COUNT=$agent_count"
      - uses: actions/upload-artifact@v7
        with:
          name: dominion-canonical-brain-${{ github.run_id }}
          path: ${{ runner.temp }}/canonical-brain/Dominion-Brain
          if-no-files-found: error
          retention-days: 1

  sync-canonical-laptop:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'APPLY CANONICAL PARITY' &&
      inputs.commit_sha == github.sha &&
      github.ref == 'refs/heads/main'
    needs: [validate-scripts, build-canonical-brain]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    environment: dominion-laptop-production
    outputs:
      git_sha: ${{ steps.receipt.outputs.git_sha }}
      brain_digest: ${{ steps.receipt.outputs.brain_digest }}
      agent_count: ${{ steps.receipt.outputs.agent_count }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dominion-canonical-brain-${{ github.run_id }}
          path: ${{ runner.temp }}\dominion-canonical-brain
      - name: Verify workflow checkout and stage exact release inputs
        id: stage
        shell: powershell
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $expected = '${{ github.sha }}'.ToLowerInvariant()
          if ($actual -ne $expected) { throw "workflow checkout mismatch: $actual != $expected" }
          Write-Host "GITHUB_CANONICAL_SHA=$actual"
          Write-Host "GITHUB_BRAIN_DIGEST=${{ needs.build-canonical-brain.outputs.brain_digest }}"

          git update-ref refs/heads/dominion-release $expected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = Join-Path $env:RUNNER_TEMP ("dominion-laptop-{0}-{1}.bundle" -f $env:GITHUB_RUN_ID,$env:GITHUB_RUN_ATTEMPT)
          git bundle create $bundle refs/heads/dominion-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git bundle verify $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $artifactRoot = Join-Path $env:RUNNER_TEMP 'dominion-canonical-brain'
          $manifest = Get-ChildItem -LiteralPath $artifactRoot -Filter MANIFEST.json -File -Recurse | Select-Object -First 1
          if (-not $manifest) { throw 'canonical Brain artifact manifest missing' }
          $brainRoot = $manifest.Directory.FullName
          "bundle=$bundle" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "brain_root=$brainRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Preserve laptop Git-visible drift locally
        shell: powershell
        run: |
          & ./scripts/quarantine_dominion_laptop_repo.ps1 -RepoPath 'C:\Users\Dell\dominion-ops'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Synchronize canonical laptop repo and Brain
        shell: powershell
        run: |
          & ./scripts/sync_dominion_laptop.ps1 `
            -ExpectedSha '${{ github.sha }}' `
            -ExpectedBrainDigest '${{ needs.build-canonical-brain.outputs.brain_digest }}' `
            -BundlePath '${{ steps.stage.outputs.bundle }}' `
            -BrainSourcePath '${{ steps.stage.outputs.brain_root }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'LAPTOP_SYNC_STAGE=PASS'
      - name: Read non-secret laptop parity receipt
        id: receipt
        shell: powershell
        run: |
          $path = 'C:\Users\Dell\Documents\Dominion Command Vault\Dominion-Release-State\laptop-latest.json'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'laptop parity receipt missing' }
          $receipt = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if ($receipt.schema -ne 'dominion-three-node-parity-v1') { throw 'laptop receipt schema mismatch' }
          $gitSha = ([string]$receipt.git_sha).ToLowerInvariant()
          $digest = ([string]$receipt.brain_source_digest).ToLowerInvariant()
          $agentCount = [int]$receipt.agent_count
          if ($gitSha -ne '${{ github.sha }}'.ToLowerInvariant()) { throw 'laptop receipt SHA mismatch' }
          if ($digest -ne '${{ needs.build-canonical-brain.outputs.brain_digest }}'.ToLowerInvariant()) { throw 'laptop receipt Brain digest mismatch' }
          if ($agentCount -ne [int]'${{ needs.build-canonical-brain.outputs.agent_count }}') { throw 'laptop receipt agent count mismatch' }
          "git_sha=$gitSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "brain_digest=$digest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "agent_count=$agentCount" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "LAPTOP_PARITY=PASS git_sha=$gitSha brain_digest=$digest agents=$agentCount"
      - name: Remove temporary release inputs
        if: always()
        shell: powershell
        run: |
          $bundle = '${{ steps.stage.outputs.bundle }}'
          if ($bundle -and (Test-Path -LiteralPath $bundle)) { Remove-Item -LiteralPath $bundle -Force }
          $artifact = Join-Path $env:RUNNER_TEMP 'dominion-canonical-brain'
          if (Test-Path -LiteralPath $artifact) { Remove-Item -LiteralPath $artifact -Recurse -Force }

  sync-canonical-vm-repo:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'APPLY CANONICAL PARITY' &&
      inputs.commit_sha == github.sha &&
      github.ref == 'refs/heads/main'
    needs: [validate-scripts, build-canonical-brain]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: foundation-vm-production
    outputs:
      git_sha: ${{ steps.remote.outputs.git_sha }}
      brain_digest: ${{ steps.remote.outputs.brain_digest }}
      agent_count: ${{ steps.remote.outputs.agent_count }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require protected VM connection
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
      - name: Stage exact Git bundle and drift-quarantine helper
        id: stage
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          bundle="$RUNNER_TEMP/dominion-parity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle"
          remote_bundle="/tmp/dominion-parity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle"
          git update-ref refs/heads/dominion-release "$GITHUB_SHA"
          git bundle create "$bundle" refs/heads/dominion-release
          git bundle verify "$bundle"
          scp -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$bundle" "$VM_USER@$VM_HOST:$remote_bundle"

          quarantine="$RUNNER_TEMP/quarantine-vm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          remote_quarantine="/tmp/quarantine-vm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          cp scripts/quarantine_vm_repo_state.sh "$quarantine"
          chmod 700 "$quarantine"
          scp -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$quarantine" "$VM_USER@$VM_HOST:$remote_quarantine"
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$VM_USER@$VM_HOST" "chmod 600 '$remote_bundle'; chmod 700 '$remote_quarantine'"
          echo "remote_bundle=$remote_bundle" >> "$GITHUB_OUTPUT"
          echo "remote_quarantine=$remote_quarantine" >> "$GITHUB_OUTPUT"
      - name: Synchronize VM repo and verify canonical Brain digest
        id: remote
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_BRAIN_DIGEST: ${{ needs.build-canonical-brain.outputs.brain_digest }}
          EXPECTED_AGENT_COUNT: ${{ needs.build-canonical-brain.outputs.agent_count }}
          REMOTE_BUNDLE: ${{ steps.stage.outputs.remote_bundle }}
          REMOTE_QUARANTINE: ${{ steps.stage.outputs.remote_quarantine }}
        run: |
          set -euo pipefail
          set +e
          result="$(ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 "$VM_USER@$VM_HOST" \
            "EXPECTED_SHA='$EXPECTED_SHA' EXPECTED_BRAIN_DIGEST='$EXPECTED_BRAIN_DIGEST' EXPECTED_AGENT_COUNT='$EXPECTED_AGENT_COUNT' BUNDLE='$REMOTE_BUNDLE' QUARANTINE='$REMOTE_QUARANTINE' RUN_ID='parity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' bash -s" 2>&1 <<'REMOTE'
          set -euo pipefail
          trap 'rm -f "$BUNDLE" "$QUARANTINE"; [ -z "${stage:-}" ] || rm -rf "$stage"' EXIT
          repo="$HOME/dominion-ops"
          test -d "$repo/.git" || { echo 'VM_PARITY=FAIL reason=repo_missing'; exit 1; }
          RUN_ID="$RUN_ID" DOMINION_REPO="$repo" bash "$QUARANTINE" || { echo 'VM_PARITY=FAIL reason=drift_quarantine'; exit 1; }
          cd "$repo" || { echo 'VM_PARITY=FAIL reason=repo_cd'; exit 1; }
          git fetch "$BUNDLE" dominion-release:refs/remotes/dominion-release/main >/dev/null 2>&1 || { echo 'VM_PARITY=FAIL reason=bundle_fetch'; exit 1; }
          git cat-file -e "${EXPECTED_SHA}^{commit}" || { echo 'VM_PARITY=FAIL reason=expected_commit_missing'; exit 1; }
          git checkout main >/dev/null 2>&1 || { echo 'VM_PARITY=FAIL reason=checkout_main'; exit 1; }
          git merge-base --is-ancestor HEAD "$EXPECTED_SHA" || { echo 'VM_PARITY=FAIL reason=non_fast_forward'; exit 1; }
          git merge --ff-only "$EXPECTED_SHA" >/dev/null 2>&1 || { echo 'VM_PARITY=FAIL reason=fast_forward'; exit 1; }
          actual_sha="$(git rev-parse HEAD)" || { echo 'VM_PARITY=FAIL reason=head_unreadable'; exit 1; }
          test "$actual_sha" = "$EXPECTED_SHA" || { echo 'VM_PARITY=FAIL reason=sha_mismatch'; exit 1; }
          test -z "$(git status --porcelain=v1 --untracked-files=no)" || { echo 'VM_PARITY=FAIL reason=post_sync_tracked_dirty'; exit 1; }

          python3 scripts/check_brain_inputs.py >/dev/null 2>&1 || { echo 'VM_PARITY=FAIL reason=brain_input_gate'; exit 1; }
          stage="$(mktemp -d /tmp/dominion-parity-brain.XXXXXX)" || { echo 'VM_PARITY=FAIL reason=brain_stage_create'; exit 1; }
          python3 scripts/render_dominion_brain.py "$stage/Dominion-Brain" >/dev/null 2>&1 || { echo 'VM_PARITY=FAIL reason=brain_render'; exit 1; }
          read -r digest agent_count <<EOF
          $(python3 - "$stage/Dominion-Brain/MANIFEST.json" <<'PY'
          import json,sys
          from pathlib import Path
          try:
              m=json.loads(Path(sys.argv[1]).read_text())
              assert m['schema']=='dominion-brain-manifest-v2'
              assert isinstance(m.get('files'), list) and m['files']
              digest=m['source_revision']['sha256'].lower()
              agents=int(m['agent_count'])
              assert len(digest)==64 and all(c in '0123456789abcdef' for c in digest)
              assert agents > 0
              print(digest, agents)
          except Exception:
              sys.exit(1)
          PY
          )
          EOF
          test -n "${digest:-}" && test -n "${agent_count:-}" || { echo 'VM_PARITY=FAIL reason=brain_manifest'; exit 1; }
          test "$digest" = "$EXPECTED_BRAIN_DIGEST" || { echo 'VM_PARITY=FAIL reason=brain_digest_mismatch'; exit 1; }
          test "$agent_count" = "$EXPECTED_AGENT_COUNT" || { echo 'VM_PARITY=FAIL reason=agent_count_mismatch'; exit 1; }
          printf 'VM_PARITY=PASS git_sha=%s brain_digest=%s agents=%s\n' "$actual_sha" "$digest" "$agent_count"
          REMOTE
          )"
          remote_rc=$?
          set -e
          printf '%s\n' "$result"
          if [ "$remote_rc" -ne 0 ]; then
            echo "VM_PARITY_REMOTE=FAIL rc=$remote_rc"
            exit "$remote_rc"
          fi
          git_sha="$(printf '%s\n' "$result" | sed -n 's/^VM_PARITY=PASS git_sha=\([0-9a-f]\{40\}\) brain_digest=.*/\1/p' | tail -1)"
          brain_digest="$(printf '%s\n' "$result" | sed -n 's/^VM_PARITY=PASS git_sha=[0-9a-f]\{40\} brain_digest=\([0-9a-f]\{64\}\) agents=.*/\1/p' | tail -1)"
          agent_count="$(printf '%s\n' "$result" | sed -n 's/^VM_PARITY=PASS .* agents=\([0-9][0-9]*\)$/\1/p' | tail -1)"
          test "$git_sha" = "$EXPECTED_SHA"
          test "$brain_digest" = "$EXPECTED_BRAIN_DIGEST"
          test "$agent_count" = "$EXPECTED_AGENT_COUNT"
          echo "git_sha=$git_sha" >> "$GITHUB_OUTPUT"
          echo "brain_digest=$brain_digest" >> "$GITHUB_OUTPUT"
          echo "agent_count=$agent_count" >> "$GITHUB_OUTPUT"
      - name: Remove temporary VM access material
        if: always()
        run: |
          rm -f "$HOME/.ssh/foundation_vm_key" "$RUNNER_TEMP"/dominion-parity-*.bundle "$RUNNER_TEMP"/quarantine-vm-*.sh

  verify-three-node-parity:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'APPLY CANONICAL PARITY' &&
      inputs.commit_sha == github.sha &&
      github.ref == 'refs/heads/main'
    needs: [build-canonical-brain, sync-canonical-laptop, sync-canonical-vm-repo]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require exact Git and Brain parity
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_DIGEST: ${{ needs.build-canonical-brain.outputs.brain_digest }}
          EXPECTED_AGENTS: ${{ needs.build-canonical-brain.outputs.agent_count }}
          LAPTOP_SHA: ${{ needs.sync-canonical-laptop.outputs.git_sha }}
          LAPTOP_DIGEST: ${{ needs.sync-canonical-laptop.outputs.brain_digest }}
          LAPTOP_AGENTS: ${{ needs.sync-canonical-laptop.outputs.agent_count }}
          VM_SHA: ${{ needs.sync-canonical-vm-repo.outputs.git_sha }}
          VM_DIGEST: ${{ needs.sync-canonical-vm-repo.outputs.brain_digest }}
          VM_AGENTS: ${{ needs.sync-canonical-vm-repo.outputs.agent_count }}
        run: |
          set -euo pipefail
          test "$LAPTOP_SHA" = "$EXPECTED_SHA"
          test "$VM_SHA" = "$EXPECTED_SHA"
          test "$LAPTOP_DIGEST" = "$EXPECTED_DIGEST"
          test "$VM_DIGEST" = "$EXPECTED_DIGEST"
          test "$LAPTOP_AGENTS" = "$EXPECTED_AGENTS"
          test "$VM_AGENTS" = "$EXPECTED_AGENTS"
          echo "THREE_NODE_PARITY=PASS github_sha=$EXPECTED_SHA vm_sha=$VM_SHA laptop_sha=$LAPTOP_SHA brain_digest=$EXPECTED_DIGEST agents=$EXPECTED_AGENTS"
