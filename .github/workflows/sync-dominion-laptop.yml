name: Dominion Provenance Repair 145 Collector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-dominion-laptop.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: Type exactly COLLECT_PROVENANCE_145
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: dominion-provenance-repair-145-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-run-pointer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record governed run URL on issue 145
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="Provenance repair collector run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (source \`${GITHUB_SHA}\`; read-only collection; no deployment)."
          BODY="$body" python3 - <<'PY' > "$RUNNER_TEMP/comment.json"
          import json,os
          print(json.dumps({'body':os.environ['BODY']}))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/145/comments" \
            --data @"$RUNNER_TEMP/comment.json" >/dev/null

  collect-laptop-source:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'COLLECT_PROVENANCE_145' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    environment: dominion-laptop-production
    steps:
      - name: Collect allowlisted source and scan for secrets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $archive = 'C:\Users\Dell\Dominion-Archive\foundation-vm\2026-07-30\dominion-strategizer-source.tar.gz'
          $voltEdgeRoot = 'C:\Users\Dell\buddy_core\voltedge'
          $stage = Join-Path $env:RUNNER_TEMP ("dominion-provenance-145-{0}-{1}" -f $env:GITHUB_RUN_ID,$env:GITHUB_RUN_ATTEMPT)
          $payload = Join-Path $stage 'payload'
          $raw = Join-Path $stage 'strategizer-raw'
          New-Item -ItemType Directory -Path $payload,$raw -Force | Out-Null
          "stage=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $archiveAccess = 'UNKNOWN'
          $archiveHash = ''
          $archiveBytes = 0
          $members = @()
          $allowedArchiveFiles = @()
          try {
            if (Test-Path -LiteralPath $archive -PathType Leaf) {
              $archiveAccess = 'PASS'
            } else {
              $archiveAccess = 'MISSING'
            }
          } catch [System.UnauthorizedAccessException] {
            $archiveAccess = 'BLOCKED_ACL'
            Write-Host 'STRATEGIZER_LAPTOP_ARCHIVE=BLOCKED_ACL'
          }
          if (-not (Test-Path -LiteralPath $voltEdgeRoot -PathType Container)) { throw 'VoltEdge governed source root missing' }

          $expectedVoltEdge = [ordered]@{
            've_constants.py' = '56e713fb1c9cadcd4615a6896343c488b07ba3aee8aeb9466d0818aba8899f7d'
            've_content_engine.py' = '41f0037fd986ef7e0b0cf71f272a7e3ad10df56f0718dbf19df06d4e0444f636'
            've_orchestrator.py' = '40b6a960d8f388a1f92e03bdcd7aff25127703e10c5cfce0f63d27f24f50ee06'
            've_product_catalog.py' = '269a9e45e82a47191b222ac6db8f65eead2d6d6cf9f2a86e17188820123a3ef2'
            've_seo_blog_engine.py' = 'e199906bc81d4e13075714f951930dba13fabf10cd3c2a8e6b75944532955096'
            've_shopping_feed.py' = '21f0bbc6af2406d14cd98676a1f1fbfad0eb0324b0a823cbdf394033049f8a8b'
            've_social_distributor.py' = '9c986cae0397f2fc0334a85bb1372f0b5685b48f94ac1238b017e4aebd52d202'
          }

          $voltDest = Join-Path $payload 'application\voltedge'
          New-Item -ItemType Directory -Path $voltDest -Force | Out-Null
          $voltEvidence = @()
          foreach ($name in $expectedVoltEdge.Keys) {
            $source = Join-Path $voltEdgeRoot $name
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Missing allowlisted VoltEdge file: $name" }
            $actual = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expectedVoltEdge[$name]) { throw "VoltEdge hash mismatch: $name" }
            Copy-Item -LiteralPath $source -Destination (Join-Path $voltDest $name)
            $voltEvidence += [ordered]@{ path = "application/voltedge/$name"; sha256 = $actual; classification = 'EXPERIMENTAL' }
          }

          if ($archiveAccess -eq 'PASS') {
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $archiveBytes = (Get-Item -LiteralPath $archive).Length
          $memberList = Join-Path $stage 'archive-members.txt'
          & tar.exe -tf $archive | Out-File -LiteralPath $memberList -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Strategizer archive list failed' }
          $members = @(Get-Content -LiteralPath $memberList)
          if ($members.Count -eq 0) { throw 'Strategizer archive is empty' }
          $unsafeMember = $members | Where-Object { $_ -match '(^/|^[A-Za-z]:|(^|[\\/])\.\.([\\/]|$))' } | Select-Object -First 1
          if ($unsafeMember) { throw 'Strategizer archive path traversal or absolute member detected' }
          & tar.exe -xf $archive -C $raw
          if ($LASTEXITCODE -ne 0) { throw 'Strategizer archive extraction failed' }

          $allArchiveFiles = @(Get-ChildItem -LiteralPath $raw -Recurse -File -Force)
          $unsafeNamePattern = '(?i)(^|[\\/])\.env($|\.)|\.(pem|key|p12|pfx)$|credential|secret|token|oauth|cookie|session'
          $unsafeNames = @($allArchiveFiles | Where-Object { $_.FullName -match $unsafeNamePattern })
          if ($unsafeNames.Count -gt 0) {
            $unsafeNames | ForEach-Object { Write-Host ("SECRET_SCAN_BLOCKED_PATH=" + $_.Name) }
            throw "Secret-sensitive filenames detected: $($unsafeNames.Count)"
          }

          $allowedExtensions = @('.py','.js','.ts','.tsx','.jsx','.json','.yaml','.yml','.toml','.ini','.cfg','.md','.txt','.html','.css','.sh','.ps1')
          $allowedNames = @('Dockerfile','requirements.txt','pyproject.toml','package.json','package-lock.json','.gitignore','.dockerignore')
          $allowedArchiveFiles = @($allArchiveFiles | Where-Object {
            ($allowedExtensions -contains $_.Extension.ToLowerInvariant()) -or ($allowedNames -contains $_.Name)
          })
          if ($allowedArchiveFiles.Count -eq 0) { throw 'No allowlisted Strategizer source files found' }

          $strategizerDest = Join-Path $payload 'application\strategizer'
          New-Item -ItemType Directory -Path $strategizerDest -Force | Out-Null
          foreach ($file in $allowedArchiveFiles) {
            $relative = $file.FullName.Substring($raw.Length).TrimStart([char[]]@('\','/'))
            $destination = Join-Path $strategizerDest $relative
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $destination
          }
          }

          $secretRules = @(
            [ordered]@{ name='private_key'; regex='-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----' },
            [ordered]@{ name='aws_access_key'; regex='(?:AKIA|ASIA)[0-9A-Z]{16}' },
            [ordered]@{ name='github_token'; regex='gh[pousr]_[A-Za-z0-9_]{20,}' },
            [ordered]@{ name='google_api_key'; regex='AIza[0-9A-Za-z_\-]{30,}' },
            [ordered]@{ name='stripe_secret'; regex='sk_(?:live|test)_[0-9A-Za-z]{16,}' },
            [ordered]@{ name='slack_token'; regex='xox[baprs]-[0-9A-Za-z-]{10,}' },
            [ordered]@{ name='openai_key'; regex='sk-(?:proj-)?[0-9A-Za-z_\-]{20,}' },
            [ordered]@{ name='jwt'; regex='eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}' },
            [ordered]@{ name='hardcoded_secret_assignment'; regex='(?i)(api[_-]?key|client[_-]?secret|password|passwd|access[_-]?token|refresh[_-]?token)\s*[:=]\s*["''][^"'']{16,}["'']' }
          )
          $scanFindings = @()
          $scanFiles = @(Get-ChildItem -LiteralPath (Join-Path $payload 'application') -Recurse -File -Force)
          foreach ($file in $scanFiles) {
            $text = [IO.File]::ReadAllText($file.FullName)
            foreach ($rule in $secretRules) {
              if ([regex]::IsMatch($text, $rule.regex)) {
                $relative = $file.FullName.Substring($payload.Length).TrimStart([char[]]@('\','/')) -replace '\\','/'
                $scanFindings += [ordered]@{ path=$relative; rule=$rule.name }
              }
            }
          }
          if ($scanFindings.Count -gt 0) {
            $scanFindings | ForEach-Object { Write-Host ("SECRET_SCAN_BLOCKED_FILE={0} RULE={1}" -f $_.path,$_.rule) }
            throw "Secret scan findings detected: $($scanFindings.Count)"
          }

          $fileHashes = @()
          foreach ($file in (Get-ChildItem -LiteralPath (Join-Path $payload 'application') -Recurse -File -Force | Sort-Object FullName)) {
            $relative = $file.FullName.Substring($payload.Length).TrimStart([char[]]@('\','/')) -replace '\\','/'
            $fileHashes += [ordered]@{
              path = $relative
              bytes = $file.Length
              sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }

          $provenanceDir = Join-Path $payload 'provenance'
          New-Item -ItemType Directory -Path $provenanceDir -Force | Out-Null
          $manifest = [ordered]@{
            schema = 'dominion-provenance-repair-145-laptop-v1'
            generated_at_utc = [DateTime]::UtcNow.ToString('o')
            mode = 'read_only_source_collection'
            source_mutation = $false
            archive = [ordered]@{
              restore_path = $archive
              access_status = $archiveAccess
              sha256 = $archiveHash
              bytes = $archiveBytes
              member_count = $members.Count
              allowlisted_file_count = $allowedArchiveFiles.Count
            }
            voltedge = $voltEvidence
            secret_scan = [ordered]@{
              status = 'PASS'
              scanned_files = $scanFiles.Count
              findings = 0
              rule_names = @($secretRules | ForEach-Object { $_.name })
            }
            files = $fileHashes
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $provenanceDir 'laptop-source-manifest.json') -Encoding utf8
          Write-Host ("PROVENANCE_LAPTOP=PASS archive_sha256={0} archive_bytes={1} files={2} secret_findings=0" -f $archiveHash,$archiveBytes,$fileHashes.Count)

      - name: Upload secret-scanned source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dominion-provenance-145-laptop-${{ github.run_id }}
          path: ${{ env.stage }}\payload
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          compression-level: 9

      - name: Remove temporary laptop staging
        if: always()
        shell: powershell
        run: |
          $stage = '${{ env.stage }}'
          if ($stage -and (Test-Path -LiteralPath $stage)) { Remove-Item -LiteralPath $stage -Recurse -Force }

  collect-deployed-strategizer-source:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'COLLECT_PROVENANCE_145' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: foundation-vm-production
    steps:
      - name: Recover exact Cloud Run build source and scan for secrets
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          stage="$RUNNER_TEMP/dominion-deployed-source-145-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -m 700 -d "$stage"
          echo "deployed_source_stage=$stage" >> "$GITHUB_ENV"
          remote_zip="/tmp/dominion-strategizer-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          source_zip="$stage/deployed-source.zip"
          metadata="$stage/runtime-source-metadata.json"

          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$VM_USER@$VM_HOST" "REMOTE_ZIP='$remote_zip' bash -se" > "$metadata" <<'REMOTE'
          set -euo pipefail
          project='dominion-ascendant'
          region='us-central1'
          service='dominion-strategizer'
          service_json="$(mktemp)"
          revision_json="$(mktemp)"
          trap 'rm -f "$service_json" "$revision_json"' EXIT
          chmod 600 "$service_json" "$revision_json"
          gcloud run services describe "$service" --project "$project" --region "$region" --format=json > "$service_json"
          read -r revision source_uri <<EOF
          $(python3 - "$service_json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          revision=d.get('status',{}).get('latestReadyRevisionName','')
          raw=d.get('metadata',{}).get('annotations',{}).get('run.googleapis.com/build-source-location','')
          locations=json.loads(raw)
          if len(locations)!=1:
              raise SystemExit('expected exactly one Cloud Run build source location')
          print(revision, next(iter(locations.values())))
          PY
          )
          EOF
          test -n "$revision"
          test -n "$source_uri"
          gcloud run revisions describe "$revision" --project "$project" --region "$region" --format=json > "$revision_json"
          gcloud storage cp "$source_uri" "$REMOTE_ZIP" >/dev/null
          chmod 600 "$REMOTE_ZIP"
          python3 - "$service_json" "$revision_json" "$REMOTE_ZIP" <<'PY'
          import datetime,hashlib,json,os,sys
          service=json.load(open(sys.argv[1],encoding='utf-8'))
          revision=json.load(open(sys.argv[2],encoding='utf-8'))
          archive=sys.argv[3]
          annotations=service.get('metadata',{}).get('annotations',{})
          locations=json.loads(annotations['run.googleapis.com/build-source-location'])
          source_uri=next(iter(locations.values()))
          containers=revision.get('spec',{}).get('containers') or []
          image=containers[0].get('image','') if containers else ''
          h=hashlib.sha256()
          with open(archive,'rb') as f:
              for chunk in iter(lambda:f.read(1024*1024),b''):
                  h.update(chunk)
          out={
              'schema':'dominion-provenance-repair-145-deployed-source-v1',
              'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'project':'dominion-ascendant',
              'region':'us-central1',
              'service':'dominion-strategizer',
              'latest_ready_revision':service.get('status',{}).get('latestReadyRevisionName',''),
              'image':image,
              'image_digest':revision.get('status',{}).get('imageDigest',''),
              'build_id':annotations.get('run.googleapis.com/build-id',''),
              'build_name':annotations.get('run.googleapis.com/build-name',''),
              'source_location':source_uri,
              'source_archive_sha256':h.hexdigest(),
              'source_archive_bytes':os.path.getsize(archive),
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          REMOTE

          scp -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$VM_USER@$VM_HOST:$remote_zip" "$source_zip"
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$VM_USER@$VM_HOST" "rm -f -- '$remote_zip'"

          python3 - "$source_zip" "$metadata" "$stage" <<'PY'
          import hashlib,json,re,shutil,sys,zipfile
          from pathlib import Path,PurePosixPath

          archive=Path(sys.argv[1])
          metadata_path=Path(sys.argv[2])
          stage=Path(sys.argv[3])
          metadata=json.loads(metadata_path.read_text(encoding='utf-8'))
          actual=hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != metadata['source_archive_sha256']:
              raise SystemExit('deployed source archive hash mismatch after transfer')
          if archive.stat().st_size != metadata['source_archive_bytes']:
              raise SystemExit('deployed source archive byte mismatch after transfer')

          raw=stage/'raw'
          payload=stage/'payload'
          dest=payload/'application'/'strategizer'
          raw.mkdir(parents=True,exist_ok=True)
          dest.mkdir(parents=True,exist_ok=True)
          allowed_ext={'.py','.js','.ts','.tsx','.jsx','.json','.yaml','.yml','.toml','.ini','.cfg','.md','.txt','.html','.css','.sh','.ps1'}
          allowed_names={'Dockerfile','requirements.txt','pyproject.toml','package.json','package-lock.json','.gitignore','.dockerignore'}
          blocked_name=re.compile(r'(?i)(^|/)\.env($|\.)|\.(pem|key|p12|pfx)$|(^|/)(credentials|secrets?|tokens?|cookies?|sessions?)\.(json|ya?ml|txt)$')
          rules={
              'private_key':re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'aws_access_key':re.compile(r'(?:AKIA|ASIA)[0-9A-Z]{16}'),
              'github_token':re.compile(r'gh[pousr]_[A-Za-z0-9_]{20,}'),
              'google_api_key':re.compile(r'AIza[0-9A-Za-z_-]{30,}'),
              'stripe_secret':re.compile(r'sk_(?:live|test)_[0-9A-Za-z]{16,}'),
              'slack_token':re.compile(r'xox[baprs]-[0-9A-Za-z-]{10,}'),
              'openai_key':re.compile(r'sk-(?:proj-)?[0-9A-Za-z_-]{20,}'),
              'jwt':re.compile(r'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'),
              'hardcoded_secret_assignment':re.compile(r'''(?i)(api[_-]?key|client[_-]?secret|password|passwd|access[_-]?token|refresh[_-]?token)\s*[:=]\s*["'][^"']{16,}["']'''),
          }
          selected=[]
          findings=[]
          total_uncompressed=0
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  if info.flag_bits & 1:
                      raise SystemExit('encrypted source archive member detected')
                  p=PurePosixPath(info.filename.replace('\\','/'))
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit('source archive path traversal detected')
                  rel=p.as_posix().lstrip('./')
                  if not rel or any(x in p.parts for x in ('.git','.venv','venv','node_modules','__pycache__','__MACOSX')):
                      continue
                  if blocked_name.search(rel):
                      findings.append((rel,'blocked_filename'))
                      continue
                  if p.suffix.lower() not in allowed_ext and p.name not in allowed_names:
                      continue
                  total_uncompressed += info.file_size
                  if info.file_size > 20*1024*1024 or total_uncompressed > 100*1024*1024:
                      raise SystemExit('deployed source archive exceeds bounded extraction limit')
                  data=z.read(info)
                  try:
                      text=data.decode('utf-8')
                  except UnicodeDecodeError:
                      findings.append((rel,'non_utf8_source'))
                      continue
                  for name,rule in rules.items():
                      if rule.search(text):
                          findings.append((rel,name))
                  selected.append((p,data))
          if findings:
              for path,rule in findings:
                  print(f'SECRET_SCAN_BLOCKED_FILE={path} RULE={rule}')
              raise SystemExit(f'secret scan findings detected: {len(findings)}')
          if not selected:
              raise SystemExit('no allowlisted deployed source files found')

          prefixes={p.parts[0] for p,_ in selected if len(p.parts)>1}
          strip_prefix=next(iter(prefixes)) if len(prefixes)==1 and all(len(p.parts)>1 for p,_ in selected) else None
          file_records=[]
          for p,data in selected:
              parts=p.parts[1:] if strip_prefix and p.parts[0]==strip_prefix else p.parts
              rel=PurePosixPath(*parts)
              target=dest.joinpath(*rel.parts)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
              file_records.append({
                  'path':(PurePosixPath('application/strategizer')/rel).as_posix(),
                  'bytes':len(data),
                  'sha256':hashlib.sha256(data).hexdigest(),
              })
          metadata['secret_scan']={
              'status':'PASS',
              'scanned_files':len(selected),
              'findings':0,
              'rule_names':sorted(rules),
          }
          metadata['files']=sorted(file_records,key=lambda x:x['path'])
          provenance=payload/'provenance'
          provenance.mkdir(parents=True,exist_ok=True)
          (provenance/'deployed-source-manifest.json').write_text(json.dumps(metadata,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('DEPLOYED_SOURCE=PASS files=%d source_sha256=%s secret_findings=0' % (len(selected),actual))
          PY

      - name: Upload exact secret-scanned deployed source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dominion-provenance-145-deployed-source-${{ github.run_id }}
          path: ${{ env.deployed_source_stage }}/payload
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          compression-level: 9

      - name: Remove temporary deployed-source material
        if: always()
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set +e
          remote_zip="/tmp/dominion-strategizer-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          if [ -f "$HOME/.ssh/foundation_vm_key" ]; then
            ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" "rm -f -- '$remote_zip'" >/dev/null 2>&1
          fi
          rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
          stage='${{ env.deployed_source_stage }}'
          if [ -n "$stage" ] && [ -d "$stage" ]; then rm -rf -- "$stage"; fi

  collect-runtime-provenance:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'COLLECT_PROVENANCE_145' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: foundation-vm-production
    steps:
      - name: Collect allowlisted Cloud Run runtime identity
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          stage="$RUNNER_TEMP/dominion-provenance-145-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -m 700 -d "$stage"
          echo "stage=$stage" >> "$GITHUB_ENV"
          output="$stage/runtime-provenance.json"

          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$VM_USER@$VM_HOST" 'bash -se' > "$output" <<'REMOTE'
          set -euo pipefail
          project='dominion-ascendant'
          region='us-central1'
          service='dominion-strategizer'
          service_json="$(mktemp)"
          revision_json="$(mktemp)"
          token_file="$(mktemp)"
          trap 'rm -f "$service_json" "$revision_json" "$token_file"' EXIT
          chmod 600 "$service_json" "$revision_json" "$token_file"

          gcloud run services describe "$service" --project "$project" --region "$region" --format=json > "$service_json"
          read -r revision url <<EOF
          $(python3 - "$service_json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1], encoding='utf-8'))
          print(d.get('status',{}).get('latestReadyRevisionName',''), d.get('status',{}).get('url',''))
          PY
          )
          EOF
          test -n "$revision"
          test -n "$url"
          gcloud run revisions describe "$revision" --project "$project" --region "$region" --format=json > "$revision_json"

          public_code="$(curl --max-time 12 --silent --show-error --output /dev/null --write-out '%{http_code}' "$url" || true)"
          auth_code='not_attempted'
          if ! printf '%s' "$public_code" | grep -Eq '^(2|3)[0-9][0-9]$'; then
            if gcloud auth print-identity-token > "$token_file" 2>/dev/null && test -s "$token_file"; then
              auth_code="$(curl --max-time 12 --silent --show-error --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $(cat "$token_file")" "$url" || true)"
              : > "$token_file"
            fi
          fi

          PUBLIC_CODE="$public_code" AUTH_CODE="$auth_code" PROJECT="$project" REGION="$region" SERVICE="$service" \
          python3 - "$service_json" "$revision_json" <<'PY'
          import datetime,json,os,sys
          service=json.load(open(sys.argv[1], encoding='utf-8'))
          revision=json.load(open(sys.argv[2], encoding='utf-8'))
          sm=service.get('metadata',{})
          ss=service.get('spec',{}).get('template',{}).get('spec',{})
          st=service.get('status',{})
          rm=revision.get('metadata',{})
          rs=revision.get('spec',{})
          rst=revision.get('status',{})
          containers=rs.get('containers') or ss.get('containers') or []
          image=containers[0].get('image','') if containers else ''
          hints={}
          for source in (sm.get('labels',{}),sm.get('annotations',{}),rm.get('labels',{}),rm.get('annotations',{})):
              for k,v in source.items():
                  low=k.lower()
                  if any(term in low for term in ('source','commit','build','revision','sha')) and 'secret' not in low and 'token' not in low:
                      hints[k]=v
          public=os.environ.get('PUBLIC_CODE','000')
          auth=os.environ.get('AUTH_CODE','not_attempted')
          healthy=any(code[:1] in ('2','3') for code in (public,auth) if len(code)==3)
          reachable=any(code not in ('000','not_attempted','') for code in (public,auth))
          result='HEALTHY' if healthy else ('REACHABLE_RESTRICTED_OR_UNHEALTHY' if reachable else 'UNREACHABLE')
          out={
              'schema':'dominion-provenance-repair-145-runtime-v1',
              'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'mode':'read_only_runtime_collection',
              'runtime_mutation':False,
              'project':os.environ['PROJECT'],
              'region':os.environ['REGION'],
              'service':os.environ['SERVICE'],
              'url':st.get('url',''),
              'latest_ready_revision':st.get('latestReadyRevisionName',''),
              'image':image,
              'image_digest':rst.get('imageDigest',''),
              'service_account':rs.get('serviceAccountName') or ss.get('serviceAccountName',''),
              'ingress':sm.get('annotations',{}).get('run.googleapis.com/ingress',''),
              'health':{
                  'result':result,
                  'unauthenticated_http_code':public,
                  'authenticated_http_code':auth,
              },
              'source_mapping_hints':hints,
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          REMOTE

          python3 -m json.tool "$output" >/dev/null
          chmod 600 "$output"
          python3 - "$output" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          required=('service','region','url','latest_ready_revision','image','service_account','health')
          missing=[k for k in required if not d.get(k)]
          if missing: raise SystemExit('missing runtime fields: '+','.join(missing))
          print('PROVENANCE_RUNTIME=PASS service=%s revision=%s health=%s' % (d['service'],d['latest_ready_revision'],d['health']['result']))
          PY

      - name: Upload sanitized runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dominion-provenance-145-runtime-${{ github.run_id }}
          path: ${{ env.stage }}/runtime-provenance.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Remove temporary VM access material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
          stage='${{ env.stage }}'
          if [ -n "$stage" ] && [ -d "$stage" ]; then rm -rf -- "$stage"; fi
