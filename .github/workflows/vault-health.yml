name: Vault Health Check

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN VAULT DOCTOR"
        required: true
        type: string
      commit_sha:
        description: "Exact 40-character main commit SHA"
        required: true
        type: string

jobs:
  doctor:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'RUN VAULT DOCTOR' &&
      inputs.commit_sha == github.sha &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Run vault doctor on VM
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/dominion-ops

            # Install deps if needed
            pip3 install --quiet python-frontmatter 2>/dev/null || \
              pip install --quiet python-frontmatter 2>/dev/null || true

            python3 apps/vault/doctor.py && echo "✅ Vault healthy" || echo "⚠️ Vault has issues — check _health/ folder"
