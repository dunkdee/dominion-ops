name: Vault and n8n Fix (RETIRED)

# This one-time direct-SSH repair is intentionally retired. Runtime changes must
# use the governed, exact-SHA Foundation VM release path.

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Type RETIRED to acknowledge this workflow is disabled"
        required: true
        type: string

permissions:
  contents: read

jobs:
  retired:
    if: ${{ inputs.acknowledge == 'RETIRED' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm governed replacement
        run: |
          echo "This legacy repair is retired."
          echo "Use the governed exact-SHA repair or Foundation VM deployment workflow."
