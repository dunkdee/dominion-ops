name: Dominion Video Studio Caddy Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/video-studio/Caddyfile.example"
      - "apps/video-studio/scripts/caddy-candidate-preflight.sh"
      - ".github/workflows/video-studio-caddy-candidate.yml"

permissions:
  contents: read

concurrency:
  group: dominion-video-studio-caddy-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.actor == 'dunkdee' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/video-studio-five-council-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve candidate identity
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure verified SSH access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy staged candidate script
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "rm -rf releases/video-studio-caddy-candidate/$RELEASE_SHA && mkdir -p releases/video-studio-caddy-candidate/$RELEASE_SHA"
          scp -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            apps/video-studio/scripts/caddy-candidate-preflight.sh \
            "$VM_USER@$VM_HOST:releases/video-studio-caddy-candidate/$RELEASE_SHA/preflight.sh"

      - name: Validate route insertion and authentication canary
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" "RELEASE_SHA=$RELEASE_SHA bash -se" <<'REMOTE'
          set -euo pipefail
          script="$HOME/releases/video-studio-caddy-candidate/$RELEASE_SHA/preflight.sh"
          test -f "$script"
          chmod 700 "$script"
          RELEASE_SHA="$RELEASE_SHA" "$script"
          REMOTE

      - name: Retrieve sanitized candidate evidence
        if: always()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST:releases/video-studio-caddy-candidate/$RELEASE_SHA/caddy-candidate-report.txt" \
            /tmp/caddy-candidate-report.txt || true
          test -f /tmp/caddy-candidate-report.txt || \
            printf 'release_sha=%s\nresult=failed_before_evidence_completion\n' "$RELEASE_SHA" > /tmp/caddy-candidate-report.txt

      - name: Upload private sanitized evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: video-studio-caddy-candidate-${{ steps.source.outputs.short }}
          path: /tmp/caddy-candidate-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish result
        if: always()
        run: cat /tmp/caddy-candidate-report.txt >> "$GITHUB_STEP_SUMMARY"
