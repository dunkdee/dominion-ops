name: Dominion Video Studio CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/video-studio/**"
      - ".github/workflows/video-studio-ci.yml"
      - ".github/workflows/video-studio-deploy.yml"
  pull_request:
    paths:
      - "apps/video-studio/**"
      - ".github/workflows/video-studio-ci.yml"
      - ".github/workflows/video-studio-deploy.yml"

permissions:
  contents: read

concurrency:
  group: video-studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            apps/video-studio/requirements-dev.txt
            apps/video-studio/worker/requirements-lite.txt

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r apps/video-studio/requirements-dev.txt
          python -m pip install --disable-pip-version-check -r apps/video-studio/worker/requirements-lite.txt

      - name: Compile Python sources
        run: python -m compileall -q apps/video-studio

      - name: Run API and CPU-worker regression tests
        run: python -m pytest -q apps/video-studio/tests

      - name: Validate deployment shell
        run: bash -n apps/video-studio/deploy-gcp-vm.sh

      - name: Validate Compose contract
        working-directory: apps/video-studio
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build hardened control-plane image
        run: docker build --tag dominion/video-studio:ci apps/video-studio

      - name: Build Dominion Lite CPU worker image
        run: docker build --file apps/video-studio/worker/Dockerfile.lite --tag dominion/video-studio-lite:ci apps/video-studio
