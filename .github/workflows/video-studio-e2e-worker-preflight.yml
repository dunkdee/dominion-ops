name: Dominion Video Studio End-to-End Worker Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/video-studio/**"
      - ".github/workflows/video-studio-e2e-worker-preflight.yml"

permissions:
  contents: read

concurrency:
  group: dominion-video-studio-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    if: >-
      github.actor == 'dunkdee' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'agent/video-studio-')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Resolve candidate identity
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure verified SSH access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy candidate to foundation VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          tar -czf /tmp/video-studio-e2e.tgz apps/video-studio
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "rm -rf releases/video-studio-e2e/$RELEASE_SHA && mkdir -p releases/video-studio-e2e/$RELEASE_SHA"
          scp -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            /tmp/video-studio-e2e.tgz \
            "$VM_USER@$VM_HOST:releases/video-studio-e2e/$RELEASE_SHA/release.tgz"
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "tar -xzf releases/video-studio-e2e/$RELEASE_SHA/release.tgz -C releases/video-studio-e2e/$RELEASE_SHA"

      - name: Run staged isolated control-plane and worker loop
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          SHORT_SHA: ${{ steps.source.outputs.short }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" "RELEASE_SHA=$RELEASE_SHA SHORT_SHA=$SHORT_SHA bash -se" <<'REMOTE'
          set -euo pipefail
          script="$HOME/releases/video-studio-e2e/$RELEASE_SHA/apps/video-studio/scripts/vm-e2e-preflight.sh"
          test -f "$script"
          chmod 700 "$script"
          RELEASE_SHA="$RELEASE_SHA" SHORT_SHA="$SHORT_SHA" "$script"
          REMOTE

      - name: Retrieve sanitized end-to-end evidence
        if: always()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST:releases/video-studio-e2e/$RELEASE_SHA/e2e-worker-preflight-report.txt" \
            /tmp/e2e-worker-preflight-report.txt || true
          test -f /tmp/e2e-worker-preflight-report.txt || \
            printf 'release_sha=%s\nresult=failed_before_evidence_completion\n' "$RELEASE_SHA" > /tmp/e2e-worker-preflight-report.txt

      - name: Upload private evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: video-studio-e2e-worker-preflight-${{ steps.source.outputs.short }}
          path: /tmp/e2e-worker-preflight-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish result
        if: always()
        run: |
          cat /tmp/e2e-worker-preflight-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Synthetic technical-readiness evidence only; production and premium neural release remain blocked." >> "$GITHUB_STEP_SUMMARY"
