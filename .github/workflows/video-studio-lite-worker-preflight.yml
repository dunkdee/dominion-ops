name: Dominion Lite CPU Worker Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/video-studio/worker/**"
      - "apps/video-studio/tests/test_lite_renderer.py"
      - ".github/workflows/video-studio-lite-worker-preflight.yml"

permissions:
  contents: read

concurrency:
  group: dominion-lite-worker-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    if: >-
      github.actor == 'dunkdee' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/video-studio-five-council-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Resolve candidate identity
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure verified SSH access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy worker candidate to foundation VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          tar -czf /tmp/dominion-lite-worker.tgz apps/video-studio
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "rm -rf releases/dominion-lite-worker/$RELEASE_SHA && mkdir -p releases/dominion-lite-worker/$RELEASE_SHA"
          scp -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            /tmp/dominion-lite-worker.tgz \
            "$VM_USER@$VM_HOST:releases/dominion-lite-worker/$RELEASE_SHA/release.tgz"
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "tar -xzf releases/dominion-lite-worker/$RELEASE_SHA/release.tgz -C releases/dominion-lite-worker/$RELEASE_SHA"

      - name: Build and render isolated synthetic canary
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          SHORT_SHA: ${{ steps.source.outputs.short }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" "RELEASE_SHA=$RELEASE_SHA SHORT_SHA=$SHORT_SHA bash -se" <<'REMOTE'
          set -euo pipefail
          umask 077
          release_dir="$HOME/releases/dominion-lite-worker/$RELEASE_SHA/apps/video-studio"
          report_dir="$HOME/releases/dominion-lite-worker/$RELEASE_SHA"
          work_dir="$report_dir/synthetic-canary"
          image="dominion/video-studio-lite:preflight-$RELEASE_SHA"
          production_before=absent

          command -v docker >/dev/null
          docker info >/dev/null
          test -f "$release_dir/worker/Dockerfile.lite"
          if docker inspect dominion-video-studio >/dev/null 2>&1; then
            production_before=$(docker inspect dominion-video-studio --format '{{.Id}}')
          fi

          cleanup() {
            rm -rf "$work_dir"
            docker image rm "$image" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          rm -rf "$work_dir"
          mkdir -p "$work_dir"
          chmod 777 "$work_dir"

          python3 - "$work_dir" <<'PY'
          import math
          import struct
          import sys
          import wave
          from pathlib import Path

          target = Path(sys.argv[1])
          width, height = 480, 640
          pixels = bytearray()
          for y in range(height):
              for x in range(width):
                  pixels.extend((40 + (x * 120 // width), 55 + (y * 100 // height), 95 + ((x + y) * 80 // (width + height))))
          with (target / "portrait.ppm").open("wb") as output:
              output.write(f"P6\n{width} {height}\n255\n".encode("ascii"))
              output.write(pixels)

          sample_rate = 16_000
          duration = 1.25
          with wave.open(str(target / "voice.wav"), "wb") as output:
              output.setnchannels(1)
              output.setsampwidth(2)
              output.setframerate(sample_rate)
              for index in range(int(sample_rate * duration)):
                  envelope = 0.15 + 0.75 * abs(math.sin(index / sample_rate * math.pi * 3.0))
                  value = int(32767 * 0.20 * envelope * math.sin(2 * math.pi * 190 * index / sample_rate))
                  output.writeframesraw(struct.pack("<h", value))
          (target / "script.txt").write_text("Dominion Lite controlled synthetic animation test.", encoding="utf-8")
          PY
          chmod 644 "$work_dir/portrait.ppm" "$work_dir/voice.wav" "$work_dir/script.txt"

          build_started=$(date +%s)
          docker build --progress=plain --pull \
            --file "$release_dir/worker/Dockerfile.lite" \
            --tag "$image" "$release_dir"
          build_seconds=$(( $(date +%s) - build_started ))

          render_started=$(date +%s)
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:size=512m,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2.0 \
            --volume "$work_dir:/work" \
            "$image" python -c 'from pathlib import Path; import dominion_lite_renderer as r; r.detect_face=lambda image:(int(image.shape[1]*0.18),int(image.shape[0]*0.12),int(image.shape[1]*0.64),int(image.shape[0]*0.70)); r.render(Path("/work/portrait.ppm"),Path("/work/voice.wav"),Path("/work/output.mp4"),Path("/work/script.txt"),"vertical",24)'
          render_seconds=$(( $(date +%s) - render_started ))

          test -s "$work_dir/output.mp4"
          docker run --rm --network none --read-only \
            --volume "$work_dir:/work:ro" \
            --entrypoint ffprobe "$image" \
            -v error -show_entries stream=codec_name,width,height -show_entries format=duration \
            -of json /work/output.mp4 > "$report_dir/ffprobe.json"

          python3 - "$report_dir/ffprobe.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          streams = payload.get("streams", [])
          video = next(stream for stream in streams if "width" in stream)
          audio = next(stream for stream in streams if stream.get("codec_name") == "aac")
          assert video["codec_name"] == "h264", payload
          assert (video["width"], video["height"]) == (720, 1280), payload
          assert audio["codec_name"] == "aac", payload
          duration = float(payload["format"]["duration"])
          assert 1.0 <= duration <= 2.0, payload
          PY

          production_after=absent
          if docker inspect dominion-video-studio >/dev/null 2>&1; then
            production_after=$(docker inspect dominion-video-studio --format '{{.Id}}')
          fi
          test "$production_after" = "$production_before"

          output_bytes=$(stat -c '%s' "$work_dir/output.mp4")
          output_sha=$(sha256sum "$work_dir/output.mp4" | awk '{print $1}')
          {
            echo "release_sha=$RELEASE_SHA"
            echo "worker=dominion_lite_cpu"
            echo "worker_image_build=passed"
            echo "synthetic_render=passed"
            echo "output_format=720x1280_h264_aac"
            echo "output_bytes=$output_bytes"
            echo "output_sha256=$output_sha"
            echo "build_seconds=$build_seconds"
            echo "render_seconds=$render_seconds"
            echo "network_during_render=none"
            echo "production_container_unchanged=passed"
            echo "personal_media_used=false"
            echo "claim=cpu_preview_not_neural_clone"
          } > "$report_dir/lite-worker-preflight-report.txt"
          chmod 600 "$report_dir/lite-worker-preflight-report.txt" "$report_dir/ffprobe.json"
          cat "$report_dir/lite-worker-preflight-report.txt"
          REMOTE

      - name: Retrieve sanitized worker evidence
        if: always()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST:releases/dominion-lite-worker/$RELEASE_SHA/lite-worker-preflight-report.txt" \
            /tmp/lite-worker-preflight-report.txt || true
          test -f /tmp/lite-worker-preflight-report.txt || \
            printf 'release_sha=%s\nresult=failed_before_evidence_completion\n' "$RELEASE_SHA" > /tmp/lite-worker-preflight-report.txt

      - name: Upload private evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: dominion-lite-worker-preflight-${{ steps.source.outputs.short }}
          path: /tmp/lite-worker-preflight-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish result
        if: always()
        run: |
          cat /tmp/lite-worker-preflight-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "This validates the owned CPU preview worker only. It is not a premium neural-clone approval." >> "$GITHUB_STEP_SUMMARY"
