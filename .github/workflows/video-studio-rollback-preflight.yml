name: Dominion Video Studio Rollback Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/video-studio/deploy-gcp-vm.sh"
      - "apps/video-studio/Dockerfile"
      - "apps/video-studio/scripts/vm-rollback-preflight.sh"
      - ".github/workflows/video-studio-rollback-preflight.yml"

permissions:
  contents: read

concurrency:
  group: dominion-video-studio-rollback-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rollback:
    if: >-
      github.actor == 'dunkdee' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/video-studio-five-council-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Resolve candidate identity
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure verified SSH access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy isolated rollback candidate
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          tar -czf /tmp/video-studio-rollback.tgz apps/video-studio
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "rm -rf releases/video-studio-rollback/$RELEASE_SHA && mkdir -p releases/video-studio-rollback/$RELEASE_SHA"
          scp -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            /tmp/video-studio-rollback.tgz \
            "$VM_USER@$VM_HOST:releases/video-studio-rollback/$RELEASE_SHA/release.tgz"
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "tar -xzf releases/video-studio-rollback/$RELEASE_SHA/release.tgz -C releases/video-studio-rollback/$RELEASE_SHA"

      - name: Prove automatic rollback on failed replacement
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          SHORT_SHA: ${{ steps.source.outputs.short }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" "RELEASE_SHA=$RELEASE_SHA SHORT_SHA=$SHORT_SHA bash -se" <<'REMOTE'
          set -euo pipefail
          script="$HOME/releases/video-studio-rollback/$RELEASE_SHA/apps/video-studio/scripts/vm-rollback-preflight.sh"
          test -f "$script"
          chmod 700 "$script"
          RELEASE_SHA="$RELEASE_SHA" SHORT_SHA="$SHORT_SHA" "$script"
          REMOTE

      - name: Retrieve sanitized rollback evidence
        if: always()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST:releases/video-studio-rollback/$RELEASE_SHA/rollback-preflight-report.txt" \
            /tmp/rollback-preflight-report.txt || true
          test -f /tmp/rollback-preflight-report.txt || \
            printf 'release_sha=%s\nresult=failed_before_evidence_completion\n' "$RELEASE_SHA" > /tmp/rollback-preflight-report.txt

      - name: Upload private sanitized evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: video-studio-rollback-preflight-${{ steps.source.outputs.short }}
          path: /tmp/rollback-preflight-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish result
        if: always()
        run: cat /tmp/rollback-preflight-report.txt >> "$GITHUB_STEP_SUMMARY"
