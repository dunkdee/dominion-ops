name: Dominion Video Studio VM Preflight PR

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/video-studio/**"
      - ".github/workflows/video-studio-vm-preflight-pr.yml"

permissions:
  contents: read

concurrency:
  group: dominion-video-studio-vm-preflight-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    if: >-
      github.actor == 'dunkdee' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/video-studio-five-council-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Resolve candidate identity
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure verified SSH access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy isolated candidate to foundation VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          tar -czf /tmp/video-studio-preflight.tgz apps/video-studio
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "rm -rf releases/video-studio-preflight-pr/$RELEASE_SHA && mkdir -p releases/video-studio-preflight-pr/$RELEASE_SHA"
          scp -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            /tmp/video-studio-preflight.tgz \
            "$VM_USER@$VM_HOST:releases/video-studio-preflight-pr/$RELEASE_SHA/release.tgz"
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "tar -xzf releases/video-studio-preflight-pr/$RELEASE_SHA/release.tgz -C releases/video-studio-preflight-pr/$RELEASE_SHA"

      - name: Verify VM prerequisites and capture baseline
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          SHORT_SHA: ${{ steps.source.outputs.short }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" "RELEASE_SHA=$RELEASE_SHA SHORT_SHA=$SHORT_SHA bash -se" <<'REMOTE'
          set -euo pipefail
          umask 077
          report_dir="$HOME/releases/video-studio-preflight-pr/$RELEASE_SHA"
          candidate="dominion-video-studio-preflight-pr-$SHORT_SHA"
          volume="${candidate}-data"
          command -v docker >/dev/null
          command -v curl >/dev/null
          command -v openssl >/dev/null
          command -v python3 >/dev/null
          docker info >/dev/null
          test -d "$report_dir/apps/video-studio"
          docker rm -f "$candidate" >/dev/null 2>&1 || true
          docker volume rm "$volume" >/dev/null 2>&1 || true
          production_before=absent
          if docker inspect dominion-video-studio >/dev/null 2>&1; then
            production_before=$(docker inspect dominion-video-studio --format '{{.Id}}')
          fi
          printf '%s\n' "$production_before" > "$report_dir/production-before.txt"
          df -Pk "$HOME" > "$report_dir/disk-before.txt"
          chmod 600 "$report_dir/production-before.txt" "$report_dir/disk-before.txt"
          REMOTE

      - name: Build isolated image
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" "RELEASE_SHA=$RELEASE_SHA bash -se" <<'REMOTE'
          set -euo pipefail
          release_dir="$HOME/releases/video-studio-preflight-pr/$RELEASE_SHA/apps/video-studio"
          image="dominion/video-studio:preflight-pr-$RELEASE_SHA"
          docker build --progress=plain --pull --tag "$image" "$release_dir"
          REMOTE

      - name: Launch isolated candidate
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          SHORT_SHA: ${{ steps.source.outputs.short }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" "RELEASE_SHA=$RELEASE_SHA SHORT_SHA=$SHORT_SHA bash -se" <<'REMOTE'
          set -euo pipefail
          image="dominion/video-studio:preflight-pr-$RELEASE_SHA"
          candidate="dominion-video-studio-preflight-pr-$SHORT_SHA"
          volume="${candidate}-data"
          docker volume create "$volume" >/dev/null
          worker_token=$(openssl rand -hex 32)
          docker run -d --name "$candidate" \
            --publish 127.0.0.1:18094:8000 \
            --read-only \
            --tmpfs /tmp:size=256m,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2.0 \
            --env VIDEO_STUDIO_DATA_DIR=/data \
            --env VIDEO_STUDIO_MAX_UPLOAD_BYTES=104857600 \
            --env "VIDEO_STUDIO_WORKER_TOKEN=$worker_token" \
            --volume "$volume:/data" \
            --label "dominion.release.sha=$RELEASE_SHA" \
            "$image" >/dev/null
          REMOTE

      - name: Verify candidate readiness
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          SHORT_SHA: ${{ steps.source.outputs.short }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" "SHORT_SHA=$SHORT_SHA bash -se" <<'REMOTE'
          set -euo pipefail
          candidate="dominion-video-studio-preflight-pr-$SHORT_SHA"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18094/ready >/tmp/video-studio-ready.json; then
              python3 -c 'import json; d=json.load(open("/tmp/video-studio-ready.json")); assert d.get("status") == "ready", d'
              exit 0
            fi
            sleep 2
          done
          docker inspect "$candidate" || true
          docker logs --tail 200 "$candidate" || true
          exit 1
          REMOTE

      - name: Verify isolation and write evidence
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          SHORT_SHA: ${{ steps.source.outputs.short }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" "RELEASE_SHA=$RELEASE_SHA SHORT_SHA=$SHORT_SHA bash -se" <<'REMOTE'
          set -euo pipefail
          report_dir="$HOME/releases/video-studio-preflight-pr/$RELEASE_SHA"
          candidate="dominion-video-studio-preflight-pr-$SHORT_SHA"
          production_before=$(cat "$report_dir/production-before.txt")
          docker port "$candidate" 8000/tcp | grep -Eq '^127\.0\.0\.1:18094$'
          test "$(docker inspect "$candidate" --format '{{.HostConfig.ReadonlyRootfs}}')" = true
          test "$(docker inspect "$candidate" --format '{{index .Config.Labels "dominion.release.sha"}}')" = "$RELEASE_SHA"
          production_after=absent
          if docker inspect dominion-video-studio >/dev/null 2>&1; then
            production_after=$(docker inspect dominion-video-studio --format '{{.Id}}')
          fi
          test "$production_after" = "$production_before"
          gpu_status=not_detected
          if command -v nvidia-smi >/dev/null 2>&1; then
            gpu_status=$(nvidia-smi --query-gpu=name,memory.total --format=csv,noheader 2>/dev/null | tr '\n' ';' || true)
            test -n "$gpu_status" || gpu_status=nvidia_smi_present_no_gpu_result
          fi
          printf 'release_sha=%s\nbinding=127.0.0.1:18094\nready=passed\nread_only_rootfs=passed\nproduction_container_unchanged=passed\ngpu_status=%s\npublic_exposure=not_performed\npersonal_media_used=false\n' \
            "$RELEASE_SHA" "$gpu_status" > "$report_dir/vm-preflight-report.txt"
          chmod 600 "$report_dir/vm-preflight-report.txt"
          cat "$report_dir/vm-preflight-report.txt"
          REMOTE

      - name: Retrieve sanitized evidence
        if: always()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST:releases/video-studio-preflight-pr/$RELEASE_SHA/vm-preflight-report.txt" \
            /tmp/vm-preflight-report.txt || true
          test -f /tmp/vm-preflight-report.txt || printf 'release_sha=%s\nresult=failed_before_evidence_completion\n' "$RELEASE_SHA" > /tmp/vm-preflight-report.txt

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: video-studio-vm-preflight-pr-${{ steps.source.outputs.short }}
          path: /tmp/vm-preflight-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish result
        if: always()
        run: |
          cat /tmp/vm-preflight-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Technical-readiness evidence only; production deployment and neural cloning remain blocked." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean isolated candidate
        if: always()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          SHORT_SHA: ${{ steps.source.outputs.short }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" "SHORT_SHA=$SHORT_SHA bash -se" <<'REMOTE'
          candidate="dominion-video-studio-preflight-pr-$SHORT_SHA"
          docker rm -f "$candidate" >/dev/null 2>&1 || true
          docker volume rm "${candidate}-data" >/dev/null 2>&1 || true
          REMOTE
