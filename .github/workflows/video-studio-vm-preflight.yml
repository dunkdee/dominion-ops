name: Dominion Video Studio VM Preflight

on:
  push:
    branches:
      - agent/video-studio-five-council-release
    paths:
      - "apps/video-studio/**"
      - ".github/workflows/video-studio-vm-preflight.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN_VIDEO_STUDIO_PREFLIGHT"
        required: true

permissions:
  contents: read

concurrency:
  group: dominion-video-studio-vm-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.actor == 'dunkdee' &&
      (github.event_name == 'push' ||
      github.event.inputs.confirm == 'RUN_VIDEO_STUDIO_PREFLIGHT')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Resolve candidate identity
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate and configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts > /tmp/video-studio-host-key-fingerprints.txt

      - name: Copy isolated candidate bundle
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          tar -czf /tmp/video-studio-preflight.tgz apps/video-studio
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "rm -rf releases/video-studio-preflight/$RELEASE_SHA && mkdir -p releases/video-studio-preflight/$RELEASE_SHA"
          scp -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            /tmp/video-studio-preflight.tgz \
            "$VM_USER@$VM_HOST:releases/video-studio-preflight/$RELEASE_SHA/release.tgz"
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "tar -xzf releases/video-studio-preflight/$RELEASE_SHA/release.tgz -C releases/video-studio-preflight/$RELEASE_SHA"

      - name: Build and test isolated VM candidate
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          SHORT_SHA: ${{ steps.source.outputs.short }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "RELEASE_SHA=$RELEASE_SHA SHORT_SHA=$SHORT_SHA bash -se" <<'REMOTE'
          set -euo pipefail
          umask 077

          release_dir="$HOME/releases/video-studio-preflight/$RELEASE_SHA/apps/video-studio"
          report_dir="$HOME/releases/video-studio-preflight/$RELEASE_SHA"
          image="dominion/video-studio:preflight-$RELEASE_SHA"
          candidate="dominion-video-studio-preflight-$SHORT_SHA"
          data_volume="${candidate}-data"
          port=18094
          production_before="absent"

          test -d "$release_dir"
          command -v docker >/dev/null
          command -v curl >/dev/null
          command -v python3 >/dev/null
          docker info >/dev/null

          if docker inspect dominion-video-studio >/dev/null 2>&1; then
            production_before=$(docker inspect dominion-video-studio --format '{{.Id}}')
          fi

          cleanup() {
            docker rm -f "$candidate" >/dev/null 2>&1 || true
            docker volume rm "$data_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup

          cd "$release_dir"
          docker build --pull --tag "$image" .
          docker volume create "$data_volume" >/dev/null
          worker_token=$(openssl rand -hex 32)

          docker run -d \
            --name "$candidate" \
            --publish "127.0.0.1:${port}:8000" \
            --read-only \
            --tmpfs /tmp:size=256m,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2.0 \
            --env VIDEO_STUDIO_DATA_DIR=/data \
            --env VIDEO_STUDIO_MAX_UPLOAD_BYTES=104857600 \
            --env "VIDEO_STUDIO_WORKER_TOKEN=$worker_token" \
            --volume "$data_volume:/data" \
            --label "dominion.release.sha=$RELEASE_SHA" \
            --label dominion.release.service=video-studio-preflight \
            "$image" >/dev/null

          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/ready" >/tmp/video-studio-preflight-ready.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs --tail 200 "$candidate" >&2 || true
              exit 1
            fi
            sleep 2
          done

          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:18094"

          with urllib.request.urlopen(base + "/ready", timeout=10) as response:
              ready = json.load(response)
          assert ready.get("status") == "ready", ready

          def post(path, payload):
              body = json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  base + path,
                  data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  return response.status, json.load(response)

          status, consent = post(
              "/api/consents",
              {
                  "subject_name": "Preflight Authorized Subject",
                  "likeness_confirmed": True,
                  "voice_confirmed": True,
                  "rights_confirmed": True,
              },
          )
          assert status == 201, status

          status, project = post(
              "/api/projects",
              {
                  "title": "VM Preflight",
                  "script": "Controlled nonproduction preflight.",
                  "output_format": "vertical",
                  "consent_id": consent["id"],
              },
          )
          assert status == 201, status

          request = urllib.request.Request(
              base + f"/api/projects/{project['id']}/jobs",
              data=json.dumps({"engine": "proof_render"}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=10)
          except urllib.error.HTTPError as error:
              assert error.code == 409, error.code
              detail = json.load(error)
              assert "portrait" in detail["detail"].lower(), detail
          else:
              raise AssertionError("missing-assets gate did not reject the render job")
          PY

          docker port "$candidate" 8000/tcp | grep -Eq '^127\.0\.0\.1:18094$'
          test "$(docker inspect "$candidate" --format '{{index .Config.Labels "dominion.release.sha"}}')" = "$RELEASE_SHA"
          test "$(docker inspect "$candidate" --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"

          production_after="absent"
          if docker inspect dominion-video-studio >/dev/null 2>&1; then
            production_after=$(docker inspect dominion-video-studio --format '{{.Id}}')
          fi
          test "$production_after" = "$production_before"

          gpu_status="not_detected"
          if command -v nvidia-smi >/dev/null 2>&1; then
            gpu_status="$(nvidia-smi --query-gpu=name,memory.total --format=csv,noheader 2>/dev/null | tr '\n' ';' || true)"
            test -n "$gpu_status" || gpu_status="nvidia_smi_present_no_gpu_result"
          fi

          {
            echo "release_sha=$RELEASE_SHA"
            echo "candidate_container=$candidate"
            echo "binding=127.0.0.1:18094"
            echo "ready=passed"
            echo "consent_api=passed"
            echo "project_api=passed"
            echo "missing_assets_gate=passed"
            echo "read_only_rootfs=passed"
            echo "production_container_unchanged=passed"
            echo "gpu_status=$gpu_status"
            echo "public_exposure=not_performed"
            echo "personal_media_used=false"
          } > "$report_dir/vm-preflight-report.txt"
          chmod 600 "$report_dir/vm-preflight-report.txt"
          cat "$report_dir/vm-preflight-report.txt"
          REMOTE

      - name: Retrieve sanitized preflight report
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST:releases/video-studio-preflight/$RELEASE_SHA/vm-preflight-report.txt" \
            /tmp/vm-preflight-report.txt
          cp /tmp/video-studio-host-key-fingerprints.txt /tmp/host-key-fingerprints.txt

      - name: Upload preflight evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: video-studio-vm-preflight-${{ steps.source.outputs.short }}
          path: |
            /tmp/vm-preflight-report.txt
            /tmp/host-key-fingerprints.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish preflight summary
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          {
            echo "## Dominion Video Studio VM preflight"
            echo "- Candidate: \`$RELEASE_SHA\`"
            echo "- Isolated binding: \`127.0.0.1:18094\`"
            echo "- Production container: unchanged"
            echo "- Personal media: not used"
            echo "- Public exposure: not performed"
            echo "- Result: passed"
            echo ""
            echo "This is technical-readiness evidence only. It does not authorize production deployment or claim that a neural clone worker is operational."
          } >> "$GITHUB_STEP_SUMMARY"
