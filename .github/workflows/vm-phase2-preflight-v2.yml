name: VM Phase 2 resilient preflight

on:
  push:
    branches:
      - audit/vm-readonly-20260720
    paths:
      - .github/workflows/vm-phase2-preflight-v2.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/vm-readonly-20260720

      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Pull authorized resilient preflight
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          mkdir -p audit
          set +e
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o ConnectTimeout=20 "$VM_USER@$VM_HOST" 'bash -s' > audit/vm-phase2-preflight-v2.txt <<'REMOTE'
          set +e
          section() { printf '\n===== %s =====\n' "$1"; }
          run() { echo "+ $*"; "$@"; rc=$?; echo "exit=$rc"; return 0; }
          REPO="$HOME/dominion-ops"

          section "GIT FETCH AND IDENTITY"
          cd "$REPO" || { echo 'repository missing'; exit 0; }
          run git fetch --prune origin main
          printf 'current_branch='; git branch --show-current 2>&1
          printf 'head='; git rev-parse HEAD 2>&1
          printf 'local_main='; git rev-parse main 2>&1
          printf 'origin_main='; git rev-parse origin/main 2>&1
          git merge-base --is-ancestor HEAD origin/main; echo "head_ancestor_rc=$?"
          git merge-base --is-ancestor origin/main HEAD; echo "origin_main_ancestor_rc=$?"

          section "COMMITS ONLY ON VM FEATURE BRANCH"
          git log --oneline --decorate origin/main..HEAD 2>&1 | sed -n '1,100p'

          section "COMMITS ONLY ON GITHUB MAIN"
          git log --oneline --decorate HEAD..origin/main 2>&1 | sed -n '1,100p'

          section "TREE DIFFERENCE"
          git diff --stat HEAD..origin/main 2>&1
          git diff --name-status HEAD..origin/main 2>&1 | sed -n '1,250p'

          section "WORKTREE CHANGES"
          git status --short 2>&1
          git check-ignore -v .env 2>&1 || echo '.env is NOT ignored'
          git ls-files --error-unmatch .env >/dev/null 2>&1 && echo '.env tracked' || echo '.env untracked'

          section "COMPOSE MODEL AT VERIFIED MAIN"
          git show origin/main:docker-compose.yml >/tmp/dominion-compose-main.yml 2>&1
          echo "git_show_exit=$?"
          docker compose -f /tmp/dominion-compose-main.yml config --services 2>&1
          echo "compose_services_exit=$?"

          section "RUNNING CONTAINER DATA MOUNTS"
          for cid in $(docker ps -aq 2>/dev/null); do
            docker inspect --format '--- {{.Name}} --- status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}} project={{index .Config.Labels "com.docker.compose.project"}} workdir={{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$cid" 2>&1
            docker inspect --format '{{range .Mounts}}{{.Type}} {{.Name}} {{.Source}} -> {{.Destination}} rw={{.RW}}{{println}}{{end}}' "$cid" 2>&1
          done

          section "DOCKER STORAGE"
          docker volume ls 2>&1
          docker system df 2>&1

          section "PERSISTENT DATA SIZE"
          for p in "$HOME/n8n" "$HOME/.n8n" "$HOME/dominion/.n8n" "$HOME/dominion-ops" "$HOME/backups"; do
            [ -e "$p" ] && du -sh "$p" 2>&1
          done
          docker exec dominion-db sh -lc 'printf "postgres_user=%s\npostgres_db=%s\n" "${POSTGRES_USER:-postgres}" "${POSTGRES_DB:-postgres}"' 2>&1 || echo 'postgres identity probe unavailable'

          section "SERVICE BASELINE"
          for port in 80 3000 5000 5055 5060 5070 5080 5090 5095 5100 5101 5102 5103 5110 5120 5678 8080 8082 8090 8100 8200 8787 9380; do
            code=$(curl -k -sS -o /dev/null -m 3 -w '%{http_code}' "http://127.0.0.1:$port/" 2>/dev/null)
            [ -n "$code" ] && [ "$code" != 000 ] && printf '%s %s\n' "$port" "$code"
          done
          systemctl --failed --no-pager --plain 2>&1

          section "PREFLIGHT COMPLETE"
          date -u
          exit 0
          REMOTE
          rc=$?
          echo "ssh_exit=$rc" >> audit/vm-phase2-preflight-v2.txt
          exit 0

      - name: Commit preflight report
        run: |
          git config user.name "Dominion Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit/vm-phase2-preflight-v2.txt
          git commit -m "audit: capture resilient authorized Phase 2 preflight"
          git push origin HEAD:audit/vm-readonly-20260720
