name: Read-only VM ecosystem audit

on:
  push:
    branches:
      - audit/vm-readonly-20260720
    paths:
      - .github/workflows/vm-readonly-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/vm-readonly-20260720

      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Pull read-only ecosystem audit
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          mkdir -p audit
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o ConnectTimeout=20 "$VM_USER@$VM_HOST" 'bash -s' > audit/vm-audit-latest.txt <<'REMOTE'
          set +e
          section() { printf '\n===== %s =====\n' "$1"; }

          section "AUDIT IDENTITY"
          date -u
          hostname
          uptime
          id
          printf 'kernel: '; uname -srmo
          printf 'os: '; . /etc/os-release 2>/dev/null; echo "${PRETTY_NAME:-unknown}"

          section "GCE METADATA"
          for key in instance/name instance/machine-type instance/zone project/project-id; do
            printf '%s: ' "$key"
            curl -sf -H 'Metadata-Flavor: Google' "http://metadata.google.internal/computeMetadata/v1/$key" || echo unavailable
            echo
          done

          section "CAPACITY"
          free -h
          df -hT -x tmpfs -x devtmpfs
          printf '\nTop-level home usage:\n'
          du -sh "$HOME"/* 2>/dev/null | sort -h | tail -30

          section "FAILED SYSTEMD UNITS"
          systemctl --failed --no-pager --plain

          section "RUNNING RELEVANT SYSTEMD SERVICES"
          systemctl list-units --type=service --state=running --no-pager --plain | grep -Ei 'dominion|n8n|caddy|docker|redis|ollama|jarvis|gemini|surplus|wix|proposal|dashboard|affiliate|kdp|conductor' || echo 'none matched'

          section "ALL RELEVANT SYSTEMD UNIT FILES"
          systemctl list-unit-files --type=service --no-pager --plain | grep -Ei 'dominion|n8n|caddy|docker|redis|ollama|jarvis|gemini|surplus|wix|proposal|dashboard|affiliate|kdp|conductor' || echo 'none matched'

          section "DOCKER CONTAINERS"
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>&1

          section "DOCKER COMPOSE PROJECTS"
          docker compose ls 2>&1

          section "LISTENING TCP PORTS"
          ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || echo 'ss/netstat unavailable'

          section "LOCAL HTTP HEALTH PROBES"
          for port in 80 443 3000 5055 5060 5678 8000 8080 8081 8082 8083 8090 8100 8200 8787 9380; do
            code=$(curl -k -sS -o /dev/null -m 3 -w '%{http_code}' "http://127.0.0.1:$port/" 2>/dev/null)
            [ -n "$code" ] && [ "$code" != "000" ] && printf 'port %s -> HTTP %s\n' "$port" "$code"
          done

          section "CADDY ROUTING SUMMARY"
          if [ -r /etc/caddy/Caddyfile ]; then
            grep -nE '^[[:space:]]*[^#].*(\{|reverse_proxy|root|handle|route|redir|respond)' /etc/caddy/Caddyfile
          else
            echo '/etc/caddy/Caddyfile not readable or absent'
          fi

          section "KNOWN APPLICATION DIRECTORIES"
          for dir in "$HOME/dominion-ops" "$HOME/buddy_core" "$HOME/aura-ecosystem" /opt/dominion /var/www; do
            if [ -e "$dir" ]; then
              echo "--- $dir ---"
              ls -la "$dir" 2>/dev/null | head -40
            else
              echo "ABSENT: $dir"
            fi
          done

          section "GIT WORKTREES"
          find "$HOME" /opt -maxdepth 4 -type d -name .git 2>/dev/null | while read -r gitdir; do
            repo=${gitdir%/.git}
            echo "--- $repo ---"
            git -C "$repo" branch --show-current 2>/dev/null
            git -C "$repo" log -1 --format='%h %cI %s' 2>/dev/null
            git -C "$repo" status --short 2>/dev/null | head -30
          done

          section "N8N, CONDUCTOR, AND JARVIS DISCOVERY"
          find "$HOME" /opt /etc -maxdepth 4 \( -iname '*n8n*' -o -iname '*conductor*' -o -iname '*jarvis*' \) 2>/dev/null | head -100

          section "AUDIT COMPLETE"
          date -u
          REMOTE

      - name: Commit audit report
        run: |
          git config user.name "Dominion Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit/vm-audit-latest.txt
          git commit -m "audit: capture read-only VM ecosystem state"
          git push origin HEAD:audit/vm-readonly-20260720
