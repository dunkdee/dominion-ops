name: Dominion Runtime Observer — Read Only

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/watchdog.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dominion-runtime-observer
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Require protected VM connection
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Collect runtime and containment evidence without mutation
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/runtime-observer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          set +e
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE' | tee "$report"
          set -u
          failures=0

          fail() {
            printf 'CHECK=FAIL %s\n' "$*"
            failures=$((failures + 1))
          }

          pass() {
            printf 'CHECK=PASS %s\n' "$*"
          }

          check_http() {
            name="$1"
            expected="$2"
            url="$3"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 "$url" 2>/dev/null || true)"
            if [ "$code" = "$expected" ]; then
              pass "health=$name status=$code url=$url"
            else
              fail "health=$name expected=$expected actual=${code:-000} url=$url"
            fi
          }

          check_active() {
            unit="$1"
            state="$(systemctl is-active "$unit" 2>/dev/null || true)"
            if [ "$state" = 'active' ]; then
              pass "unit=$unit active=$state"
            else
              fail "unit=$unit expected=active actual=${state:-unknown}"
            fi
          }

          check_held() {
            unit="$1"
            active="$(systemctl is-active "$unit" 2>/dev/null || true)"
            enabled="$(systemctl is-enabled "$unit" 2>/dev/null || true)"
            if [ "$active" = 'inactive' ] && [ "$enabled" = 'disabled' ]; then
              pass "CONTAINMENT_HOLD=ENFORCED unit=$unit active=$active enabled=$enabled"
            else
              fail "CONTAINMENT_HOLD=BROKEN unit=$unit active=${active:-unknown} enabled=${enabled:-unknown}"
            fi
          }

          check_firewall_absent() {
            rule="$1"
            if ! command -v gcloud >/dev/null 2>&1; then
              fail "firewall=$rule state=UNKNOWN reason=gcloud_unavailable"
              return
            fi
            output="$(gcloud compute firewall-rules describe "$rule" --project=dominion-ascendant 2>&1)"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              fail "firewall=$rule state=PRESENT"
            elif printf '%s' "$output" | grep -qiE 'was not found|not found'; then
              pass "firewall=$rule state=ABSENT"
            else
              fail "firewall=$rule state=UNKNOWN reason=describe_failed"
            fi
          }

          echo '=== CORE RUNTIME ==='
          check_http baby_api 200 http://127.0.0.1:8080/
          check_http dominion_web 200 http://127.0.0.1:8090/
          check_http wix_agent 200 http://127.0.0.1:8082/ready
          check_http n8n 200 http://127.0.0.1:5678/healthz
          check_http alpha_engine 200 http://127.0.0.1:8787/health
          check_http conductor 200 http://127.0.0.1:5060/health
          check_http command_center 200 http://127.0.0.1:8091/health

          echo '=== BUDDY RUNTIME ==='
          check_active dominion-buddy-web.service
          check_active dominion-proposal-queue.service
          check_active dominion-sentinel.service
          check_http buddy_auth_boundary 401 http://127.0.0.1:5070/buddy
          check_http proposal_queue 200 http://127.0.0.1:5101/api/proposals

          echo '=== SYSTEM INTEGRITY AGENT ==='
          check_active dominion-system-integrity.timer
          integrity_state="$HOME/.dominion/system-integrity/latest.json"
          if python3 - "$integrity_state" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          path=Path(sys.argv[1])
          state=json.loads(path.read_text(encoding='utf-8'))
          assert state['schema']=='dominion-system-integrity-state-v1'
          assert state['agent']=='system-integrity-agent'
          assert state['ok'] is True and state['status']=='PASS' and state['defect_count']==0
          assert state['authority']=='OBSERVE_VERIFY_REQUEST_RECOVERY'
          assert state['self_mutation'] is False
          observed=datetime.fromisoformat(str(state['observed_at']).replace('Z','+00:00')).astimezone(timezone.utc)
          age=max(0.0,(datetime.now(timezone.utc)-observed).total_seconds())
          assert age <= 240, age
          PY
          then
            pass "system_integrity=online cadence=89s receipt=fresh"
          else
            fail "system_integrity=invalid_or_stale file=$integrity_state"
          fi

          echo '=== CONTAINMENT ==='
          check_held dominion-nemotron.service
          check_held dominion-email-monitor.service
          check_held dominion-affiliate.timer
          check_held dominion-scout.timer
          check_held dominion-wholesale.timer

          if ss -ltnH 2>/dev/null | awk '{print $4}' | grep -Eq '(^|:)11435$'; then
            fail 'CONTAINMENT_HOLD=BROKEN port=11435 listener=PRESENT'
          else
            pass 'CONTAINMENT_HOLD=ENFORCED port=11435 listener=ABSENT'
          fi

          check_firewall_absent allow-ops-dashboard
          check_firewall_absent allow-twilio-router

          echo '=== LIVE TRUTH AND GOVERNANCE STATE ==='
          repo_sha="$(git -C "$HOME/dominion-ops" rev-parse HEAD 2>/dev/null || true)"
          command_state="$(curl -fsS --max-time 10 http://127.0.0.1:8091/api/status 2>/dev/null || true)"
          if python3 - "$command_state" "$repo_sha" <<'PY'
          import json,sys
          state=json.loads(sys.argv[1])
          repo_sha=sys.argv[2]
          assert repo_sha and state['truth']['connected'] is True
          assert state['truth']['release_sha'] == repo_sha
          assert state['lane_summary'] == {'open':11,'registered':11,'all_open':True}
          assert state['revenue']['runtime_connected'] is True
          assert state['revenue']['active_experiment_count'] >= 1
          assert state['autopilot']['connected'] is True
          integrity=state['systems']['system_integrity']
          assert integrity == 'online' or (
              isinstance(integrity,dict)
              and integrity.get('ok') is True
              and integrity.get('status') == 'PASS'
          )
          assert state['latest_receipts']
          PY
          then
            pass "command_center_truth=canonical sha=$repo_sha lanes=11/11 revenue=connected autopilot=connected system_integrity=online receipts=present"
          else
            fail "command_center_truth=invalid sha=${repo_sha:-unknown}"
          fi

          brain_manifest="$HOME/vault/Dominion-Brain/MANIFEST.json"
          if python3 - "$brain_manifest" <<'PY'
          import json,sys
          from pathlib import Path
          doc=json.loads(Path(sys.argv[1]).read_text())
          assert doc['schema']=='dominion-brain-manifest-v2'
          assert int(doc['agent_count']) > 0
          assert len(doc['source_revision']['sha256']) == 64
          PY
          then
            pass "OBSIDIAN_CANONICAL=VERIFIED manifest=$brain_manifest"
          else
            fail "OBSIDIAN_CANONICAL=INVALID manifest=$brain_manifest"
          fi

          pass 'BUDDY_LIVE_CONFORMANCE=VERIFIED services=buddy,proposal_queue,sentinel'
          echo 'EXTERNAL_ACTIONS_AUTHORIZED=founder_gated'

          if [ "$failures" -eq 0 ]; then
            echo 'RUNTIME_OBSERVER=PASS system_online=VERIFIED_FOR_CHECKED_CONTRACTS'
            exit 0
          fi
          echo "RUNTIME_OBSERVER=FAIL failures=$failures"
          exit 1
          REMOTE
          rc=${PIPESTATUS[0]}
          set -e
          printf 'observer_exit=%s\n' "$rc" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload sanitized observer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-observer-${{ github.run_id }}-${{ github.run_attempt }}.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key" "$HOME/.ssh/known_hosts"
