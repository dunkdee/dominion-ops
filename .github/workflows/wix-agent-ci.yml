name: Wix Agent CI

on:
  schedule:
    - cron: "40 16 21 7 *"
  push:
    branches:
      - main
    paths:
      - "apps/wix-agent/**"
      - "docker-compose.yml"
      - ".github/workflows/wix-agent-ci.yml"
      - ".github/workflows/wix-auto-sync.yml"
      - ".github/workflows/wix-agent-preflight.yml"
  pull_request:
    paths:
      - "apps/wix-agent/**"
      - "docker-compose.yml"
      - ".github/workflows/wix-agent-ci.yml"
      - ".github/workflows/wix-auto-sync.yml"
      - ".github/workflows/wix-agent-preflight.yml"
      - ".github/recovery/juris-recovery-trigger.txt"

permissions:
  contents: write

concurrency:
  group: wix-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: apps/wix-agent/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r apps/wix-agent/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q apps/wix-agent

      - name: Run regression tests
        run: python -m unittest discover -s apps/wix-agent/tests -v

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Wix agent image
        run: docker build --tag dominion/wix-agent:ci apps/wix-agent

  juris_recovery:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/juris-recovery-execution-20260721')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RECOVERY_DIR: ${{ runner.temp }}/juris-trust-private-${{ github.run_id }}
      REPORT_BRANCH: audit/juris-recovery-runtime-20260721
      REPORT_PATH: .github/recovery/juris-run-report.json
      ARTIFACT_NAME: juris-trust-case-private-recovery
    steps:
      - name: Enforce one-time scheduled date
        if: github.event_name == 'schedule'
        run: test "$(date -u +%F)" = "2026-07-21"

      - name: Write private run-start report
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_STATUS: started
          RESET_REPORT_BRANCH: "true"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          branch = os.environ["REPORT_BRANCH"]
          path = os.environ["REPORT_PATH"]
          sha = os.environ["GITHUB_SHA"]
          status = os.environ["RUN_STATUS"]
          reset = os.environ.get("RESET_REPORT_BRANCH") == "true"
          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def call(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  api + endpoint, data=data, method=method, headers=headers
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else {}

          ref_endpoint = "/git/refs/heads/" + urllib.parse.quote(branch, safe="/")
          try:
              call("GET", ref_endpoint)
              if reset:
                  call("PATCH", ref_endpoint, {"sha": sha, "force": True})
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              call("POST", "/git/refs", {"ref": f"refs/heads/{branch}", "sha": sha})

          report = {
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "status": status,
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "commit_sha": sha,
              "artifact_name": os.environ["ARTIFACT_NAME"],
          }
          report_bytes = (json.dumps(report, indent=2, sort_keys=True) + "\n").encode("utf-8")
          content_endpoint = "/contents/" + urllib.parse.quote(path, safe="/")
          existing_sha = None
          try:
              current = call(
                  "GET",
                  content_endpoint + "?ref=" + urllib.parse.quote(branch, safe=""),
              )
              existing_sha = current.get("sha")
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          payload = {
              "message": f"audit: Juris recovery run {status}",
              "content": base64.b64encode(report_bytes).decode("ascii"),
              "branch": branch,
          }
          if existing_sha:
              payload["sha"] = existing_sha
          call("PUT", content_endpoint, payload)
          PY

      - name: Validate VM connection secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Configure strict SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer only the verified Juris trust case
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$RECOVERY_DIR"
          ssh \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VM_USER@$VM_HOST" 'python3 -' \
            > "$RECOVERY_DIR/trust_Dewayne_L_Singleton_20260414_084645.txt" <<'PY'
          import hashlib
          import stat
          import sys
          from pathlib import Path

          expected_name = "trust_Dewayne_L_Singleton_20260414_084645.txt"
          expected_size = 9299
          expected_sha256 = (
              "e45cb33b478df63e0edeba3a4a69882317bfe1786ee53e826"
              "6c20de32e0d8f77"
          )

          cases_root = (
              Path.home() / "dominion" / "agents" / "juris" / "cases"
          ).resolve(strict=True)
          candidate = cases_root / expected_name
          if candidate.is_symlink():
              raise SystemExit("Refusing symlinked case file")
          target = candidate.resolve(strict=True)
          if target.parent != cases_root:
              raise SystemExit("Resolved case file escaped the authorized directory")
          metadata = target.stat()
          if not stat.S_ISREG(metadata.st_mode):
              raise SystemExit("Authorized case path is not a regular file")
          data = target.read_bytes()
          if len(data) != expected_size:
              raise SystemExit("Authorized case size no longer matches inventory")
          digest = hashlib.sha256(data).hexdigest()
          if digest != expected_sha256:
              raise SystemExit("Authorized case hash no longer matches inventory")
          sys.stdout.buffer.write(data)
          PY

          printf '%s  %s\n' \
            'e45cb33b478df63e0edeba3a4a69882317bfe1786ee53e8266c20de32e0d8f77' \
            "$RECOVERY_DIR/trust_Dewayne_L_Singleton_20260414_084645.txt" \
            | sha256sum --check --status
          test "$(wc -c < "$RECOVERY_DIR/trust_Dewayne_L_Singleton_20260414_084645.txt")" -eq 9299

          cat > "$RECOVERY_DIR/RECOVERY_README.txt" <<'TXT'
          PRIVATE LEGAL-DRAFT RECOVERY MATERIAL

          Source: foundation-vm Juris case directory
          Original relative path:
          dominion/agents/juris/cases/trust_Dewayne_L_Singleton_20260414_084645.txt
          Expected size: 9299 bytes
          Expected SHA-256:
          e45cb33b478df63e0edeba3a4a69882317bfe1786ee53e8266c20de32e0d8f77

          This recovery is private and authorized for analysis only.
          It is not signed, executed, filed, or attorney-approved.
          Do not rely on any EIN unless independently verified against an
          official IRS CP 575 or 147C notice.
          TXT
          chmod 600 "$RECOVERY_DIR"/*

      - name: Upload 1-day private recovery artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.RECOVERY_DIR }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          include-hidden-files: false

      - name: Remove temporary runner copies
        if: ${{ always() }}
        run: |
          set -eu
          if test -d "$RECOVERY_DIR"; then
            if command -v shred >/dev/null 2>&1; then
              find "$RECOVERY_DIR" -type f -exec shred -u -- {} +
            else
              find "$RECOVERY_DIR" -type f -delete
            fi
            find "$RECOVERY_DIR" -depth -type d -empty -delete
          fi
          rm -f ~/.ssh/id_vm ~/.ssh/known_hosts

      - name: Write private run-result report
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          branch = os.environ["REPORT_BRANCH"]
          path = os.environ["REPORT_PATH"]
          sha = os.environ["GITHUB_SHA"]
          status = os.environ["RUN_STATUS"]
          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def call(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  api + endpoint, data=data, method=method, headers=headers
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else {}

          ref_endpoint = "/git/refs/heads/" + urllib.parse.quote(branch, safe="/")
          try:
              call("GET", ref_endpoint)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              call("POST", "/git/refs", {"ref": f"refs/heads/{branch}", "sha": sha})

          report = {
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "status": status,
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "commit_sha": sha,
              "artifact_name": os.environ["ARTIFACT_NAME"],
          }
          report_bytes = (json.dumps(report, indent=2, sort_keys=True) + "\n").encode("utf-8")
          content_endpoint = "/contents/" + urllib.parse.quote(path, safe="/")
          existing_sha = None
          try:
              current = call(
                  "GET",
                  content_endpoint + "?ref=" + urllib.parse.quote(branch, safe=""),
              )
              existing_sha = current.get("sha")
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          payload = {
              "message": f"audit: Juris recovery run {status}",
              "content": base64.b64encode(report_bytes).decode("ascii"),
              "branch": branch,
          }
          if existing_sha:
              payload["sha"] = existing_sha
          call("PUT", content_endpoint, payload)
          PY
