name: Wix Agent CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/wix-agent/**"
      - "docker-compose.yml"
      - ".github/workflows/wix-agent-ci.yml"
      - ".github/workflows/wix-auto-sync.yml"
      - ".github/workflows/wix-agent-preflight.yml"
  pull_request:
    paths:
      - "apps/wix-agent/**"
      - "docker-compose.yml"
      - ".github/workflows/wix-agent-ci.yml"
      - ".github/workflows/wix-auto-sync.yml"
      - ".github/workflows/wix-agent-preflight.yml"

permissions:
  contents: read

concurrency:
  group: wix-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: apps/wix-agent/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r apps/wix-agent/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q apps/wix-agent

      - name: Run regression tests
        run: python -m unittest discover -s apps/wix-agent/tests -v

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Wix agent image
        run: docker build --tag dominion/wix-agent:ci apps/wix-agent
