name: Wix Agent — Governed Runtime Repair

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/repair_wix_runtime.sh'
      - '.github/workflows/wix-agent-runtime-repair.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/repair_wix_runtime.sh'
      - '.github/workflows/wix-agent-runtime-repair.yml'

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

env:
  WIX_SITE_ID_CANONICAL: a790d430-a3a0-4b0e-9be6-4c874c229167

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate governed record-only repair
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile apps/wix-agent/*.py
          bash -n scripts/repair_wix_runtime.sh
          grep -Fq 'WIX_FULFILLMENT_MODE=record_only' scripts/repair_wix_runtime.sh
          grep -Fq '127.0.0.1:18082:8000' scripts/repair_wix_runtime.sh
          grep -Fq '127.0.0.1:8082/ready' scripts/repair_wix_runtime.sh
          grep -Fq 'docker compose' scripts/repair_wix_runtime.sh
          grep -Fq -- '--no-build --force-recreate wix-agent' scripts/repair_wix_runtime.sh
          grep -Fq 'WIX_RUNTIME_REPAIR=ROLLBACK' scripts/repair_wix_runtime.sh
          if grep -Eq '^[[:space:]]*--privileged([[:space:]]|$)' scripts/repair_wix_runtime.sh; then
            echo 'WIX_REPAIR_VALIDATE=HOLD reason=privileged_container'
            exit 1
          fi
          if grep -Eq 'WIX_FULFILLMENT_MODE=(live|enabled)' scripts/repair_wix_runtime.sh; then
            echo 'WIX_REPAIR_VALIDATE=HOLD reason=live_fulfillment_forbidden'
            exit 1
          fi
          echo 'WIX_REPAIR_VALIDATE=PASS'

  repair:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: foundation-vm-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require protected credentials and configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" && test -n "$VM_USER" && test -n "$VM_SSH_KEY"
          test -n "$WIX_API_KEY" || { echo 'WIX_RUNTIME_REPAIR=HOLD reason=wix_api_key_missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stage exact candidate, repair script, and protected API key
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/wix-agent-${GITHUB_SHA}.tgz" apps/wix-agent
          umask 077
          printf 'WIX_API_KEY=%s\n' "$WIX_API_KEY" > "$RUNNER_TEMP/wix-api-key.env"
          scp_opts=(-i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${scp_opts[@]}" "$RUNNER_TEMP/wix-agent-${GITHUB_SHA}.tgz" "$VM_USER@$VM_HOST:/tmp/wix-agent-${GITHUB_RUN_ID}.tgz"
          scp "${scp_opts[@]}" "$RUNNER_TEMP/wix-api-key.env" "$VM_USER@$VM_HOST:/tmp/wix-api-key-${GITHUB_RUN_ID}.env"
          scp "${scp_opts[@]}" scripts/repair_wix_runtime.sh "$VM_USER@$VM_HOST:/tmp/repair-wix-runtime-${GITHUB_RUN_ID}.sh"
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" "chmod 600 '/tmp/wix-agent-${GITHUB_RUN_ID}.tgz' '/tmp/wix-api-key-${GITHUB_RUN_ID}.env'; chmod 700 '/tmp/repair-wix-runtime-${GITHUB_RUN_ID}.sh'"
          rm -f "$RUNNER_TEMP/wix-api-key.env"

      - name: Preflight isolated candidate and perform governed record-only cutover
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ github.sha }}
          WIX_SITE_ID: ${{ env.WIX_SITE_ID_CANONICAL }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "$VM_USER@$VM_HOST" \
            "RELEASE_SHA='$RELEASE_SHA' WIX_SITE_ID='$WIX_SITE_ID' RUN_ID='$GITHUB_RUN_ID' bash '/tmp/repair-wix-runtime-${GITHUB_RUN_ID}.sh'"

      - name: Remove temporary SSH and staged material
        if: always()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          rm -f "$HOME/.ssh/foundation_vm_key" "$RUNNER_TEMP/wix-api-key.env" "$RUNNER_TEMP"/wix-agent-*.tgz
          if [ -n "${VM_HOST:-}" ] && [ -n "${VM_USER:-}" ] && [ -f "$HOME/.ssh/known_hosts" ]; then
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$VM_USER@$VM_HOST" "rm -f '/tmp/repair-wix-runtime-${GITHUB_RUN_ID}.sh' '/tmp/wix-agent-${GITHUB_RUN_ID}.tgz' '/tmp/wix-api-key-${GITHUB_RUN_ID}.env'" || true
          fi
