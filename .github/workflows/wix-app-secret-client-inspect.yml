name: Wix App Secret Client Inspect

on:
  pull_request:
    paths:
      - ".github/workflows/wix-app-secret-client-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Probe Wix Dev Center secret route without exposing secret
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_ACCOUNT_ID: "40d4b193-49a5-4717-8fdb-3ef9383e2cb1"
          APP_ID: "5c72cb8a-686d-4dd2-8ec5-8985e7f55f01"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIX_API_KEY"
          [[ "$WIX_ACCOUNT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$APP_ID" =~ ^[0-9a-fA-F-]{36}$ ]]

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          probe() {
            host="$1"
            label="$2"
            out="$work/$label.json"
            code="$(curl -sS -o "$out" -w '%{http_code}'               -H "Authorization: $WIX_API_KEY"               -H "wix-account-id: $WIX_ACCOUNT_ID"               -H "Accept: application/json"               "$host/apps-service/v1/apps/$APP_ID?withSecrets=true" || true)"
            app_id="$(jq -r '.app.id // empty' "$out" 2>/dev/null || true)"
            has_secret="$(jq -r '(.app.appSecrets.appSecret // "") | length > 0' "$out" 2>/dev/null || echo false)"
            echo "WIX_APP_SECRET_ROUTE_PROBE host=$label http=$code app_match=$([ "$app_id" = "$APP_ID" ] && echo true || echo false) secret_present=$has_secret"
            if [ "$code" = "200" ] && [ "$app_id" = "$APP_ID" ] && [ "$has_secret" = "true" ]; then
              echo "WIX_APP_SECRET_ROUTE=PASS host=$label secret_exposed=false"
              return 0
            fi
            return 1
          }

          probe "https://manage.wix.com" "manage.wix.com" && exit 0
          probe "https://www.wix.com" "www.wix.com" && exit 0
          probe "https://www.wixapis.com" "www.wixapis.com" && exit 0

          echo "WIX_APP_SECRET_ROUTE=FAIL"
          exit 1
