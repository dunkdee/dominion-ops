name: Wix App Secret Client Inspect

on:
  pull_request:
    paths:
      - ".github/workflows/wix-app-secret-client-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Inspect Wix bundled Dev Center app transport
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          npm pack @wix/create-new@0.0.113 >/dev/null
          tar -xzf wix-create-new-0.0.113.tgz
          python3 - <<'PY'
          from pathlib import Path
          import re

          code=Path("package/build/index.js").read_text(encoding="utf-8", errors="replace")
          needles=[
              "withSecrets",
              "appSecrets",
              "devcenter-apps-v1-app",
              "/apps/v1/",
              "getApp:",
              "GetApp",
          ]
          found=0
          for needle in needles:
              start=0
              while True:
                  i=code.find(needle,start)
                  if i<0:
                      break
                  found+=1
                  lo=max(0,i-2500)
                  hi=min(len(code),i+5000)
                  print(f"===== NEEDLE {needle} INDEX {i} =====")
                  print(code[lo:hi])
                  print(f"===== END NEEDLE {needle} =====")
                  start=i+len(needle)
                  if found>=40:
                      break
              if found>=40:
                  break

          urls=sorted(set(re.findall(r'https?://[^"\'\x60\s\\]+',code)))
          for u in urls:
              if "wix" in u.lower() and ("app" in u.lower() or "devcenter" in u.lower()):
                  print("WIX_URL",u)

          paths=sorted(set(re.findall(r'/(?:[^"\'\x60\\\s]{0,80})(?:apps|devcenter)(?:[^"\'\x60\\\s]{0,120})',code,re.I)))
          for p in paths[:200]:
              print("WIX_PATH",p)

          if found==0:
              raise SystemExit("no relevant transport strings found")
          print(f"WIX_APP_SECRET_BUNDLE_INSPECT=PASS matches={found}")
          PY
