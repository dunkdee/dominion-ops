name: Wix App Secret Client Inspect

on:
  pull_request:
    paths:
      - ".github/workflows/wix-app-secret-client-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Inspect Wix installed client packages
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null
          npm install --silent @wix/create-new@0.0.113 @wix/cli@latest
          node <<'JS'
          const fs=require('fs');
          const path=require('path');
          const mods=[
            '@wix/cli-http-client',
            '@wix/ambassador-devcenter-apps-v1-app',
            '@wix/ambassador-devcenter-apps-v1-app/http',
            '@wix/create-new',
            '@wix/cli'
          ];
          for(const m of mods){
            try{
              const resolved=require.resolve(m);
              console.log('RESOLVE',m,resolved);
              try{
                const pkgPath=require.resolve(m.split('/http')[0]+'/package.json');
                const pkg=JSON.parse(fs.readFileSync(pkgPath,'utf8'));
                console.log('PACKAGE',m,JSON.stringify({name:pkg.name,version:pkg.version,exports:pkg.exports,main:pkg.main,module:pkg.module},null,2));
              }catch(e){console.log('PACKAGE_ERR',m,String(e))}
              try{
                const mod=require(m);
                console.log('EXPORT_KEYS',m,Object.keys(mod).sort());
              }catch(e){console.log('REQUIRE_ERR',m,String(e))}
            }catch(e){
              console.log('RESOLVE_ERR',m,String(e));
            }
          }
          JS

          http_pkg="$(node -p "require.resolve('@wix/cli-http-client/package.json')" 2>/dev/null || true)"
          if [ -n "$http_pkg" ]; then
            http_dir="$(dirname "$http_pkg")"
            echo "HTTP_CLIENT_DIR=$http_dir"
            find "$http_dir" -maxdepth 2 -type f -name '*.js' -o -name '*.mjs' | sort | head -80
            grep -R -n -E "create.*Http|api.?key|authorization|login|token|host" "$http_dir" --include='*.js' --include='*.mjs' | head -200 || true
          fi

          app_pkg="$(node -p "require.resolve('@wix/ambassador-devcenter-apps-v1-app/package.json')" 2>/dev/null || true)"
          if [ -n "$app_pkg" ]; then
            app_dir="$(dirname "$app_pkg")"
            echo "APP_CLIENT_DIR=$app_dir"
            grep -R -n -E "withSecrets|protoPath|apps-service|GetApp" "$app_dir" --include='*.js' --include='*.mjs' | head -240 || true
          fi

          echo "WIX_INSTALLED_CLIENT_INSPECT=PASS"
