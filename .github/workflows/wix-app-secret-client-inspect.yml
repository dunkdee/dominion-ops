name: Wix App Secret Client Inspect

on:
  pull_request:
    paths:
      - ".github/workflows/wix-app-secret-client-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Inspect Wix Dev Center app client source
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          npm pack @wix/create-new@0.0.113 >/dev/null
          tar -xzf wix-create-new-0.0.113.tgz
          python3 - <<'PY'
          import json
          from pathlib import Path

          sm=json.loads(Path("package/build/index.js.map").read_text(encoding="utf-8"))
          wanted=(
              "dev-center-client/src/dev-center-client.ts",
              "ambassador-devcenter-apps-v1-app/http.impl.ts",
              "ambassador-devcenter-apps-v1-app/http.ts",
              "ambassador-devcenter-apps-v1-app/types.impl.ts",
              "ambassador-devcenter-apps-v1-app/types.ts",
          )
          matched=0
          for i,source in enumerate(sm.get("sources",[])):
              if any(source.endswith(x) for x in wanted):
                  matched+=1
                  print(f"===== SOURCE {source} =====")
                  content=(sm.get("sourcesContent") or [])[i]
                  print(content or "<NO_SOURCE_CONTENT>")
                  print(f"===== END SOURCE {source} =====")
          if matched < 2:
              raise SystemExit(f"expected >=2 relevant sources, got {matched}")
          print(f"WIX_APP_SECRET_CLIENT_INSPECT=PASS matched={matched}")
          PY
