name: Wix Attribution Embedded Script Activate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  activate:
    if: >-
      github.event.issue.number == 367 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'RUN_WIX_ATTRIBUTION_EMBED_ACTIVATE:')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Bind authorization to exact current main
        id: auth
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$COMMENT_USER" = "$GITHUB_REPOSITORY_OWNER"
          test "$AUTHOR_ASSOCIATION" = "OWNER"
          main_sha="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/main" | jq -r '.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          expected="RUN_WIX_ATTRIBUTION_EMBED_ACTIVATE:$main_sha:ACTIVATE"
          test "$COMMENT_BODY" = "$expected"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "WIX_ATTRIBUTION_EMBED_AUTH=PASS main_sha=$main_sha actor=$COMMENT_USER"

      - name: Checkout exact current main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.auth.outputs.main_sha }}
          persist-credentials: false

      - name: Resolve installed app token without exposing it
        id: app
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: "a790d430-a3a0-4b0e-9be6-4c874c229167"
          APP_ID: "5c72cb8a-686d-4dd2-8ec5-8985e7f55f01"
        run: |
          set -euo pipefail
          test -n "$WIX_API_KEY"
          [[ "$WIX_SITE_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$APP_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          file="$RUNNER_TEMP/wix-installed-apps.json"
          curl -fsSL \
            -H "Authorization: $WIX_API_KEY" \
            -H "wix-site-id: $WIX_SITE_ID" \
            -H "Content-Type: application/json" \
            "https://www.wixapis.com/apps-installer-service/v1/app-instances" > "$file"
          count="$(jq --arg app "$APP_ID" '[.appInstances[]? | select(.appDefId == $app)] | length' "$file")"
          test "$count" = "1"
          app_token="$(jq -r --arg app "$APP_ID" '.appInstances[] | select(.appDefId == $app) | .appToken // empty' "$file")"
          version="$(jq -r --arg app "$APP_ID" '.appInstances[] | select(.appDefId == $app) | .version // empty' "$file")"
          enabled="$(jq -r --arg app "$APP_ID" '.appInstances[] | select(.appDefId == $app) | .enabled // false' "$file")"
          test -n "$app_token"
          test "$enabled" = "true"
          echo "::add-mask::$app_token"
          printf '%s' "$app_token" > "$RUNNER_TEMP/dominion-attribution-app-token"
          chmod 600 "$RUNNER_TEMP/dominion-attribution-app-token"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "WIX_ATTRIBUTION_APP_INSTANCE=PASS app_id=$APP_ID version=$version enabled=$enabled token_exposed=false"

      - name: Activate exact embedded script as installed app
        id: embed
        env:
          COMPONENT_ID: "c50757c2-9f64-46f8-891d-a87abfcdba0a"
        run: |
          set -euo pipefail
          [[ "$COMPONENT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          token_file="$RUNNER_TEMP/dominion-attribution-app-token"
          test -s "$token_file"
          app_token="$(cat "$token_file")"
          echo "::add-mask::$app_token"
          body='{"properties":{"parameters":{},"disabled":false}}'
          response="$RUNNER_TEMP/embed-response.json"
          curl -fsSL -X POST \
            -H "Authorization: $app_token" \
            -H "Content-Type: application/json" \
            --data-binary "$body" \
            "https://www.wixapis.com/apps/v1/scripts?componentId=$COMPONENT_ID" > "$response"
          disabled="$(jq -r '.properties.disabled // false' "$response")"
          test "$disabled" = "false"
          echo "WIX_ATTRIBUTION_EMBED_ACTIVATE=PASS component_id=$COMPONENT_ID disabled=$disabled"

      - name: Read back embedded script as installed app
        id: verify
        env:
          COMPONENT_ID: "c50757c2-9f64-46f8-891d-a87abfcdba0a"
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/dominion-attribution-app-token"
          test -s "$token_file"
          app_token="$(cat "$token_file")"
          echo "::add-mask::$app_token"
          response="$RUNNER_TEMP/embed-verify.json"
          curl -fsSL \
            -H "Authorization: $app_token" \
            "https://www.wixapis.com/apps/v1/scripts?componentId=$COMPONENT_ID" > "$response"
          disabled="$(jq -r '.properties.disabled // false' "$response")"
          test "$disabled" = "false"
          echo "WIX_ATTRIBUTION_EMBED_READBACK=PASS component_id=$COMPONENT_ID disabled=$disabled"

      - name: Remove ephemeral app token
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/dominion-attribution-app-token" "$RUNNER_TEMP/wix-installed-apps.json" "$RUNNER_TEMP/embed-response.json" "$RUNNER_TEMP/embed-verify.json"

      - name: Record activation receipt on issue 367
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.auth.outputs.main_sha }}
          APP_VERSION: ${{ steps.app.outputs.version }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ## Wix native embedded attribution — activation PASS

          - exact main: `$MAIN_SHA`
          - app: `5c72cb8a-686d-4dd2-8ec5-8985e7f55f01`
          - installed version: `$APP_VERSION`
          - component: `c50757c2-9f64-46f8-891d-a87abfcdba0a`
          - `WIX_ATTRIBUTION_EMBED_ACTIVATE=PASS`
          - `WIX_ATTRIBUTION_EMBED_READBACK=PASS`
          - app token remained ephemeral and was not logged or persisted

          This proves activation/read-back only. Issue #367 remains open until live publication and a zero-spend native `WIX_CHECKOUT_LINK` runtime receipt are proven.
          EOF
          )"
          jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/comment.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/367/comments" >/dev/null
