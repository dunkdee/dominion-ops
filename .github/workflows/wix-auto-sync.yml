name: Wix inventory and fulfillment monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-auto-sync-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate VM connection secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"

      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run authenticated production checks
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            "$VM_USER@$VM_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/dominion-ops"
          set -a
          . ./.env
          set +a

          test -n "${WIX_AGENT_OPERATOR_TOKEN:-}"
          auth_header="X-Operator-Token: ${WIX_AGENT_OPERATOR_TOKEN}"

          curl -fsS http://127.0.0.1:8082/ready >/tmp/wix-ready.json
          python3 -c 'import json; d=json.load(open("/tmp/wix-ready.json")); assert d["ready"] is True'

          curl -fsS -X POST \
            -H "$auth_header" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            http://127.0.0.1:8082/sync >/tmp/wix-sync.json

          echo "Supplier submission is never triggered by this scheduled workflow."

          curl -fsS \
            -H "$auth_header" \
            http://127.0.0.1:8082/fulfillments/status \
            >/tmp/wix-fulfillment-status.json
          python3 -c 'import json; d=json.load(open("/tmp/wix-fulfillment-status.json")); print("Fulfillment status counts:", d)'
          REMOTE
