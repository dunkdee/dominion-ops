name: Wix Auto Sync (Cron)

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger inventory sync and fulfillment via wix-agent
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "=== Wix Auto Sync $(date -u '+%Y-%m-%d %H:%M UTC') ==="

            # Verify wix-agent is alive
            if ! curl -sf http://localhost:8082/health > /dev/null 2>&1; then
              echo "ERROR: wix-agent not running — run the Deploy Wix Agent workflow first"
              exit 1
            fi

            echo ""
            echo "--- Inventory sync ---"
            curl -s -X POST http://localhost:8082/sync \
              -H "Content-Type: application/json" \
              --max-time 60 | python3 -m json.tool 2>/dev/null || echo "(no JSON response)"

            echo ""
            echo "--- Fulfillment cycle ---"
            curl -s -X POST http://localhost:8082/fulfill \
              -H "Content-Type: application/json" \
              --max-time 60 | python3 -m json.tool 2>/dev/null || echo "(no JSON response)"

            echo ""
            echo "--- Dashboard ---"
            curl -s http://localhost:8082/dashboard | python3 -m json.tool 2>/dev/null || true

            echo ""
            echo "=== Done ==="
