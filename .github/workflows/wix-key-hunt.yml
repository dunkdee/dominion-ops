name: Hunt WIX API Key

on:
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Deep search every location for WIX_API_KEY
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 120s
          script: |
            echo "=== HUNTING WIX_API_KEY ==="

            echo ""
            echo "--- /proc running processes ---"
            for f in /proc/[0-9]*/environ; do
              val=$(tr '\0' '\n' < "$f" 2>/dev/null | grep '^WIX_API_KEY=' | cut -d= -f2-)
              if [ -n "$val" ]; then
                pid=$(echo "$f" | cut -d/ -f3)
                cmd=$(cat /proc/$pid/cmdline 2>/dev/null | tr '\0' ' ' | head -c 80)
                echo "FOUND in PID $pid ($cmd): WIX_API_KEY=***REDACTED*** (${#val} chars)"
              fi
            done

            echo ""
            echo "--- grep /home /opt /root /etc (all text files) ---"
            grep -rl 'WIX_API_KEY' /home /opt /root /etc 2>/dev/null \
              | grep -v '/.git/' | grep -v '__pycache__' | grep -v '.pyc' \
              | while read f; do
                  echo "FOUND: $f"
                  grep 'WIX_API_KEY' "$f" 2>/dev/null | sed 's/=.*/=***REDACTED***/' | head -3
                done

            echo ""
            echo "--- systemd unit/env files ---"
            find /etc/systemd /lib/systemd /home -type f \( -name '*.service' -o -name '*.env' -o -name '*.conf' \) 2>/dev/null \
              | xargs grep -l 'WIX' 2>/dev/null \
              | while read f; do
                  echo "FOUND systemd: $f"
                  grep 'WIX' "$f" | sed 's/=.*/=***REDACTED***/'
                done

            echo ""
            echo "--- docker container envs ---"
            for cid in $(docker ps -aq 2>/dev/null); do
              name=$(docker inspect --format '{{.Name}}' "$cid" 2>/dev/null)
              docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$cid" 2>/dev/null \
                | grep 'WIX' | sed 's/=.*/=***REDACTED***/' \
                | while read line; do echo "FOUND in $name: $line"; done
            done

            echo ""
            echo "--- docker-compose files ---"
            find /home /opt /root -name 'docker-compose*.yml' -o -name 'docker-compose*.yaml' 2>/dev/null \
              | xargs grep -l 'WIX' 2>/dev/null \
              | while read f; do
                  echo "FOUND compose: $f"
                  grep 'WIX' "$f" | sed 's/=.*/=***REDACTED***/'
                done

            echo ""
            echo "--- login shell env ---"
            bash -l -c 'echo "WIX_API_KEY in login env: ${#WIX_API_KEY} chars"'

            echo ""
            echo "=== Done. If nothing found, key no longer exists on VM. ==="
            echo "Get it fresh from Wix: manage.wix.com > Settings > Advanced > API Keys"
