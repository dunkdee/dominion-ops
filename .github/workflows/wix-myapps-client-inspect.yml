name: Wix My Apps Client Inspect

on:
  pull_request:
    paths:
      - ".github/workflows/wix-myapps-client-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Inspect public Wix route resolver
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          npm pack @wix/create-new@0.0.113 >/dev/null
          tar -xzf wix-create-new-0.0.113.tgz
          python3 - <<'PY'
          import json
          from pathlib import Path

          found = 0
          for map_path in sorted(Path("package/build").glob("*.js.map")):
              try:
                  sm = json.loads(map_path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              for source, body in zip(sm.get("sources", []), sm.get("sourcesContent", [])):
                  if not body:
                      continue
                  if (
                      "function resolveUrl" in body
                      or "const resolveUrl" in body
                      or "export const resolveUrl" in body
                      or "export function resolveUrl" in body
                  ):
                      found += 1
                      print(f"===== RESOLVER SOURCE {map_path.name} :: {source} =====")
                      # Resolver source is small enough to print completely; if not, cap around symbol.
                      idxs = [i for i in (
                          body.find("function resolveUrl"),
                          body.find("const resolveUrl"),
                          body.find("export const resolveUrl"),
                          body.find("export function resolveUrl"),
                      ) if i >= 0]
                      idx = min(idxs) if idxs else 0
                      print(body[max(0, idx-6000):min(len(body), idx+16000)])
                      print(f"===== END RESOLVER SOURCE {source} =====")
          if found == 0:
              raise SystemExit("resolveUrl source not found in public source maps")
          print(f"WIX_ROUTE_RESOLVER_INSPECT=PASS sources={found}")
          PY
