name: Wix My Apps Client Inspect

on:
  pull_request:
    paths:
      - ".github/workflows/wix-myapps-client-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Inspect public Wix My Apps compiled request
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          npm pack @wix/create-new@0.0.113 >/dev/null
          tar -xzf wix-create-new-0.0.113.tgz
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path("package/build")
          files = sorted(root.glob("*.js"))
          needles = (
              "queryMyApps",
              "devcenter-myapps",
              "myapps",
              "my-app",
              "updatedDate",
          )
          hits = 0
          for path in files:
              text = path.read_text(encoding="utf-8", errors="replace")
              positions = []
              low = text.lower()
              for needle in needles:
                  start = 0
                  while True:
                      pos = low.find(needle.lower(), start)
                      if pos < 0:
                          break
                      positions.append((pos, needle))
                      start = pos + len(needle)
              # De-duplicate overlapping windows.
              positions.sort()
              emitted = []
              for pos, needle in positions:
                  if any(abs(pos - prior) < 5000 for prior in emitted):
                      continue
                  emitted.append(pos)
                  hits += 1
                  lo = max(0, pos - 8000)
                  hi = min(len(text), pos + 14000)
                  print(f"===== COMPILED {path.name} needle={needle} pos={pos} =====")
                  print(text[lo:hi])
                  print(f"===== END COMPILED {path.name} =====")

          # Print all likely Wix API route literals containing app/my-app/devcenter.
          route_re = re.compile(r'["\x27\x60]([^"\x27\x60]{0,240}(?:myapps|my-app|devcenter)[^"\x27\x60]{0,240})["\x27\x60]', re.I)
          routes = []
          for path in files:
              text = path.read_text(encoding="utf-8", errors="replace")
              for m in route_re.finditer(text):
                  value = m.group(1)
                  if value not in routes:
                      routes.append(value)
          print("===== CANDIDATE_ROUTE_LITERALS =====")
          for value in routes[:200]:
              print(value)
          print("===== END_CANDIDATE_ROUTE_LITERALS =====")

          if hits == 0:
              raise SystemExit("no My Apps compiled-code hits found")
          print(f"WIX_MYAPPS_COMPILED_INSPECT=PASS hits={hits} routes={len(routes)}")
          PY
