name: One-time Wix production cutover

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wix-production-cutover-20260720.yml"

permissions:
  contents: write

concurrency:
  group: wix-agent-production
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out authorized main release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve immutable release
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate and configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy immutable Wix release to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          tar -czf /tmp/wix-agent-release.tgz apps/wix-agent
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" "mkdir -p releases/wix-agent/$RELEASE_SHA"
          scp -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            /tmp/wix-agent-release.tgz \
            "$VM_USER@$VM_HOST:releases/wix-agent/$RELEASE_SHA/release.tgz"
          ssh -i ~/.ssh/id_vm -o BatchMode=yes -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "tar -xzf releases/wix-agent/$RELEASE_SHA/release.tgz -C releases/wix-agent/$RELEASE_SHA"

      - name: Execute authorized backed-up record-only cutover
        id: cutover
        continue-on-error: true
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            "$VM_USER@$VM_HOST" \
            "RELEASE_SHA=$RELEASE_SHA DEPLOYMENT_ID=$DEPLOYMENT_ID bash -se" <<'REMOTE'
          set -euo pipefail
          umask 077
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOYMENT_ID" =~ ^[0-9]+-[0-9]+$ ]]

          release_dir="$HOME/releases/wix-agent/$RELEASE_SHA/apps/wix-agent"
          source_env="$HOME/dominion-ops/.env"
          runtime_env="$HOME/.config/dominion/wix-agent.env"
          state_dir="$HOME/.local/state/dominion"
          state_file="$state_dir/wix-production-cutover-latest.env"
          image="dominion/wix-agent:$RELEASE_SHA"
          stage="INITIALIZING"
          backup_file="NONE"
          rollback_name="NONE"
          old_database_status="NOT_CHECKED"
          backup_sha256="NONE"
          deployment_slug="${RELEASE_SHA:0:12}-${DEPLOYMENT_ID}"
          new_data_volume="wix_agent_data_${deployment_slug}"
          new_logs_volume="wix_agent_logs_${deployment_slug}"
          candidate="wix-agent-candidate-${deployment_slug}"
          candidate_data="${candidate}-data"
          candidate_logs="${candidate}-logs"
          mkdir -p "$state_dir"

          write_state() {
            {
              printf 'RELEASE_SHA=%s\n' "$RELEASE_SHA"
              printf 'DEPLOYMENT_ID=%s\n' "$DEPLOYMENT_ID"
              printf 'STAGE=%s\n' "$stage"
              printf 'BACKUP_FILE=%s\n' "$(basename "$backup_file")"
              printf 'BACKUP_SHA256=%s\n' "$backup_sha256"
              printf 'ROLLBACK_CONTAINER=%s\n' "$rollback_name"
              printf 'OLD_DATABASE_STATUS=%s\n' "$old_database_status"
              printf 'NEW_DATA_VOLUME=%s\n' "$new_data_volume"
              printf 'UPDATED_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > "$state_file"
            chmod 600 "$state_file"
          }
          write_state

          cleanup_candidate() {
            docker rm -f "$candidate" >/dev/null 2>&1 || true
            docker volume rm "$candidate_data" "$candidate_logs" \
              >/dev/null 2>&1 || true
          }

          fail_before_cutover() {
            exit_code=$?
            trap - ERR INT TERM HUP
            set +e
            if [ "$exit_code" -eq 0 ]; then
              exit_code=1
            fi
            cleanup_candidate
            stage="FAILED_BEFORE_CUTOVER"
            write_state
            exit "$exit_code"
          }
          trap fail_before_cutover ERR INT TERM HUP

          test -d "$release_dir"
          test -f "$source_env"
          test "$(docker inspect -f '{{.State.Running}}' wix-agent)" = "true"

          python3 - "$source_env" <<'PYENV'
          import os
          import secrets
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()

          def current(key):
              prefix = key + "="
              values = [line[len(prefix):] for line in lines if line.startswith(prefix)]
              return values[-1] if values else ""

          def replace(key, value):
              prefix = key + "="
              lines[:] = [line for line in lines if not line.startswith(prefix)]
              lines.append(prefix + value)

          if not current("WIX_AGENT_OPERATOR_TOKEN"):
              replace("WIX_AGENT_OPERATOR_TOKEN", secrets.token_urlsafe(48))
          replace("WIX_FULFILLMENT_MODE", "record_only")

          temp = path.with_suffix(path.suffix + ".cutover")
          temp.write_text("\n".join(lines) + "\n", encoding="utf-8")
          os.chmod(temp, 0o600)
          os.replace(temp, path)
          PYENV
          chmod 600 "$source_env"

          mkdir -p "$(dirname "$runtime_env")"
          python3 - "$source_env" "$runtime_env" <<'PYRUNTIME'
          import os
          import sys
          from pathlib import Path

          allowed = {
              "WIX_API_KEY",
              "WIX_SITE_ID",
              "WIX_AGENT_OPERATOR_TOKEN",
              "WIX_FULFILLMENT_MODE",
              "N8N_WEBHOOK_URL",
          }
          source = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          selected = []
          seen = set()
          for line in reversed(source):
              key = line.partition("=")[0]
              if key in allowed and key not in seen:
                  selected.append(line)
                  seen.add(key)
          selected.reverse()
          target = Path(sys.argv[2])
          target.write_text("\n".join(selected) + "\n", encoding="utf-8")
          os.chmod(target, 0o600)
          PYRUNTIME

          python3 - "$runtime_env" <<'PYVALIDATE'
          import sys
          from pathlib import Path

          values = {}
          for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              key, separator, value = line.partition("=")
              if separator:
                  values[key] = value
          for key in ("WIX_API_KEY", "WIX_SITE_ID", "WIX_AGENT_OPERATOR_TOKEN"):
              if not values.get(key):
                  raise SystemExit(f"Required Wix setting is missing: {key}")
          if values.get("WIX_FULFILLMENT_MODE") != "record_only":
              raise SystemExit("Fulfillment mode is not record_only")
          PYVALIDATE

          stage="BUILDING_CANDIDATE"
          write_state
          docker build --tag "$image" "$release_dir"
          mapfile -t networks < <(
            docker inspect wix-agent \
              --format '{{range $name, $config := .NetworkSettings.Networks}}{{println $name}}{{end}}'
          )
          test "${#networks[@]}" -eq 1
          network="${networks[0]}"
          test -n "$network"

          cleanup_candidate
          docker volume create "$candidate_data" >/dev/null
          docker volume create "$candidate_logs" >/dev/null
          docker run -d --name "$candidate" \
            --network "$network" \
            --publish 127.0.0.1:18082:8000 \
            --read-only \
            --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 512m \
            --cpus 1.0 \
            --env-file "$runtime_env" \
            --env WIX_FULFILLMENT_MODE=record_only \
            --env ZENDROP_API_KEY= \
            --env ZENDROP_VARIANT_MAP_JSON= \
            --env WIX_AGENT_DB=/data/wix_agent.db \
            --env BABY_API_URL=http://baby-api:8080 \
            --volume "$candidate_data:/data" \
            --volume "$candidate_logs:/app/logs" \
            "$image" >/dev/null

          attempt=0
          until curl -fsS http://127.0.0.1:18082/ready \
            >/tmp/wix-candidate-ready.json; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 20 ]; then
              exit 1
            fi
            sleep 2
          done
          python3 -c 'import json; d=json.load(open("/tmp/wix-candidate-ready.json")); assert d["ready"] is True; assert d["catalog"]["version"] == "v3"; assert d["fulfillment"]["mode"] == "record_only"'
          operator_token="$(python3 -c 'import sys; print(next(line.split("=",1)[1] for line in open(sys.argv[1]) if line.startswith("WIX_AGENT_OPERATOR_TOKEN=")), end="")' "$runtime_env")"
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:18082/fulfillments/status)" = "401"
          curl -fsS -H "X-Operator-Token: $operator_token" \
            http://127.0.0.1:18082/fulfillments/status >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "X-Operator-Token: $operator_token" \
            http://127.0.0.1:18082/fulfill)" = "409"
          cleanup_candidate

          stage="BACKING_UP_EXISTING_DATABASE"
          write_state
          database_backup_result="$(docker exec -i wix-agent python - <<'PYDB'
          import os
          import sqlite3
          from pathlib import Path

          configured = os.getenv("WIX_AGENT_DB", "")
          candidates = []
          for raw in (configured, "/data/wix_agent.db", "/app/wix_agent.db"):
              if raw:
                  path = Path(raw)
                  if path not in candidates:
                      candidates.append(path)
          for root in (Path("/data"), Path("/app")):
              if root.is_dir():
                  for path in root.rglob("*.db"):
                      if path not in candidates:
                          candidates.append(path)

          valid = []
          for path in candidates:
              if not path.is_file():
                  continue
              try:
                  with sqlite3.connect(path) as connection:
                      result = connection.execute("PRAGMA quick_check").fetchone()[0]
                  if result == "ok":
                      valid.append(path)
              except sqlite3.Error:
                  continue

          preferred = Path(configured) if configured else None
          if preferred in valid:
              source = preferred
          elif len(valid) == 1:
              source = valid[0]
          elif not valid:
              print("NONE")
              raise SystemExit(0)
          else:
              print("AMBIGUOUS")
              raise SystemExit(2)

          destination = Path("/tmp/wix_agent_cutover_backup.db")
          destination.unlink(missing_ok=True)
          with sqlite3.connect(source) as source_connection:
              with sqlite3.connect(destination) as destination_connection:
                  source_connection.backup(destination_connection)
          with sqlite3.connect(destination) as connection:
              if connection.execute("PRAGMA quick_check").fetchone()[0] != "ok":
                  raise SystemExit(3)
          print("BACKED_UP")
          PYDB
          )"

          backup_dir="$HOME/backups/wix-agent"
          mkdir -p "$backup_dir"
          case "$database_backup_result" in
            BACKED_UP)
              backup_file="$backup_dir/wix_agent_$(date -u +%Y%m%dT%H%M%SZ).db"
              docker cp wix-agent:/tmp/wix_agent_cutover_backup.db "$backup_file"
              docker exec wix-agent python -c \
                'from pathlib import Path; Path("/tmp/wix_agent_cutover_backup.db").unlink(missing_ok=True)'
              chmod 600 "$backup_file"
              python3 -c 'import sqlite3,sys; c=sqlite3.connect(sys.argv[1]); assert c.execute("PRAGMA quick_check").fetchone()[0] == "ok"' "$backup_file"
              backup_sha256="$(sha256sum "$backup_file" | awk '{print $1}')"
              [[ "$backup_sha256" =~ ^[0-9a-f]{64}$ ]]
              old_database_status="BACKED_UP_AND_VERIFIED"
              ;;
            NONE)
              old_database_status="NO_EXISTING_SQLITE_DATABASE"
              ;;
            *)
              old_database_status="BACKUP_FAILED"
              false
              ;;
          esac
          write_state

          docker volume create "$new_data_volume" >/dev/null
          docker volume create "$new_logs_volume" >/dev/null
          docker run --rm --user 0 --read-only \
            --volume "$new_data_volume:/data" \
            --volume "$new_logs_volume:/app/logs" \
            "$image" python -c \
            'import os; os.chown("/data", 10001, 10001); os.chown("/app/logs", 10001, 10001); os.chmod("/data", 0o700); os.chmod("/app/logs", 0o700)'
          if [ "$old_database_status" = "BACKED_UP_AND_VERIFIED" ]; then
            docker run --rm --user 0 \
              --volume "$new_data_volume:/data" \
              --volume "$backup_file:/backup/source.db:ro" \
              "$image" python -c \
              'import os,shutil; shutil.copyfile("/backup/source.db", "/data/wix_agent.db"); os.chown("/data/wix_agent.db", 10001, 10001); os.chmod("/data/wix_agent.db", 0o600)'
          fi
          docker run --rm \
            --env-file "$runtime_env" \
            --env WIX_FULFILLMENT_MODE=record_only \
            --env ZENDROP_API_KEY= \
            --env ZENDROP_VARIANT_MAP_JSON= \
            --env WIX_AGENT_DB=/data/wix_agent.db \
            --volume "$new_data_volume:/data" \
            "$image" python -c \
            'import fulfillment; fulfillment.init_db(); assert fulfillment.database_health()["status"] == "ok"'

          stage="BACKUP_AND_NEW_DATABASE_VERIFIED"
          write_state

          rollback_name="wix-agent-rollback-$(date -u +%Y%m%dT%H%M%SZ)"
          renamed=0
          rollback_cutover() {
            exit_code=$?
            trap - ERR INT TERM HUP
            set +e
            if [ "$exit_code" -eq 0 ]; then
              exit_code=1
            fi
            if docker inspect "$rollback_name" >/dev/null 2>&1; then
              renamed=1
            fi
            rollback_ok=0
            if [ "$renamed" -eq 1 ]; then
              docker rm -f wix-agent >/dev/null 2>&1 || true
              if docker rename "$rollback_name" wix-agent \
                && docker start wix-agent >/dev/null \
                && test "$(docker inspect -f '{{.State.Running}}' wix-agent 2>/dev/null)" = "true"; then
                rollback_ok=1
              fi
            else
              if docker start wix-agent >/dev/null 2>&1 \
                && test "$(docker inspect -f '{{.State.Running}}' wix-agent 2>/dev/null)" = "true"; then
                rollback_ok=1
              fi
            fi
            if [ "$rollback_ok" -eq 1 ]; then
              stage="ROLLED_BACK_TO_PREVIOUS_CONTAINER"
            else
              stage="ROLLBACK_FAILED_REQUIRES_OPERATOR"
            fi
            write_state
            exit "$exit_code"
          }
          trap rollback_cutover ERR INT TERM HUP

          stage="CUTOVER_STARTED"
          write_state
          docker stop wix-agent >/dev/null
          docker rename wix-agent "$rollback_name"
          renamed=1

          docker run -d --name wix-agent \
            --restart unless-stopped \
            --network "$network" \
            --publish 127.0.0.1:8082:8000 \
            --read-only \
            --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 512m \
            --cpus 1.0 \
            --env-file "$runtime_env" \
            --env WIX_FULFILLMENT_MODE=record_only \
            --env ZENDROP_API_KEY= \
            --env ZENDROP_VARIANT_MAP_JSON= \
            --env WIX_AGENT_DB=/data/wix_agent.db \
            --env BABY_API_URL=http://baby-api:8080 \
            --volume "$new_data_volume:/data" \
            --volume "$new_logs_volume:/app/logs" \
            --health-cmd 'python -c '\''import urllib.request; urllib.request.urlopen("http://localhost:8000/ready", timeout=5).read()'\'' || exit 1' \
            --health-interval 30s \
            --health-timeout 10s \
            --health-retries 3 \
            --health-start-period 20s \
            "$image" >/dev/null

          attempt=0
          until curl -fsS http://127.0.0.1:8082/ready \
            >/tmp/wix-production-ready.json; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 20 ]; then
              false
            fi
            sleep 2
          done
          python3 -c 'import json; d=json.load(open("/tmp/wix-production-ready.json")); assert d["ready"] is True; assert d["catalog"]["version"] == "v3"; assert d["fulfillment"]["mode"] == "record_only"'
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8082/fulfillments/status)" = "401"
          curl -fsS -H "X-Operator-Token: $operator_token" \
            http://127.0.0.1:8082/fulfillments/status >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "X-Operator-Token: $operator_token" \
            http://127.0.0.1:8082/fulfill)" = "409"
          test "$(docker inspect -f '{{.State.Running}}' "$rollback_name")" = "false"

          stage="SUCCESS"
          write_state
          trap - ERR INT TERM HUP
          echo "Authorized Wix record-only production cutover succeeded."
          REMOTE

      - name: Generate customer-data-free cutover report
        if: always()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          CUTOVER_OUTCOME: ${{ steps.cutover.outcome }}
          EXPECTED_RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p audit
          ssh \
            -i ~/.ssh/id_vm \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "CUTOVER_OUTCOME=$CUTOVER_OUTCOME EXPECTED_RELEASE_SHA=$EXPECTED_RELEASE_SHA python3 -" \
            > audit/wix-production-cutover-latest.md <<'PYREPORT'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          def command(*args):
              return subprocess.run(
                  args, text=True, capture_output=True, check=False
              )

          state_path = Path.home() / ".local/state/dominion/wix-production-cutover-latest.env"
          state = {}
          if state_path.is_file():
              for line in state_path.read_text(encoding="utf-8").splitlines():
                  key, separator, value = line.partition("=")
                  if separator:
                      state[key] = value

          inspection = command("docker", "inspect", "wix-agent")
          container = None
          if inspection.returncode == 0:
              container = json.loads(inspection.stdout)[0]

          environment = {}
          mounts = []
          image = "MISSING"
          running = False
          localhost_only = False
          if container:
              environment = dict(
                  item.split("=", 1)
                  for item in container.get("Config", {}).get("Env", [])
                  if "=" in item
              )
              mounts = [
                  {
                      "destination": item.get("Destination"),
                      "type": item.get("Type"),
                      "name": item.get("Name") or "bind",
                  }
                  for item in container.get("Mounts", [])
              ]
              image = container.get("Config", {}).get("Image") or "UNKNOWN"
              running = container.get("State", {}).get("Running") is True
              bindings = (
                  container.get("HostConfig", {})
                  .get("PortBindings", {})
                  .get("8000/tcp", [])
                  or []
              )
              localhost_only = bool(bindings) and all(
                  item.get("HostIp") == "127.0.0.1" for item in bindings
              )

          host_config = container.get("HostConfig", {}) if container else {}
          read_only = host_config.get("ReadonlyRootfs") is True
          no_new_privileges = "no-new-privileges" in (
              host_config.get("SecurityOpt") or []
          )
          cap_drop_all = "ALL" in (host_config.get("CapDrop") or [])
          restart_safe = (
              host_config.get("RestartPolicy", {}).get("Name") == "unless-stopped"
          )
          healthcheck_configured = bool(
              container
              and container.get("Config", {}).get("Healthcheck", {}).get("Test")
          )

          readiness_code = "unreachable"
          readiness = {}
          try:
              with urllib.request.urlopen(
                  "http://127.0.0.1:8082/ready", timeout=10
              ) as response:
                  readiness_code = str(response.status)
                  readiness = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              readiness_code = str(exc.code)
          except Exception:
              pass

          expected = os.environ.get("EXPECTED_RELEASE_SHA", "")
          outcome = os.environ.get("CUTOVER_OUTCOME", "unknown")
          release_matches = bool(expected) and expected in image
          mode = environment.get("WIX_FULFILLMENT_MODE", "UNSET")
          zendrop_credential_withheld = not bool(
              environment.get("ZENDROP_API_KEY")
          )
          db_mount = next(
              (item for item in mounts if item["destination"] == "/data"), None
          )
          source_env = Path.home() / "dominion-ops/.env"
          runtime_env = Path.home() / ".config/dominion/wix-agent.env"
          secret_files_mode_600 = all(
              path.is_file() and (path.stat().st_mode & 0o777) == 0o600
              for path in (source_env, runtime_env)
          )

          backup_name = state.get("BACKUP_FILE", "UNKNOWN")
          backup_path = Path.home() / "backups/wix-agent" / backup_name
          backup_status = state.get("OLD_DATABASE_STATUS", "UNKNOWN")
          backup_hash = state.get("BACKUP_SHA256", "")
          backup_retained = backup_status == "NO_EXISTING_SQLITE_DATABASE"
          if backup_status == "BACKED_UP_AND_VERIFIED" and backup_path.is_file():
              import hashlib

              with backup_path.open("rb") as backup_stream:
                  digest_builder = hashlib.sha256()
                  for chunk in iter(lambda: backup_stream.read(1024 * 1024), b""):
                      digest_builder.update(chunk)
                  digest = digest_builder.hexdigest()
              backup_retained = (
                  digest == backup_hash
                  and (backup_path.stat().st_mode & 0o777) == 0o600
              )

          rollback_name = state.get("ROLLBACK_CONTAINER", "")
          rollback_inspection = command("docker", "inspect", rollback_name)
          rollback_retained = False
          if rollback_inspection.returncode == 0:
              rollback = json.loads(rollback_inspection.stdout)[0]
              rollback_retained = rollback.get("State", {}).get("Running") is False

          print("# Wix Production Cutover Report")
          print()
          print(f"- Generated: {datetime.now(timezone.utc).isoformat()}")
          print("- Customer/order data: **EXCLUDED**")
          print("- API keys and secret values: **EXCLUDED**")
          print(f"- Workflow cutover outcome: **{outcome.upper()}**")
          print(f"- Cutover state: **{state.get('STAGE', 'UNKNOWN')}**")
          print(f"- Expected release: **{expected or 'UNKNOWN'}**")
          print(f"- Running image matches release: **{release_matches}**")
          print()
          print("## Production verification")
          print()
          print("| Gate | Status |")
          print("|---|---:|")
