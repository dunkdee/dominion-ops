      - name: Store authorized report in private audit branch
        if: always()
        run: |
          set -euo pipefail
          git fetch origin audit/vm-readonly-20260720
          git worktree add --detach /tmp/dominion-audit \
            origin/audit/vm-readonly-20260720
          install -D -m 600 \
            audit/wix-production-cutover-latest.md \
            /tmp/dominion-audit/audit/wix-production-cutover-latest.md
          cd /tmp/dominion-audit
          git config user.name "Dominion Cutover Bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit/wix-production-cutover-latest.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "audit: capture Wix production cutover result"
          git push origin HEAD:audit/vm-readonly-20260720

