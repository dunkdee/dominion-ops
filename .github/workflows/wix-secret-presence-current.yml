name: Wix Protected Credential Presence Probe

on:
  push:
    branches:
      - diag/wix-readiness-current-20260810
    paths:
      - '.github/workflows/wix-secret-presence-current.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: foundation-vm-production
    steps:
      - name: Report GitHub secret presence only
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          WIX_AGENT_OPERATOR_TOKEN: ${{ secrets.WIX_AGENT_OPERATOR_TOKEN }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          ZENDROP_API_KEY: ${{ secrets.ZENDROP_API_KEY }}
        run: |
          set -euo pipefail
          for name in WIX_API_KEY WIX_SITE_ID WIX_AGENT_OPERATOR_TOKEN N8N_WEBHOOK_URL ZENDROP_API_KEY; do
            if [ -n "${!name:-}" ]; then state=present; else state=missing; fi
            echo "WIX_GITHUB_SECRET name=$name state=$state"
          done

      - name: Require protected VM connection
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" && test -n "$VM_USER" && test -n "$VM_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inventory VM sources without printing values
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          python3 - "$HOME" <<'PY'
          import json,os,sys
          from pathlib import Path

          home=Path(sys.argv[1]).resolve()
          keys=['WIX_API_KEY','WIX_SITE_ID','WIX_AGENT_OPERATOR_TOKEN','N8N_WEBHOOK_URL','ZENDROP_API_KEY']
          candidates=[
              home/'.env',
              home/'dominion-ops'/'.env',
              home/'.config'/'dominion'/'wix-agent-preflight.env',
          ]

          def presence(path):
              out={k:False for k in keys}
              try:
                  text=path.read_text(encoding='utf-8',errors='replace')
              except OSError:
                  return out
              for raw in text.splitlines():
                  if '=' not in raw or raw.lstrip().startswith('#'):
                      continue
                  k,v=raw.split('=',1)
                  k=k.strip()
                  if k in out and v.strip(): out[k]=True
              return out

          for p in candidates:
              state=presence(p)
              label=str(p.relative_to(home)) if p.is_absolute() and str(p).startswith(str(home)) else str(p)
              print('WIX_VM_ENV_SOURCE='+json.dumps({'path':label,'exists':p.is_file(),'keys':state},separators=(',',':'),sort_keys=True))
          PY

          # Inspect only exact key names in the container publishing port 8082.
          container="$(docker ps --format '{{.ID}} {{.Ports}}' | awk '$0 ~ /:8082->|:8082-/ {print $1; exit}')"
          if [ -n "$container" ]; then
            docker inspect "$container" --format '{{json .Config.Env}}' | python3 - <<'PY'
          import json,sys
          keys=['WIX_API_KEY','WIX_SITE_ID','WIX_AGENT_OPERATOR_TOKEN','N8N_WEBHOOK_URL','ZENDROP_API_KEY']
          env=json.load(sys.stdin)
          parsed={}
          for item in env:
              if '=' in item:
                  k,v=item.split('=',1); parsed[k]=bool(v.strip())
          print('WIX_RUNNING_CONTAINER_KEYS='+json.dumps({k:bool(parsed.get(k)) for k in keys},separators=(',',':'),sort_keys=True))
          PY
          else
            echo 'WIX_RUNNING_CONTAINER_KEYS=HOLD reason=container_not_found'
          fi

          # Bounded recovery inventory: path and boolean key presence only.
          sudo python3 - "$HOME" <<'PY'
          import json,os,sys
          from pathlib import Path
          home=Path(sys.argv[1]).resolve()
          keys=['WIX_API_KEY','WIX_SITE_ID','WIX_AGENT_OPERATOR_TOKEN','N8N_WEBHOOK_URL','ZENDROP_API_KEY']
          roots=[home/'.config'/'dominion',home/'dominion-releases',home/'.dominion-recovery',Path('/var/lib/dominion/cutovers')]
          rows=[]; seen=set()
          for root in roots:
              if not root.exists(): continue
              for base,dirs,files in os.walk(root):
                  dirs[:]=[d for d in dirs if d not in {'.git','venv','.venv','node_modules','__pycache__'}]
                  for name in files:
                      lower=name.lower()
                      if not (name=='.env' or lower.endswith('.env') or ('wix' in lower and ('env' in lower or 'config' in lower))):
                          continue
                      p=Path(base)/name
                      try:
                          rp=p.resolve(); text=p.read_text(encoding='utf-8',errors='replace')
                      except OSError:
                          continue
                      key=str(rp)
                      if key in seen: continue
                      seen.add(key)
                      present={k:False for k in keys}
                      for raw in text.splitlines():
                          if '=' not in raw or raw.lstrip().startswith('#'): continue
                          k,v=raw.split('=',1); k=k.strip()
                          if k in present and v.strip(): present[k]=True
                      if not any(present.values()): continue
                      try: label=str(rp.relative_to(home))
                      except ValueError: label=str(rp)
                      rows.append({'path':label,'keys':present})
          rows.sort(key=lambda r:r['path'])
          print('WIX_RECOVERY_ENV_SOURCES='+json.dumps({'count':len(rows),'sources':rows},separators=(',',':'),sort_keys=True))
          PY
          REMOTE

      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/foundation_vm_key"
