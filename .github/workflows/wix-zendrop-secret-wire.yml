name: Wix Agent — Wire Zendrop Secret

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type WIRE ZENDROP SECRET"
        required: true
        type: string
      commit_sha:
        description: "Exact 40-character main commit SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: foundation-vm-production
  cancel-in-progress: false

jobs:
  wire-zendrop:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'WIRE ZENDROP SECRET' &&
      inputs.commit_sha == github.sha &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: foundation-vm-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require protected credentials and configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          ZENDROP_API_KEY: ${{ secrets.ZENDROP_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" && test -n "$VM_USER" && test -n "$VM_SSH_KEY"
          test -n "$ZENDROP_API_KEY" || { echo 'ZENDROP_WIRE=HOLD reason=zendrop_api_key_missing'; exit 1; }
          grep -Fq 'ZENDROP_API_KEY: ${ZENDROP_API_KEY:-}' docker-compose.yml
          grep -Fq 'ZENDROP_VARIANT_MAP_JSON: ${ZENDROP_VARIANT_MAP_JSON:-}' docker-compose.yml
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/foundation_vm_key"
          chmod 600 "$HOME/.ssh/foundation_vm_key"
          ssh-keyscan -T 15 -H "$VM_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stage protected Zendrop key and canonical Compose file
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          ZENDROP_API_KEY: ${{ secrets.ZENDROP_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf 'ZENDROP_API_KEY=%s\n' "$ZENDROP_API_KEY" > "$RUNNER_TEMP/zendrop-api-key.env"
          scp_opts=(-i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${scp_opts[@]}" "$RUNNER_TEMP/zendrop-api-key.env" "$VM_USER@$VM_HOST:/tmp/zendrop-api-key-${GITHUB_RUN_ID}.env"
          scp "${scp_opts[@]}" docker-compose.yml "$VM_USER@$VM_HOST:/tmp/docker-compose-zendrop-${GITHUB_RUN_ID}.yml"
          ssh -i "$HOME/.ssh/foundation_vm_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" "chmod 600 '/tmp/zendrop-api-key-${GITHUB_RUN_ID}.env'; chmod 644 '/tmp/docker-compose-zendrop-${GITHUB_RUN_ID}.yml'"
          rm -f "$RUNNER_TEMP/zendrop-api-key.env"

      - name: Install runtime handoff and verify governed state
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/foundation_vm_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "$VM_USER@$VM_HOST" "RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077
          repo="$HOME/dominion-ops"
          env_file="$repo/.env"
          compose_file="$repo/docker-compose.yml"
          compose_stage="/tmp/docker-compose-zendrop-${RUN_ID}.yml"
          compose_backup="$repo/.docker-compose.zendrop-${RUN_ID}.bak"
          key_file="/tmp/zendrop-api-key-${RUN_ID}.env"
          ready_file="/tmp/wix-zendrop-ready-${RUN_ID}.json"

          test -d "$repo/.git" && test -f "$compose_file" && test -s "$compose_stage" && test -s "$key_file"
          zendrop_key="$(sed -n 's/^ZENDROP_API_KEY=//p' "$key_file" | tail -n1)"
          test -n "$zendrop_key"

          python3 - "$env_file" "$zendrop_key" <<'PY'
          import os, stat, sys
          from pathlib import Path
          dst = Path(sys.argv[1]); value = sys.argv[2]; parent = dst.parent
          if dst.exists():
              if dst.is_symlink(): raise SystemExit('repo_env_symlink')
              st = dst.stat()
              if not stat.S_ISREG(st.st_mode): raise SystemExit('repo_env_not_regular')
              mode = stat.S_IMODE(st.st_mode); uid, gid = st.st_uid, st.st_gid
              lines = dst.read_text(errors='replace').splitlines()
          else:
              mode = 0o600; uid, gid = os.getuid(), os.getgid(); lines = []
          out=[]; replaced=False
          for raw in lines:
              key = raw.split('=',1)[0].strip() if '=' in raw and not raw.lstrip().startswith('#') else None
              if key == 'ZENDROP_API_KEY':
                  if not replaced: out.append(f'ZENDROP_API_KEY={value}'); replaced=True
              else: out.append(raw)
          if not replaced: out.append(f'ZENDROP_API_KEY={value}')
          tmp = parent / f'.{dst.name}.zendrop.{os.getpid()}.tmp'
          fd = os.open(tmp, os.O_WRONLY|os.O_CREAT|os.O_EXCL, mode)
          try:
              payload=('\n'.join(out).rstrip('\n')+'\n').encode(); os.write(fd,payload); os.fsync(fd)
              os.fchmod(fd,mode); os.fchown(fd,uid,gid)
          finally: os.close(fd)
          os.replace(tmp,dst)
          dfd=os.open(parent,os.O_RDONLY|os.O_DIRECTORY)
          try: os.fsync(dfd)
          finally: os.close(dfd)
          PY

          grep -Fqx 'WIX_FULFILLMENT_MODE=record_only' "$env_file" || { echo 'ZENDROP_WIRE=HOLD reason=fulfillment_not_record_only'; exit 1; }
          grep -Fq 'ZENDROP_API_KEY: ${ZENDROP_API_KEY:-}' "$compose_stage"
          grep -Fq 'ZENDROP_VARIANT_MAP_JSON: ${ZENDROP_VARIANT_MAP_JSON:-}' "$compose_stage"

          project="$(docker inspect wix-agent --format '{{index .Config.Labels "com.docker.compose.project"}}')"
          image="$(docker inspect wix-agent --format '{{.Config.Image}}')"
          test -n "$project" && test -n "$image"
          cp -p "$compose_file" "$compose_backup"

          rollback() {
            rc=$?
            trap - ERR
            if [ -f "$compose_backup" ]; then cp -p "$compose_backup" "$compose_file"; fi
            WIX_AGENT_IMAGE="$image" docker compose -p "$project" -f "$compose_file" --env-file "$env_file" \
              up -d --no-deps --no-build --force-recreate wix-agent >/dev/null 2>&1 || true
            rm -f "$compose_backup" "$ready_file" "$key_file" "$compose_stage"
            echo "ZENDROP_WIRE=ROLLBACK original_rc=$rc"
            exit "$rc"
          }
          trap rollback ERR

          install -m 644 "$compose_stage" "$compose_file"
          WIX_AGENT_IMAGE="$image" docker compose -p "$project" -f "$compose_file" --env-file "$env_file" \
            up -d --no-deps --no-build --force-recreate wix-agent >/dev/null

          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8082/ready > "$ready_file"; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" -eq 1 ] || { docker logs --tail 80 wix-agent; echo 'ZENDROP_WIRE=HOLD reason=runtime_not_ready'; false; }

          python3 - "$ready_file" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['ready'] is True
          assert d['catalog']['status']=='ok'
          assert str(d['catalog']['version']).lower()=='v3'
          assert d['integrations']['wix_api_key'] is True
          assert d['integrations']['wix_site_id'] is True
          assert d['integrations']['zendrop_api_key'] is True
          assert d['fulfillment']['mode']=='record_only'
          PY

          operator_token="$(sed -n 's/^WIX_AGENT_OPERATOR_TOKEN=//p' "$env_file" | tail -n1)"
          test -n "$operator_token"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "X-Operator-Token: $operator_token" http://127.0.0.1:8082/fulfill)" = '409'

          trap - ERR
          rm -f "$compose_backup" "$ready_file" "$key_file" "$compose_stage"
          echo 'ZENDROP_WIRE=PASS catalog=v3 zendrop_key=present fulfillment=record_only'
          REMOTE

      - name: Remove staged credentials
        if: always()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          if [ -n "${VM_HOST:-}" ] && [ -n "${VM_USER:-}" ] && [ -f "$HOME/.ssh/foundation_vm_key" ] && [ -f "$HOME/.ssh/known_hosts" ]; then
            ssh -i "$HOME/.ssh/foundation_vm_key" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$VM_USER@$VM_HOST" "rm -f '/tmp/zendrop-api-key-${GITHUB_RUN_ID}.env' '/tmp/docker-compose-zendrop-${GITHUB_RUN_ID}.yml' '/tmp/wix-zendrop-ready-${GITHUB_RUN_ID}.json'" || true
          fi
          rm -f "$HOME/.ssh/foundation_vm_key" "$RUNNER_TEMP/zendrop-api-key.env"
