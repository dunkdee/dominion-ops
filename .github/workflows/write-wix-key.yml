name: Write ENV Key to VM

on:
  workflow_dispatch:
    inputs:
      env_key:
        description: 'Variable name (e.g. ZENDROP_API_KEY)'
        required: true
        default: 'ZENDROP_API_KEY'
      env_value:
        description: 'Paste the API key value here'
        required: true

jobs:
  write-key:
    runs-on: ubuntu-latest
    steps:
      - name: Write key to VM .env and restart wix-agent
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: ENV_KEY,ENV_VALUE
          script: |
            set -e
            ENV_FILE="$HOME/dominion-ops/.env"

            # Remove any existing line for this key
            if [ -f "$ENV_FILE" ]; then
              sed -i "/^${ENV_KEY}=/d" "$ENV_FILE"
            fi

            # Append the new key
            echo "${ENV_KEY}=${ENV_VALUE}" >> "$ENV_FILE"
            echo "${ENV_KEY} written to $ENV_FILE"

            # Verify (show length, not value)
            VAL=$(grep "^${ENV_KEY}=" "$ENV_FILE" | cut -d= -f2)
            echo "Stored key length: ${#VAL} chars"

            # Restart wix-agent to pick up the new env var
            cd "$HOME/dominion-ops"
            if docker ps -a --format '{{.Names}}' | grep -q '^wix-agent$'; then
              docker stop wix-agent 2>/dev/null || true
              docker rm wix-agent 2>/dev/null || true
              echo "Removed old wix-agent container"
            fi

            docker compose up -d wix-agent
            echo "Started wix-agent via docker compose"

            sleep 5
            docker ps --filter name=wix-agent --format 'Status: {{.Status}}'
            curl -sf http://localhost:8082/health && echo 'PASS: wix-agent /health OK' || echo 'WARN: /health not reachable yet'
        env:
          ENV_KEY: ${{ inputs.env_key }}
          ENV_VALUE: ${{ inputs.env_value }}
