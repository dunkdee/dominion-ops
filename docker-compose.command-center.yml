services:
  dominion-command-center:
    build: ./apps/command-center
    container_name: dominion-command-center
    # Production intelligence workers are private host-loopback services.
    # Host networking lets this container reach them without opening those ports
    # on a public interface. Uvicorn itself remains bound to host loopback only.
    network_mode: host
    command: ["uvicorn", "app:app", "--host", "127.0.0.1", "--port", "8091"]
    volumes:
      - ${VAULT_PATH:-/home/malachisingleton8/vault}:/vault:ro
      - ${COMMAND_CENTER_MEMORY_PATH:-/home/malachisingleton8/dominion-memory}:/data/memory
      - ${COMMAND_CENTER_RUNTIME_DIR:-/home/malachisingleton8/.dominion/command-center}:/runtime:ro
      - ./governance/lane_access_policy.json:/governance/lane_access_policy.json:ro
    restart: unless-stopped
    environment:
      VAULT_PATH: /vault
      MEMORY_PATH: /data/memory
      RUNTIME_STATE_PATH: /runtime/runtime-state.json
      LANE_POLICY_PATH: /governance/lane_access_policy.json
      NEMOTRON_BASE_URL: ${NEMOTRON_BASE_URL:-}
      NEMOTRON_MODEL: ${NEMOTRON_MODEL:-nemotron-3}
      NEMOTRON_API_KEY: ${NEMOTRON_API_KEY:-}
      # Canonical fallback remains private on the VM. Do not inherit a stale
      # host.docker.internal value from older command-center.env files.
      CONDUCTOR_URL: http://127.0.0.1:5060
      INTELLIGENCE_TIMEOUT_SECONDS: ${INTELLIGENCE_TIMEOUT_SECONDS:-60}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8091/health\").read()' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
