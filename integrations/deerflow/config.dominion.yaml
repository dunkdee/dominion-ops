config_version: 14
log_level: info

token_usage:
  enabled: true

models:
  - name: dominion-ollama
    display_name: Dominion Local Ollama
    use: langchain_ollama:ChatOllama
    model: llama3.1:8b
    base_url: $DOMINION_OLLAMA_BASE_URL
    num_predict: 8192
    temperature: 0.2
    supports_thinking: false
    supports_vision: false

tool_groups:
  - name: web
  - name: file:read
  - name: file:write

tools:
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 5
  - name: ls
    group: file:read
    use: deerflow.sandbox.tools:ls_tool
  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool
  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool

suggestions:
  enabled: true

loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
