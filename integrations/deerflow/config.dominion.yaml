config_version: 15
log_level: info

token_usage:
  enabled: true

models:
  - name: dominion-ollama
    display_name: Dominion Local Ollama
    use: langchain_ollama:ChatOllama
    model: nemotron-3-nano:4b
    base_url: $DOMINION_OLLAMA_BASE_URL
    num_predict: 8192
    temperature: 0.2
    supports_thinking: false
    supports_vision: false

# Single-node production persistence. This is DeerFlow execution state, not a
# replacement for Dominion's canonical source of truth.
database:
  backend: sqlite
  sqlite_dir: .deer-flow/data
  echo_sql: false

# Persist messages and execution traces instead of losing them on restart.
run_events:
  backend: db
  max_trace_content: 10240
  track_token_usage: true

# Local execution memory remains per-user. It supports continuity but is not
# constitutional or canonical Dominion memory.
memory:
  enabled: true
  debounce_seconds: 30
  max_facts: 200
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000
  token_counting: char

# Keep long-running delegation available while bounding runaway work.
subagents:
  timeout_seconds: 1800
  max_turns: 50

skills:
  path: /app/skills
  container_path: /mnt/skills

# DeerFlow may use approved skills, but may not silently rewrite its own skills
# or expose the custom-agent prompt management API in production.
skill_evolution:
  enabled: false

agents_api:
  enabled: false

# User-owned messaging connections stay disabled until each channel is bound
# through a separately governed integration.
channel_connections:
  enabled: false
  require_bound_identity: true

# Native fail-closed pre-tool authorization. Host shell remains denied even if
# a future config accidentally exposes the bash tool.
guardrails:
  enabled: true
  fail_closed: true
  provider:
    use: deerflow.guardrails.builtin:AllowlistProvider
    config:
      denied_tools:
        - bash

circuit_breaker:
  failure_threshold: 5
  recovery_timeout_sec: 60

tool_output:
  enabled: true
  externalize_min_chars: 12000
  fallback_max_chars: 30000

tool_groups:
  - name: web
  - name: image
  - name: file:read
  - name: file:write

tools:
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 8
  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 15
  - name: image_search
    group: image
    use: deerflow.community.image_search.tools:image_search_tool
    max_results: 5
  - name: ls
    group: file:read
    use: deerflow.sandbox.tools:ls_tool
  - name: glob
    group: file:read
    use: deerflow.sandbox.tools:glob_tool
    max_results: 200
  - name: grep
    group: file:read
    use: deerflow.sandbox.tools:grep_tool
    max_results: 100
  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool
  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool
  - name: str_replace
    group: file:write
    use: deerflow.sandbox.tools:str_replace_tool

suggestions:
  enabled: true

loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
