[pytest]
# The elite governance gate runs a bare `python -m pytest` from the repository
# root, so repository-wide settings belong here rather than in the workflow.
#
# import-mode=importlib gives every test module a unique identity derived from
# its full path. Under the legacy "prepend" mode two files sharing a basename
# (OPS/radah-traffic-engine/tests/test_api.py and
# apps/video-studio/tests/test_api.py) both import as the module `test_api`,
# and whichever is collected second fails with an import file mismatch.
# This resolves that without renaming either subproject's tests.
addopts = --import-mode=importlib
testpaths = tests apps OPS services control_plane scripts
